  <script>
    const API_BASE = 'https://fundora-be-singapore.onrender.com';
    const STARTUPS_ENDPOINT = `${API_BASE}/api/investor/startups/`;
    const WATCHLIST_ENDPOINT = `${API_BASE}/api/investor/watchlist/`;
    const ADD_WATCHLIST_ENDPOINT = (id) => `${API_BASE}/api/investor/watchlist/add/${id}/`;
    const REMOVE_WATCHLIST_ENDPOINT = (id) => `${API_BASE}/api/investor/watchlist/remove/${id}/`;
    const LOGOUT_ENDPOINT = `${API_BASE}/api/logout/`;
    const COMPANY_PROFILE_PAGE = '../Module_2/Company_Profile.html';
    const COMPANY_PROFILE_DB_PAGE = '../Module_2/Company_ProfileDB.html';
    const INVEST_PAGE = '../Module_2/Investment_Simulation.html';

    let watchlistIdsSet = new Set();

    function getAuthToken() {
      return sessionStorage.getItem('authToken');
    }

    function authHeaders() {
      const token = getAuthToken();
      if (!token) return {};
      return { 'Authorization': `Bearer ${token}`, 'Content-Type': 'application/json' };
    }

    function riskLevelToNum(riskLevel) {
      const map = { 'Low': 1, 'Medium': 2, 'High': 3 };
      return map[riskLevel] || 2;
    }

    function confidenceToNum(confidence) {
      const map = { 'High': 3, 'Medium': 2, 'Low': 1 };
      return map[confidence] || 0;
    }

    async function fetchJSON(url, options = {}) {
      const token = getAuthToken();
      if (!token) {
        window.location.href = '/login.html';
        throw new Error('No auth token');
      }
      options.headers = Object.assign({}, options.headers || {}, { 'Authorization': `Bearer ${token}` });
      const res = await fetch(url, options);
      if (res.status === 401 || res.status === 403) {
        sessionStorage.removeItem('authToken');
        window.location.href = '/login.html';
        throw new Error('Unauthorized');
      }
      if (!res.ok) {
        const text = await res.text().catch(()=>null);
        throw new Error(`Request failed: ${res.status} ${text || ''}`);
      }
      const ct = res.headers.get('content-type') || '';
      if (ct.includes('application/json')) return await res.json();
      return await res.text();
    }

    async function refreshWatchlist() {
        try {
            const data = await fetchJSON(WATCHLIST_ENDPOINT, { method: 'GET' });
            const items = data.results || data.watchlist || [];
            watchlistIdsSet = new Set(items.map(it => it.id));
            
            const badge = document.getElementById('watchlist-badge');
            badge.textContent = data.count ?? items.length ?? 0;
        } catch (err) {
            console.warn('Could not refresh watchlist:', err);
        }
    }

    async function addToWatchlist(startupId, btn) {
      try {
        const res = await fetch(ADD_WATCHLIST_ENDPOINT(startupId), {
          method: 'POST',
          headers: authHeaders()
        });
        if (res.status === 201 || res.ok) {
          watchlistIdsSet.add(Number(startupId));
          updateWatchlistBadge();
          return true;
        } else {
          console.warn('Add failed', res.status);
          return false;
        }
      } catch (err) {
        console.error('Error adding to watchlist', err);
        return false;
      }
    }

    async function removeFromWatchlist(startupId, btn) {
      try {
        const res = await fetch(REMOVE_WATCHLIST_ENDPOINT(startupId), {
          method: 'POST',
          headers: authHeaders()
        });
        if (res.ok) {
          watchlistIdsSet.delete(Number(startupId));
          updateWatchlistBadge();
          return true;
        } else {
          console.warn('Remove failed', res.status);
          return false;
        }
      } catch (err) {
        console.error('Error removing from watchlist', err);
        return false;
      }
    }

    function updateWatchlistBadge() {
      const badge = document.getElementById('watchlist-badge');
      badge.textContent = watchlistIdsSet.size;
    }

    function escapeHtml(text) {
      if (!text) return '';
      const map = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' };
      return text.replace(/[&<>"']/g, m => map[m]);
    }

    function watchIcon(filled) {
      return filled 
        ? '<svg class="w-5 h-5 text-brand-400" fill="currentColor" viewBox="0 0 24 24"><path d="M4.318 6.318a4.5 4.5 0 000 6.364L12 20.364l7.682-7.682a4.5 4.5 0 00-6.364-6.364L12 7.636l-1.318-1.318a4.5 4.5 0 00-6.364 0z"/></svg>'
        : '<svg class="w-5 h-5 text-gray-400 hover:text-brand-400 transition-colors" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4.318 6.318a4.5 4.5 0 000 6.364L12 20.364l7.682-7.682a4.5 4.5 0 00-6.364-6.364L12 7.636l-1.318-1.318a4.5 4.5 0 00-6.364 0z"/></svg>';
    }

    function renderStartup(startup) {
      const isPitchDeck = startup.source_deck_id != null || startup.is_deck_builder === true || startup.is_deck_builder === 'true' || startup.startup_type === 'pitch_deck';
      
      const card = document.createElement('div');
      card.className = 'startup-card bg-slate-900/40 border border-slate-800/50 rounded-lg p-6 flex flex-col';
      card.setAttribute('data-startup-id', startup.id);
      card.setAttribute('data-is-deck-builder', isPitchDeck);

      let hasDataPending = false;
      let riskBadge;

      if (isPitchDeck) {
          riskBadge = '<span class="bg-brand-600/20 text-brand-300 text-xs font-medium px-3 py-1 rounded-full border border-brand-600/30">Pitch Deck</span>';
      } else if (startup.risk_level && startup.risk_level !== 'Data Pending') {
          if (startup.risk_level === 'Low') {
              riskBadge = '<span class="bg-accent-600/20 text-accent-300 text-xs font-medium px-3 py-1 rounded-full border border-accent-600/30">Low Risk</span>';
          } else if (startup.risk_level === 'Medium') {
              riskBadge = '<span class="bg-yellow-600/20 text-yellow-300 text-xs font-medium px-3 py-1 rounded-full border border-yellow-600/30">Medium Risk</span>';
          } else {
              riskBadge = '<span class="bg-red-600/20 text-red-300 text-xs font-medium px-3 py-1 rounded-full border border-red-600/30">High Risk</span>';
          }
      } else {
          hasDataPending = true;
          riskBadge = '<span class="bg-gray-600/20 text-gray-300 text-xs font-medium px-3 py-1 rounded-full border border-gray-600/30">Data Pending</span>';
      }

      if (isPitchDeck) {
          hasDataPending = false;
      }

      const industry = isPitchDeck ? (startup.tagline || '—') : (startup.industry || '—');
      
      const reward = startup.reward_potential;
      const rewardDisplay = (reward != null) ? `${reward}/5` : 'N/A';
      
      const estimatedGrowth = (startup.estimated_growth_rate != null && startup.estimated_growth_rate !== '') 
          ? `${startup.estimated_growth_rate >= 0 ? '+' : ''}${startup.estimated_growth_rate}%` 
          : 'N/A';

      const inWatchlist = watchlistIdsSet.has(Number(startup.id));

      let metricsSection;
      if (isPitchDeck) {
          const fundingAmount = startup.funding_ask ? `$${parseFloat(startup.funding_ask).toLocaleString()}` : 'N/A';
          const marketGrowth = startup.market_growth_rate ?? startup.market_growth ?? 'N/A';
          const marketGrowthDisplay = marketGrowth !== 'N/A' ? `${marketGrowth}%` : 'N/A';
          
          metricsSection = `
              <div class="space-y-3 mb-4 flex-grow">
                  <div class="flex justify-between items-center">
                      <span class="text-sm text-gray-400">Funding Requested</span>
                      <span class="text-sm font-semibold text-brand-400">${escapeHtml(fundingAmount)}</span>
                  </div>
                  <div class="flex justify-between items-center">
                      <span class="text-sm text-gray-400">Market Growth Rate (YOY)</span>
                      <span class="text-sm font-semibold text-accent-400">${escapeHtml(marketGrowthDisplay)}</span>
                  </div>
              </div>
          `;
      } else {
          metricsSection = `
              <div class="space-y-3 mb-4 flex-grow">
                  <div class="flex justify-between items-center">
                      <span class="text-sm text-gray-400">Reward Potential</span>
                      <span class="text-sm font-semibold text-white">${escapeHtml(rewardDisplay)}</span>
                  </div>
                  <div class="flex justify-between items-center">
                      <span class="text-sm text-gray-400">Estimated Growth Rate</span>
                      <span class="text-sm font-semibold ${startup.estimated_growth_rate != null && startup.estimated_growth_rate >= 0 ? 'text-accent-400' : 'text-red-400'}">${escapeHtml(estimatedGrowth)}</span>
                  </div>
              </div>
          `;
      }

      card.innerHTML = `
          <div class="flex justify-between items-start mb-4">
              <div class="flex-1">
                  <h3 class="text-lg font-semibold text-white mb-1">${escapeHtml(startup.company_name)}</h3>
                  <p class="text-sm text-gray-400">${escapeHtml(industry)}</p>
              </div>
              <div class="flex flex-col items-end space-y-2">
                  ${riskBadge}
                  <button class="watch-toggle text-sm" title="${inWatchlist ? 'Remove from watchlist' : 'Add to watchlist'}" aria-pressed="${inWatchlist ? 'true' : 'false'}">
                      ${inWatchlist ? watchIcon(true) : watchIcon(false)}
                  </button>
              </div>
          </div>
          ${metricsSection}
          <div class="flex gap-2 mt-auto">
              <button class="view-details-btn flex-1 px-4 py-2.5 border border-slate-700/50 bg-slate-800/30 text-white rounded-lg hover:bg-slate-700/40 hover:border-slate-600 text-sm font-medium text-center transition-all cursor-pointer">View Details</button>
              ${hasDataPending 
              ? '<button class="invest-btn flex-1 px-4 py-2.5 bg-gray-600/20 text-gray-400 rounded-lg text-sm text-center cursor-not-allowed border border-gray-600/30" disabled title="Cannot invest - data pending">Invest</button>'
              : `<a class="invest-btn flex-1 px-4 py-2.5 bg-brand-600 hover:bg-brand-700 text-white rounded-lg text-sm text-center font-medium transition-all" href="${INVEST_PAGE}?startup_id=${startup.id}">Invest</a>`
          }
          </div>
      `;

      card.querySelector('.view-details-btn').addEventListener('click', () => {
          const id = card.getAttribute('data-startup-id');
          const isDeckBuilder = card.getAttribute('data-is-deck-builder') === 'true';
          const target = isDeckBuilder ? `${COMPANY_PROFILE_DB_PAGE}?id=${id}` : `${COMPANY_PROFILE_PAGE}?id=${id}`;
          window.location.href = target;
      });

      const watchBtn = card.querySelector('.watch-toggle');
      watchBtn.addEventListener('click', async (e) => {
          e.stopPropagation();
          e.preventDefault();
          const sid = startup.id;
          const currently = watchlistIdsSet.has(Number(sid));
          if (!currently) {
              watchBtn.disabled = true;
              const ok = await addToWatchlist(sid, watchBtn);
              watchBtn.disabled = false;
              if (ok) {
                  watchBtn.innerHTML = watchIcon(true);
                  watchBtn.title = 'Remove from watchlist';
                  watchBtn.setAttribute('aria-pressed', 'true');
              } else {
                  alert('Could not add to watchlist.');
              }
          } else {
              watchBtn.disabled = true;
              const ok = await removeFromWatchlist(sid, watchBtn);
              watchBtn.disabled = false;
              if (ok) {
                  watchBtn.innerHTML = watchIcon(false);
                  watchBtn.title = 'Add to watchlist';
                  watchBtn.setAttribute('aria-pressed', 'false');
              } else {
                  alert('Could not remove from watchlist.');
              }
          }
      });

      return card;
    }

    async function renderStartups(shouldRefreshWatchlist = true) {
      try {
        const grid = document.getElementById('startup-grid');
        grid.innerHTML = '<p class="text-gray-400 text-center py-8">Loading startups...</p>';

        if (shouldRefreshWatchlist) {
          await refreshWatchlist();
        }

        const form = document.getElementById('filterForm');
        const formData = new FormData(form);
        const params = new URLSearchParams();
        
        formData.forEach((value, key) => {
          if (value != null && value.toString().trim() !== '') {
            params.append(key, value.toString().trim());
          }
        });

        let url = STARTUPS_ENDPOINT;
        const queryString = params.toString();
        if (queryString) {
          url += '?' + queryString;
        }

        const data = await fetchJSON(url);
        const startups = data.results || data || [];

        grid.innerHTML = '';
        
        document.getElementById('startup-count').textContent = startups.length;
        document.getElementById('startup-plural').textContent = startups.length === 1 ? '' : 's';

        if (startups.length === 0) {
          document.getElementById('no-startups').classList.remove('hidden');
        } else {
          document.getElementById('no-startups').classList.add('hidden');
          startups.forEach(startup => {
            grid.appendChild(renderStartup(startup));
          });
        }
      } catch (error) {
        console.error('Error rendering startups:', error);
        document.getElementById('startup-grid').innerHTML = '<p class="text-red-400 text-center py-8">Error loading startups. Please try again.</p>';
      }
    }

    function applyPreset(preset) {
      document.getElementById('type-hidden').value = 'financial';
      document.getElementById('type-financial').style.borderColor = 'rgb(59 130 246)';
      document.getElementById('type-pitch_deck').style.borderColor = '';
      setStartupType('financial');
      
      document.getElementById('financial-filters').classList.remove('hidden');
      document.getElementById('pitch-deck-filters').classList.add('hidden');

      if (preset === 'conservative') {
          document.getElementById('risk-Low').style.borderColor = 'rgb(34 197 94)';
          setRiskLevel('Low');
      } else if (preset === 'balanced') {
          document.getElementById('risk-Medium').style.borderColor = 'rgb(202 138 4)';
          setRiskLevel('Medium');
      } else if (preset === 'aggressive') {
          document.getElementById('risk-High').style.borderColor = 'rgb(239 68 68)';
          setRiskLevel('High');
      }
    }

    function setStartupType(type) {
      document.getElementById('type-hidden').value = type;
      const finBtn = document.getElementById('type-financial');
      const deckBtn = document.getElementById('type-pitch_deck');
      
      if (type === 'financial') {
          finBtn.style.borderColor = 'rgb(59 130 246)';
          deckBtn.style.borderColor = '';
          document.getElementById('financial-filters').classList.remove('hidden');
          document.getElementById('pitch-deck-filters').classList.add('hidden');
      } else {
          finBtn.style.borderColor = '';
          deckBtn.style.borderColor = 'rgb(59 130 246)';
          document.getElementById('financial-filters').classList.add('hidden');
          document.getElementById('pitch-deck-filters').classList.remove('hidden');
      }
    }

    function setRiskLevel(level) {
      document.getElementById('risk-hidden').value = level;
      const buttons = document.querySelectorAll('.risk-btn');
      buttons.forEach(btn => {
        btn.style.borderColor = '';
      });
      document.getElementById(`risk-${level}`).style.borderColor = 
        level === 'Low' ? 'rgb(34 197 94)' : (level === 'Medium' ? 'rgb(202 138 4)' : 'rgb(239 68 68)');
    }

    function setMarketGrowth(level) {
      document.getElementById('growth-hidden').value = level;
      const buttons = document.querySelectorAll('.growth-btn');
      buttons.forEach(btn => {
        btn.style.borderColor = '';
      });
      document.getElementById(`growth-${level}`).style.borderColor = 'rgb(59 130 246)';
    }

    function clearAllFilters() {
      document.getElementById('filterForm').reset();
      document.getElementById('risk-hidden').value = '';
      document.getElementById('type-hidden').value = '';
      document.getElementById('growth-hidden').value = '';
      
      document.querySelectorAll('.risk-btn').forEach(btn => btn.style.borderColor = '');
      document.querySelectorAll('.type-btn').forEach(btn => btn.style.borderColor = '');
      document.querySelectorAll('.growth-btn').forEach(btn => btn.style.borderColor = '');
      
      document.getElementById('financial-filters').classList.remove('hidden');
      document.getElementById('pitch-deck-filters').classList.add('hidden');
      
      renderStartups(false);
    }

    document.getElementById('filterForm').addEventListener('submit', (e) => {
      e.preventDefault();
      renderStartups(false);
    });

    // Initial render
    renderStartups();
  </script>
</body>
</html>
