<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Fundora - Investment Dashboard</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            'low-risk': '#10b981',
            'med-risk': '#f59e0b',
            'high-risk': '#ef4444'
          }
        }
      }
    }
  </script>
</head>
<body class="bg-gray-50 min-h-screen">
  <!-- Header -->
  <header class="bg-white border-b border-gray-200 px-6 py-4 sticky top-0 z-50">
    <div class="flex justify-between items-center">
      <div class="flex items-center space-x-4">
        <h1 class="text-2xl font-bold text-gray-900">Fundora</h1>
        <div class="hidden md:flex items-center space-x-2 text-sm text-gray-600">
          <span id="startup-count-header" class="bg-blue-100 text-blue-800 px-2 py-1 rounded-full">0</span>
        </div>
      </div>
      <div class="flex items-center space-x-4">
        <a href="Watchlist.html" class="bg-blue-600 text-white px-4 py-2 rounded-lg hover:bg-blue-700 font-medium transition-colors">
          My Watchlist
        </a>
        <button id="logoutBtn" class="bg-gray-600 text-white px-4 py-2 rounded-lg hover:bg-gray-700 font-medium transition-colors">
          Logout
        </button>
      </div>
    </div>
  </header>

  <div class="flex">
    <!-- Sidebar -->
    <aside class="fixed top-16 left-0 w-80 h-[calc(100vh-64px)] bg-white border-r border-gray-200 p-6 overflow-y-auto">
      <div class="mb-6">
        <h2 class="text-lg font-semibold text-gray-900 mb-2">Investment Filters</h2>
      </div>

      <form id="filterForm" class="space-y-6">
        <!-- Presets -->
        <div class="bg-gray-50 p-4 rounded-lg">
          <label class="block text-sm font-medium text-gray-700 mb-3">Quick Presets</label>
          <div class="grid grid-cols-1 gap-2">
            <button type="button" onclick="applyPreset('conservative')" class="preset-btn w-full text-left px-3 py-2 text-sm bg-white border border-gray-200 rounded-md hover:bg-blue-50 hover:border-blue-300 transition">
              <div class="flex items-center justify-between">
                <span class="font-medium">Conservative</span>
                <span class="text-xs text-gray-500">Low Risk</span>
              </div>
            </button>
            <button type="button" onclick="applyPreset('balanced')" class="preset-btn w-full text-left px-3 py-2 text-sm bg-white border border-gray-200 rounded-md hover:bg-blue-50 hover:border-blue-300 transition">
              <div class="flex items-center justify-between">
                <span class="font-medium">Balanced</span>
                <span class="text-xs text-gray-500">Mixed</span>
              </div>
            </button>
            <button type="button" onclick="applyPreset('aggressive')" class="preset-btn w-full text-left px-3 py-2 text-sm bg-white border border-gray-200 rounded-md hover:bg-blue-50 hover:border-blue-300 transition">
              <div class="flex items-center justify-between">
                <span class="font-medium">Aggressive</span>
                <span class="text-xs text-gray-500">High Risk</span>
              </div>
            </button>
          </div>
        </div>

        <!-- Sort -->
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-2">Sort By</label>
          <select name="sort_by" class="w-full px-3 py-2 border border-gray-300 rounded-md focus:ring-blue-500">
            <option value="recommended">Recommended</option>
            <option value="projected_return_desc">Highest Returns First</option>
            <option value="projected_return_asc">Lowest Returns First</option>
            <option value="reward_potential_desc">Best Reward Potential</option>
            <option value="confidence_desc">Highest Confidence</option>
            <option value="risk_asc">Lowest Risk First</option>
            <option value="company_name">Company Name A-Z</option>
          </select>
        </div>

        <!-- Industry -->
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-2">Industry</label>
          <select name="industry" class="w-full px-3 py-2 border border-gray-300 rounded-md focus:ring-blue-500">
            <option value="">All Industries</option>
            <option value="Technology">Technology</option>
            <option value="Finance">Finance</option>
            <option value="Healthcare">Healthcare</option>
            <option value="Retail">Retail</option>
            <option value="Manufacturing">Manufacturing</option>
            <option value="Energy">Energy</option>
            <option value="Education">Education</option>
          </select>
        </div>

        <!-- Risk -->
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-2">Risk Tolerance</label>
          <input type="range" name="risk" min="0" max="100" value="50" class="w-full h-2 bg-gray-200 rounded-lg cursor-pointer" oninput="updateRiskLabel(this.value)">
          <div class="flex justify-between text-xs text-gray-500 mt-1">
            <span>Low</span><span>Medium</span><span>High</span>
          </div>
          <div class="text-center mt-2">
            <span id="risk-value" class="text-sm font-medium text-gray-700">50%</span>
          </div>
        </div>

        <!-- Minimum Return -->
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-2">Minimum Projected Return</label>
          <select name="min_return" class="w-full px-3 py-2 border border-gray-300 rounded-md focus:ring-blue-500">
            <option value="">Any Return</option>
            <option value="5">5% or higher</option>
            <option value="10">10% or higher</option>
            <option value="15">15% or higher</option>
            <option value="20">20% or higher</option>
            <option value="25">25% or higher</option>
            <option value="50">50% or higher</option>
            <option value="75">75% or higher</option>
            <option value="100">100% or higher</option>
          </select>
        </div>

        <!-- Buttons -->
        <div class="space-y-3 pt-4 border-t border-gray-200">
          <button type="submit" class="w-full bg-blue-600 text-white py-2.5 px-4 rounded-lg hover:bg-blue-700 font-medium transition">Apply Filters</button>
          <button type="button" onclick="clearAllFilters()" class="w-full bg-gray-100 text-gray-700 py-2.5 px-4 rounded-lg hover:bg-gray-200 font-medium transition">Clear All</button>
        </div>
      </form>
    </aside>

    <!-- Main -->
    <main class="flex-1 p-6 ml-80">
      <div class="mb-8">
        <h2 class="text-3xl font-bold text-gray-900 mb-2">Investment Opportunities</h2>
        <p class="text-gray-600">Discover startups tailored to your investment profile</p>
      </div>

      <!-- Results header -->
      <div class="mb-6 flex items-center justify-between bg-white p-4 rounded-lg border border-gray-200">
        <p class="text-sm text-gray-600">
          Showing <span id="startup-count" class="font-semibold text-gray-900">0</span> startup<span id="startup-plural">s</span>
        </p>
        <div id="clear-filters" class="hidden">
          <button onclick="clearAllFilters()" class="text-blue-600 hover:text-blue-800 text-sm">Clear all</button>
        </div>
      </div>

      <!-- Startup Grid -->
      <div id="startup-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6"></div>

      <!-- Empty state -->
      <div id="no-startups" class="col-span-full text-center py-16 hidden">
        <div class="text-6xl mb-4">🔍</div>
        <h3 class="text-xl font-semibold text-gray-900 mb-2">No startups found</h3>
        <p class="text-gray-500 text-lg mb-6">No startups match your current filters.</p>
      </div>
    </main>
  </div>

  <script>
    async function fetchStartups() {
      try {
        const token = localStorage.getItem('authToken');
        if (!token) throw new Error('No auth token found');

        // Read form values
        const form = document.getElementById('filterForm');
        const params = new URLSearchParams(new FormData(form));

        // Build URL with filters
        const url = `http://127.0.0.1:8000/api/startups/?${params.toString()}`;

        const response = await fetch(url, {
          headers: { 'Authorization': `Bearer ${token}` }
        });
        if (!response.ok) throw new Error('Failed to fetch startups');
        const data = await response.json();
        return data.results || data.startups || [];
      } catch (error) {
        console.error('Error fetching startups:', error);
        return [];
      }
    }

    function createStartupCard(startup) {
      let riskBadge = '';
      if (startup.is_deck_builder) {
        riskBadge = '<span class="bg-yellow-100 text-yellow-800 text-xs font-medium px-2 py-1 rounded-full">Medium Risk</span>';
      } else if (startup.data_source_confidence === 'High') {
        riskBadge = '<span class="bg-green-100 text-green-800 text-xs font-medium px-2 py-1 rounded-full">Low Risk</span>';
      } else if (startup.data_source_confidence === 'Medium') {
        riskBadge = '<span class="bg-yellow-100 text-yellow-800 text-xs font-medium px-2 py-1 rounded-full">Medium Risk</span>';
      } else {
        riskBadge = '<span class="bg-red-100 text-red-800 text-xs font-medium px-2 py-1 rounded-full">High Risk</span>';
      }

      const card = document.createElement('div');
      card.className = 'startup-card bg-white rounded-lg border border-gray-200 p-6 hover:shadow-lg transition';
      card.innerHTML = `
        <div class="flex justify-between items-start mb-4">
          <div class="flex-1">
            <h3 class="text-lg font-semibold text-gray-900 mb-1">${startup.company_name}</h3>
            <p class="text-sm text-gray-600">${startup.industry || 'Technology'}</p>
          </div>
          <div class="flex flex-col items-end">${riskBadge}</div>
        </div>
        <div class="space-y-3 mb-4">
          <div class="flex justify-between items-center">
            <span class="text-sm text-gray-600">Reward Potential</span>
            <span class="text-sm font-semibold">${startup.reward_potential || 'N/A'}/5</span>
          </div>
          <div class="flex justify-between items-center">
            <span class="text-sm text-gray-600">Projected Return</span>
            <span class="text-sm font-semibold ${startup.projected_return >= 0 ? 'text-green-600' : 'text-red-600'}">
              ${startup.projected_return != null ? (startup.projected_return >= 0 ? '+' : '') + startup.projected_return + '%' : 'N/A'}
            </span>
          </div>
        </div>
        <div class="flex gap-2">
          <a href="/company/${startup.id}/" class="flex-1 px-3 py-2 border rounded-md text-sm text-gray-700 text-center hover:bg-gray-50">View Details</a>
          <a href="/simulate/${startup.id}/" class="flex-1 px-3 py-2 bg-blue-600 text-white rounded-md text-sm text-center hover:bg-blue-700">Invest</a>
        </div>
      `;
      return card;
    }

    async function renderStartups() {
      const startups = await fetchStartups();
      const grid = document.getElementById('startup-grid');
      const countSpan = document.getElementById('startup-count');
      const noStartups = document.getElementById('no-startups');

      grid.innerHTML = '';
      if (!startups || startups.length === 0) {
        noStartups.classList.remove('hidden');
        countSpan.textContent = '0';
        return;
      }
      noStartups.classList.add('hidden');
      countSpan.textContent = startups.length;
      startups.forEach(s => grid.appendChild(createStartupCard(s)));
    }

    document.getElementById('filterForm').addEventListener('submit', e => {
      e.preventDefault();
      renderStartups();
    });

    function clearAllFilters() {
      document.getElementById('filterForm').reset();
      document.getElementById('risk-value').textContent = '50%';
      renderStartups();
    }
    function updateRiskLabel(v) {
      document.getElementById('risk-value').textContent = v + '%';
    }

    function applyPreset(preset) {
      // apply preset logic (set form fields based on preset)
      renderStartups();
    }

    document.addEventListener('DOMContentLoaded', renderStartups);
  </script>

  <style>
    .startup-card:hover {
      transform: translateY(-4px);
      box-shadow: 0 10px 25px rgba(0,0,0,0.1);
    }
  </style>
</body>
</html>
