<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Fundora - Investment Dashboard</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            'low-risk': '#10b981',
            'med-risk': '#f59e0b',
            'high-risk': '#ef4444'
          }
        }
      }
    }
  </script>
</head>
<body class="bg-gray-50 min-h-screen">
  <!-- Header -->
  <header class="bg-white border-b border-gray-200 px-6 py-4 sticky top-0 z-50">
    <div class="flex justify-between items-center">
      <div class="flex items-center space-x-4">
        <h1 class="text-2xl font-bold text-gray-900">Fundora</h1>
        <div class="hidden md:flex items-center space-x-2 text-sm text-gray-600">
          <span id="startup-count" class="bg-blue-100 text-blue-800 px-2 py-1 rounded-full">Loading...</span>
        </div>
      </div>
      <div class="flex items-center space-x-4">
        <a href="Watchlist.html" class="bg-blue-600 text-white px-4 py-2 rounded-lg hover:bg-blue-700 font-medium transition-colors">
          My Watchlist
        </a>
        <button id="logoutBtn" class="bg-gray-600 text-white px-4 py-2 rounded-lg hover:bg-gray-700 font-medium transition-colors">
          Logout
        </button>
      </div>
    </div>
  </header>

  <div class="flex">
    <!-- Sidebar -->
    <aside class="w-80 bg-white border-r border-gray-200 p-6 min-h-screen overflow-y-auto">
      <div class="mb-6">
        <h2 class="text-lg font-semibold text-gray-900 mb-2">Investment Filters</h2>
        <p class="text-sm text-gray-600">Customize your investment criteria</p>
      </div>

      <form id="filterForm" class="space-y-6">
        <!-- Presets -->
        <div class="bg-gray-50 p-4 rounded-lg">
          <label class="block text-sm font-medium text-gray-700 mb-3">Quick Presets</label>
          <div class="grid grid-cols-1 gap-2">
            <button type="button" class="preset-btn w-full text-left px-3 py-2 text-sm bg-white border border-gray-200 rounded-md hover:bg-blue-50 hover:border-blue-300 transition-all duration-200"
              onclick="applyPreset('conservative')">
              <div class="flex items-center justify-between">
                <span class="font-medium">Conservative</span>
                <span class="text-xs text-gray-500">Low Risk</span>
              </div>
            </button>
            <button type="button" class="preset-btn w-full text-left px-3 py-2 text-sm bg-white border border-gray-200 rounded-md hover:bg-blue-50 hover:border-blue-300 transition-all duration-200"
              onclick="applyPreset('balanced')">
              <div class="flex items-center justify-between">
                <span class="font-medium">Balanced</span>
                <span class="text-xs text-gray-500">Mixed</span>
              </div>
            </button>
            <button type="button" class="preset-btn w-full text-left px-3 py-2 text-sm bg-white border border-gray-200 rounded-md hover:bg-blue-50 hover:border-blue-300 transition-all duration-200"
              onclick="applyPreset('aggressive')">
              <div class="flex items-center justify-between">
                <span class="font-medium">Aggressive</span>
                <span class="text-xs text-gray-500">High Risk</span>
              </div>
            </button>
          </div>
        </div>

        <!-- Sort By -->
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-2">Sort By</label>
          <select name="sort_by" class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500">
            <option value="recommended">Recommended</option>
            <option value="projected_return_desc">Highest Returns First</option>
            <option value="projected_return_asc">Lowest Returns First</option>
            <option value="reward_potential_desc">Best Reward Potential</option>
            <option value="confidence_desc">Highest Confidence</option>
            <option value="risk_asc">Lowest Risk First</option>
            <option value="company_name">Company Name A-Z</option>
          </select>
        </div>

        <!-- Industry -->
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-2">Industry</label>
          <select name="industry" class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500">
            <option value="">All Industries</option>
            <option value="Technology">Technology</option>
            <option value="Finance">Finance</option>
            <option value="Healthcare">Healthcare</option>
            <option value="Retail">Retail</option>
            <option value="Manufacturing">Manufacturing</option>
            <option value="Energy">Energy</option>
            <option value="Education">Education</option>
          </select>
        </div>

        <!-- Risk -->
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-2">Risk Tolerance</label>
          <input type="range" name="risk" min="0" max="100" value="50"
            class="w-full h-2 bg-gray-200 rounded-lg appearance-none cursor-pointer risk-slider"
            oninput="updateRiskLabel(this.value)">
          <div class="flex justify-between text-xs text-gray-500 mt-1">
            <span>Low</span><span>Medium</span><span>High</span>
          </div>
          <div class="text-center mt-2">
            <span id="risk-value" class="text-sm font-medium text-gray-700">50%</span>
          </div>
        </div>

        <!-- Minimum Return -->
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-2">Minimum Projected Return</label>
          <select name="min_return" class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500">
            <option value="">Any Return</option>
            <option value="5">5% or higher</option>
            <option value="10">10% or higher</option>
            <option value="15">15% or higher</option>
            <option value="20">20% or higher</option>
            <option value="25">25% or higher</option>
            <option value="50">50% or higher</option>
            <option value="75">75% or higher</option>
            <option value="100">100% or higher</option>
          </select>
        </div>

        <!-- Submit -->
        <div class="space-y-3 pt-4 border-t border-gray-200">
          <button type="submit"
            class="w-full bg-blue-600 text-white py-2.5 px-4 rounded-lg hover:bg-blue-700 font-medium transition-colors shadow-sm">
            Apply Filters
          </button>
        </div>
      </form>
    </aside>

    <!-- Main -->
    <main class="flex-1 p-6">
      <div class="mb-8">
        <h2 class="text-3xl font-bold text-gray-900 mb-2">Investment Opportunities</h2>
        <p class="text-gray-600">Discover startups tailored to your investment profile</p>
      </div>

      <!-- Results -->
      <div class="mb-6 flex items-center justify-between bg-white p-4 rounded-lg border border-gray-200">
        <p class="text-sm text-gray-600">
          Showing <span id="startup-count" class="font-semibold text-gray-900">0</span> startup<span id="startup-plural">s</span>
        </p>
        <div id="clear-filters" class="hidden">
          <button onclick="clearAllFilters()" class="text-blue-600 hover:text-blue-800 transition-colors text-sm">Clear all</button>
        </div>
      </div>

      <!-- Startup Grid -->
      <div id="startup-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
        <!-- Startup cards will be injected here -->
      </div>

      <!-- Empty State -->
      <div id="no-startups" class="col-span-full text-center py-16 hidden">
        <div class="text-6xl mb-4">🔍</div>
        <h3 class="text-xl font-semibold text-gray-900 mb-2">No startups found</h3>
        <p class="text-gray-500 text-lg mb-6">No startups match your current filters.</p>
        <div class="space-x-4">
          <button onclick="loadAllStartups()" class="bg-blue-600 text-white px-6 py-2 rounded-lg hover:bg-blue-700 font-medium">View All</button>
          <button onclick="applyPreset('balanced')" class="bg-gray-100 text-gray-700 px-6 py-2 rounded-lg hover:bg-gray-200 font-medium">Try Balanced</button>
        </div>
      </div>
    </main>
  </div>

  <script>
    function updateRiskLabel(value) {
      document.getElementById('risk-value').textContent = value + '%';
    }

    document.addEventListener('DOMContentLoaded', () => {
      const riskSlider = document.querySelector('input[name="risk"]');
      if (riskSlider) updateRiskLabel(riskSlider.value);
    });

    function applyPreset(type) {
      const form = document.querySelector('#filterForm');
      const riskSlider = form.querySelector('input[name="risk"]');
      const sortSelect = form.querySelector('select[name="sort_by"]');
      const minReturnSelect = form.querySelector('select[name="min_return"]');
      form.querySelector('select[name="industry"]').value = '';

      switch (type) {
        case 'conservative':
          riskSlider.value = 20; sortSelect.value = 'confidence_desc'; minReturnSelect.value = '5'; break;
        case 'balanced':
          riskSlider.value = 50; sortSelect.value = 'recommended'; minReturnSelect.value = '15'; break;
        case 'aggressive':
          riskSlider.value = 80; sortSelect.value = 'projected_return_desc'; minReturnSelect.value = '25'; break;
      }
      updateRiskLabel(riskSlider.value);
      form.submit();
    }
  </script>

  <style>
    .startup-card { transition: all 0.2s ease; }
    .startup-card:hover { transform: translateY(-4px); box-shadow: 0 10px 25px rgba(0,0,0,0.1); }
    .preset-btn:hover { transform: translateY(-1px); }
    .risk-slider::-webkit-slider-thumb {
      appearance: none; height: 20px; width: 20px; border-radius: 50%; background: #3b82f6;
      cursor: pointer; box-shadow: 0 2px 6px rgba(0,0,0,0.2); transition: all 0.2s;
    }
    .risk-slider::-webkit-slider-thumb:hover { background: #2563eb; transform: scale(1.1); }
    .risk-slider::-moz-range-thumb {
      height: 20px; width: 20px; border-radius: 50%; background: #3b82f6; cursor: pointer; border: none;
      box-shadow: 0 2px 6px rgba(0,0,0,0.2);
    }
  </style>
</body>
</html>
