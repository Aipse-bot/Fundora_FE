<!DOCTYPE html>
<html lang="en">
<head>

  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>

  <script>
    tailwind.config = {

<body class="bg-gray-50 min-h-screen">
  <header class="bg-white border-b border-gray-200 px-6 py-4 sticky top-0 z-50">
    <div class="flex justify-between items-center">
      <div class="flex items-center space-x-4">

      </div>
      <div class="flex items-center space-x-4">
        <a href="/Module_2/Compare_Startups.html?return=/Module_1/Dashboard.html" class="bg-green-600 text-white px-4 py-2 rounded-lg hover:bg-green-700 font-medium transition-colors flex items-center">
          <svg class="w-5 h-5 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z"></path>
          </svg>

    </div>
  </header>

  <div class="flex">
    <aside class="fixed top-16 left-0 w-80 h-[calc(100vh-64px)] bg-white border-r border-gray-200 p-6 overflow-y-auto">
      <form id="filterForm" class="space-y-6">
        <div class="bg-gray-50 p-4 rounded-lg">
          <label class="block text-sm font-medium text-gray-700 mb-3">Quick Presets</label>
          <div class="grid grid-cols-1 gap-2">
            <button type="button" onclick="applyPreset('conservative')" class="preset-btn w-full text-left px-3 py-2 text-sm bg-white border border-gray-200 rounded-md hover:bg-blue-50 hover:border-blue-300 transition">
              <div class="flex items-center justify-between"><span class="font-medium">Conservative</span><span class="text-xs text-gray-500">Low Risk</span></div>
            </button>
            <button type="button" onclick="applyPreset('balanced')" class="preset-btn w-full text-left px-3 py-2 text-sm bg-white border border-gray-200 rounded-md hover:bg-blue-50 hover:border-blue-300 transition">
              <div class="flex items-center justify-between"><span class="font-medium">Balanced</span><span class="text-xs text-gray-500">Mixed</span></div>
            </button>
            <button type="button" onclick="applyPreset('aggressive')" class="preset-btn w-full text-left px-3 py-2 text-sm bg-white border border-gray-200 rounded-md hover:bg-blue-50 hover:border-blue-300 transition">
              <div class="flex items-center justify-between"><span class="font-medium">Aggressive</span><span class="text-xs text-gray-500">High Risk</span></div>
            </button>
          </div>
        </div>

        <div>
          <label class="block text-sm font-medium text-gray-700 mb-3">Startup Type</label>
          <div class="grid grid-cols-2 gap-2">
            <button type="button" onclick="setStartupType('financial')" id="type-financial" class="type-btn px-3 py-2.5 text-sm font-medium border-2 border-gray-300 rounded-md hover:border-blue-400 transition-all">
              Financial Data
            </button>
            <button type="button" onclick="setStartupType('pitch_deck')" id="type-pitch_deck" class="type-btn px-3 py-2.5 text-sm font-medium border-2 border-gray-300 rounded-md hover:border-blue-400 transition-all">
              Pitch Decks
            </button>
          </div>
          <input type="hidden" name="startup_type" id="type-hidden" value="">
        </div>

        <!-- Financial Data Filters -->
        <div id="financial-filters" class="space-y-6">
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-2">Sort By</label>
            <select name="sort_by" class="w-full px-3 py-2 border border-gray-300 rounded-md focus:ring-blue-500">
              <option value="">Default Order</option>
              <option value="projected_return_desc">Highest Returns First</option>
              <option value="projected_return_asc">Lowest Returns First</option>
              <option value="reward_potential_desc">Best Reward Potential</option>
              <option value="confidence_desc">Highest Confidence</option>
              <option value="risk_asc">Lowest Risk First</option>
              <option value="company_name">Company Name A-Z</option>
            </select>
          </div>

          <div>
            <label class="block text-sm font-medium text-gray-700 mb-2">Industry</label>
            <select name="industry" class="w-full px-3 py-2 border border-gray-300 rounded-md focus:ring-blue-500">
              <option value="">All Industries</option>
              <option value="Technology">Technology</option>
              <option value="Finance">Finance</option>
              <option value="Healthcare">Healthcare</option>
              <option value="Retail">Retail</option>
              <option value="Manufacturing">Manufacturing</option>
              <option value="Energy">Energy</option>
              <option value="Education">Education</option>
            </select>
          </div>

          <div>
            <label class="block text-sm font-medium text-gray-700 mb-3">Risk Tolerance</label>
            <div class="grid grid-cols-3 gap-2">
              <button type="button" onclick="setRiskLevel('Low')" id="risk-Low" class="risk-btn px-3 py-2.5 text-sm font-medium border-2 border-gray-300 rounded-md hover:border-blue-400 transition-all">
                Low
              </button>
              <button type="button" onclick="setRiskLevel('Medium')" id="risk-Medium" class="risk-btn px-3 py-2.5 text-sm font-medium border-2 border-gray-300 rounded-md hover:border-blue-400 transition-all">
                Medium
              </button>
              <button type="button" onclick="setRiskLevel('High')" id="risk-High" class="risk-btn px-3 py-2.5 text-sm font-medium border-2 border-gray-300 rounded-md hover:border-blue-400 transition-all">
                High

            </div>
            <input type="hidden" name="risk_level" id="risk-hidden" value="">
          </div>

          <div>
            <label class="block text-sm font-medium text-gray-700 mb-2">Minimum Projected Return</label>
            <select name="min_return" class="w-full px-3 py-2 border border-gray-300 rounded-md focus:ring-blue-500">
              <option value="">Any Return</option>
              <option value="5">5% or higher</option>
              <option value="10">10% or higher</option>
              <option value="15">15% or higher</option>
              <option value="20">20% or higher</option>
              <option value="25">25% or higher</option>
              <option value="50">50% or higher</option>
              <option value="75">75% or higher</option>
              <option value="100">100% or higher</option>
            </select>
          </div>
        </div>

        <!-- Pitch Deck Filters -->
        <div id="pitch-deck-filters" class="space-y-6 hidden">
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-2">Sort By</label>
            <select name="deck_sort_by" class="w-full px-3 py-2 border border-gray-300 rounded-md focus:ring-blue-500">
              <option value="">Default Order</option>
              <option value="funding_ask_desc">Highest Funding Ask</option>
              <option value="funding_ask_asc">Lowest Funding Ask</option>
              <option value="market_growth_desc">Highest Market Growth</option>
              <option value="market_growth_asc">Lowest Market Growth</option>
              <option value="company_name">Company Name A-Z</option>
            </select>
          </div>

          <div>
            <label class="block text-sm font-medium text-gray-700 mb-2">Funding Ask Range</label>
            <select name="funding_ask_range" class="w-full px-3 py-2 border border-gray-300 rounded-md focus:ring-blue-500">
              <option value="">Any Amount</option>
              <option value="0-100000">Up to $100K</option>
              <option value="100000-500000">$100K - $500K</option>
              <option value="500000-1000000">$500K - $1M</option>
              <option value="1000000-5000000">$1M - $5M</option>
              <option value="5000000+">$5M+</option>
            </select>
          </div>

          <div>
            <label class="block text-sm font-medium text-gray-700 mb-3">Market Growth Rate</label>
            <div class="grid grid-cols-3 gap-2">
              <button type="button" onclick="setMarketGrowth('Low')" id="growth-Low" class="growth-btn px-3 py-2.5 text-sm font-medium border-2 border-gray-300 rounded-md hover:border-blue-400 transition-all">
                0-10%
              </button>
              <button type="button" onclick="setMarketGrowth('Medium')" id="growth-Medium" class="growth-btn px-3 py-2.5 text-sm font-medium border-2 border-gray-300 rounded-md hover:border-blue-400 transition-all">
                10-30%
              </button>
              <button type="button" onclick="setMarketGrowth('High')" id="growth-High" class="growth-btn px-3 py-2.5 text-sm font-medium border-2 border-gray-300 rounded-md hover:border-blue-400 transition-all">
                30%+
              </button>
            </div>
            <input type="hidden" name="market_growth_filter" id="growth-hidden" value="">
          </div>

          <div>
            <label class="block text-sm font-medium text-gray-700 mb-2">Minimum Market Growth</label>
            <select name="min_market_growth" class="w-full px-3 py-2 border border-gray-300 rounded-md focus:ring-blue-500">
              <option value="">Any Growth Rate</option>
              <option value="5">5% or higher</option>
              <option value="10">10% or higher</option>
              <option value="15">15% or higher</option>
              <option value="20">20% or higher</option>
              <option value="30">30% or higher</option>
              <option value="50">50% or higher</option>
            </select>
          </div>
        </div>

        <div class="space-y-3 pt-4 border-t border-gray-200">
          <button type="submit" class="w-full bg-blue-600 text-white py-2.5 px-4 rounded-lg hover:bg-blue-700 font-medium transition">Apply Filters</button>
          <button type="button" onclick="clearAllFilters()" class="w-full bg-gray-100 text-gray-700 py-2.5 px-4 rounded-lg hover:bg-gray-200 font-medium transition">Clear All</button>
        </div>
      </form>
    </aside>

    <main class="flex-1 p-6 ml-80">
      <div class="mb-8">
        <h2 class="text-3xl font-bold text-gray-900 mb-2">Investment Opportunities</h2>
        <p class="text-gray-600">Discover startups tailored to your investment profile</p>
      </div>

      <div class="mb-6 flex items-center justify-between bg-white p-4 rounded-lg border border-gray-200">
        <p class="text-sm text-gray-600">Showing <span id="startup-count" class="font-semibold text-gray-900">0</span> startup<span id="startup-plural">s</span></p>
        <div id="clear-filters" class="hidden"></div>
      </div>

      <div id="startup-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6"></div>

      <div id="no-startups" class="col-span-full text-center py-16 hidden">
        <div class="text-6xl mb-4">🔍</div>
        <h3 class="text-xl font-semibold text-gray-900 mb-2">No startups found</h3>
        <p class="text-gray-500 text-lg mb-6">No startups match your current filters.</p>
      </div>
    </main>
  </div>

  <script>
    const API_BASE = 'https://fundora-be-singapore.onrender.com';
    const STARTUPS_ENDPOINT = `${API_BASE}/api/investor/startups/`;
    const WATCHLIST_ENDPOINT = `${API_BASE}/api/investor/watchlist/`;
    const ADD_WATCHLIST_ENDPOINT = (id) => `${API_BASE}/api/investor/watchlist/add/${id}/`;
    const REMOVE_WATCHLIST_ENDPOINT = (id) => `${API_BASE}/api/investor/watchlist/remove/${id}/`;
    const LOGOUT_ENDPOINT = `${API_BASE}/api/logout/`;
    const COMPANY_PROFILE_PAGE = '../Module_2/Company_Profile.html';
    const COMPANY_PROFILE_DB_PAGE = '../Module_2/Company_ProfileDB.html';
    const INVEST_PAGE = '../Module_2/Investment_Simulation.html';

    function getAuthToken() {
      return localStorage.getItem('authToken');
    }

    function authHeaders() {
      const token = getAuthToken();
      if (!token) return {};
      return { 'Authorization': `Bearer ${token}`, 'Content-Type': 'application/json' };
    }

    function riskLevelToNum(riskLevel) {
      const map = { 'Low': 1, 'Medium': 2, 'High': 3 };
      return map[riskLevel] || 2;
    }

    function confidenceToNum(confidence) {
      const map = { 'High': 3, 'Medium': 2, 'Low': 1 };
      return map[confidence] || 0;
    }

    async function fetchJSON(url, options = {}) {
      const token = getAuthToken();
      if (!token) {
        window.location.href = '/login';
        throw new Error('No auth token');
      }
      options.headers = Object.assign({}, options.headers || {}, { 'Authorization': `Bearer ${token}` });
      const res = await fetch(url, options);
      if (res.status === 401 || res.status === 403) {
        localStorage.removeItem('authToken');
        window.location.href = '/login';
        throw new Error('Unauthorized');
      }
      if (!res.ok) {
        const text = await res.text().catch(()=>null);
        throw new Error(`Request failed: ${res.status} ${text || ''}`);
      }
      const ct = res.headers.get('content-type') || '';
      if (ct.includes('application/json')) return await res.json();
      return null;
    }

    let watchlistIdsSet = new Set();
    async function refreshWatchlist() {
        try {
            const data = await fetchJSON(WATCHLIST_ENDPOINT, { method: 'GET' });
            const items = data.results || data.watchlist || [];
            watchlistIdsSet = new Set(items.map(it => it.id));
            
            const badge = document.getElementById('watchlist-badge');
            badge.textContent = data.count ?? items.length ?? 0;
        } catch (err) {
            console.warn('Could not refresh watchlist:', err);
        }
    }

    async function addToWatchlist(startupId, btn) {
      try {
        const res = await fetch(ADD_WATCHLIST_ENDPOINT(startupId), {
          method: 'POST',
          headers: authHeaders()
        });
        if (res.status === 201 || res.ok) {
          watchlistIdsSet.add(Number(startupId));
          updateWatchlistBadge();
          btn && btn.classList.add('text-blue-600');
          return true;
        } else {
          console.warn('Add failed', res.status);
          return false;
        }
      } catch (err) {
        console.error('Error adding to watchlist', err);
        return false;
      }
    }

    async function removeFromWatchlist(startupId, btn) {
      try {
        const res = await fetch(REMOVE_WATCHLIST_ENDPOINT(startupId), {
          method: 'DELETE',
          headers: authHeaders()
        });
        if (res.ok) {
          watchlistIdsSet.delete(Number(startupId));
          updateWatchlistBadge();
          btn && btn.classList.remove('text-blue-600');
          return true;
        } else {
          console.warn('Remove failed', res.status);
          return false;
        }
      } catch (err) {
        console.error('Error removing from watchlist', err);
        return false;
      }
    }

    function updateWatchlistBadge() {
      const badge = document.getElementById('watchlist-badge');
      if (badge) {
        badge.textContent = watchlistIdsSet.size;
      }
    }

    function setStartupType(type) {
      document.querySelectorAll('.type-btn').forEach(btn => {
        btn.classList.remove('border-blue-500', 'bg-blue-50');
        btn.classList.add('border-gray-300');
      });
      
      const selectedBtn = document.getElementById(`type-${type}`);
      if (selectedBtn) {
        selectedBtn.classList.remove('border-gray-300');
        selectedBtn.classList.add('border-blue-500', 'bg-blue-50');
      }
      
      document.getElementById('type-hidden').value = type;
      
      const financialFilters = document.getElementById('financial-filters');
      const pitchDeckFilters = document.getElementById('pitch-deck-filters');
      
      if (type === 'pitch_deck') {
        financialFilters.classList.add('hidden');
        pitchDeckFilters.classList.remove('hidden');
      } else {
        financialFilters.classList.remove('hidden');
        pitchDeckFilters.classList.add('hidden');
      }
      
      console.log('Startup type set to:', type);
    }

    function setMarketGrowth(level) {
      document.querySelectorAll('.growth-btn').forEach(btn => {
        btn.classList.remove('border-blue-500', 'bg-blue-50');
        btn.classList.add('border-gray-300');
      });
      
      const selectedBtn = document.getElementById(`growth-${level}`);
      if (selectedBtn) {
        selectedBtn.classList.remove('border-gray-300');
        selectedBtn.classList.add('border-blue-500', 'bg-blue-50');
      }
      
      document.getElementById('growth-hidden').value = level;
      console.log('Market growth set to:', level);
    }

    async function fetchStartups() {
      try {
        const token = getAuthToken();
        if (!token) throw new Error('No auth token found');

        const form = document.getElementById('filterForm');
        const params = new URLSearchParams();

        const sortVal = form.elements.sort_by?.value;
        if (sortVal) {
          params.set('sort_by', sortVal);
        }

        const industry = form.elements.industry?.value;
        if (industry) {
          params.set('industry', industry);
        }

        const minReturn = form.elements.min_return?.value;
        if (minReturn) {
          params.set('min_return', minReturn);
        }

        const riskLevel = document.getElementById('risk-hidden')?.value;
        if (riskLevel) {
          params.set('risk_level', riskLevel);
        }

        const url = STARTUPS_ENDPOINT + (params.toString() ? `?${params.toString()}` : '');
        console.log('Full URL:', url);

        const [startupsData] = await Promise.allSettled([
          fetchJSON(url, { method: 'GET' }),
          refreshWatchlist()
        ]);

        const startupPayload = (startupsData.status === 'fulfilled') ? (startupsData.value) : null;
        let startups = [];
        if (startupPayload) {
          startups = startupPayload.results || startupPayload.startups || startupPayload;
          if (!Array.isArray(startups)) {
            if (startupPayload.startups && Array.isArray(startupPayload.startups)) {
              startups = startupPayload.startups;
            } else if (Array.isArray(startupPayload)) {
              startups = startupPayload;
            } else {
              startups = [];
            }
          }
        }

        console.log('Fetched startups count:', startups.length);
        return startups || [];
      } catch (error) {
        console.error('Error fetching startups:', error);
        return [];
      }
    }

    function sortStartups(startups, sortBy) {
      const copy = [...startups];
      if (!sortBy) return copy;
      
      if (sortBy === 'funding_ask_desc') return copy.sort((a, b) => (parseFloat(b.funding_ask) || 0) - (parseFloat(a.funding_ask) || 0));
      if (sortBy === 'funding_ask_asc') return copy.sort((a, b) => (parseFloat(a.funding_ask) || 0) - (parseFloat(b.funding_ask) || 0));
      if (sortBy === 'market_growth_desc') return copy.sort((a, b) => (parseFloat(b.market_growth_rate ?? b.market_growth) || 0) - (parseFloat(a.market_growth_rate ?? a.market_growth) || 0));
      if (sortBy === 'market_growth_asc') return copy.sort((a, b) => (parseFloat(a.market_growth_rate ?? a.market_growth) || 0) - (parseFloat(b.market_growth_rate ?? b.market_growth) || 0));
      
      switch (sortBy) {
        case 'projected_return_desc': return copy.sort((a, b) => (b.projected_return || 0) - (a.projected_return || 0));
        case 'projected_return_asc': return copy.sort((a, b) => (a.projected_return || 0) - (b.projected_return || 0));
        case 'reward_potential_desc': return copy.sort((a, b) => (b.reward_potential || 0) - (a.reward_potential || 0));
        case 'confidence_desc': return copy.sort((a, b) => (confidenceToNum(b.data_source_confidence) - confidenceToNum(a.data_source_confidence)));
        case 'risk_asc': return copy.sort((a, b) => riskLevelToNum(a.risk_level) - riskLevelToNum(b.risk_level));
        case 'company_name': return copy.sort((a, b) => (a.company_name || '').localeCompare(b.company_name || ''));
        default: return copy;
      }
    }

    function createStartupCard(startup) {
      const card = document.createElement('div');
      card.className = 'startup-card bg-white rounded-lg border border-gray-200 p-6 hover:shadow-lg transition flex flex-col';
      const isDeck = !!(startup.is_deck_builder || startup.source_deck_id || startup.source_deck);
      card.setAttribute('data-startup-id', startup.id);
      card.setAttribute('data-is-deck-builder', isDeck ? 'true' : 'false');

      let riskBadge;
      let hasDataPending = false;
      if (isDeck) {
        riskBadge = '<span class="bg-purple-100 text-purple-800 text-xs font-medium px-2.5 py-1 rounded-full">Pitch Deck</span>';
      } else if (startup.risk_level) {
        const riskLevel = startup.risk_level.toLowerCase();
        if (riskLevel === 'low') {
          riskBadge = '<span class="bg-green-100 text-green-800 text-xs font-medium px-2.5 py-1 rounded-full">Low Risk</span>';
        } else if (riskLevel === 'medium') {
          riskBadge = '<span class="bg-yellow-100 text-yellow-800 text-xs font-medium px-2.5 py-1 rounded-full">Medium Risk</span>';
        } else {
          riskBadge = '<span class="bg-red-100 text-red-800 text-xs font-medium px-2.5 py-1 rounded-full">High Risk</span>';
        }
      } else {
        hasDataPending = true;
        riskBadge = '<span class="bg-gray-100 text-gray-600 text-xs font-medium px-2.5 py-1 rounded-full">Data Pending</span>';
      }

      const industry = isDeck ? (startup.tagline || '—') : (startup.industry || '—');
      let reward = 'N/A';
      if (startup.reward_potential != null) {
        if (typeof startup.reward_potential === 'string') {
          reward = startup.reward_potential.split(',')[0].trim();
        } else if (Array.isArray(startup.reward_potential)) {
          reward = startup.reward_potential[0];
        } else {
          reward = String(startup.reward_potential);
        }
      }

      const rewardDisplay = reward === 'N/A' ? 'N/A' : `${reward}/5`;
      const projected = (startup.projected_return != null && startup.projected_return !== '') ? `${startup.projected_return >= 0 ? '+' : ''}${startup.projected_return}%` : 'N/A';

      const inWatchlist = watchlistIdsSet.has(Number(startup.id));

      let metricsSection;
      if (isDeck) {
        const fundingAmount = startup.funding_ask ? `$${parseFloat(startup.funding_ask).toLocaleString()}` : 'N/A';
        const marketGrowth = startup.market_growth_rate ?? startup.market_growth ?? 'N/A';
        const marketGrowthDisplay = marketGrowth !== 'N/A' ? `${marketGrowth}%` : 'N/A';
        
        metricsSection = `
          <div class="space-y-3 mb-4 flex-grow">
            <div class="flex justify-between items-center">
              <span class="text-sm text-gray-600">Funding Ask</span>
              <span class="text-sm font-semibold text-purple-600">${escapeHtml(fundingAmount)}</span>
            </div>
            <div class="flex justify-between items-center">
              <span class="text-sm text-gray-600">Market Growth</span>
              <span class="text-sm font-semibold text-green-600">${escapeHtml(marketGrowthDisplay)}</span>
            </div>
          </div>
        `;
      } else {
        metricsSection = `
          <div class="space-y-3 mb-4 flex-grow">
            <div class="flex justify-between items-center">
              <span class="text-sm text-gray-600">Reward Potential</span>
              <span class="text-sm font-semibold">${escapeHtml(rewardDisplay)}</span>
            </div>
            <div class="flex justify-between items-center">
              <span class="text-sm text-gray-600">Projected Return</span>
              <span class="text-sm font-semibold ${startup.projected_return != null && startup.projected_return >= 0 ? 'text-green-600' : 'text-red-600'}">${escapeHtml(projected)}</span>
            </div>
          </div>
        `;
      }

      card.innerHTML = `
        <div class="flex justify-between items-start mb-4">
          <div class="flex-1">
            <h3 class="text-lg font-semibold text-gray-900 mb-1">${escapeHtml(startup.company_name)}</h3>
            <p class="text-sm text-gray-600">${escapeHtml(industry)}</p>
          </div>
          <div class="flex flex-col items-end space-y-2">
            ${riskBadge}
            <button class="watch-toggle text-sm" title="${inWatchlist ? 'Remove from watchlist' : 'Add to watchlist'}" aria-pressed="${inWatchlist ? 'true' : 'false'}">
              ${inWatchlist ? watchIcon(true) : watchIcon(false)}
            </button>
          </div>
        </div>
        ${metricsSection}
        <div class="flex gap-2 mt-auto">
          <button class="view-details-btn flex-1 px-3 py-2 border border-gray-300 text-gray-700 rounded-md hover:bg-gray-50 hover:border-gray-400 text-sm font-medium text-center transition-all cursor-pointer">View Details</button>
          ${hasDataPending 
          ? '<button class="invest-btn flex-1 px-3 py-2 bg-gray-300 text-gray-500 rounded-md text-sm text-center cursor-not-allowed" disabled title="Cannot invest - data pending">Invest</button>'
          : `<a class="invest-btn flex-1 px-3 py-2 bg-blue-600 text-white rounded-md text-sm text-center hover:bg-blue-700" href="${INVEST_PAGE}?startup_id=${startup.id}">Invest</a>`
        }
        </div>
      `;

      card.querySelector('.view-details-btn').addEventListener('click', () => {
        const id = card.getAttribute('data-startup-id');
        const isDeckBuilder = card.getAttribute('data-is-deck-builder') === 'true';
        const target = isDeckBuilder ? `${COMPANY_PROFILE_DB_PAGE}?id=${id}` : `${COMPANY_PROFILE_PAGE}?id=${id}`;
        window.location.href = target;
      });

      const watchBtn = card.querySelector('.watch-toggle');
      watchBtn.addEventListener('click', async (e) => {
        e.stopPropagation();
        const sid = startup.id;
        const currently = watchlistIdsSet.has(Number(sid));
        if (!currently) {
          watchBtn.disabled = true;
          const ok = await addToWatchlist(sid, watchBtn);
          watchBtn.disabled = false;
          if (ok) {
            watchBtn.innerHTML = watchIcon(true);
            watchBtn.title = 'Remove from watchlist';
            watchBtn.setAttribute('aria-pressed', 'true');
          } else {
            alert('Could not add to watchlist.');
          }
        } else {
          watchBtn.disabled = true;
          const ok = await removeFromWatchlist(sid, watchBtn);
          watchBtn.disabled = false;
          if (ok) {
            watchBtn.innerHTML = watchIcon(false);
            watchBtn.title = 'Add to watchlist';
            watchBtn.setAttribute('aria-pressed', 'false');
          } else {
            alert('Could not remove from watchlist.');
          }
        }
      });

      return card;
    }

    function watchIcon(active) {
      if (active) {
        return `<svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 text-blue-600" fill="currentColor" viewBox="0 0 24 24"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 6 4 4 6.5 4c1.54 0 3.04.99 3.57 2.36h.87C13.46 4.99 14.96 4 16.5 4 19 4 21 6 21 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>`;
      }
      return `<svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 text-gray-400" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M21 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35l-0.45-0.41C6.4 15.36 3 12.28 3 8.5 3 6 5 4 7.5 4c1.54 0 3.04 .99 3.57 2.36h0.87C13.46 4.99 14.96 4 16.5 4 19 4 21 6 21 8.5z"/></svg>`;
    }

    function escapeHtml(unsafe) {
      if (unsafe === null || unsafe === undefined) return '';
      return String(unsafe)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    function applyClientSideFilters(startups) {
      let filtered = [...startups];
      
      const form = document.getElementById('filterForm');
      
      const startupType = document.getElementById('type-hidden')?.value;
      if (startupType && startupType.trim() !== '') {
        const beforeCount = filtered.length;
        if (startupType === 'pitch_deck') {
          filtered = filtered.filter(s => {
            return !!(s.is_deck_builder || s.source_deck_id || s.source_deck);
          });
          
          const fundingAskRange = form.elements.funding_ask_range?.value;
          if (fundingAskRange && fundingAskRange !== '') {
            filtered = filtered.filter(s => {
              const fundingAsk = parseFloat(s.funding_ask);
              if (isNaN(fundingAsk)) return false;
              
              if (fundingAskRange === '0-100000') return fundingAsk <= 100000;
              if (fundingAskRange === '100000-500000') return fundingAsk >= 100000 && fundingAsk <= 500000;
              if (fundingAskRange === '500000-1000000') return fundingAsk >= 500000 && fundingAsk <= 1000000;
              if (fundingAskRange === '1000000-5000000') return fundingAsk >= 1000000 && fundingAsk <= 5000000;
              if (fundingAskRange === '5000000+') return fundingAsk >= 5000000;
              return true;
            });
          }
          
          const marketGrowthFilter = document.getElementById('growth-hidden')?.value;
          if (marketGrowthFilter && marketGrowthFilter !== '') {
            filtered = filtered.filter(s => {
              const growth = parseFloat(s.market_growth_rate ?? s.market_growth);
              if (isNaN(growth)) return false;
              
              if (marketGrowthFilter === 'Low') return growth >= 0 && growth < 10;
              if (marketGrowthFilter === 'Medium') return growth >= 10 && growth < 30;
              if (marketGrowthFilter === 'High') return growth >= 30;
              return true;
            });
          }
          
          const minMarketGrowth = form.elements.min_market_growth?.value;
          if (minMarketGrowth && minMarketGrowth !== '') {
            const minGrowthValue = parseFloat(minMarketGrowth);
            filtered = filtered.filter(s => {
              const growth = parseFloat(s.market_growth_rate ?? s.market_growth);
              return !isNaN(growth) && growth >= minGrowthValue;
            });
          }
          
        } else if (startupType === 'financial') {
          filtered = filtered.filter(s => {
            return !(s.is_deck_builder || s.source_deck_id || s.source_deck);
          });
          
          const riskLevel = document.getElementById('risk-hidden')?.value;
          if (riskLevel && riskLevel.trim() !== '') {
            filtered = filtered.filter(s => {
              return s.risk_level === riskLevel;
            });
          }
          
          const minReturn = form.elements.min_return?.value;
          if (minReturn && minReturn.trim() !== '') {
            const minReturnValue = parseFloat(minReturn);
            filtered = filtered.filter(s => {
              const projReturn = s.projected_return;
              return projReturn !== null && projReturn !== undefined && projReturn >= minReturnValue;
            });
          }
        }
        console.log(`Client-side Type filter: ${startupType} | Before: ${beforeCount}, After: ${filtered.length}`);
      }
      
      return filtered;
    }

    async function renderStartups() {
      console.log('Rendering startups...');
      
      const grid = document.getElementById('startup-grid');
      const noStartups = document.getElementById('no-startups');
      grid.innerHTML = '<div class="col-span-full text-center py-16"><div class="text-4xl mb-4">⏳</div><p class="text-gray-600">Loading startups...</p></div>';
      noStartups.classList.add('hidden');
      
      const startups = await fetchStartups();
      console.log('Raw startups from backend:', startups.length);
      
      const clientFiltered = applyClientSideFilters(startups);
      
      const form = document.getElementById('filterForm');
      const startupType = document.getElementById('type-hidden')?.value;
      let sortBy;
      if (startupType === 'pitch_deck') {
        sortBy = form.elements.deck_sort_by?.value;
      } else {
        sortBy = form.elements.sort_by?.value;
      }
      
      const sorted = sortStartups(clientFiltered, sortBy);

      const countSpan = document.getElementById('startup-count');
      const clearBtn = document.getElementById('clear-filters');
      grid.innerHTML = '';

      if (!sorted || sorted.length === 0) {
        noStartups.classList.remove('hidden');
        countSpan.textContent = '0';
        clearBtn.classList.add('hidden');
        console.log('No startups found after filtering');
        return;
      }

      noStartups.classList.add('hidden');
      countSpan.textContent = sorted.length;
      document.getElementById('startup-plural').textContent = sorted.length === 1 ? '' : 's';
      clearBtn.classList.remove('hidden');

      console.log('Rendering', sorted.length, 'startup cards');
      for (const s of sorted) {
        const card = createStartupCard(s);
        grid.appendChild(card);
      }
    }

    function setRiskLevel(level) {
      document.querySelectorAll('.risk-btn').forEach(btn => {
        btn.classList.remove('border-blue-500', 'bg-blue-50');
        btn.classList.add('border-gray-300');
      });
      
      const selectedBtn = document.getElementById(`risk-${level}`);
      if (selectedBtn) {
        selectedBtn.classList.remove('border-gray-300');
        selectedBtn.classList.add('border-blue-500', 'bg-blue-50');
      }
      
      document.getElementById('risk-hidden').value = level;
      console.log('Risk level set to:', level);
    }

    function clearAllFilters() {
      const form = document.getElementById('filterForm');
      form.reset();
      
      document.querySelectorAll('.type-btn').forEach(btn => {
        btn.classList.remove('border-blue-500', 'bg-blue-50');
        btn.classList.add('border-gray-300');
      });
      document.getElementById('type-hidden').value = '';
      
      document.getElementById('financial-filters').classList.remove('hidden');
      document.getElementById('pitch-deck-filters').classList.add('hidden');
      
      document.querySelectorAll('.risk-btn').forEach(btn => {
        btn.classList.remove('border-blue-500', 'bg-blue-50');
        btn.classList.add('border-gray-300');
      });
      
      document.querySelectorAll('.growth-btn').forEach(btn => {
        btn.classList.remove('border-blue-500', 'bg-blue-50');
        btn.classList.add('border-gray-300');
      });
      
      document.getElementById('risk-hidden').value = '';
      document.getElementById('growth-hidden').value = '';
      
      renderStartups();
    }

    function applyPreset(preset) {
      const form = document.getElementById('filterForm');
      
      setStartupType('financial');
      
      form.elements.sort_by.value = '';
      form.elements.industry.value = '';
      form.elements.min_return.value = '';
      
      if (preset === 'conservative') { 
        setRiskLevel('Low');
      }
      else if (preset === 'balanced') { 
        setRiskLevel('Medium');
      }
      else if (preset === 'aggressive') { 
        setRiskLevel('High');
        form.elements.min_return.value = '20'; 
      }
      
      renderStartups();
    }

    async function logoutUser() {
      try {
        await fetch(LOGOUT_ENDPOINT, { method: 'POST', headers: authHeaders() });
      } catch (err) {
        console.warn('Logout error (ignored):', err);
      } finally {
        localStorage.removeItem('authToken');
        window.location.href = '/login.html';
      }
    }

    document.getElementById('filterForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      console.log('Apply Filters clicked!');
      await renderStartups();
    });

    document.getElementById('logoutBtn').addEventListener('click', () => {
      logoutUser();
    });

    document.addEventListener('DOMContentLoaded', async () => {
      const token = getAuthToken();
      if (!token) { window.location.href = '/login'; return; }

      try {
        await refreshWatchlist();
      } catch (e) { /* ignore */ }

      await renderStartups();
    });

    window._fundora = {
      refreshWatchlist,
      fetchStartups,
      renderStartups,
      addToWatchlist,
      removeFromWatchlist
    };
  </script>

  <style>
    .startup-card:hover {
      transform: translateY(-4px);
      box-shadow: 0 10px 25px rgba(0,0,0,0.1);
    }
  </style>
</body>
</html>
