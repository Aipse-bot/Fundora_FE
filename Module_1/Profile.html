  <style>
    body { font-family: 'Inter', sans-serif; }
    .hero-gradient { background: linear-gradient(135deg, #0f172a 0%, #1e293b 50%, #0f172a 100%); }
    .glass-card { background: rgba(15, 23, 42, 0.7); border: 1px solid rgba(59, 130, 246, 0.2); }
    
    @keyframes fadeInUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes scaleIn { from { opacity: 0; transform: scale(0.95); } to { opacity: 1; transform: scale(1); } }
    @keyframes slideDown { from { opacity: 0; transform: translateY(-10px); } to { opacity: 1; transform: translateY(0); } }
    
    .fade-in-up { animation: fadeInUp 0.6s ease-out forwards; opacity: 0; }
    .scale-in { animation: scaleIn 0.5s ease-out forwards; opacity: 0; }
    .slide-down { animation: slideDown 0.4s ease-out forwards; opacity: 0; }
    
    .stat-card {
      transition: all 0.3s ease;
      opacity: 0;
      animation: fadeInUp 0.6s ease-out forwards;
    }
    .stat-card:hover {
      transform: translateY(-4px) scale(1.02);
      box-shadow: 0 12px 24px rgba(59, 130, 246, 0.2);
    }
    .stat-card:nth-child(1) { animation-delay: 0.1s; }
    .stat-card:nth-child(2) { animation-delay: 0.2s; }
    .stat-card:nth-child(3) { animation-delay: 0.3s; }
    
    header { animation: slideDown 0.5s ease-out; }
    
    button, a { transition: all 0.3s ease; }
    button:hover:not(:disabled), a:hover {
      transform: translateY(-1px);
    }
    button:active:not(:disabled), a:active {
      transform: translateY(0);
    }
    
    input:focus {
      box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.1);
      transition: all 0.3s ease;
    }
    
    #editModal {
      backdrop-filter: blur(8px);
      animation: fadeInUp 0.3s ease-out;
    }
    
    #editModal > div {
      animation: scaleIn 0.3s ease-out;
    }
    
    .activity-item {
      transition: all 0.3s ease;
    }
    .activity-item:hover {
      transform: translateX(4px);
      background-color: rgba(51, 65, 85, 0.5) !important;
    }
  </style>
</head>

  <script>
    // const API_BASE = 'http://127.0.0.1:8000';
    const API_BASE = 'fundorabe-production-5ccb.up.railway.app';
    const PROFILE_ENDPOINT = `${API_BASE}/api/profile/`;
    const UPDATE_PROFILE_ENDPOINT = `${API_BASE}/api/profile/update/`;
    const LOGOUT_ENDPOINT = `${API_BASE}/api/logout/`;

    const cachedElements = {
      userName: document.getElementById('userName'),
      userEmail: document.getElementById('userEmail'),
      userInitials: document.getElementById('userInitials'),
      userLabel: document.getElementById('userLabel'),
      watchlistCount: document.getElementById('watchlistCount'),
      viewsCount: document.getElementById('viewsCount'),
      comparisonsCount: document.getElementById('comparisonsCount'),
      recentViews: document.getElementById('recentViews'),
      recentComparisons: document.getElementById('recentComparisons'),
      editModal: document.getElementById('editModal'),
      editForm: document.getElementById('editForm'),
      editFirstName: document.getElementById('editFirstName'),
      editLastName: document.getElementById('editLastName'),
      editEmail: document.getElementById('editEmail'),
      logoutBtn: document.getElementById('logoutBtn'),
      editProfileBtn: document.getElementById('editProfileBtn'),
      cancelEdit: document.getElementById('cancelEdit')
    };

    // TODO: change to session
    function getAuthToken() {
      return sessionStorage.getItem('authToken');
    }

    function authHeaders() {
      const token = getAuthToken();
      if (!token) return {};
      return { 'Authorization': `Bearer ${token}`, 'Content-Type': 'application/json' };
    }

    async function fetchJSON(url, options = {}) {
      const token = getAuthToken();
      if (!token) {
        window.location.href = '/login.html';
        throw new Error('No auth token');
      }
      options.headers = Object.assign({}, options.headers || {}, { 'Authorization': `Bearer ${token}` });
      const res = await fetch(url, options);
      if (res.status === 401 || res.status === 403) {
        sessionStorage.removeItem('authToken');  // ← CHANGED
        window.location.href = '/login.html';
        throw new Error('Unauthorized');
      }
      if (!res.ok) {
        const text = await res.text().catch(()=>null);
        throw new Error(`Request failed: ${res.status} ${text || ''}`);
      }
      const ct = res.headers.get('content-type') || '';
      if (ct.includes('application/json')) return await res.json();
      return null;
    }

    function getInitials(firstName, lastName) {
      const first = (firstName || '?').charAt(0).toUpperCase();
      const last = (lastName || '').charAt(0).toUpperCase();
      return first + last;
    }

    function formatDate(dateString) {
      const date = new Date(dateString);
      const now = new Date();
      const diffMs = now - date;
      const diffMins = Math.floor(diffMs / 60000);
      const diffHours = Math.floor(diffMs / 3600000);
      const diffDays = Math.floor(diffMs / 86400000);

      if (diffMins < 1) return 'Just now';
      if (diffMins < 60) return `${diffMins}m ago`;
      if (diffHours < 24) return `${diffHours}h ago`;
      if (diffDays < 7) return `${diffDays}d ago`;
      
      return date.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
    }

    async function loadProfile() {
      try {
        const data = await fetchJSON(PROFILE_ENDPOINT);
        
        cachedElements.userName.textContent = `${data.first_name} ${data.last_name}`;
        cachedElements.userEmail.textContent = data.email;
        cachedElements.userInitials.textContent = getInitials(data.first_name, data.last_name);
        
        const labelEl = cachedElements.userLabel;
        if (data.label === 'investor') {
          labelEl.textContent = 'Investor';
          labelEl.className = 'inline-block px-4 py-1.5 rounded-full text-sm font-medium mt-2 bg-brand-500/20 text-brand-300 border border-brand-500/30';
        } else if (data.label === 'startup') {
          labelEl.textContent = 'Startup';
          labelEl.className = 'inline-block px-4 py-1.5 rounded-full text-sm font-medium mt-2 bg-accent-500/20 text-accent-300 border border-accent-500/30';
        } else {
          labelEl.textContent = 'User';
          labelEl.className = 'inline-block px-4 py-1.5 rounded-full text-sm font-medium mt-2 bg-gray-500/20 text-gray-300 border border-gray-500/30';
        }

        cachedElements.watchlistCount.textContent = data.watchlist_count || 0;
        cachedElements.viewsCount.textContent = data.views_count || 0;
        cachedElements.comparisonsCount.textContent = data.comparisons_count || 0;

        renderRecentViews(data.recent_views || []);
        renderRecentComparisons(data.recent_comparisons || []);

      } catch (error) {
        console.error('Error loading profile:', error);
        alert('Failed to load profile data');
      }
    }

    function renderRecentViews(views) {
      const container = cachedElements.recentViews;
      
      if (!views || views.length === 0) {
        container.innerHTML = '<div class="text-center py-8 text-gray-400">No recent views</div>';
        return;
      }

      container.innerHTML = views.slice(0, 5).map(view => `
        <div class="activity-item flex flex-col sm:flex-row sm:items-center justify-between p-3 sm:p-4 bg-slate-800/30 rounded-lg hover:bg-slate-800/50 transition-all gap-2">
          <div class="flex-1">
            <h4 class="font-semibold text-white">${escapeHtml(view.startup_name || 'Unknown')}</h4>
            <p class="text-sm text-gray-400">${escapeHtml(view.startup_industry || 'N/A')}</p>
          </div>
          <span class="text-sm text-gray-500">${formatDate(view.viewed_at)}</span>
        </div>
      `).join('');
    }

    function renderRecentComparisons(comparisons) {
      const container = cachedElements.recentComparisons;
      
      if (!comparisons || comparisons.length === 0) {
        container.innerHTML = '<div class="text-center py-8 text-gray-400">No recent comparisons</div>';
        return;
      }

      container.innerHTML = comparisons.slice(0, 5).map(comp => `
        <div class="activity-item p-4 bg-slate-800/30 rounded-lg hover:bg-slate-800/50 transition-all">
          <div class="flex items-center justify-between mb-2">
            <span class="text-sm font-medium text-purple-400">${comp.startup_count || 0} startups</span>
            <span class="text-sm text-gray-500">${formatDate(comp.created_at)}</span>
          </div>
          <p class="text-sm text-gray-300">${escapeHtml(comp.name || 'Comparison Set')}</p>
        </div>
      `).join('');
    }

    function escapeHtml(unsafe) {
      if (unsafe === null || unsafe === undefined) return '';
      return String(unsafe)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    async function logoutUser() {
      try {
        await fetch(LOGOUT_ENDPOINT, { method: 'POST', headers: authHeaders() });
      } catch (err) {
        console.warn('Logout error (ignored):', err);
      } finally {
        sessionStorage.removeItem('authToken');
        window.location.href = '/login.html';
      }
    }

    cachedElements.logoutBtn.addEventListener('click', logoutUser);

    cachedElements.editProfileBtn.addEventListener('click', async () => {
      try {
        const data = await fetchJSON(PROFILE_ENDPOINT);
        cachedElements.editFirstName.value = data.first_name || '';
        cachedElements.editLastName.value = data.last_name || '';
        cachedElements.editEmail.value = data.email || '';
        
        document.body.style.overflow = 'hidden';
        
        cachedElements.editModal.classList.remove('hidden');
      } catch (error) {
        console.error('Error loading profile for edit:', error);
      }
    });

    cachedElements.cancelEdit.addEventListener('click', () => {
      cachedElements.editModal.classList.add('hidden');
      document.body.style.overflow = '';
    });

    cachedElements.editForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      
      const formData = {
        first_name: cachedElements.editFirstName.value,
        last_name: cachedElements.editLastName.value,
        email: cachedElements.editEmail.value
      };

      try {
        await fetchJSON(UPDATE_PROFILE_ENDPOINT, {
          method: 'PUT',
          headers: authHeaders(),
          body: JSON.stringify(formData)
        });

        cachedElements.editModal.classList.add('hidden');
        document.body.style.overflow = '';
        
        await loadProfile();
        alert('Profile updated successfully!');
      } catch (error) {
        console.error('Error updating profile:', error);
        alert('Failed to update profile');
      }
    });

    document.addEventListener('DOMContentLoaded', () => {
      const token = getAuthToken();
      if (!token) {
        window.location.href = '/login.html';
        return;
      }
      loadProfile();
    });
  </script>
</div>
</body>
</html>
