<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Fundora - Create Account</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-cover bg-center bg-no-repeat bg-[url('/assets/img/investor-register-bg.jpg')] flex items-center justify-center p-4">

  <div class="bg-gray-400 shadow-lg w-full max-w-5xl h-[45rem] flex bg-opacity-75">
    <div class="shadow-lg p-8 w-full max-w-5xl flex items-center justify-center">
      <h2 class="text-white text-3xl font-semibold text-center">Invest in ideas. Grow with purpose.</h2>
    </div>
  </div>

  <div class="bg-gray-200 shadow-lg p-8 w-full max-w-md h-[45rem] bg-opacity-75">
    <div class="text-center mb-6">
      <h1 class="text-xl font-semibold text-gray-900">Fundora</h1>
    </div>

    <div class="text-center mb-8">
      <h2 class="text-2xl font-bold text-gray-900 mb-2">Create Account</h2>
      <p class="text-gray-600">Start your investment journey today</p>
    </div>

    <div id="messageBox" class="mb-6 hidden">
      <div id="messageText" class="px-4 py-3 rounded text-sm"></div>
    </div>

    <form id="investorForm" class="space-y-6">
      <div class="grid grid-cols-2 gap-4">
        <div>
          <label for="firstName" class="block text-sm font-medium text-gray-700 mb-2">First Name</label>
          <input type="text" id="firstName" name="firstName" required placeholder="Firstname"
            class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500">
        </div>
        <div>
          <label for="lastName" class="block text-sm font-medium text-gray-700 mb-2">Last Name</label>
          <input type="text" id="lastName" name="lastName" required placeholder="Lastname"
            class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500">
        </div>
      </div>

      <div>
        <label for="email" class="block text-sm font-medium text-gray-700 mb-2">Email Address</label>
        <input type="email" id="email" name="email" required placeholder="youremail@email.com"
          class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500">
      </div>

      <div>
        <label for="password" class="block text-sm font-medium text-gray-700 mb-2">Password</label>
        <input type="password" id="password" name="password" required placeholder="Create a strong password"
          class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500">
      </div>

      <div>
        <label for="confirmPassword" class="block text-sm font-medium text-gray-700 mb-2">Confirm Password</label>
        <input type="password" id="confirmPassword" name="confirmPassword" required placeholder="Confirm your password"
          class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500">
      </div>

      <div class="flex items-start">
        <input type="checkbox" id="terms" name="terms" required
          class="mt-1 h-4 w-4 text-blue-600 focus:ring-blue-500 border-gray-300 rounded">
        <label for="terms" class="ml-2 text-sm text-gray-600">
          I agree to the <a href="#" class="text-blue-600 hover:text-blue-800">Terms of Service</a> and
          <a href="#" class="text-blue-600 hover:text-blue-800">Privacy Policy</a>
        </label>
      </div>

      <button type="submit"
        class="w-full bg-blue-600 text-white py-2 px-4 rounded-md hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-offset-2 font-medium">
        Create Account
      </button>
    </form>

    <div class="text-center mt-6">
      <p class="text-sm text-gray-600">
        Already have an account? <a href="/login.html" class="text-blue-600 hover:text-blue-800 font-medium">Sign in</a>
      </p>
    </div>
  </div>

<script>
    document.getElementById('investorForm').addEventListener('submit', async function (e) {e.preventDefault();
        // Capture form data
        const payload = {
            first_name: document.getElementById('firstName').value.trim(),
            last_name: document.getElementById('lastName').value.trim(),
            email: document.getElementById('email').value.trim(),
            password: document.getElementById('password').value,
            confirm_password: document.getElementById('confirmPassword').value,
            label: 'investor',
            terms: document.getElementById('terms').checked  // Ensure the checkbox for terms is included
        };

        // Passwords don't match
        if (payload.password !== payload.confirm_password) {
            const box = document.getElementById('messageBox');
            const text = document.getElementById('messageText');
            text.textContent = 'Passwords do not match.';
            text.className = 'bg-red-100 border border-red-400 text-red-700';
            box.classList.remove('hidden');
            return;
        }

        // Check if the user agreed to the terms
        if (!payload.terms) {
            const box = document.getElementById('messageBox');
            const text = document.getElementById('messageText');
            text.textContent = 'You must agree to the Terms of Service and Privacy Policy.';
            text.className = 'bg-red-100 border border-red-400 text-red-700';
            box.classList.remove('hidden');
            return;
        }

        try {
            const res = await fetch('http://127.0.0.1:8000/api/investor/register/', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });

            const data = await res.json();
            const box = document.getElementById('messageBox');
            const text = document.getElementById('messageText');

            if (res.ok) {
                text.textContent = 'Account created successfully!';
                text.className = 'bg-green-100 border border-green-400 text-green-700';
                box.classList.remove('hidden');
                setTimeout(() => window.location.href = '/login.html', 1500);
            } else {
                console.log(data);  // Log errors for debugging
                text.textContent = data.errors ? data.errors : 'Registration failed. Please check your input.';
                text.className = 'bg-red-100 border border-red-400 text-red-700';
                box.classList.remove('hidden');
            }
        } catch (err) {
            const box = document.getElementById('messageBox');
            const text = document.getElementById('messageText');
            text.textContent = 'Something went wrong. Please try again.';
            text.className = 'bg-red-100 border border-red-400 text-red-700';
            box.classList.remove('hidden');
        }
    });
</script>
  
</body>
</html>
