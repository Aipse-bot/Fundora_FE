<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Create Investor Account</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: {
              50: '#eff6ff',
              100: '#dbeafe',
              200: '#bfdbfe',
              300: '#93c5fd',
              400: '#60a5fa',
              500: '#3b82f6',
              600: '#2563eb',
              700: '#1d4ed8',
              800: '#1e40af',
              900: '#1e3a8a'
            },
            accent: {
              50: '#ecfdf5',
              100: '#d1fae5',
              200: '#a7f3d0',
              300: '#6ee7b7',
              400: '#34d399',
              500: '#10b981',
              600: '#059669',
              700: '#047857',
              800: '#065f46',
              900: '#064e3b'
            }
          },
          fontFamily: {
            'sans': ['Inter', 'system-ui', 'sans-serif']
          }
        }
      }
    }
  </script>
  <style>
    body { font-family: 'Inter', sans-serif; }
    .bg-gradient { background: linear-gradient(135deg, #0a0e27 0%, #1a1f4a 50%, #051633 100%); }
    .subtle-grid { background-image: 
      linear-gradient(rgba(59, 130, 246, 0.15) 1px, transparent 1px),
      linear-gradient(90deg, rgba(59, 130, 246, 0.15) 1px, transparent 1px);
      background-size: 40px 40px;
    }
    .accent-dots {
      background-image: 
        radial-gradient(circle, rgba(16, 185, 129, 0.1) 2px, transparent 2px);
      background-size: 60px 60px;
    }
  </style>
</head>
<body class="bg-slate-950 text-gray-100 min-h-screen">

  <!-- Navbar -->
  <nav class="fixed top-0 left-0 right-0 z-50 bg-slate-900/95 border-b border-slate-700/50 backdrop-blur-sm">
    <div class="max-w-7xl mx-auto px-6 py-4">
      <div class="flex items-center justify-between">
        <a href="/" class="flex items-center space-x-3">
          <div class="relative w-10 h-10">
            <svg viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg">
              <circle cx="20" cy="20" r="18" fill="url(#logo-gradient)" stroke="#3b82f6" stroke-width="2"/>
              <path d="M20 10 L20 30 M12 20 L28 20" stroke="white" stroke-width="2.5" stroke-linecap="round"/>
              <circle cx="20" cy="12" r="2" fill="white"/>
              <circle cx="20" cy="28" r="2" fill="white"/>
              <circle cx="12" cy="20" r="2" fill="white"/>
              <circle cx="28" cy="20" r="2" fill="white"/>
              <defs>
                <linearGradient id="logo-gradient" x1="0" y1="0" x2="40" y2="40" gradientUnits="userSpaceOnUse">
                  <stop offset="0%" stop-color="#3b82f6"/>
                  <stop offset="100%" stop-color="#10b981"/>
                </linearGradient>
              </defs>
            </svg>
          </div>
          <span class="text-2xl font-bold text-white">Fundora</span>
        </a>
        <a href="/login.html" class="text-gray-400 hover:text-white transition-colors font-medium">Sign In</a>
      </div>
    </div>
  </nav>

  <!-- Made background patterns much more visible -->
  <div class="fixed inset-0 bg-gradient subtle-grid accent-dots pointer-events-none"></div>

  <!-- Main Content -->
  <div class="relative min-h-screen flex items-center justify-center pt-24 pb-12 px-4">
    <div class="w-full max-w-6xl mx-auto flex flex-col lg:flex-row items-center gap-12">
      
      <!-- Left Side - Marketing Content -->
      <div class="flex-1 text-center lg:text-left space-y-6 max-w-xl">
        <div class="inline-block px-3 py-1.5 bg-emerald-500/20 border border-emerald-400/40 rounded-md text-emerald-300 text-xs font-medium mb-4">
          For Investors
        </div>
        <h1 class="text-4xl md:text-5xl font-bold leading-tight text-white">
          Discover the next<br/>generation of startups
        </h1>
        <p class="text-lg text-gray-400">
          Join Fundora to explore high-potential startups, compare opportunities, and make data-driven investment decisions.
        </p>
      </div>

      <!-- Right Side - Registration Form -->
      <div class="w-full max-w-md">
        <div class="bg-gradient-to-br from-emerald-600/10 via-slate-900/60 to-slate-900/40 border border-emerald-500/30 rounded-2xl p-8 backdrop-blur-sm">
          <div class="mb-8">
            <h2 class="text-2xl font-bold text-white mb-2">Create Your Account</h2>
            <p class="text-gray-400">Start investing in startups today</p>
          </div>

          <form id="investorForm" class="space-y-5">
            <!-- Name Fields -->
            <div class="grid grid-cols-2 gap-4">
              <div>
                <label for="firstName" class="block text-sm font-medium text-gray-300 mb-2">First Name</label>
                <input type="text" id="firstName" name="firstName"
                  class="w-full px-4 py-2.5 bg-slate-800/60 border border-slate-700/50 rounded-lg focus:outline-none focus:ring-2 focus:ring-brand-500 focus:border-transparent text-white placeholder-gray-500 transition-colors">
                <p class="text-red-400 text-xs mt-1.5 hidden" id="firstNameError"></p>
              </div>
              <div>
                <label for="lastName" class="block text-sm font-medium text-gray-300 mb-2">Last Name</label>
                <input type="text" id="lastName" name="lastName"
                  class="w-full px-4 py-2.5 bg-slate-800/60 border border-slate-700/50 rounded-lg focus:outline-none focus:ring-2 focus:ring-brand-500 focus:border-transparent text-white placeholder-gray-500 transition-colors">
                <p class="text-red-400 text-xs mt-1.5 hidden" id="lastNameError"></p>
              </div>
            </div>

            <!-- Email -->
            <div>
              <label for="email" class="block text-sm font-medium text-gray-300 mb-2">Email Address</label>
              <input type="email" id="email" name="email"
                class="w-full px-4 py-2.5 bg-slate-800/60 border border-slate-700/50 rounded-lg focus:outline-none focus:ring-2 focus:ring-brand-500 focus:border-transparent text-white placeholder-gray-500 transition-colors">
              <p class="text-red-400 text-xs mt-1.5 hidden" id="emailError"></p>
            </div>

            <!-- Password -->
            <div>
              <label for="password" class="block text-sm font-medium text-gray-300 mb-2">Password</label>
              <div class="relative">
                <input type="password" id="password" name="password"
                  class="w-full px-4 py-2.5 pr-12 bg-slate-800/60 border border-slate-700/50 rounded-lg focus:outline-none focus:ring-2 focus:ring-brand-500 focus:border-transparent text-white placeholder-gray-500 transition-colors">
                <button type="button" onclick="togglePassword('password')" class="absolute right-3 top-1/2 -translate-y-1/2 text-gray-400 hover:text-white transition-colors">
                  <svg id="passwordEyeIcon" class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path>
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"></path>
                  </svg>
                </button>
              </div>
              <p class="text-red-400 text-xs mt-1.5 hidden" id="passwordError"></p>
            </div>

            <!-- Confirm Password -->
            <div>
              <label for="confirmPassword" class="block text-sm font-medium text-gray-300 mb-2">Confirm Password</label>
              <div class="relative">
                <input type="password" id="confirmPassword" name="confirmPassword"
                  class="w-full px-4 py-2.5 pr-12 bg-slate-800/60 border border-slate-700/50 rounded-lg focus:outline-none focus:ring-2 focus:ring-brand-500 focus:border-transparent text-white placeholder-gray-500 transition-colors">
                <button type="button" onclick="togglePassword('confirmPassword')" class="absolute right-3 top-1/2 -translate-y-1/2 text-gray-400 hover:text-white transition-colors">
                  <svg id="confirmPasswordEyeIcon" class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path>
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"></path>
                  </svg>
                </button>
              </div>
              <p class="text-red-400 text-xs mt-1.5 hidden" id="confirmPasswordError"></p>
            </div>

            <!-- Terms -->
            <div class="flex items-start">
              <input type="checkbox" id="terms" name="terms" required
                class="mt-1 h-4 w-4 text-brand-600 focus:ring-brand-500 border-slate-600 rounded bg-slate-800">
              <label for="terms" class="ml-3 text-sm text-gray-400">
                I agree to the <a href="#" class="text-brand-400 hover:text-brand-300">Terms of Service</a> and
                <a href="#" class="text-brand-400 hover:text-brand-300">Privacy Policy</a>
              </label>
            </div>
            <p class="text-red-400 text-xs mt-1.5 hidden" id="termsError"></p>

            <!-- Submit Button -->
            <button type="submit" id="submitBtn"
              class="w-full bg-brand-600 hover:bg-brand-700 text-white py-3 px-4 rounded-lg font-medium transition-colors disabled:opacity-50 disabled:cursor-not-allowed">
              Create Account
            </button>
          </form>

          <!-- Sign In Link -->
          <div class="text-center mt-6 pt-6 border-t border-slate-800">
            <p class="text-sm text-gray-400">
              Already have an account? <a href="/login.html" class="text-brand-400 hover:text-brand-300 font-medium">Sign in</a>
            </p>
          </div>
        </div>
      </div>
    </div>
  </div>

<script>
    // Enhanced email validation
    function isValidEmail(email) {
        const emailRegex = /^[a-zA-Z0-9.!#$%&'*+/=?^_`{|}~-]+@[a-zA-Z0-9](?:[a-zA-Z0-9-]{0,61}[a-zA-Z0-9])?(?:\.[a-zA-Z0-9](?:[a-zA-Z0-9-]{0,61}[a-zA-Z0-9])?)*$/;
        
        if (!emailRegex.test(email)) return false;
        
        const parts = email.split('@');
        if (parts.length !== 2) return false;
        
        const domain = parts[1];
        if (!domain.includes('.')) return false;
        
        const domainParts = domain.split('.');
        const tld = domainParts[domainParts.length - 1];
        
        if (tld.length < 2) return false;
        
        const invalidTLDs = ['co', 'cm', 'con', 'cmo', 'comm', 'om', 'ocm'];
        if (invalidTLDs.includes(tld.toLowerCase())) return false;
        
        return true;
    }

    // Password visibility toggle
    function togglePassword(fieldId) {
        const field = document.getElementById(fieldId);
        const icon = document.getElementById(fieldId + 'EyeIcon');
        
        if (field.type === 'password') {
            field.type = 'text';
            icon.innerHTML = `
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.88 9.88l-3.29-3.29m7.532 7.532l3.29 3.29M3 3l3.59 3.59m0 0A9.953 9.953 0 0112 5c4.478 0 8.268 2.943 9.543 7a10.025 10.025 0 01-4.132 5.411m0 0L21 21"></path>
            `;
        } else {
            field.type = 'password';
            icon.innerHTML = `
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path>
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"></path>
            `;
        }
    }

    // Clear error messages
    function clearError(fieldId) {
        const errorElement = document.getElementById(fieldId + 'Error');
        const inputElement = document.getElementById(fieldId);
        if (errorElement) {
            errorElement.classList.add('hidden');
            errorElement.textContent = '';
        }
        if (inputElement) {
            inputElement.classList.remove('border-red-500');
        }
    }

    // Show error messages
    function showError(fieldId, message) {
        const errorElement = document.getElementById(fieldId + 'Error');
        const inputElement = document.getElementById(fieldId);
        if (errorElement) {
            errorElement.textContent = message;
            errorElement.classList.remove('hidden');
        }
        if (inputElement) {
            inputElement.classList.add('border-red-500');
        }
    }

    // Add input listeners to clear errors
    ['firstName', 'lastName', 'email', 'password', 'confirmPassword'].forEach(fieldId => {
        const element = document.getElementById(fieldId);
        if (element) {
            element.addEventListener('input', () => clearError(fieldId));
        }
    });

    document.getElementById('terms').addEventListener('change', () => clearError('terms'));

    // Form submission
    document.getElementById('investorForm').addEventListener('submit', async function (e) {
        e.preventDefault();
        
        ['firstName', 'lastName', 'email', 'password', 'confirmPassword', 'terms'].forEach(clearError);
        
        const submitBtn = document.getElementById('submitBtn');
        const originalText = submitBtn.textContent;
        
        const firstName = document.getElementById('firstName').value.trim();
        const lastName = document.getElementById('lastName').value.trim();
        const email = document.getElementById('email').value.trim();
        const password = document.getElementById('password').value;
        const confirmPassword = document.getElementById('confirmPassword').value;
        const terms = document.getElementById('terms').checked;
        
        let hasError = false;
        
        if (firstName.length < 2) {
            showError('firstName', 'First name must be at least 2 characters');
            hasError = true;
        }
        
        if (lastName.length < 2) {
            showError('lastName', 'Last name must be at least 2 characters');
            hasError = true;
        }
        
        if (!isValidEmail(email)) {
            showError('email', 'Please enter a valid email address');
            hasError = true;
        }
        
        if (password.length < 8) {
            showError('password', 'Password must be at least 8 characters');
            hasError = true;
        } else if (!/(?=.*[a-z])(?=.*[A-Z])/.test(password)) {
            showError('password', 'Password must contain uppercase and lowercase letters');
            hasError = true;
        } else if (!/(?=.*\d)/.test(password)) {
            showError('password', 'Password must contain at least one number');
            hasError = true;
        }
        
        if (password !== confirmPassword) {
            showError('confirmPassword', 'Passwords do not match');
            hasError = true;
        }
        
        if (!terms) {
            showError('terms', 'You must agree to the Terms and Privacy Policy');
            hasError = true;
        }
        
        if (hasError) {
            return;
        }
        
        const payload = {
            first_name: firstName,
            last_name: lastName,
            email: email,
            password: password,
            confirm_password: confirmPassword,
            label: 'investor',
            terms: terms
        };
        
        submitBtn.disabled = true;
        submitBtn.textContent = 'Creating Account...';
        
        try {
            const res = await fetch('https://fundora-be-singapore.onrender.com/api/investor/register/', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });
            
            const data = await res.json();
            
            if (res.ok) {
                setTimeout(() => window.location.href = '/login.html', 1500);
            } else {
                if (data.errors) {
                    if (typeof data.errors === 'string') {
                        showError('email', data.errors);
                    } else if (typeof data.errors === 'object') {
                        Object.keys(data.errors).forEach(field => {
                            const errorMsg = Array.isArray(data.errors[field]) 
                                ? data.errors[field][0] 
                                : data.errors[field];
                            
                            const fieldMap = {
                                'first_name': 'firstName',
                                'last_name': 'lastName',
                                'email': 'email',
                                'password': 'password',
                                'confirm_password': 'confirmPassword'
                            };
                            
                            const fieldId = fieldMap[field] || field;
                            showError(fieldId, errorMsg);
                        });
                    }
                } else if (data.error) {
                    showError('email', data.error);
                }
                
                submitBtn.disabled = false;
                submitBtn.textContent = originalText;
            }
        } catch (err) {
            console.error('Registration error:', err);
            showError('email', 'Connection error. Please check your internet and try again.');
            submitBtn.disabled = false;
            submitBtn.textContent = originalText;
        }
    });
</script>
</body>
</html>
