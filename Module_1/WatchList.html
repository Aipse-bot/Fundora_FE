<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Fundora - My Watchlist</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 min-h-screen">
    <div class="max-w-6xl mx-auto p-6">
        <!-- Messages -->
        <div id="notificationBox" class="fixed top-6 right-6 z-50 space-y-4"></div>

        <!-- Header -->
        <div class="flex items-center mb-8">
            <a href="Dashboard.html" class="mr-4 p-2 hover:bg-gray-100 rounded-full">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7" />
                </svg>
            </a>
            <h1 class="text-3xl font-bold text-gray-900">My Watchlist</h1>
        </div>

        <!-- Tab Navigation -->
        <div class="border-b border-gray-200 mb-8">
            <nav class="flex space-x-8">
                <button id="saved-tab" class="tab-button py-2 px-1 border-b-2 font-medium text-sm focus:outline-none transition-colors duration-200" onclick="switchTab('saved')">
                    Saved (<span id="saved-count">0</span>)
                </button>
                <button id="compared-tab" class="tab-button py-2 px-1 border-b-2 font-medium text-sm focus:outline-none transition-colors duration-200" onclick="switchTab('compared')">
                    Compared (<span id="compared-count">0</span>)
                </button>
                <button id="downloaded-tab" class="tab-button py-2 px-1 border-b-2 font-medium text-sm focus:outline-none transition-colors duration-200" onclick="switchTab('downloaded')">
                    Downloaded (<span id="downloaded-count">0</span>)
                </button>
            </nav>
        </div>

        <!-- Tab Content -->
        <div id="tab-content">
            <!-- Saved Tab -->
            <div id="saved-content" class="tab-content">
                <div id="saved-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6"></div>
                <div id="saved-empty" class="text-center py-12 hidden">
                    <p class="text-gray-600">You have no startups in your watchlist yet.</p>
                </div>
            </div>

            <!-- Compared Tab -->
            <div id="compared-content" class="tab-content hidden">
                <div id="compared-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6"></div>
                <div id="compared-empty" class="text-center py-12 hidden">
                    <h3 class="mt-2 text-sm font-medium text-gray-900">No comparisons yet</h3>
                    <p class="mt-1 text-sm text-gray-500">Compare startups to see them here.</p>
                </div>
            </div>

            <!-- Downloaded Tab -->
            <div id="downloaded-content" class="tab-content hidden">
                <div id="downloaded-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6"></div>
                <div id="downloaded-empty" class="text-center py-12 hidden">
                    <h3 class="mt-2 text-sm font-medium text-gray-900">No downloads yet</h3>
                    <p class="mt-1 text-sm text-gray-500">Start by downloading a company profile from your saved startups.</p>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Helper functions
        function getAuthToken() {
            return localStorage.getItem('authToken');
        }

        function authHeaders() {
            const token = getAuthToken();
            if (!token) return {};
            return {
                'Authorization': `Bearer ${token}`,
                'Content-Type': 'application/json'
            };
        }

        function getCookie(name) {
            let cookieValue = null;
            if (document.cookie && document.cookie !== '') {
                const cookies = document.cookie.split(';');
                for (let cookie of cookies) {
                    cookie = cookie.trim();
                    if (cookie.startsWith(name + '=')) {
                        cookieValue = decodeURIComponent(cookie.substring(name.length + 1));
                        break;
                    }
                }
            }
            return cookieValue;
        }

        function showMessage(message, type) {
            const div = document.createElement('div');
            div.className = `fixed top-4 right-4 z-50 p-4 rounded-md shadow-lg ${type === 'success' ? 'bg-green-500 text-white' : 'bg-red-500 text-white'}`;
            div.textContent = message;
            document.body.appendChild(div);
            setTimeout(() => {
                div.style.opacity = '0';
                setTimeout(() => div.remove(), 300);
            }, 3000);
        }

        // Check authentication on load
        document.addEventListener('DOMContentLoaded', () => {
            const token = getAuthToken();
            if (!token) {
                window.location.href = '/login';
                return;
            }
            switchTab('saved');
            loadWatchlist();
        });

        function loadWatchlist() {
            const token = getAuthToken();
            if (!token) {
                window.location.href = '/login';
                return;
            }

            fetch('http://127.0.0.1:8000/api/investor/watchlist/', {
                method: 'GET',
                headers: authHeaders()
            })
            .then(res => {
                if (res.status === 401 || res.status === 403) {
                    localStorage.removeItem('authToken');
                    window.location.href = '/login';
                    throw new Error('Unauthorized');
                }
                return res.json();
            })
            .then(data => {
                const savedGrid = document.getElementById('saved-grid');
                const savedCount = document.getElementById('saved-count');
                savedGrid.innerHTML = '';

                const results = data.results || data.watchlist || [];
                
                if (!results || results.length === 0) {
                    document.getElementById('saved-empty').classList.remove('hidden');
                    savedCount.textContent = '0';
                    return;
                }

                document.getElementById('saved-empty').classList.add('hidden');
                savedCount.textContent = results.length;

                results.forEach(startup => {
                    const card = document.createElement('div');
                    card.className = 'bg-white shadow rounded-lg p-5 transition hover:shadow-lg';
                    card.innerHTML = `
                        <div class="flex justify-between items-start mb-3">
                            <h2 class="text-xl font-semibold text-gray-900">${escapeHtml(startup.company_name)}</h2>
                            <button onclick="removeFromWatchlist(${startup.id}, '${escapeHtml(startup.company_name)}')" 
                                    class="text-gray-400 hover:text-red-500 transition">
                                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>
                                </svg>
                            </button>
                        </div>
                        <p class="text-sm text-gray-600 mb-2">${escapeHtml(startup.industry || 'N/A')}</p>
                        <p class="text-gray-700 text-sm line-clamp-3 mb-3">${escapeHtml(startup.company_description || '')}</p>
                        <div class="flex justify-between items-center">
                            <a href="../Module_2/Company_Profile.html?id=${startup.id}" 
                               class="text-blue-600 hover:underline text-sm font-medium">View Profile</a>
                            <a href="../Module_2/Investment_Simulation.html?startup_id=${startup.id}" 
                               class="text-sm text-gray-500 hover:text-blue-600">Invest</a>
                        </div>
                    `;
                    savedGrid.appendChild(card);
                });
            })
            .catch(err => {
                console.error('Error loading watchlist:', err);
                if (err.message !== 'Unauthorized') {
                    showMessage('Error loading watchlist.', 'error');
                }
            });
        }

        function removeFromWatchlist(startupId, companyName) {
            if (!confirm(`Remove "${companyName}" from your watchlist?`)) return;

            const token = getAuthToken();
            if (!token) {
                window.location.href = '/login';
                return;
            }

            fetch(`http://127.0.0.1:8000/api/investor/watchlist/remove/${startupId}/`, {
                method: 'DELETE',
                headers: authHeaders()
            })
            .then(res => {
                if (res.status === 401 || res.status === 403) {
                    localStorage.removeItem('authToken');
                    window.location.href = '/login';
                    throw new Error('Unauthorized');
                }
                return res.json();
            })
            .then(data => {
                showMessage(data.message || 'Removed from watchlist.', 'success');
                loadWatchlist();
            })
            .catch(err => {
                console.error('Error removing from watchlist:', err);
                if (err.message !== 'Unauthorized') {
                    showMessage('Failed to remove startup.', 'error');
                }
            });
        }

        function switchTab(tabName) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.add('hidden'));
            document.querySelectorAll('.tab-button').forEach(btn => {
                btn.classList.remove('border-blue-500', 'text-blue-600');
                btn.classList.add('border-transparent', 'text-gray-500', 'hover:text-gray-700', 'hover:border-gray-300');
            });

            document.getElementById(`${tabName}-content`).classList.remove('hidden');
            const activeTab = document.getElementById(`${tabName}-tab`);
            activeTab.classList.remove('border-transparent', 'text-gray-500');
            activeTab.classList.add('border-blue-500', 'text-blue-600');
        }

        function escapeHtml(unsafe) {
            if (unsafe === null || unsafe === undefined) return '';
            return String(unsafe)
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");
        }
    </script>
</body>
</html>
