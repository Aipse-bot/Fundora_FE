<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Fundora - My Watchlist</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 min-h-screen">
    <div class="max-w-6xl mx-auto p-6">
        <!-- Header -->
        <div class="flex items-center mb-8">
            <a href="Dashboard.html" class="mr-4 p-2 hover:bg-gray-100 rounded-full">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7" />
                </svg>
            </a>
            <h1 class="text-3xl font-bold text-gray-900">My Watchlist</h1>
        </div>

        <!-- Tab Navigation -->
        <div class="border-b border-gray-200 mb-8">
            <nav class="flex space-x-8">
                <button id="saved-tab" class="tab-button py-2 px-1 border-b-2 font-medium text-sm focus:outline-none transition-colors duration-200" onclick="switchTab('saved')">
                    Saved (<span id="saved-count">0</span>)
                </button>
                <button id="compared-tab" class="tab-button py-2 px-1 border-b-2 font-medium text-sm focus:outline-none transition-colors duration-200" onclick="switchTab('compared')">
                    Compared (<span id="compared-count">0</span>)
                </button>
            </nav>
        </div>

        <!-- Tab Content -->
        <div id="tab-content">
            <!-- Saved Tab -->
            <div id="saved-content" class="tab-content">
                <div id="saved-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6"></div>
                <div id="saved-empty" class="text-center py-12 hidden">
                    <p class="text-gray-600">You have no startups in your watchlist yet.</p>
                </div>
            </div>

            <!-- Compared Tab -->
            <div id="compared-content" class="tab-content hidden">
                <div id="compared-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6"></div>
                <div id="compared-empty" class="text-center py-12 hidden">
                    <h3 class="mt-2 text-sm font-medium text-gray-900">No comparisons yet</h3>
                    <p class="mt-1 text-sm text-gray-500">Compare startups to see them here.</p>
                </div>
            </div>
        </div>
    </div>

    <script>
        function getAuthToken() {
            return localStorage.getItem('authToken');
        }

        function authHeaders() {
            const token = getAuthToken();
            if (!token) return {};
            return {
                'Authorization': `Bearer ${token}`,
                'Content-Type': 'application/json'
            };
        }

        function showMessage(message, type) {
            const div = document.createElement('div');
            div.className = `fixed top-4 right-4 z-50 p-4 rounded-md shadow-lg ${type === 'success' ? 'bg-green-500 text-white' : 'bg-red-500 text-white'}`;
            div.textContent = message;
            document.body.appendChild(div);
            setTimeout(() => {
                div.style.opacity = '0';
                setTimeout(() => div.remove(), 300);
            }, 3000);
        }

        document.addEventListener('DOMContentLoaded', () => {
            const token = getAuthToken();
            if (!token) {
                window.location.href = '/login';
                return;
            }
            
            // Load both tab counts immediately
            loadTabCounts();
            
            // Check URL parameters for tab
            const urlParams = new URLSearchParams(window.location.search);
            const activeTab = urlParams.get('tab') || 'saved';
            
            switchTab(activeTab);
        });

        async function loadTabCounts() {
            // Load watchlist count
            try {
                const watchlistRes = await fetch('https://fundora-be-mjvs.onrender.com/api/investor/watchlist/', {
                    method: 'GET',
                    headers: authHeaders()
                });
                if (watchlistRes.ok) {
                    const watchlistData = await watchlistRes.json();
                    const watchlistResults = watchlistData.results || watchlistData.watchlist || [];
                    document.getElementById('saved-count').textContent = watchlistResults.length;
                }
            } catch (err) {
                console.error('Error loading watchlist count:', err);
            }

            // Load comparisons count
            try {
                const comparisonsRes = await fetch('https://fundora-be-mjvs.onrender.com/api/investor/comparisons/', {
                    method: 'GET',
                    headers: authHeaders()
                });
                if (comparisonsRes.ok) {
                    const comparisonsData = await comparisonsRes.json();
                    const comparisonsResults = comparisonsData.results || [];
                    document.getElementById('compared-count').textContent = comparisonsResults.length;
                }
            } catch (err) {
                console.error('Error loading comparisons count:', err);
            }
        }

        async function loadWatchlist() {
            const token = getAuthToken();
            if (!token) {
                window.location.href = '/login';
                return;
            }

            try {
                // First get the watchlist IDs
                const watchlistRes = await fetch('https://fundora-be-mjvs.onrender.com/api/investor/watchlist/', {
                    method: 'GET',
                    headers: authHeaders()
                });
                
                if (watchlistRes.status === 401 || watchlistRes.status === 403) {
                    localStorage.removeItem('authToken');
                    window.location.href = '/login';
                    return;
                }
                
                const watchlistData = await watchlistRes.json();
                const watchlistItems = watchlistData.results || watchlistData.watchlist || [];
                
                if (!watchlistItems || watchlistItems.length === 0) {
                    document.getElementById('saved-empty').classList.remove('hidden');
                    document.getElementById('saved-count').textContent = '0';
                    document.getElementById('saved-grid').innerHTML = '';
                    return;
                }
                
                // Then get all startups data
                const startupsRes = await fetch('https://fundora-be-mjvs.onrender.com/api/investor/startups/', {
                    method: 'GET',
                    headers: authHeaders()
                });
                
                if (!startupsRes.ok) {
                    throw new Error('Failed to fetch startups data');
                }
                
                const startupsData = await startupsRes.json();
                const allStartups = startupsData.results || startupsData.startups || startupsData;
                
                // Match watchlist items with full startup data
                const watchlistIds = new Set(watchlistItems.map(item => item.id));
                const results = allStartups.filter(startup => watchlistIds.has(startup.id));
                
                const savedGrid = document.getElementById('saved-grid');
                const savedCount = document.getElementById('saved-count');
                savedGrid.innerHTML = '';

                if (!results || results.length === 0) {
                    document.getElementById('saved-empty').classList.remove('hidden');
                    savedCount.textContent = '0';
                    return;
                }

                document.getElementById('saved-empty').classList.add('hidden');
                savedCount.textContent = results.length;

                results.forEach(startup => {
                    const card = document.createElement('div');
                    card.className = 'bg-white shadow rounded-lg p-5 transition hover:shadow-lg flex flex-col';
                    
                    const isDeck = !!(startup.is_deck_builder || startup.source_deck_id || startup.source_deck);
                    const hasDataPending = !isDeck && !startup.risk_level;
                    
                    // Determine risk badge
                    let riskBadge;
                    if (isDeck) {
                        riskBadge = '<span class="bg-purple-100 text-purple-800 text-xs font-medium px-2.5 py-1 rounded-full">Pitch Deck</span>';
                    } else if (startup.risk_level) {
                        const riskLevel = startup.risk_level.toLowerCase();
                        if (riskLevel === 'low') {
                            riskBadge = '<span class="bg-green-100 text-green-800 text-xs font-medium px-2.5 py-1 rounded-full">Low Risk</span>';
                        } else if (riskLevel === 'medium') {
                            riskBadge = '<span class="bg-yellow-100 text-yellow-800 text-xs font-medium px-2.5 py-1 rounded-full">Medium Risk</span>';
                        } else {
                            riskBadge = '<span class="bg-red-100 text-red-800 text-xs font-medium px-2.5 py-1 rounded-full">High Risk</span>';
                        }
                    } else {
                        riskBadge = '<span class="bg-gray-100 text-gray-600 text-xs font-medium px-2.5 py-1 rounded-full">Data Pending</span>';
                    }
                    
                    // Determine industry display
                    let industryDisplay = startup.industry;
                    if (startup.tagline) {
                        industryDisplay = startup.tagline;
                    } else if (!industryDisplay || industryDisplay === '—') {
                        industryDisplay = startup.company_description || 'N/A';
                    }
                    
                    // Build metrics section with more details
                    let metricsSection;
                    if (isDeck) {
                        const fundingAmount = startup.funding_ask ? `$${parseFloat(startup.funding_ask).toLocaleString()}` : 'N/A';
                        const marketGrowth = startup.market_growth_rate ?? startup.market_growth ?? 'N/A';
                        const marketGrowthDisplay = marketGrowth !== 'N/A' ? `${marketGrowth}%` : 'N/A';
                        
                        metricsSection = `
                            <div class="space-y-3 mb-4 flex-grow">
                                <div class="flex justify-between items-center">
                                    <span class="text-sm text-gray-600">Funding Ask</span>
                                    <span class="text-sm font-semibold text-purple-600">${escapeHtml(fundingAmount)}</span>
                                </div>
                                <div class="flex justify-between items-center">
                                    <span class="text-sm text-gray-600">Market Growth</span>
                                    <span class="text-sm font-semibold text-green-600">${escapeHtml(marketGrowthDisplay)}</span>
                                </div>
                            </div>
                        `;
                    } else {
                        let reward = 'N/A';
                        if (startup.reward_potential != null) {
                            if (typeof startup.reward_potential === 'string') {
                                reward = startup.reward_potential.split(',')[0].trim();
                            } else if (Array.isArray(startup.reward_potential)) {
                                reward = startup.reward_potential[0];
                            } else {
                                reward = String(startup.reward_potential);
                            }
                        }

                        const rewardDisplay = reward === 'N/A' ? 'N/A' : `${reward}/5`;
                        const projected = (startup.projected_return != null && startup.projected_return !== '') 
                            ? `${startup.projected_return >= 0 ? '+' : ''}${startup.projected_return}%` 
                            : 'N/A';
                        
                        metricsSection = `
                            <div class="space-y-3 mb-4 flex-grow">
                                <div class="flex justify-between items-center">
                                    <span class="text-sm text-gray-600">Reward Potential</span>
                                    <span class="text-sm font-semibold">${escapeHtml(rewardDisplay)}</span>
                                </div>
                                <div class="flex justify-between items-center">
                                    <span class="text-sm text-gray-600">Projected Return</span>
                                    <span class="text-sm font-semibold ${startup.projected_return != null && startup.projected_return >= 0 ? 'text-green-600' : 'text-red-600'}">${escapeHtml(projected)}</span>
                                </div>
                            </div>
                        `;
                    }
                    
                    const profilePage = isDeck ? '../Module_2/Company_ProfileDB.html' : '../Module_2/Company_Profile.html';
                    const returnPath = window.location.pathname + window.location.search;
                    
                    card.innerHTML = `
                        <div class="flex justify-between items-start mb-3">
                            <div class="flex-1">
                                <h2 class="text-xl font-semibold text-gray-900 mb-1">${escapeHtml(startup.company_name)}</h2>
                                <p class="text-sm text-gray-600">${escapeHtml(industryDisplay)}</p>
                            </div>
                            <div class="flex flex-col items-end space-y-2">
                                ${riskBadge}
                                <button onclick="removeFromWatchlist(${startup.id}, '${escapeHtml(startup.company_name).replace(/'/g, "\\'")}')" 
                                        class="text-gray-400 hover:text-red-500 transition"
                                        title="Remove from watchlist">
                                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>
                                    </svg>
                                </button>
                            </div>
                        </div>
                        ${metricsSection}
                        <div class="flex gap-2 mt-auto">
                            <a href="${profilePage}?id=${startup.id}&return=${encodeURIComponent(returnPath)}" 
                               class="flex-1 px-3 py-2 border border-gray-300 text-gray-700 rounded-md hover:bg-gray-50 hover:border-gray-400 text-sm font-medium text-center transition-all">
                                View Details
                            </a>
                            ${hasDataPending 
                                ? '<button class="flex-1 px-3 py-2 bg-gray-300 text-gray-500 rounded-md text-sm text-center cursor-not-allowed" disabled title="Cannot invest - data pending">Invest</button>'
                                : `<a href="../Module_2/Investment_Simulation.html?startup_id=${startup.id}&return=${encodeURIComponent(returnPath)}" 
                                      class="flex-1 px-3 py-2 bg-blue-600 text-white rounded-md text-sm text-center hover:bg-blue-700 transition-all">Invest</a>`
                            }
                        </div>
                    `;
                    savedGrid.appendChild(card);
                });
            } catch (err) {
                console.error('Error loading watchlist:', err);
                if (err.message !== 'Unauthorized') {
                    showMessage('Error loading watchlist.', 'error');
                }
            }
        }

        async function loadComparisons() {
            const token = getAuthToken();
            if (!token) {
                window.location.href = '/login';
                return;
            }

            try {
                const res = await fetch('https://fundora-be-mjvs.onrender.com/api/investor/comparisons/', {
                    method: 'GET',
                    headers: authHeaders()
                });
                
                if (res.status === 401 || res.status === 403) {
                    localStorage.removeItem('authToken');
                    window.location.href = '/login';
                    return;
                }
                
                const data = await res.json();
                const comparedGrid = document.getElementById('compared-grid');
                const comparedCount = document.getElementById('compared-count');
                comparedGrid.innerHTML = '';

                const results = data.results || [];
                
                if (!results || results.length === 0) {
                    document.getElementById('compared-empty').classList.remove('hidden');
                    comparedCount.textContent = '0';
                    return;
                }

                document.getElementById('compared-empty').classList.add('hidden');
                comparedCount.textContent = results.length;

                results.forEach(comparison => {
                    const card = document.createElement('div');
                    card.className = 'bg-white shadow rounded-lg p-5 transition hover:shadow-lg flex flex-col';
                    
                    // Get startup names for display
                    const startupNames = comparison.startups.map(s => s.company_name);
                    const displayName = startupNames.length > 2 
                        ? `${startupNames[0]} vs ${startupNames[1]} vs ${startupNames[2]}`
                        : startupNames.join(' vs ');
                    
                    // Get startup IDs for the comparison link
                    const startupIds = comparison.startups.map(s => s.id).join(',');
                    
                    // Format date
                    const dateObj = new Date(comparison.created_at);
                    const formattedDate = dateObj.toLocaleDateString('en-US', { 
                        year: 'numeric', 
                        month: 'short', 
                        day: 'numeric' 
                    });
                    
                    card.innerHTML = `
                        <div class="flex justify-between items-start mb-3">
                            <div class="flex-1">
                                <h2 class="text-lg font-semibold text-gray-900 mb-1">${escapeHtml(displayName)}</h2>
                            </div>
                            <button onclick="removeComparison(${comparison.id}, '${escapeHtml(displayName).replace(/'/g, "\\'")}')" 
                                    class="text-gray-400 hover:text-red-500 transition ml-2">
                                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>
                                </svg>
                            </button>
                        </div>
                        <p class="text-xs text-gray-500 mt-auto mb-4">${comparison.startup_count} startups • Saved on ${formattedDate}</p>
                        <div class="pt-4 border-t border-gray-200">
                            <a href="../Module_2/Startup_Comparison.html?startups=${startupIds}&from=watchlist" 
                               class="text-blue-600 hover:underline text-sm font-medium flex items-center">
                                <svg class="w-4 h-4 mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z"></path>
                                </svg>
                                View Comparison
                            </a>
                        </div>
                    `;
                    comparedGrid.appendChild(card);
                });
            } catch (err) {
                console.error('Error loading comparisons:', err);
                if (err.message !== 'Unauthorized') {
                    showMessage('Error loading comparisons.', 'error');
                }
            }
        }

        async function removeFromWatchlist(startupId, companyName) {
            if (!confirm(`Remove "${companyName}" from your watchlist?`)) return;

            const token = getAuthToken();
            if (!token) {
                window.location.href = '/login';
                return;
            }

            try {
                const res = await fetch(`https://fundora-be-mjvs.onrender.com/api/investor/watchlist/remove/${startupId}/`, {
                    method: 'DELETE',
                    headers: authHeaders()
                });
                
                if (res.status === 401 || res.status === 403) {
                    localStorage.removeItem('authToken');
                    window.location.href = '/login';
                    return;
                }
                
                const data = await res.json();
                showMessage(data.message || 'Removed from watchlist.', 'success');
                loadWatchlist();
            } catch (err) {
                console.error('Error removing from watchlist:', err);
                if (err.message !== 'Unauthorized') {
                    showMessage('Failed to remove startup.', 'error');
                }
            }
        }

        async function removeComparison(comparisonId, comparisonName) {
            if (!confirm(`Remove "${comparisonName}" from your saved comparisons?`)) return;

            const token = getAuthToken();
            if (!token) {
                window.location.href = '/login';
                return;
            }

            try {
                const res = await fetch(`https://fundora-be-mjvs.onrender.com/api/investor/comparisons/delete/${comparisonId}/`, {
                    method: 'DELETE',
                    headers: authHeaders()
                });
                
                if (res.status === 401 || res.status === 403) {
                    localStorage.removeItem('authToken');
                    window.location.href = '/login';
                    return;
                }
                
                const data = await res.json();
                showMessage(data.message || 'Comparison removed successfully.', 'success');
                loadComparisons();
            } catch (err) {
                console.error('Error removing comparison:', err);
                if (err.message !== 'Unauthorized') {
                    showMessage('Failed to remove comparison.', 'error');
                }
            }
        }

        function switchTab(tabName) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.add('hidden'));
            document.querySelectorAll('.tab-button').forEach(btn => {
                btn.classList.remove('border-blue-500', 'text-blue-600');
                btn.classList.add('border-transparent', 'text-gray-500', 'hover:text-gray-700', 'hover:border-gray-300');
            });

            document.getElementById(`${tabName}-content`).classList.remove('hidden');
            const activeTab = document.getElementById(`${tabName}-tab`);
            activeTab.classList.remove('border-transparent', 'text-gray-500');
            activeTab.classList.add('border-blue-500', 'text-blue-600');

            // Update URL without reloading the page
            const url = new URL(window.location);
            url.searchParams.set('tab', tabName);
            window.history.pushState({}, '', url);

            // Load data based on active tab
            if (tabName === 'saved') {
                loadWatchlist();
            } else if (tabName === 'compared') {
                loadComparisons();
            }
        }

        function escapeHtml(unsafe) {
            if (unsafe === null || unsafe === undefined) return '';
            return String(unsafe)
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");
        }
    </script>
</body>
</html>
