<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Fundora - My Watchlist</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50: '#eff6ff',
                            100: '#dbeafe',
                            200: '#bfdbfe',
                            300: '#93c5fd',
                            400: '#60a5fa',
                            500: '#3b82f6',
                            600: '#2563eb',
                            700: '#1d4ed8',
                            800: '#1e40af',
                            900: '#1e3a8a'
                        },
                        accent: {
                            50: '#ecfdf5',
                            100: '#d1fae5',
                            200: '#a7f3d0',
                            300: '#6ee7b7',
                            400: '#34d399',
                            500: '#10b981',
                            600: '#059669',
                            700: '#047857',
                            800: '#065f46',
                            900: '#064e3b'
                        }
                    },
                    fontFamily: { 'sans': ['Inter', 'system-ui', 'sans-serif'] }
                }
            }
        }
    </script>
    <style>
        body { font-family: 'Inter', sans-serif; }
        .hero-gradient { background: linear-gradient(135deg, #0f172a 0%, #1e293b 50%, #0f172a 100%); }
        .glass-card { background: rgba(15, 23, 42, 0.8); border: 1px solid rgba(148, 163, 184, 0.2); }
        .content-wrapper { position: relative; z-index: 1; }
        
        @keyframes slideIn { from { transform: translateY(-20px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
        @keyframes fadeInUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes scaleIn { from { opacity: 0; transform: scale(0.95); } to { opacity: 1; transform: scale(1); } }
        
        .fade-in { animation: slideIn 0.3s ease-out; }
        .fade-in-up { animation: fadeInUp 0.5s ease-out forwards; opacity: 0; }
        .scale-in { animation: scaleIn 0.4s ease-out forwards; opacity: 0; }
        
        .startup-card { 
            transition: all 0.3s ease; 
            opacity: 0;
            animation: scaleIn 0.5s ease-out forwards;
        }
        .startup-card:hover { 
            transform: translateY(-4px) scale(1.02); 
            box-shadow: 0 12px 24px rgba(59, 130, 246, 0.2); 
        }
        
        .tab-button { position: relative; overflow: hidden; }
        .tab-button::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(59, 130, 246, 0.1), transparent);
            transition: left 0.5s ease;
        }
        .tab-button:hover::before {
            left: 100%;
        }
        
        button, a { transition: all 0.3s ease; }
        button:hover:not(:disabled), a:hover:not(.startup-card) {
            transform: translateY(-1px);
        }
        button:active:not(:disabled), a:active {
            transform: translateY(0);
        }
        
        #saved-grid > .startup-card:nth-child(1) { animation-delay: 0.05s; }
        #saved-grid > .startup-card:nth-child(2) { animation-delay: 0.1s; }
        #saved-grid > .startup-card:nth-child(3) { animation-delay: 0.15s; }
        #saved-grid > .startup-card:nth-child(4) { animation-delay: 0.2s; }
        #saved-grid > .startup-card:nth-child(5) { animation-delay: 0.25s; }
        #saved-grid > .startup-card:nth-child(6) { animation-delay: 0.3s; }
        
        #compared-grid > .startup-card:nth-child(1) { animation-delay: 0.05s; }
        #compared-grid > .startup-card:nth-child(2) { animation-delay: 0.1s; }
        #compared-grid > .startup-card:nth-child(3) { animation-delay: 0.15s; }
        #compared-grid > .startup-card:nth-child(4) { animation-delay: 0.2s; }
        #compared-grid > .startup-card:nth-child(5) { animation-delay: 0.25s; }
        #compared-grid > .startup-card:nth-child(6) { animation-delay: 0.3s; }
    </style>
</head>
<body class="bg-slate-950 text-white min-h-screen hero-gradient">
    <div class="content-wrapper max-w-7xl mx-auto p-6">
        <!-- Header -->
        <div class="flex items-center mb-8 fade-in">
            <a href="Dashboard.html" class="mr-4 p-2.5 hover:bg-slate-800/50 rounded-lg transition-all border border-slate-700">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7" />
                </svg>
            </a>
            <div>
                <h1 class="text-4xl font-bold mb-1">My Watchlist</h1>
                <p class="text-gray-400">Track your favorite startups and comparisons</p>
            </div>
        </div>

        <!-- Tab Navigation -->
        <div class="bg-slate-900/60 border border-slate-800 rounded-2xl mb-8 p-2 fade-in-up" style="animation-delay: 0.1s;">
            <nav class="flex space-x-2">
                <button id="saved-tab" class="tab-button flex-1 py-3 px-6 rounded-lg font-medium text-sm focus:outline-none transition-all duration-200" onclick="switchTab('saved')">
                    <div class="flex items-center justify-center space-x-2">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4.318 6.318a4.5 4.5 0 000 6.364L12 20.364l7.682-7.682a4.5 4.5 0 00-6.364-6.364L12 7.636l-1.318-1.318a4.5 4.5 0 00-6.364 0z"></path>
                        </svg>
                        <span>Saved (<span id="saved-count">0</span>)</span>
                    </div>
                </button>
                <button id="compared-tab" class="tab-button flex-1 py-3 px-6 rounded-lg font-medium text-sm focus:outline-none transition-all duration-200" onclick="switchTab('compared')">
                    <div class="flex items-center justify-center space-x-2">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z"></path>
                        </svg>
                        <span>Compared (<span id="compared-count">0</span>)</span>
                    </div>
                </button>
            </nav>
        </div>

        <!-- Tab Content -->
        <div id="tab-content" class="fade-in-up" style="animation-delay: 0.2s;">
            <!-- Saved Tab -->
            <div id="saved-content" class="tab-content">
                <div id="saved-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6"></div>
                <div id="saved-empty" class="text-center py-16 hidden">
                    <!-- Removed emoji, made text more professional -->
                    <div class="bg-slate-900/60 border border-slate-800 rounded-2xl p-12 max-w-md mx-auto">
                        <svg class="w-16 h-16 mx-auto mb-4 text-gray-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M4.318 6.318a4.5 4.5 0 000 6.364L12 20.364l7.682-7.682a4.5 4.5 0 00-6.364-6.364L12 7.636l-1.318-1.318a4.5 4.5 0 00-6.364 0z"></path>
                        </svg>
                        <h3 class="text-xl font-semibold mb-2">No saved startups yet</h3>
                        <p class="text-gray-400 mb-6">Start building your watchlist by saving startups you're interested in.</p>
                        <a href="Dashboard.html" class="inline-block bg-brand-600 hover:bg-brand-700 text-white px-6 py-3 rounded-lg font-medium transition-all">
                            Browse Startups
                        </a>
                    </div>
                </div>
            </div>

            <!-- Compared Tab -->
            <div id="compared-content" class="tab-content hidden">
                <div id="compared-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6"></div>
                <div id="compared-empty" class="text-center py-16 hidden">
                    <!-- Removed emoji, made text more professional -->
                    <div class="bg-slate-900/60 border border-slate-800 rounded-2xl p-12 max-w-md mx-auto">
                        <svg class="w-16 h-16 mx-auto mb-4 text-gray-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z"></path>
                        </svg>
                        <h3 class="text-xl font-semibold mb-2">No comparisons yet</h3>
                        <p class="text-gray-400 mb-6">Compare startups side-by-side to make informed investment decisions.</p>
                        <a href="../Module_2/Compare_Startups.html" class="inline-block bg-accent-600 hover:bg-accent-700 text-white px-6 py-3 rounded-lg font-medium transition-all">
                            Compare Startups
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        function getAuthToken() {
            return sessionStorage.getItem('authToken');
        }

        function authHeaders() {
            const token = getAuthToken();
            if (!token) return {};
            return {
                'Authorization': `Bearer ${token}`,
                'Content-Type': 'application/json'
            };
        }

        function showMessage(message, type) {
            const div = document.createElement('div');
            div.className = `fixed top-4 right-4 z-50 p-4 rounded-lg shadow-2xl ${type === 'success' ? 'bg-accent-600' : 'bg-red-600'} text-white font-medium`;
            div.style.opacity = '0';
            div.textContent = message;
            document.body.appendChild(div);
            
            setTimeout(() => div.style.opacity = '1', 10);
            setTimeout(() => {
                div.style.opacity = '0';
                setTimeout(() => div.remove(), 300);
            }, 3000);
        }

        document.addEventListener('DOMContentLoaded', () => {
            const token = getAuthToken();
            if (!token) {
                window.location.href = '/login.html';
                return;
            }
            
            loadTabCounts();
            
            const urlParams = new URLSearchParams(window.location.search);
            const activeTab = urlParams.get('tab') || 'saved';
            
            switchTab(activeTab);
        });

        async function loadTabCounts() {
            try {
                const watchlistRes = await fetch('https://fundorabe-production.up.railway.app/api/investor/watchlist/', {
                    method: 'GET',
                    headers: authHeaders()
                });
                if (watchlistRes.ok) {
                    const watchlistData = await watchlistRes.json();
                    const watchlistResults = watchlistData.results || watchlistData.watchlist || [];
                    document.getElementById('saved-count').textContent = watchlistResults.length;
                }
            } catch (err) {
                console.error('Error loading watchlist count:', err);
            }

            try {
                const comparisonsRes = await fetch('https://fundorabe-production.up.railway.app/api/investor/comparisons/', {
                    method: 'GET',
                    headers: authHeaders()
                });
                if (comparisonsRes.ok) {
                    const comparisonsData = await comparisonsRes.json();
                    const comparisonsResults = comparisonsData.results || [];
                    document.getElementById('compared-count').textContent = comparisonsResults.length;
                }
            } catch (err) {
                console.error('Error loading comparisons count:', err);
            }
        }

        async function loadWatchlist() {
            const token = getAuthToken();
            if (!token) {
                window.location.href = '/login.html';
                return;
            }

            try {
                const watchlistRes = await fetch('https://fundorabe-production.up.railway.app/api/investor/watchlist/', {
                    method: 'GET',
                    headers: authHeaders()
                });
                
                if (watchlistRes.status === 401 || watchlistRes.status === 403) {
                    sessionStorage.removeItem('authToken');
                    window.location.href = '/login.html';
                    return;
                }
                
                const watchlistData = await watchlistRes.json();
                const watchlistItems = watchlistData.results || watchlistData.watchlist || [];
                
                if (!watchlistItems || watchlistItems.length === 0) {
                    document.getElementById('saved-empty').classList.remove('hidden');
                    document.getElementById('saved-count').textContent = '0';
                    document.getElementById('saved-grid').innerHTML = '';
                    return;
                }
                
                const startupsRes = await fetch('https://fundorabe-production.up.railway.app/api/investor/startups/', {
                    method: 'GET',
                    headers: authHeaders()
                });
                
                if (!startupsRes.ok) {
                    throw new Error('Failed to fetch startups data');
                }
                
                const startupsData = await startupsRes.json();
                const allStartups = startupsData.results || startupsData.startups || startupsData;
                
                const watchlistIds = new Set(watchlistItems.map(item => item.id));
                const results = allStartups.filter(startup => watchlistIds.has(startup.id));
                
                const savedGrid = document.getElementById('saved-grid');
                const savedCount = document.getElementById('saved-count');
                savedGrid.innerHTML = '';

                if (!results || results.length === 0) {
                    document.getElementById('saved-empty').classList.remove('hidden');
                    savedCount.textContent = '0';
                    return;
                }

                document.getElementById('saved-empty').classList.add('hidden');
                savedCount.textContent = results.length;

                results.forEach(startup => {
                    const card = document.createElement('div');
                    card.className = 'startup-card bg-slate-900/60 border border-slate-800 rounded-2xl p-6 hover:shadow-xl transition-all flex flex-col';
                    
                    const isDeck = !!(startup.is_deck_builder || startup.source_deck_id || startup.source_deck);
                    const hasDataPending = !isDeck && !startup.risk_level;
                    
                    let riskBadge;
                    if (isDeck) {
                        riskBadge = '<span class="bg-purple-500/20 text-purple-300 text-xs font-medium px-3 py-1 rounded-full border border-purple-500/30">Pitch Deck</span>';
                    } else if (startup.risk_level) {
                        const riskLevel = startup.risk_level.toLowerCase();
                        if (riskLevel === 'low') {
                            riskBadge = '<span class="bg-green-500/20 text-green-300 text-xs font-medium px-3 py-1 rounded-full border border-green-500/30">Low Risk</span>';
                        } else if (riskLevel === 'medium') {
                            riskBadge = '<span class="bg-yellow-500/20 text-yellow-300 text-xs font-medium px-3 py-1 rounded-full border border-yellow-500/30">Medium Risk</span>';
                        } else {
                            riskBadge = '<span class="bg-red-500/20 text-red-300 text-xs font-medium px-3 py-1 rounded-full border border-red-500/30">High Risk</span>';
                        }
                    } else {
                        riskBadge = '<span class="bg-gray-500/20 text-gray-300 text-xs font-medium px-3 py-1 rounded-full border border-gray-500/30">Data Pending</span>';
                    }
                    
                    let industryDisplay = startup.industry;
                    if (startup.tagline) {
                        industryDisplay = startup.tagline;
                    } else if (!industryDisplay || industryDisplay === '—') {
                        industryDisplay = startup.company_description || 'N/A';
                    }
                    
                    let metricsSection;
                        if (isDeck) {
                            const fundingAmount = startup.funding_ask ? `$${parseFloat(startup.funding_ask).toLocaleString()}` : 'N/A';
                            const marketGrowth = startup.market_growth_rate ?? startup.market_growth ?? 'N/A';
                            const marketGrowthDisplay = marketGrowth !== 'N/A' ? `${marketGrowth}%` : 'N/A';
                            
                            metricsSection = `
                                <div class="space-y-3 mb-4 flex-grow">
                                    <div class="flex justify-between items-center">
                                        <span class="text-sm text-gray-400">Funding Requested</span>
                                        <span class="text-sm font-semibold text-brand-400">${escapeHtml(fundingAmount)}</span>
                                    </div>
                                    <div class="flex justify-between items-center">
                                        <span class="text-sm text-gray-400">Market Growth Rate (YOY)</span>
                                        <span class="text-sm font-semibold text-accent-400">${escapeHtml(marketGrowthDisplay)}</span>
                                    </div>
                                </div>
                            `;
                        } else {
                            let reward = 'N/A';
                            if (startup.reward_potential != null) {
                                if (typeof startup.reward_potential === 'string') {
                                    reward = startup.reward_potential.split(',')[0].trim();
                                } else if (Array.isArray(startup.reward_potential)) {
                                    reward = startup.reward_potential[0];
                                } else {
                                    reward = String(startup.reward_potential);
                                }
                            }

                            const rewardDisplay = reward === 'N/A' ? 'N/A' : `${reward}/5`;
                            const estimatedGrowth = (startup.estimated_growth_rate != null && startup.estimated_growth_rate !== '') 
                                ? `${startup.estimated_growth_rate >= 0 ? '+' : ''}${startup.estimated_growth_rate}%` 
                                : 'N/A';
                            
                            metricsSection = `
                                <div class="space-y-3 mb-4 flex-grow">
                                    <div class="flex justify-between items-center">
                                        <span class="text-sm text-gray-400">Reward Potential</span>
                                        <span class="text-sm font-semibold text-white">${escapeHtml(rewardDisplay)}</span>
                                    </div>
                                    <div class="flex justify-between items-center">
                                        <span class="text-sm text-gray-400">Estimated Growth Rate</span>
                                        <span class="text-sm font-semibold ${startup.estimated_growth_rate != null && startup.estimated_growth_rate >= 0 ? 'text-accent-400' : 'text-red-400'}">${escapeHtml(estimatedGrowth)}</span>
                                    </div>
                                </div>
                            `;
                        }
                    
                    const profilePage = isDeck ? '../Module_2/Company_ProfileDB.html' : '../Module_2/Company_Profile.html';
                    const returnPath = window.location.pathname + window.location.search;
                    
                    card.innerHTML = `
                        <div class="flex justify-between items-start mb-4">
                            <div class="flex-1">
                                <h2 class="text-lg font-semibold text-white mb-1">${escapeHtml(startup.company_name)}</h2>
                                <p class="text-sm text-gray-400">${escapeHtml(industryDisplay)}</p>
                            </div>
                            <div class="flex flex-col items-end space-y-2">
                                ${riskBadge}
                                <button onclick="removeFromWatchlist(${startup.id}, '${escapeHtml(startup.company_name).replace(/'/g, "\\'")}')" 
                                        class="text-gray-400 hover:text-red-400 transition p-1 rounded-lg hover:bg-slate-800/50"
                                        title="Remove from watchlist">
                                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>
                                    </svg>
                                </button>
                            </div>
                        </div>
                        ${metricsSection}
                        <div class="flex gap-2 mt-auto">
                            <a href="${profilePage}?id=${startup.id}&return=${encodeURIComponent(returnPath)}" 
                               class="flex-1 px-4 py-2.5 border border-slate-700 bg-slate-800/50 text-white rounded-lg hover:bg-slate-700/50 hover:border-slate-600 text-sm font-medium text-center transition-all">
                                View Details
                            </a>
                            ${hasDataPending 
                                ? '<button class="flex-1 px-4 py-2.5 bg-gray-500/20 text-gray-400 rounded-lg text-sm font-medium cursor-not-allowed">Data Pending</button>'
                                : `<a href="../Module_2/Investment_Calculation.html?startup_id=${startup.id}&return=${encodeURIComponent(returnPath)}" 
                                      class="flex-1 px-4 py-2.5 bg-brand-600 hover:bg-brand-700 text-white rounded-lg text-sm text-center font-medium transition-all">Invest</a>`
                            }
                        </div>
                    `;
                    savedGrid.appendChild(card);
                });
            } catch (err) {
                console.error('Error loading watchlist:', err);
                if (err.message !== 'Unauthorized') {
                    showMessage('Error loading watchlist.', 'error');
                }
            }
        }

        async function loadComparisons() {
            const token = getAuthToken();
            if (!token) {
                window.location.href = '/login.html';
                return;
            }

            try {
                const res = await fetch('https://fundorabe-production.up.railway.app/api/investor/comparisons/', {
                    method: 'GET',
                    headers: authHeaders()
                });
                
                if (res.status === 401 || res.status === 403) {
                    sessionStorage.removeItem('authToken');
                    window.location.href = '/login.html';
                    return;
                }
                
                const data = await res.json();
                const comparedGrid = document.getElementById('compared-grid');
                const comparedCount = document.getElementById('compared-count');
                comparedGrid.innerHTML = '';

                const results = data.results || [];
                
                if (!results || results.length === 0) {
                    document.getElementById('compared-empty').classList.remove('hidden');
                    comparedCount.textContent = '0';
                    return;
                }

                document.getElementById('compared-empty').classList.add('hidden');
                comparedCount.textContent = results.length;

                results.forEach(comparison => {
                    const card = document.createElement('div');
                    card.className = 'startup-card bg-slate-900/60 border border-slate-800 rounded-2xl p-6 hover:shadow-xl transition-all flex flex-col';
                    
                    const startupNames = comparison.startups.map(s => s.company_name);
                    const displayName = startupNames.length > 2 
                        ? `${startupNames[0]} vs ${startupNames[1]} vs ${startupNames[2]}`
                        : startupNames.join(' vs ');
                    
                    const startupIds = comparison.startups.map(s => s.id).join(',');
                    
                    const dateObj = new Date(comparison.created_at);
                    const formattedDate = dateObj.toLocaleDateString('en-US', { 
                        year: 'numeric', 
                        month: 'short', 
                        day: 'numeric' 
                    });
                    
                    card.innerHTML = `
                        <div class="flex justify-between items-start mb-4">
                            <div class="flex-1">
                                <h2 class="text-lg font-semibold text-white mb-2">${escapeHtml(displayName)}</h2>
                                <p class="text-xs text-gray-400">${comparison.startup_count} startups • Saved on ${formattedDate}</p>
                            </div>
                            <button onclick="removeComparison(${comparison.id}, '${escapeHtml(displayName).replace(/'/g, "\\'")}')" 
                                    class="text-gray-400 hover:text-red-400 transition ml-2 p-1 rounded-lg hover:bg-slate-800/50">
                                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>
                                </svg>
                            </button>
                        </div>
                        <div class="mt-auto pt-4 border-t border-slate-800">
                            <a href="../Module_2/Startup_Comparison.html?startups=${startupIds}&from=watchlist" 
                               class="text-brand-400 hover:text-brand-300 text-sm font-medium flex items-center group">
                                <svg class="w-4 h-4 mr-2 group-hover:translate-x-1 transition-transform" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path>
                                </svg>
                                View Comparison
                            </a>
                        </div>
                    `;
                    comparedGrid.appendChild(card);
                });
            } catch (err) {
                console.error('Error loading comparisons:', err);
                if (err.message !== 'Unauthorized') {
                    showMessage('Error loading comparisons.', 'error');
                }
            }
        }

        async function removeFromWatchlist(startupId, companyName) {
            if (!confirm(`Remove "${companyName}" from your watchlist?`)) return;

            const token = getAuthToken();
            if (!token) {
                window.location.href = '/login.html';
                return;
            }

            try {
                const res = await fetch(`https://fundorabe-production.up.railway.app/api/investor/watchlist/remove/${startupId}/`, {
                    method: 'POST',
                    headers: authHeaders()
                });
                
                if (res.status === 401 || res.status === 403) {
                    sessionStorage.removeItem('authToken');
                    window.location.href = '/login.html';
                    return;
                }
                
                const data = await res.json();
                showMessage(data.message || 'Removed from watchlist.', 'success');
                loadWatchlist();
                loadTabCounts();
            } catch (err) {
                console.error('Error removing from watchlist:', err);
                if (err.message !== 'Unauthorized') {
                    showMessage('Failed to remove startup.', 'error');
                }
            }
        }

        async function removeComparison(comparisonId, comparisonName) {
            if (!confirm(`Remove "${comparisonName}" from your saved comparisons?`)) return;

            const token = getAuthToken();
            if (!token) {
                window.location.href = '/login.html';
                return;
            }

            try {
                const res = await fetch(`https://fundorabe-production.up.railway.app/api/investor/comparisons/delete/${comparisonId}/`, {
                    method: 'DELETE',
                    headers: authHeaders()
                });
                
                if (res.status === 401 || res.status === 403) {
                    sessionStorage.removeItem('authToken');
                    window.location.href = '/login.html';
                    return;
                }
                
                const data = await res.json();
                showMessage(data.message || 'Comparison removed successfully.', 'success');
                loadComparisons();
            } catch (err) {
                console.error('Error removing comparison:', err);
                if (err.message !== 'Unauthorized') {
                    showMessage('Failed to remove comparison.', 'error');
                }
            }
        }

        function switchTab(tabName) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.add('hidden'));
            document.querySelectorAll('.tab-button').forEach(btn => {
                btn.classList.remove('bg-slate-800/50', 'text-white');
                btn.classList.add('text-gray-400', 'hover:text-white', 'hover:bg-slate-800/30');
            });

            document.getElementById(`${tabName}-content`).classList.remove('hidden');
            const activeTab = document.getElementById(`${tabName}-tab`);
            activeTab.classList.remove('text-gray-400', 'hover:text-white', 'hover:bg-slate-800/30');
            activeTab.classList.add('bg-slate-800/50', 'text-white');

            const url = new URL(window.location);
            url.searchParams.set('tab', tabName);
            window.history.pushState({}, '', url);

            if (tabName === 'saved') {
                loadWatchlist();
            } else if (tabName === 'compared') {
                loadComparisons();
            }
        }

        function escapeHtml(unsafe) {
            if (unsafe === null || unsafe === undefined) return '';
            return String(unsafe)
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");
        }
    </script>
</body>
