<!DOCTYPE html>
<html lang="en" class="h-screen">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Deck Builder</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-100 text-black">

  <!-- Header -->
  <header class="p-6 bg-white shadow-md flex justify-between items-center">
    <h1 class="text-4xl font-bold">My Pitch Decks</h1>
    <button id="createDeckBtn" class="py-2 px-4 rounded bg-blue-500 text-white font-semibold hover:bg-blue-600">
      + Create New Deck
    </button>
  </header>

  <div class="p-10 max-w-4xl mx-auto">

    <!-- Back Button -->
    <div class="mb-6">
      <a href="Module_3/added-startups.html" class="inline-flex items-center space-x-2 py-2 px-4 rounded bg-gray-100 hover:bg-gray-200 text-gray-700 hover:text-gray-900 font-medium transition duration-200 ease-in-out">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path>
        </svg>
        <span>Back to Added Startups</span>
      </a>
    </div>

    <!-- Message Container -->
    <div id="messageContainer" class="mb-6"></div>

    <!-- Deck List -->
    <div id="deckList" class="space-y-4">
      <!-- Deck cards will be injected here -->
    </div>
  </div>

  <script>
    const API_BASE = 'http://127.0.0.1:8000/api/';
    const token = localStorage.getItem('authToken');

    async function loadDecks() {
      const container = document.getElementById('deckList');
      try {
        console.log(token)
        const res = await fetch(`${API_BASE}deck/list/`, {
            headers: {
              'Authorization': `Bearer ${token}`,
              'Content-Type': 'application/json'
            }
        });
        const data = await res.json();
        const decks = data.decks || [];
        console.log(decks)
        container.innerHTML = '';

        if (decks.length === 0) {
          container.innerHTML = `<p class="text-center text-gray-500">You haven't created any decks yet.</p>`;
          return;
        }

        decks.forEach(deck => {
          const card = document.createElement('div');
          card.className = "bg-white p-6 rounded-lg shadow-md flex justify-between items-center";

          card.innerHTML = `
            <div>
              <h2 class="text-2xl font-bold">${deck.company_name}</h2>
              <p class="text-gray-600">${deck.tagline}</p>
              <p class="text-sm text-gray-400">Created on: ${new Date(deck.created_at).toLocaleDateString()}</p>
            </div>
            <div class="flex items-center space-x-4">
              <button onclick="loadDeckEditor(${deck.id})" class="text-blue-500 hover:underline">Edit</button>
              <button onclick="deleteDeck(${deck.id})" class="text-red-500 hover:underline">Delete</button>
            </div>
          `;

          container.appendChild(card);
        });
      } catch (err) {
        console.error('Failed to load decks:', err);
        showMessage('Failed to load decks. Please try again.', 'error');
      }
    }

    async function deleteDeck(deckId) {
      if (!confirm('Are you sure you want to delete this deck?')) return;

      try {
        const res = await fetch(`${API_BASE}deck/${deckId}/delete/`, {
          method: 'DELETE',
          headers: { 'Authorization': `Bearer ${token}` }
        });

        if (res.ok) {
          showMessage('Deck deleted successfully.', 'success');
          loadDecks();
          setTimeout(() => {
            window.location.reload();
          }, 700); // optional delay to let the message show
        } else {
          showMessage('Failed to delete deck.', 'error');
        }
      } catch (err) {
        console.error('Delete failed:', err);
        showMessage('Error deleting deck.', 'error');
      }
    }

    function showMessage(text, type) {
      const container = document.getElementById('messageContainer');
      container.innerHTML = `<div class="p-4 text-sm ${type === 'error' ? 'text-red-700 bg-red-100' : 'text-green-700 bg-green-100'} rounded-lg">${text}</div>`;
    }

    function loadDeckEditor(deckId) {
      if (!deckId || isNaN(deckId)) {
        console.error('Invalid deck ID');
        return;
      }

      localStorage.setItem('deck_id', deckId); // persist for other sections
      window.location.href = '/base.html'; // redirect to deck builder
    }

    document.getElementById('createDeckBtn').addEventListener('click', async () => {
        const token = localStorage.getItem('authToken');

        try {
          const res = await fetch('http://127.0.0.1:8000/api/deck/create/', {
            method: 'POST',
            headers: {
              'Authorization': `Bearer ${token}`,
            }
          });

          const data = await res.json();
          console.log('Deck creation response:', data);

          if (res.ok && data.deck_id) {
            console.log('New deck created with ID:', data.deck_id);
            localStorage.setItem('deck_id', data.deck_id);
            window.location.href = '/base.html'; // redirect to deck builder
          } else {
            alert(data.error || 'Failed to create new deck.');
          }
        } catch (err) {
          console.error('Deck creation failed:', err);
          alert('Something went wrong while creating the deck.');
        }
      });

    window.onload = loadDecks;
  </script>

</body>
</html>
