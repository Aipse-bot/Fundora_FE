    async function loadDecks() {
      const container = document.getElementById('deckList');
      const messageContainer = document.getElementById('messageContainer');
      const token = localStorage.getItem('authToken');

      if (!token) {
        showMessage('Please log in to view your decks.', 'error');
        setTimeout(() => {
          window.location.href = '../login.html';
        }, 2000);
        return;
      }

      container.innerHTML = `
        <div class="col-span-full text-center py-12">
          <div class="animate-spin rounded-full h-8 w-8 border-b-2 border-blue-600 mx-auto"></div>
          <p class="mt-4 text-slate-600">Loading your pitch decks...</p>
        </div>
      `;
      messageContainer.innerHTML = '';

      let isLoadingDecks = true;
      let successfulRenders = 0;
      let failedRenders = 0;

      try {
        const res = await fetch(`${API_BASE}deck/list/`, {
          headers: {
            'Authorization': `Bearer ${token}`,
            'Content-Type': 'application/json'
          }
        });

        if (!res.ok) {
          throw new Error(`HTTP ${res.status}: ${res.statusText}`);
        }

        const data = await res.json();
        const decks = Array.isArray(data.decks) ? data.decks : [];

        container.innerHTML = '';

        if (decks.length === 0) {
          container.innerHTML = `
            <div class="col-span-full text-center py-12">
              <svg xmlns="http://www.w3.org/2000/svg" class="mx-auto h-16 w-16 text-slate-400 mb-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
              </svg>
              <h3 class="text-lg font-medium text-slate-800 mb-2">No pitch decks created yet</h3>
              <p class="text-slate-600 mb-6">Click the button above to start building your first deck.</p>
            </div>
          `;
          return;
        }

        decks.forEach((deck, index) => {
          try {
            if (!deck || typeof deck !== 'object') {
              throw new Error(`Deck ${index + 1} is not a valid object`);
            }

            const card = document.createElement('div');
            card.className = "border border-slate-200 rounded-xl p-6 shadow hover:shadow-lg transition duration-300";

            card.innerHTML = `
              <div class="flex flex-col gap-2">
                <h2 class="text-xl font-semibold text-slate-800">${deck.company_name}</h2>
                <p class="text-slate-600">${deck.tagline}</p>
                <p class="text-sm text-slate-400">Created on: ${new Date(deck.created_at).toLocaleDateString()}</p>
              </div>
              <div class="mt-4 flex gap-4">
                <button onclick="loadDeckEditor(${deck.id})" class="text-blue-600 hover:underline">Edit</button>
                <button onclick="deleteDeck(${deck.id})" class="text-red-600 hover:underline">Delete</button>
              </div>
            `;

            container.appendChild(card);
            successfulRenders++;
          } catch (error) {
            console.error(`❌ Error rendering deck ${index + 1}:`, error);

            const errorCard = document.createElement('div');
            errorCard.className = "bg-red-50 border border-red-200 rounded-xl p-6";
            errorCard.innerHTML = `
              <div class="text-red-600 text-center">
                <div class="text-2xl mb-2">⚠️</div>
                <h3 class="font-medium">Error Loading Deck</h3>
                <p class="text-sm mt-1">Deck ${index + 1} could not be displayed</p>
                <details class="mt-2 text-left">
                  <summary class="cursor-pointer text-xs">Show Error</summary>
                  <pre class="text-xs mt-1 bg-red-100 p-2 rounded overflow-x-auto">${error.message}</pre>
                </details>
              </div>
            `;
            container.appendChild(errorCard);
            failedRenders++;
          }
        });

        // Show summary message
        if (successfulRenders > 0) {
          let msg = `Successfully loaded ${successfulRenders} pitch deck${successfulRenders === 1 ? '' : 's'}`;
          if (failedRenders > 0) msg += ` (${failedRenders} failed to render)`;
          showMessage(msg, failedRenders === 0 ? 'success' : 'warning');
        } else {
          showMessage('No decks could be rendered due to data issues.', 'error');
        }

      } catch (error) {
        console.error('💥 Error loading decks:', error);
        container.innerHTML = `
          <div class="col-span-full text-center py-12">
            <div class="text-red-600 mb-4">
              <svg xmlns="http://www.w3.org/2000/svg" class="mx-auto h-16 w-16 mb-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
              </svg>
              <h3 class="text-lg font-medium mb-2">Failed to load decks</h3>
              <p class="text-slate-600 mb-4">${error.message}</p>
              <details class="mb-4">
                <summary class="cursor-pointer text-sm text-slate-500">Show technical details</summary>
                <pre class="mt-2 text-xs bg-red-50 p-3 rounded text-left overflow-x-auto">${error.stack || error.toString()}</pre>
              </details>
              <button onclick="loadDecks()" class="bg-blue-600 text-white px-4 py-2 rounded-lg hover:bg-blue-700 transition-colors">
                Try Again
              </button>
            </div>
          </div>
        `;
        showMessage(`Failed to load decks: ${error.message}`, 'error');
      } finally {
        isLoadingDecks = false;
      }
    }
    
    async function deleteDeck(deckId) {
      if (!confirm('Are you sure you want to delete this deck?')) return;

      try {
        const res = await fetch(`${API_BASE}deck/${deckId}/delete/`, {
          method: 'DELETE',
          headers: { 'Authorization': `Bearer ${token}` }
        });

        if (res.ok) {
          showMessage('Deck deleted successfully.', 'success');
          loadDecks();
          setTimeout(() => {
            window.location.reload();
          }, 700); // optional delay to let the message show
        } else {
          showMessage('Failed to delete deck.', 'error');
        }
      } catch (err) {
        console.error('Delete failed:', err);
        showMessage('Error deleting deck.', 'error');
      }
    }

    // }

    function showMessage(text, type) {
      const container = document.getElementById('messageContainer');
      container.innerHTML = `
        <div class="p-4 text-sm ${type === 'error' ? 'text-red-700 bg-red-100' : type === 'warning' ? 'text-yellow-700 bg-yellow-100' : 'text-green-700 bg-green-100'} rounded-lg">
          ${text}
        </div>
      `;

      // Auto-clear after 5 seconds
      setTimeout(() => {
        container.innerHTML = '';
      }, 5000);
    }

    function loadDeckEditor(deckId) {
      if (!deckId || isNaN(deckId)) {
        console.error('Invalid deck ID');
        return;
      }

      localStorage.setItem('deck_id', deckId); // persist for other sections
      window.location.href = '/base.html'; // redirect to deck builder
    }

    document.getElementById('createDeckBtn').addEventListener('click', async () => {
        const token = localStorage.getItem('authToken');

        try {
          const res = await fetch(`${API_BASE}deck/create/`, {
            method: 'POST',
            headers: {
              'Authorization': `Bearer ${token}`,
            }
          });

          const data = await res.json();
          console.log('Deck creation response:', data);

          if (res.ok && data.deck_id) {
            console.log('New deck created with ID:', data.deck_id);
            localStorage.setItem('deck_id', data.deck_id);
            window.location.href = '/base.html'; // redirect to deck builder
          } else {
            alert(data.error || 'Failed to create new deck.');
          }
        } catch (err) {
          console.error('Deck creation failed:', err);
          alert('Something went wrong while creating the deck.');
        }
      });

    window.onload = loadDecks;
    
    function logout() {
      localStorage.removeItem('authToken');
      localStorage.removeItem('userData');
      window.location.href = '/login.html'; // or wherever your login page lives
    }
