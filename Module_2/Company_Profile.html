<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title id="page-title">Company Profile</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: { coral: "#e57373" },
        },
      },
    };
  </script>
</head>
<body class="bg-gray-50 min-h-screen">
  <div class="max-w-6xl mx-auto p-6">
    <!-- Header -->
    <div class="flex items-center justify-between mb-8">
      <div class="flex items-center">
        <a href="/Dashboard.html" class="mr-6 p-2 hover:bg-gray-100 rounded-full">
          <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path>
          </svg>
        </a>
        <div class="flex items-center">
          <div class="w-12 h-12 bg-gradient-to-br from-orange-400 to-red-500 rounded-lg flex items-center justify-center mr-4">
            <div class="w-8 h-8 bg-gradient-to-br from-orange-300 to-red-400 rounded"></div>
          </div>
          <div>
            <h1 id="companyName" class="text-2xl font-bold text-gray-900"></h1>
            <span id="industry" class="bg-blue-100 text-blue-700 text-sm font-medium px-3 py-1 rounded-full"></span>
          </div>
        </div>
      </div>
      <span id="riskBadge" class="text-sm font-medium px-3 py-1 rounded-full"></span>
    </div>

    <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
      <!-- Left Column -->
      <div class="lg:col-span-2 space-y-6">
        <!-- Company Summary -->
        <div class="bg-white rounded-lg p-6 shadow-sm">
          <h2 class="text-xl font-semibold text-gray-900 mb-4">Company Summary</h2>
          <p id="companyDescription" class="text-gray-700 leading-relaxed mb-6"></p>
        </div>

        <!-- Financial Metrics -->
        <div class="bg-white rounded-lg p-6 shadow-sm">
          <div class="flex items-center mb-6">
            <svg class="w-5 h-5 text-green-600 mr-2" fill="currentColor" viewBox="0 0 20 20">
              <path d="M4 4a2 2 0 00-2 2v4a2 2 0 002 2V6h10a2 2 0 00-2-2H4zm2 6a2 2 0 012-2h8a2 2 0 012 2v4a2 2 0 01-2 2H8a2 2 0 01-2-2v-4zm6 4a2 2 0 100-4 2 2 0 000 4z"></path>
            </svg>
            <h2 class="text-xl font-semibold text-gray-900">Financial Metrics</h2>
          </div>
          <div id="financials" class="grid grid-cols-2 gap-4"></div>
        </div>

        <!-- Qualitative Insights -->
        <div class="bg-white rounded-lg p-6 shadow-sm">
          <h2 class="text-xl font-semibold text-gray-900 mb-6">Qualitative Insights</h2>
          <div id="qualitative"></div>
        </div>
      </div>

      <!-- Right Column -->
      <div class="space-y-6">
        <!-- Risk & Reward -->
        <div class="bg-white rounded-lg p-6 shadow-sm">
          <div class="flex items-center mb-4">
            <svg class="w-5 h-5 text-orange-600 mr-2" fill="currentColor" viewBox="0 0 20 20">
              <path fill-rule="evenodd" d="M8.257 3.099c.765-1.36 2.722-1.36 3.486 0l5.58 9.92c.75 1.334-.213 2.98-1.742 2.98H4.42c-1.53 0-2.493-1.646-1.743-2.98l5.58-9.92zM11 13a1 1 0 11-2 0 1 1 0 012 0zm-1-8a1 1 0 00-1 1v3a1 1 0 002 0V6a1 1 0 00-1-1z" clip-rule="evenodd"></path>
            </svg>
            <h2 class="text-xl font-semibold text-gray-900">Risk & Reward</h2>
          </div>
          <div id="riskReward" class="space-y-4"></div>
        </div>

        <!-- Data Confidence -->
        <div class="bg-white rounded-lg p-6 shadow-sm">
          <div class="flex items-center mb-4">
            <svg class="w-5 h-5 text-blue-600 mr-2" fill="currentColor" viewBox="0 0 20 20">
              <path fill-rule="evenodd" d="M18 10a8 8 0 11-16 0 8 8 0 0116 0zm-7-4a1 1 0 11-2 0 1 1 0 012 0zM9 9a1 1 0 000 2v3a1 1 0 001 1h1a1 1 0 100-2v-3a1 1 0 00-1-1H9z" clip-rule="evenodd"></path>
            </svg>
            <h2 class="text-xl font-semibold text-gray-900">Data Confidence</h2>
          </div>
          <div id="dataConfidence" class="text-center mb-4"></div>
        </div>

        <!-- Action Buttons -->
        <div class="space-y-3">
          <button id="watchlistBtn" class="w-full font-medium py-3 px-4 rounded-lg transition-colors duration-200 flex items-center justify-center"></button>
          <a href="/compare.html" class="w-full border border-gray-300 text-gray-700 hover:bg-gray-50 font-medium py-3 px-4 rounded-lg transition-colors duration-200 text-center block">
            Compare Startups
          </a>
          <a id="downloadPdf" class="w-full bg-green-100 hover:bg-green-200 text-green-700 font-medium py-3 px-4 rounded-lg transition-colors duration-200 text-center block">
            Download Profile (PDF)
          </a>
          <a id="investBtn" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-medium py-3 px-4 rounded-lg transition-colors duration-200 text-center block">
            Invest
          </a>
        </div>
      </div>
    </div>
  </div>

  <script>
  const token = localStorage.getItem("authToken");
  const params = new URLSearchParams(window.location.search);
  const id = params.get("id");

  async function loadCompany() {
    if (!id) return;

    const res = await fetch(`http://127.0.0.1:8000/api/startups/${id}/profile/`, {
        headers: { Authorization: `Bearer ${token}` },
    });
    const data = await res.json();

    document.title = `${data.company_name} - Company Profile`;
    document.getElementById("companyName").textContent = data.company_name;
    document.getElementById("industry").textContent = data.industry || "—";
    document.getElementById("companyDescription").textContent =
      data.company_description || "No description provided.";

    // Risk Badge
    const badge = document.getElementById("riskBadge");
    if (data.data_source_confidence === "High") {
      badge.textContent = "Low Risk";
      badge.className =
        "bg-green-100 text-green-800 text-sm font-medium px-3 py-1 rounded-full";
    } else if (data.data_source_confidence === "Medium") {
      badge.textContent = "Medium Risk";
      badge.className =
        "bg-yellow-100 text-yellow-800 text-sm font-medium px-3 py-1 rounded-full";
    } else {
      badge.textContent = "High Risk";
      badge.className =
        "bg-red-100 text-red-800 text-sm font-medium px-3 py-1 rounded-full";
    }

    // Financial Metrics
    const fin = document.getElementById("financials");
    fin.innerHTML = `
      <div class="bg-green-50 border border-green-200 rounded-lg p-4 text-center">
        <div class="text-2xl font-bold text-green-600 mb-1">${data.revenue ?? "N/A"}</div>
        <div class="text-sm text-gray-600">Revenue</div>
      </div>
      <div class="bg-blue-50 border border-blue-200 rounded-lg p-4 text-center">
        <div class="text-2xl font-bold text-blue-600 mb-1">${data.net_income ?? "N/A"}</div>
        <div class="text-sm text-gray-600">Net Income</div>
      </div>
      <div class="bg-orange-50 border border-orange-200 rounded-lg p-4 text-center">
        <div class="text-2xl font-bold text-orange-600 mb-1">${data.total_assets ?? "N/A"}</div>
        <div class="text-sm text-gray-600">Total Assets</div>
      </div>
      <div class="bg-purple-50 border border-purple-200 rounded-lg p-4 text-center">
        <div class="text-2xl font-bold text-purple-600 mb-1">${data.cash_flow ?? "N/A"}</div>
        <div class="text-sm text-gray-600">Cash Flow</div>
      </div>
    `;

    // Qualitative Insights
    const qual = document.getElementById("qualitative");
    qual.innerHTML = `
      <div class="mb-4">
        <span class="text-gray-700 font-medium">Team Strength</span>
        <p class="text-gray-600 text-sm">${data.team_strength ?? "No data"}</p>
      </div>
      <div class="mb-4">
        <span class="text-gray-700 font-medium">Market Position</span>
        <p class="text-gray-600 text-sm">${data.market_position ?? "No data"}</p>
      </div>
      <div class="mb-4">
        <span class="text-gray-700 font-medium">Brand Reputation</span>
        <p class="text-gray-600 text-sm">${data.brand_reputation ?? "No data"}</p>
      </div>
    `;

    // Risk & Reward
    const rr = document.getElementById("riskReward");
    const riskScore = data.risk_score ?? 2.5;
    const rewardScore = data.reward_score ?? 3.0;
    rr.innerHTML = `
      <div>
        <div class="flex justify-between text-sm mb-2">
          <p class="text-gray-700 font-medium">Risk Score</p>
          <p class="font-semibold text-gray-900">${riskScore}/5</p>
        </div>
        <div class="w-full bg-gray-200 rounded-full h-2">
          <div class="bg-red-500 h-2 rounded-full" style="width:${(riskScore / 5) * 100}%"></div>
        </div>
      </div>
      <div>
        <div class="flex justify-between text-sm mb-2">
          <p class="text-gray-700 font-medium">Reward Potential</p>
          <p class="font-semibold text-gray-900">${rewardScore}/5</p>
        </div>
        <div class="w-full bg-gray-200 rounded-full h-2">
          <div class="bg-blue-500 h-2 rounded-full" style="width:${(rewardScore / 5) * 100}%"></div>
        </div>
      </div>
    `;

    // Data Confidence
    const dc = document.getElementById("dataConfidence");
    dc.innerHTML = `
      <div class="inline-flex items-center justify-center w-24 h-24 bg-blue-100 rounded-full mb-3">
        <span class="text-lg font-bold text-blue-600 px-2 text-center leading-tight">${data.data_source_confidence ?? "N/A"}</span>
      </div>
      <p class="text-sm text-gray-600">
        Confidence Level: <strong>${data.data_source_confidence ?? "Unknown"}</strong>
      </p>
    `;

    // Watchlist Button
    const watchBtn = document.getElementById("watchlistBtn");
    const isInWatchlist = data.is_in_watchlist ?? false;
    if (isInWatchlist) {
      watchBtn.innerHTML = `
        <svg class="w-5 h-5 mr-2" fill="currentColor" viewBox="0 0 20 20">
          <path fill-rule="evenodd" d="M16.707 5.293a1 1 0 010 1.414l-8 8a1 1 0 01-1.414 0l-4-4a1 1 0 011.414-1.414L8 12.586l7.293-7.293a1 1 0 011.414 0z" clip-rule="evenodd"></path>
        </svg>
        ✓ In Your Watchlist
      `;
      watchBtn.className =
        "w-full bg-gray-500 hover:bg-gray-600 text-white font-medium py-3 px-4 rounded-lg flex items-center justify-center";
      watchBtn.onclick = () => modifyWatchlist("remove");
    } else {
      watchBtn.innerHTML = `
        <svg class="w-5 h-5 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6v6m0 0v6m0-6h6m-6 0H6"></path>
        </svg>
        Add to Watchlist
      `;
      watchBtn.className =
        "w-full bg-red-400 hover:bg-red-500 text-white font-medium py-3 px-4 rounded-lg flex items-center justify-center";
      watchBtn.onclick = () => modifyWatchlist("add");
    }

    document.getElementById("downloadPdf").href = `/download_company_profile_pdf/${data.id}/`;
    document.getElementById("investBtn").href = `/investment_simulation_with_startup/${data.id}/`;
  }

  async function modifyWatchlist(action) {
    await fetch(`/api/watchlist/${action}/${id}/`, {
      method: "POST",
      headers: { Authorization: `Token ${token}` },
    });
    loadCompany();
  }

  document.addEventListener("DOMContentLoaded", loadCompany);
  </script>
</body>
</html>
