<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="page-title">Company Profile</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'coral': '#e57373',
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-gray-50 min-h-screen">
    <div class="max-w-6xl mx-auto p-6">
        <!-- Messages -->
        <div id="alertBox" class="fixed top-6 right-6 z-50 space-y-4"></div>

        <!-- Header -->
        <div class="flex items-center justify-between mb-8">
            <div class="flex items-center">
                <a href="/dashboard.html" class="mr-6 p-2 hover:bg-gray-100 rounded-full">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path>
                    </svg>
                </a>

                <div class="flex items-center">
                    <div class="w-12 h-12 bg-gradient-to-br from-orange-400 to-red-500 rounded-lg flex items-center justify-center mr-4">
                    <div class="w-8 h-8 bg-gradient-to-br from-orange-300 to-red-400 rounded"></div>
                    </div>
                    <div>
                    <h1 id="startup-name" class="text-2xl font-bold text-gray-900">Loading...</h1>
                    <span id="startup-industry" class="bg-blue-100 text-blue-700 text-sm font-medium px-3 py-1 rounded-full">
                        Loading...
                    </span>
                    </div>
                </div>
            </div>
            
            <!-- Dynamic Risk Level Badge -->
            <span id="risk-badge" class="text-sm font-medium px-3 py-1 rounded-full">Loading...</span>
        </div>

        <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
            <!-- Left Column -->
            <div class="lg:col-span-2 space-y-6">

                <!-- Company Summary -->
                <div class="bg-white rounded-lg p-6 shadow-sm">
                    <h2 class="text-xl font-semibold text-gray-900 mb-4">Company Summary</h2>
                    <p id="company-description" class="text-gray-700 leading-relaxed mb-6">Loading...</p>
                </div>

                <!-- Financial Metrics -->
                <div class="bg-white rounded-lg p-6 shadow-sm">
                    <div class="flex items-center mb-6">
                    <svg class="w-5 h-5 text-green-600 mr-2" fill="currentColor" viewBox="0 0 20 20">
                        <path d="M4 4a2 2 0 00-2 2v4a2 2 0 002 2V6h10a2 2 0 00-2-2H4zm2 6a2 2 0 012-2h8a2 2 0 012 2v4a2 2 0 01-2 2H8a2 2 0 01-2-2v-4zm6 4a2 2 0 100-4 2 2 0 000 4z"></path>
                    </svg>
                    <h2 class="text-xl font-semibold text-gray-900">Financial Metrics</h2>
                    </div>

                    <div class="grid grid-cols-2 gap-4">
                        <div class="metric-card bg-green-50 border-green-200 text-green-600" id="revenue-card"></div>
                        <div class="metric-card bg-blue-50 border-blue-200 text-blue-600" id="net-income-card"></div>
                        <div class="metric-card bg-orange-50 border-orange-200 text-orange-600" id="total-assets-card"></div>
                        <div class="metric-card bg-purple-50 border-purple-200 text-purple-600" id="cash-flow-card"></div>
                    </div>
                </div>

                <!-- Qualitative Insights -->
                <div class="bg-white rounded-lg p-6 shadow-sm">
                    <h2 class="text-xl font-semibold text-gray-900 mb-6">Qualitative Insights</h2>

                    <div class="mb-4">
                        <div class="flex justify-between items-center mb-2">
                            <span class="text-gray-700 font-medium">Team Strength</span>
                        </div>
                        <p id="team-strength" class="text-gray-600 text-sm">Loading...</p>
                    </div>

                    <div class="mb-4">
                        <div class="flex justify-between items-center mb-2">
                            <span class="text-gray-700 font-medium">Market Position</span>
                        </div>
                    <p id="market-position" class="text-gray-600 text-sm">Loading...</p>
                    </div>

                    <div class="mb-4">
                        <div class="flex justify-between items-center mb-2">
                            <span class="text-gray-700 font-medium">Brand Reputation</span>
                        </div>
                    <p id="brand-reputation" class="text-gray-600 text-sm">Loading...</p>
                    </div>
                </div>
            </div>

            <!-- Right Column -->
            <div class="space-y-6">

                <!-- Risk & Reward -->
                <div class="bg-white rounded-lg p-6 shadow-sm">
                    <div class="flex items-center mb-4">
                        <svg class="w-5 h-5 text-orange-600 mr-2" fill="currentColor" viewBox="0 0 20 20">
                            <path fill-rule="evenodd" d="..." clip-rule="evenodd"></path>
                        </svg>
                        <h2 class="text-xl font-semibold text-gray-900">Risk & Reward</h2>
                    </div>
                    <div class="space-y-4">
                    <div>
                        <div class="flex justify-between text-sm mb-2">
                            <p class="text-gray-700 font-medium">Risk Score</p>
                            <p id="risk-score" class="font-semibold text-gray-900">—</p>
                        </div>
                        <div class="w-full bg-gray-200 rounded-full h-2">
                            <div id="risk-bar" class="bg-red-500 h-2 rounded-full" style="width: 0%"></div>
                        </div>
                    </div>
                    <div>
                        <div class="flex justify-between text-sm mb-2">
                            <p class="text-gray-700 font-medium">Reward Potential</p>
                            <p id="reward-score" class="font-semibold text-gray-900">—</p>
                        </div>
                        <div class="w-full bg-gray-200 rounded-full h-2">
                            <div id="reward-bar" class="bg-blue-500 h-2 rounded-full" style="width: 0%"></div>
                        </div>
                    </div>
                    </div>
                </div>

                <!-- Data Confidence -->
                <div class="bg-white rounded-lg p-6 shadow-sm">
                    <div class="flex items-center mb-4">
                    <svg class="w-5 h-5 text-blue-600 mr-2" fill="currentColor" viewBox="0 0 20 20">
                        <path fill-rule="evenodd" d="..." clip-rule="evenodd"></path>
                    </svg>
                    <h2 class="text-xl font-semibold text-gray-900">Data Confidence</h2>
                    </div>
                    <div class="text-center mb-4">
                    <div class="inline-flex items-center justify-center w-24 h-24 bg-blue-100 rounded-full mb-3">
                        <span id="confidence-badge" class="text-lg font-bold text-blue-600 px-2 text-center leading-tight">—</span>
                    </div>
                    <p class="text-sm text-gray-600">
                        Confidence Level: <strong id="confidence-label">—</strong>
                    </p>
                    </div>
                </div>
                <!-- Action Buttons -->
                <div class="space-y-3" id="action-buttons"></div>
            </div>
        </div>
    </div>
</body>
</html>
