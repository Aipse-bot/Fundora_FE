<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Company Name</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f8fafc;
        }
    </style>
</head>
<body class="bg-gray-50 text-black min-h-screen">
    <!-- Include Module 3 Header -->
    <header class="bg-white shadow-sm border-b border-gray-200 sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between items-center h-16">
            
            <!-- Left side - Fundora logo/title -->
            <div class="flex items-center">
                <a href="/index.html" class="text-2xl font-bold text-blue-600 hover:text-blue-700 transition-colors duration-200">
                Fundora
                </a>
            </div>

            <!-- Right side - Welcome message and logout -->
            <div id="header-user" class="flex items-center space-x-4"></div>

            </div>
        </div>
    <script>
        function renderHeaderUser(user) {
            const container = document.getElementById('header-user');
            container.innerHTML = '';

            if (!user || !user.name) return;

            container.innerHTML = `
                <span class="text-gray-700 text-sm">
                Welcome, <span class="font-medium">${user.name}</span>
                </span>
                <a href="/logout.html"
                class="inline-flex items-center px-3 py-2 border border-transparent text-sm leading-4 font-medium rounded-md text-gray-500 hover:text-gray-700 hover:bg-gray-100 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500 transition-colors duration-200">
                Logout
                </a>
            `;
        }
    </script>
    </header>

    <!-- Full page layout instead of modal -->
    <div class="py-0">
        <div class="max-w-screen-xl mx-auto space-y-8 p-4 sm:p-6 lg:p-8">

            <!-- Header -->
            <div class="bg-blue-600 text-white px-4 sm:px-6 py-4 sm:py-6 flex flex-col sm:flex-row items-start sm:items-center justify-between gap-4 rounded-lg">
                <div class="flex items-center space-x-4">
                    <div id="deck-initial" class="bg-white text-blue-600 font-bold w-10 h-10 flex items-center justify-center text-xl">L</div>
                    <div>
                    <h1 id="deck-name" class="text-2xl sm:text-3xl font-semibold">Loading...</h1>
                    <p id="deck-tagline" class="text-lg sm:text-xl text-blue-100">Loading...</p>
                    </div>
                </div>
                <div id="deck-nav" class="flex flex-col sm:flex-row gap-2 sm:gap-3"></div>
            </div>

            <!-- Main Layout with Sidebar -->
            <div class="flex flex-col lg:flex-row gap-6">
                <!-- Main Content -->
                <div class="flex-1 space-y-6">
                    <!-- Problem & Solution -->
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                        <div class="px-4 py-6 bg-white border rounded">
                        <h2 class="text-xl font-bold text-black mb-2">The Problem</h2>
                        <div class="w-full h-1 bg-blue-500 mb-4"></div>
                        <p id="problem-description" class="text-gray-500 text-lg">—</p>
                        </div>
                        <div class="px-4 py-6 bg-white border rounded">
                        <h2 class="text-xl font-bold text-black mb-2">The Solution</h2>
                        <div class="w-full h-1 bg-blue-500 mb-4"></div>
                        <p id="solution-description" class="text-gray-500 text-lg">—</p>
                        </div>
                    </div>

                    <!-- Market & Financials -->
                    <section class="grid grid-cols-1 md:grid-cols-2 gap-6">
                        <!-- Market Analysis -->
                        <div class="bg-white p-4 sm:p-6 rounded shadow text-left">
                            <h2 class="text-xl font-bold text-gray-800 mb-4 text-center">Market Analysis</h2>
                            <div class="space-y-3">
                                <div class="flex justify-between">
                                    <span class="text-gray-600 font-medium">Primary Market:</span>
                                    <span id="primary-market" class="text-gray-900 font-semibold">—</span>
                                </div>
                                <div class="flex justify-between">
                                    <span class="text-gray-600 font-medium">Target Audience:</span>
                                    <span id="target-audience" class="text-gray-900 font-semibold">—</span>
                                </div>
                                <div class="flex justify-between">
                                    <span class="text-gray-600 font-medium">Market Growth (YOY):</span>
                                    <span id="market-growth" class="text-green-600 font-semibold">—</span>
                                </div>
                                <div class="mt-4">
                                    <span class="text-gray-600 font-medium">Our Advantage:</span>
                                    <p id="competitive-advantage" class="text-blue-600 mt-1">—</p>
                                </div>
                            </div>
                        </div>

                        <!-- Financial Projections -->
                        <div class="bg-white p-4 sm:p-6 rounded shadow">
                            <h2 class="text-xl font-bold text-gray-800 mb-4 text-center">Financial Projection</h2>
                            <div id="financial-table-container" class="overflow-x-auto mb-4"></div>
                            <div class="mt-4">
                                <h3 class="text-lg font-semibold text-gray-800 mb-2 text-center">Revenue & Profit Chart</h3>
                                <canvas id="revenueProfitChart" class="w-full h-64"></canvas>
                            </div>
                        </div>
                    </section>
                    <!-- The Ask -->
                    <div class="px-4 py-6 bg-white border rounded text-center">
                        <h2 class="text-xl font-bold text-black mb-4">THE ASK</h2>
                        <div id="ask-section" class="space-y-3">
                        <p class="text-gray-500">No funding information available</p>
                        </div>
                    </div>
                </div>

                <!-- Sidebar Actions -->
                <div class="w-full lg:w-80 space-y-6">
                <!-- Actions -->
                    <div class="px-4 py-6 bg-white border rounded">
                        <h2 class="text-xl font-bold text-black mb-4">Actions</h2>
                        <div id="actions-panel" class="space-y-3"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    </div>
    </div>

</body>
</html>
