<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pitch Deck Profile</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: {
              50: '#eff6ff',
              100: '#dbeafe',
              200: '#bfdbfe',
              300: '#93c5fd',
              400: '#60a5fa',
              500: '#3b82f6',
              600: '#2563eb',
              700: '#1d4ed8',
              800: '#1e40af',
              900: '#1e3a8a'
            },
            accent: {
              50: '#ecfdf5',
              100: '#d1fae5',
              200: '#a7f3d0',
              300: '#6ee7b7',
              400: '#34d399',
              500: '#10b981',
              600: '#059669',
              700: '#047857',
              800: '#065f46',
              900: '#064e3b'
            }
          },
          fontFamily: { 'sans': ['Inter', 'system-ui', 'sans-serif'] }
        }
      }
    };
  </script>
  <style>
    body { font-family: 'Inter', sans-serif; }
    .hero-gradient { background: linear-gradient(135deg, #0f172a 0%, #1e293b 50%, #0f172a 100%); }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
    .fade-in { animation: fadeIn 0.5s ease-out; }
    .delay-1 { animation-delay: 0.1s; }
    .delay-2 { animation-delay: 0.2s; }
    .delay-3 { animation-delay: 0.3s; }
  </style>
</head>
<body class="bg-slate-950 text-white min-h-screen hero-gradient">
  <div class="max-w-7xl mx-auto p-6">
    <!-- Header -->
    <div class="flex items-center justify-between mb-8 fade-in">
      <div class="flex items-center">
        <button id="backBtn" class="mr-6 p-2.5 hover:bg-slate-800/50 rounded-lg transition-all border border-slate-700">
          <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path>
          </svg>
        </button>
        <div>
          <h1 id="deck-name" class="text-3xl font-bold mb-2">Loading...</h1>
          <p id="deck-tagline" class="text-lg text-gray-400">Loading...</p>
        </div>
      </div>
    </div>

    <div class="grid grid-cols-1 lg:grid-cols-4 gap-6">
      <!-- Left Column - Main Content -->
      <div class="lg:col-span-3 space-y-6">
        <!-- Problem & Solution -->
        <div class="grid grid-cols-1 md:grid-cols-2 gap-6 fade-in delay-1">
          <div class="bg-slate-900/50 backdrop-blur-xl border border-slate-800 rounded-2xl p-6">
            <h2 class="text-xl font-semibold mb-4">The Problem</h2>
            <p id="problem-description" class="text-gray-300 leading-relaxed text-sm">—</p>
          </div>
          <div class="bg-slate-900/50 backdrop-blur-xl border border-slate-800 rounded-2xl p-6">
            <h2 class="text-xl font-semibold mb-4">The Solution</h2>
            <p id="solution-description" class="text-gray-300 leading-relaxed text-sm">—</p>
          </div>
        </div>

        <!-- Market Analysis -->
        <div class="bg-slate-900/50 backdrop-blur-xl border border-slate-800 rounded-2xl p-6 fade-in delay-2">
          <div class="flex items-center mb-6">
            <div class="w-10 h-10 bg-brand-500/20 rounded-lg flex items-center justify-center mr-3">
              <svg class="w-5 h-5 text-brand-400" fill="currentColor" viewBox="0 0 20 20">
                <path d="M2 11a1 1 0 011-1h2a1 1 0 011 1v5a1 1 0 01-1 1H3a1 1 0 01-1-1v-5zM8 7a1 1 0 011-1h2a1 1 0 011 1v9a1 1 0 01-1 1H9a1 1 0 01-1-1V7zM14 4a1 1 0 011-1h2a1 1 0 011 1v12a1 1 0 01-1 1h-2a1 1 0 01-1-1V4z"></path>
              </svg>
            </div>
            <h2 class="text-xl font-semibold">Market Analysis</h2>
          </div>
          <div class="grid grid-cols-2 gap-4">
            <div class="bg-brand-500/10 border border-brand-500/30 rounded-lg p-4">
              <div class="text-xs text-gray-400 mb-1">Primary Market</div>
              <div id="primary-market" class="text-base font-semibold text-brand-400">—</div>
            </div>
            <div class="bg-accent-500/10 border border-accent-500/30 rounded-lg p-4">
              <div class="text-xs text-gray-400 mb-1">Target Audience</div>
              <div id="target-audience" class="text-base font-semibold text-accent-400">—</div>
            </div>
            <div class="bg-orange-500/10 border border-orange-500/30 rounded-lg p-4">
              <div class="text-xs text-gray-400 mb-1">Market Growth (YOY)</div>
              <div id="market-growth" class="text-base font-semibold text-orange-400">—</div>
            </div>
            <div class="bg-purple-500/10 border border-purple-500/30 rounded-lg p-4">
              <div class="text-xs text-gray-400 mb-1">Competitive Advantage</div>
              <div id="competitive-advantage" class="text-base font-semibold text-purple-400 line-clamp-2">—</div>
            </div>
          </div>
        </div>

        <!-- Financial Projections -->
        <div class="bg-slate-900/50 backdrop-blur-xl border border-slate-800 rounded-2xl p-6 fade-in delay-2">
          <div class="flex items-center mb-6">
            <div class="w-10 h-10 bg-accent-500/20 rounded-lg flex items-center justify-center mr-3">
              <svg class="w-5 h-5 text-accent-400" fill="currentColor" viewBox="0 0 20 20">
                <path d="M4 4a2 2 0 00-2 2v4a2 2 0 002 2V6h10a2 2 0 00-2-2H4zm2 6a2 2 0 012-2h8a2 2 0 012 2v4a2 2 0 01-2 2H8a2 2 0 01-2-2v-4zm6 4a2 2 0 100-4 2 2 0 000 4z"></path>
              </svg>
            </div>
            <h2 class="text-xl font-semibold">Financial Projections</h2>
          </div>
          <div id="financial-table-container" class="mb-6"></div>
          <div class="mt-6 h-[250px]">
            <canvas id="revenueProfitChart" class="w-full h-full"></canvas>
          </div>
        </div>
      </div>

      <!-- Right Column - Sidebar -->
      <div class="space-y-6">
        <!-- Action Buttons -->
        <div class="bg-slate-900/50 backdrop-blur-xl border border-slate-800 rounded-2xl p-6 fade-in delay-1">
          <h2 class="text-lg font-semibold mb-4">Actions</h2>
          <div class="space-y-3">
            <button id="watchlistBtn" class="w-full font-semibold py-3 px-4 rounded-lg transition-all duration-200 flex items-center justify-center text-sm" disabled>
              <svg class="w-4 h-4 mr-2 animate-spin" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
              </svg>
              Loading...
            </button>
            <a id="investBtn" class="w-full bg-brand-600 hover:bg-brand-700 text-white font-semibold py-3 px-4 rounded-lg transition-all duration-200 text-center block text-sm">
              Invest
            </a>
          </div>
        </div>

        <!-- The Ask -->
        <div class="bg-slate-900/50 backdrop-blur-xl border border-slate-800 rounded-2xl p-6 fade-in delay-3">
          <h2 class="text-lg font-semibold mb-4">The Ask</h2>
          <div id="ask-section" class="space-y-3">
            <p class="text-gray-400 text-sm">No funding information available</p>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    const token = sessionStorage.getItem("authToken") || localStorage.getItem("authToken");
    const params = new URLSearchParams(window.location.search);
    const startupId = params.get("id");
    const returnUrl = params.get("return");
    
    let watchlistIdsSet = new Set();
    let currentWatchlistState = false;

    function authHeaders() {
      const h = { 'Content-Type': 'application/json' };
      if (token) h['Authorization'] = `Bearer ${token}`;
      return h;
    }

    async function fetchJSON(url, opts = {}) {
      const merged = Object.assign({ headers: authHeaders() }, opts);
      const res = await fetch(url, merged);
      if (!res.ok) {
        const text = await res.text().catch(() => '');
        const err = new Error(`API request failed: ${res.status} ${res.statusText} ${text}`);
        err.status = res.status;
        throw err;
      }
      return res.json();
    }

    async function tryFetchJSON(url) {
      try {
        return await fetchJSON(url);
      } catch (err) {
        console.warn(`fetch failed for ${url}:`, err.message || err);
        return null;
      }
    }

    async function refreshWatchlist() {
      try {
        const data = await tryFetchJSON('https://fundora-be-singapore.onrender.com/api/investor/watchlist/');
        if (data) {
          const items = data.results || data.watchlist || [];
          watchlistIdsSet = new Set(items.map(it => it.id));
          console.log('Watchlist refreshed, IDs:', Array.from(watchlistIdsSet));
        }
      } catch (err) {
        console.warn('Could not refresh watchlist:', err);
      }
    }

    function populateHeaderFromStartup(startup) {
      const initial = (startup.company_name || "—").charAt(0).toUpperCase() || "L";
      document.title = startup.company_name || "Company Profile";
      document.getElementById("deck-name").textContent = startup.company_name || "—";
      document.getElementById("deck-tagline").textContent = startup.company_description || "—";
    }

    function populateAsk(ask) {
      const askSection = document.getElementById("ask-section");
      if (!ask) {
        askSection.innerHTML = `<p class="text-gray-400 text-sm">No funding information available</p>`;
        return;
      }
      const amt = (ask.amount != null && !isNaN(Number(ask.amount))) ? `₱${Number(ask.amount).toLocaleString()}` : (ask.amount || "—");
      askSection.innerHTML = `
        <div class="bg-brand-500/10 border border-brand-500/30 rounded-lg p-4">
          <div class="text-xs text-gray-400 mb-1">Funding Goal</div>
          <div class="text-xl font-bold text-brand-400 mb-3">${amt}</div>
          <div class="text-xs text-gray-400 mb-1">Use of Funds</div>
          <p class="text-gray-300 text-sm">${ask.usage_description || "—"}</p>
        </div>
      `;
    }

    function populateMarket(market) {
      document.getElementById("primary-market").textContent = market?.primary_market || "—";
      document.getElementById("target-audience").textContent = market?.target_audience || "—";
      const growth = market?.market_growth_rate ?? market?.market_growth ?? "—";
      document.getElementById("market-growth").textContent = growth !== null ? String(growth) : "—";
      document.getElementById("competitive-advantage").textContent = market?.competitive_advantage || "—";
    }

    function populateProblemSolution(problemObj, solutionObj) {
      const problemText = problemObj?.description ?? (typeof problemObj === 'string' ? problemObj : null);
      const solutionText = solutionObj?.description ?? (typeof solutionObj === 'string' ? solutionObj : null);
      document.getElementById("problem-description").textContent = problemText || "—";
      document.getElementById("solution-description").textContent = solutionText || "—";
    }

    function updateWatchlistButton(inWatchlist) {
      const watchBtn = document.getElementById("watchlistBtn");
      if (!watchBtn) return;
      
      watchBtn.disabled = false;
      currentWatchlistState = inWatchlist;

      if (inWatchlist) {
        watchBtn.innerHTML = `
          <svg class="w-4 h-4 mr-2 inline" fill="currentColor" viewBox="0 0 24 24">
            <path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 6 4 4 6.5 4c1.54 0 3.04.99 3.57 2.36h.87C13.46 4.99 14.96 4 16.5 4 19 4 21 6 21 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/>
          </svg>
          In Watchlist
        `;
        watchBtn.className = "w-full bg-slate-800/50 hover:bg-slate-700/50 text-white font-semibold py-3 px-4 rounded-lg flex items-center justify-center transition-all duration-200 border border-slate-700 text-sm";
        watchBtn.onclick = () => toggleWatchlist(false);
      } else {
        watchBtn.innerHTML = `
          <svg class="w-4 h-4 mr-2 inline" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4.318 6.318a4.5 4.5 0 000 6.364L12 20.364l7.682-7.682a4.5 4.5 0 00-6.364-6.364L12 7.636l-1.318-1.318a4.5 4.5 0 00-6.364 0z"/>
          </svg>
          Add to Watchlist
        `;
        watchBtn.className = "w-full bg-red-600 hover:bg-red-700 text-white font-semibold py-3 px-4 rounded-lg flex items-center justify-center transition-all duration-200 text-sm";
        watchBtn.onclick = () => toggleWatchlist(true);
      }
    }

    async function toggleWatchlist(shouldAdd) {
      const watchBtn = document.getElementById("watchlistBtn");
      if (!watchBtn) return;
      
      watchBtn.disabled = true;
      
      const originalHTML = watchBtn.innerHTML;
      watchBtn.innerHTML = `
        <svg class="w-4 h-4 mr-2 inline animate-spin" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
          <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
        </svg>
        Updating...
      `;

      try {
        const action = shouldAdd ? 'add' : 'remove';
        const method = shouldAdd ? 'POST' : 'DELETE';
        
        console.log(`Attempting to ${action} startup ${startupId} to watchlist...`);
        
        const res = await fetch(`https://fundora-be-singapore.onrender.com/api/investor/watchlist/${action}/${startupId}/`, {
          method: method,
          headers: authHeaders()
        });
        
        console.log('Response status:', res.status);
        
        if (!res.ok) {
          const errorText = await res.text();
          console.error('Response error:', errorText);
          throw new Error(`Failed to ${action} watchlist: ${res.status} ${errorText}`);
        }

        const result = await res.json();
        console.log('Watchlist response:', result);
        
        if (shouldAdd) {
          watchlistIdsSet.add(Number(startupId));
        } else {
          watchlistIdsSet.delete(Number(startupId));
        }
        currentWatchlistState = shouldAdd;
        
        showNotification(result.message || `Watchlist ${shouldAdd ? 'added' : 'removed'} successfully`, 'success');
        
        updateWatchlistButton(shouldAdd);
        
      } catch (err) {
        console.error('Watchlist toggle failed:', err);
        showNotification(err.message || 'Failed to update watchlist. Please try again.', 'error');
        
        watchBtn.innerHTML = originalHTML;
        watchBtn.disabled = false;
      }
    }

    function showNotification(message, type) {
      const div = document.createElement('div');
      div.className = `fixed top-4 right-4 z-50 p-4 rounded-lg shadow-2xl font-medium ${type === 'success' ? 'bg-accent-600' : 'bg-red-600'} text-white`;
      div.textContent = message;
      div.style.opacity = '0';
      document.body.appendChild(div);
      setTimeout(() => div.style.opacity = '1', 10);
      setTimeout(() => {
        div.style.opacity = '0';
        setTimeout(() => div.remove(), 300);
      }, 3000);
    }

    function renderFinancialTable(financials) {
      const container = document.getElementById("financial-table-container");
      if (!financials || financials.length === 0) {
        container.innerHTML = "<p class='text-gray-400 text-center text-sm'>No financial data available.</p>";
        return;
      }

      const parsed = financials.map(f => ({
        year: f.year,
        revenue: Number(f.revenue) || 0,
        profit: Number(f.profit) || 0
      })).sort((a,b) => (Number(a.year) || 0) - (Number(b.year) || 0));

      const rows = parsed.map(f => `
        <tr class="border-b border-slate-800">
          <td class="py-2 px-3 text-gray-300 text-sm">${f.year}</td>
          <td class="py-2 px-3 text-brand-400 font-semibold text-sm">₱${f.revenue.toLocaleString()}</td>
          <td class="py-2 px-3 text-accent-400 font-semibold text-sm">₱${f.profit.toLocaleString()}</td>
        </tr>
      `).join('');

      container.innerHTML = `
        <div class="overflow-x-auto">
          <table class="min-w-full text-sm">
            <thead class="bg-slate-800/50 font-semibold text-gray-300">
              <tr>
                <th class="py-2 px-3 text-left rounded-tl-lg text-xs">Year</th>
                <th class="py-2 px-3 text-left text-xs">Revenue</th>
                <th class="py-2 px-3 text-left rounded-tr-lg text-xs">Profit</th>
              </tr>
            </thead>
            <tbody>${rows}</tbody>
          </table>
        </div>
      `;

      const ctxEl = document.getElementById("revenueProfitChart");
      if (!ctxEl) return;
      const ctx = ctxEl.getContext("2d");
      if (window._revenueProfitChart) {
        try { window._revenueProfitChart.destroy(); } catch(e){/*ignore*/ }
        window._revenueProfitChart = null;
      }

      window._revenueProfitChart = new Chart(ctx, {
        type: "bar",
        data: {
          labels: parsed.map(p => p.year),
          datasets: [
            { label: "Revenue", data: parsed.map(p => p.revenue), backgroundColor: "#3b82f6" },
            { label: "Profit", data: parsed.map(p => p.profit), backgroundColor: "#10b981" }
          ]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          plugins: {
            legend: {
              labels: { color: '#fff', font: { size: 11 } }
            }
          },
          scales: {
            x: {
              ticks: { color: '#9ca3af', font: { size: 10 } },
              grid: { color: 'rgba(148, 163, 184, 0.1)' }
            },
            y: {
              beginAtZero: true,
              ticks: {
                color: '#9ca3af',
                font: { size: 10 },
                callback: v => "₱" + Number(v).toLocaleString()
              },
              grid: { color: 'rgba(148, 163, 184, 0.1)' }
            }
          }
        }
      });
    }

    async function loadDeckReport(startupIdParam) {
      return tryFetchJSON(`https://fundora-be-singapore.onrender.com/api/startups/${startupIdParam}/profile/`);
    }

    async function loadStartupProfile(startupIdParam) {
      return tryFetchJSON(`https://fundora-be-singapore.onrender.com/api/startups/${startupIdParam}/profile/`);
    }

    async function loadAllData() {
      if (!startupId) {
        alert('Missing startup id');
        return;
      }

      await refreshWatchlist();

      let report = await loadDeckReport(startupId);
      if (report && report.report_type === 'deck') {
        const deckInfo = report.deck_info || {};
        const problem = report.problem || null;
        const solution = report.solution || null;
        const market = report.market_analysis || null;
        const ask = report.ask || null;
        const financials = report.financials || [];

        populateHeaderFromStartup({ company_name: deckInfo.company_name, company_description: deckInfo.tagline });
        populateProblemSolution(problem, solution);
        populateMarket(market);
        populateAsk(ask);
        renderFinancialTable(financials);
        
        const inWatchlist = watchlistIdsSet.has(Number(startupId));
        currentWatchlistState = inWatchlist;
        updateWatchlistButton(inWatchlist);
        
        const investBtn = document.getElementById("investBtn");
        const currentPath = window.location.pathname + window.location.search;
        investBtn.href = `../Module_2/Investment_Simulation.html?startup_id=${startupId}&return=${encodeURIComponent(currentPath)}`;
        return;
      }

      const profile = await loadStartupProfile(startupId);
      if (!profile) {
        console.warn('No profile or deck report available for startup', startupId);
        const fallback = await tryFetchJSON(`https://fundora-be-singapore.onrender.com/api/startups/${startupId}/`);
        if (fallback) {
          populateHeaderFromStartup(fallback);
          const inWatchlist = watchlistIdsSet.has(Number(startupId));
          currentWatchlistState = inWatchlist;
          updateWatchlistButton(inWatchlist);
        } else {
          document.getElementById("deck-name").textContent = "Startup not found";
        }
        renderFinancialTable([]);
        populateProblemSolution(null, null);
        populateMarket(null);
        populateAsk(null);
        return;
      }

      const data = profile;
      const startupObj = data.startup || data;
      const deckObj = data.deck || null;

      populateHeaderFromStartup({
        company_name: startupObj.company_name || startupObj.company_name,
        company_description: startupObj.company_description || startupObj.company_description
      });

      if (deckObj) {
        populateProblemSolution(deckObj.problem, deckObj.solution);
        populateMarket(deckObj.market_analysis || {});
        populateAsk(deckObj.ask || {});
        renderFinancialTable(deckObj.financials || []);
      } else {
        populateProblemSolution(data.problem, data.solution);
        populateMarket({
          primary_market: data.primary_market,
          target_audience: data.target_audience,
          market_growth_rate: data.market_growth,
          competitive_advantage: data.competitive_advantage
        });
        populateAsk({
          amount: data.funding_goal ?? data.funding_ask ?? data.funding_goal,
          usage_description: data.use_of_funds ?? data.usage_description ?? data.usage
        });
        renderFinancialTable(data.financials || []);
      }

      const inWatchlist = watchlistIdsSet.has(Number(startupId));
      currentWatchlistState = inWatchlist;
      updateWatchlistButton(inWatchlist);
      
      const investBtn = document.getElementById("investBtn");
      const currentPath = window.location.pathname + window.location.search;
      investBtn.href = `../Module_2/Investment_Simulation.html?startup_id=${startupId}&return=${encodeURIComponent(currentPath)}`;
    }

    document.getElementById('backBtn').addEventListener('click', () => {
      if (returnUrl) {
        window.location.href = returnUrl;
      } else {
        window.location.href = '../Module_1/Dashboard.html';
      }
    });

    document.addEventListener("DOMContentLoaded", async () => {
      if (!token) {
        console.warn('No auth token present — page will try to load public data where available.');
      }

      await loadAllData();
    });
  </script>
</body>
</html>
