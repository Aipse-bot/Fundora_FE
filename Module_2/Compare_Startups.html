<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Compare Startups</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: {
              50: '#eff6ff',
              100: '#dbeafe',
              200: '#bfdbfe',
              300: '#93c5fd',
              400: '#60a5fa',
              500: '#3b82f6',
              600: '#2563eb',
              700: '#1d4ed8',
              800: '#1e40af',
              900: '#1e3a8a'
            },
            accent: {
              50: '#ecfdf5',
              100: '#d1fae5',
              200: '#a7f3d0',
              300: '#6ee7b7',
              400: '#34d399',
              500: '#10b981',
              600: '#059669',
              700: '#047857',
              800: '#065f46',
              900: '#064e3b'
            }
          },
          fontFamily: { 'sans': ['Inter', 'system-ui', 'sans-serif'] }
        }
      }
    };
  </script>
  <style>
    body { font-family: 'Inter', sans-serif; }
    .hero-gradient { background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%); }
    
    @keyframes fadeIn { 
      from { opacity: 0; transform: translateY(20px); } 
      to { opacity: 1; transform: translateY(0); } 
    }
    @keyframes slideInLeft { 
      from { opacity: 0; transform: translateX(-25px); } 
      to { opacity: 1; transform: translateX(0); } 
    }
    @keyframes slideInRight { 
      from { opacity: 0; transform: translateX(25px); } 
      to { opacity: 1; transform: translateX(0); } 
    }
    @keyframes scaleIn { 
      from { opacity: 0; transform: scale(0.95); } 
      to { opacity: 1; transform: scale(1); } 
    }

    .fade-in { animation: fadeIn 0.5s ease-out forwards; opacity: 0; }
    .slide-left { animation: slideInLeft 0.5s ease-out forwards; opacity: 0; }
    .slide-right { animation: slideInRight 0.5s ease-out forwards; opacity: 0; }
    .scale-in { animation: scaleIn 0.4s ease-out forwards; opacity: 0; }

    .delay-1 { animation-delay: 0.1s; }
    .delay-2 { animation-delay: 0.2s; }
    .delay-3 { animation-delay: 0.3s; }

    .startup-card { 
      will-change: auto; 
      transition: all 0.3s ease;
    }
    .startup-card:hover { 
      transform: translateY(-4px); 
      box-shadow: 0 8px 16px rgba(0, 0, 0, 0.4);
      border-color: #475569 !important;
    }

    .startup-card, .fade-in { contain: layout style paint; }

    input:focus, select:focus {
      transform: scale(1.01);
    }

    @keyframes pulse-glow {
      0%, 100% { box-shadow: 0 0 0 0 rgba(59, 130, 246, 0.4); }
      50% { box-shadow: 0 0 0 8px rgba(59, 130, 246, 0); }
    }

    .btn-pulse:not(:disabled) {
      animation: pulse-glow 2s infinite;
    }
  </style>
</head>
<body class="bg-slate-950 text-white min-h-screen hero-gradient">
  <div class="max-w-7xl mx-auto p-6">
    <!-- Header -->
    <div class="flex items-center mb-8 slide-left">
      <button id="back-button" class="mr-6 p-2.5 hover:bg-slate-800 rounded-lg transition-colors border border-slate-700">
        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path>
        </svg>
      </button>
      <div>
        <h1 class="text-3xl font-bold mb-2">Compare Startups</h1>
        <p class="text-gray-400">Select 2-3 startups to compare side by side</p>
      </div>
    </div>

    <!-- Filters -->
    <div class="flex flex-col md:flex-row gap-4 mb-8 slide-right delay-1">
      <div class="flex-1 relative">
        <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
          <svg class="h-5 w-5 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path>
          </svg>
        </div>
        <input id="search-input" type="text" placeholder="Search startups..." class="w-full pl-10 pr-4 py-3 bg-slate-900 border border-slate-700 rounded-lg text-white placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-brand-500 focus:border-transparent transition-all">
      </div>

      <div class="relative">
        <select id="industry-filter" class="appearance-none bg-slate-900 border border-slate-700 text-white rounded-lg px-4 py-3 pr-10 focus:outline-none focus:ring-2 focus:ring-brand-500 focus:border-transparent transition-all">
          <option value="">All Industries</option>
          <option value="Technology">Technology</option>
          <option value="Finance">Finance</option>
          <option value="Healthcare">Healthcare</option>
          <option value="E-commerce">E-commerce</option>
          <option value="Education">Education</option>
          <option value="Real Estate">Real Estate</option>
          <option value="Manufacturing">Manufacturing</option>
          <option value="Retail">Retail</option>
          <option value="Food & Beverage">Food & Beverage</option>
          <option value="Transportation">Transportation</option>
          <option value="Energy">Energy</option>
          <option value="Entertainment">Entertainment</option>
          <option value="Agriculture">Agriculture</option>
        </select>
        <div class="absolute inset-y-0 right-0 flex items-center px-2 pointer-events-none">
          <svg class="w-4 h-4 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path>
          </svg>
        </div>
      </div>

      <div class="relative">
        <select id="risk-filter" class="appearance-none bg-slate-900 border border-slate-700 text-white rounded-lg px-4 py-3 pr-10 focus:outline-none focus:ring-2 focus:ring-brand-500 focus:border-transparent transition-all">
          <option value="">All Risk Levels</option>
          <option value="Low">Low Risk</option>
          <option value="Medium">Medium Risk</option>
          <option value="High">High Risk</option>
        </select>
        <div class="absolute inset-y-0 right-0 flex items-center px-2 pointer-events-none">
          <svg class="w-4 h-4 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path>
          </svg>
        </div>
      </div>
    </div>

    <!-- Selection Info -->
    <div class="mb-8 scale-in delay-2">
      <div class="flex justify-between items-center mb-6">
        <h2 class="text-xl font-semibold">Select Startups to Compare (Max 3)</h2>
        <div class="text-sm text-gray-400"><span id="selected-count">0</span> of 3 selected</div>
      </div>

      <div id="selected-startups" class="mb-6 hidden">
        <h3 class="text-lg font-medium mb-3">Selected for Comparison:</h3>
        <div id="selected-list" class="flex flex-wrap gap-2"></div>
      </div>

      <div id="startups-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6"></div>

      <div id="empty-state" class="text-center py-12 hidden">
        <div class="w-16 h-16 bg-slate-800 rounded-full flex items-center justify-center mx-auto mb-4">
          <svg class="w-8 h-8 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z"></path>
          </svg>
        </div>
        <h3 class="text-lg font-medium mb-2">No Startups Found</h3>
        <p class="text-gray-400 mb-4">Try adjusting your filters or search criteria.</p>
      </div>
    </div>

    <!-- Compare Button -->
    <div class="flex justify-center fade-in delay-3">
  <button id="compare-btn" class="bg-slate-700 text-gray-400 font-semibold py-3.5 px-8 rounded-lg transition-all duration-200 cursor-not-allowed transform hover:scale-105 active:scale-95" disabled>
        Select at least 2-3 startups to compare
      </button>
    </div>
  </div>

  <script>
    // const apiBase = "http://127.0.0.1:8000/api";
    const apiBase = "https://fundora-be-singapore.onrender.com/api";
    const RECORD_COMPARISON_ENDPOINT = `${apiBase}/analytics/comparison/`;
    let startups = [];
    let selectedStartups = new Set();
    const maxSelections = 3;
    
    const domCache = {
      backButton: null,
      searchInput: null,
      industryFilter: null,
      riskFilter: null,
      startupsGrid: null,
      emptyState: null,
      selectedCount: null,
      selectedList: null,
      selectedStartups: null,
      compareBtn: null
    };

    function cacheElements() {
      domCache.backButton = document.getElementById("back-button");
      domCache.searchInput = document.getElementById("search-input");
      domCache.industryFilter = document.getElementById("industry-filter");
      domCache.riskFilter = document.getElementById("risk-filter");
      domCache.startupsGrid = document.getElementById("startups-grid");
      domCache.emptyState = document.getElementById("empty-state");
      domCache.selectedCount = document.getElementById("selected-count");
      domCache.selectedList = document.getElementById("selected-list");
      domCache.selectedStartups = document.getElementById("selected-startups");
      domCache.compareBtn = document.getElementById("compare-btn");
    }

    function getAuthToken() {
      return sessionStorage.getItem('authToken');
    }

    function getBackUrl() {
      const params = new URLSearchParams(window.location.search);
      const returnUrl = params.get('return');
      
      if (returnUrl) {
        try {
          const decoded = decodeURIComponent(returnUrl);
          if (decoded.startsWith('http://') || decoded.startsWith('https://')) {
            const url = new URL(decoded);
            return url.pathname + url.search;
          }
          if (decoded.startsWith('/')) {
            return decoded;
          }
          return decoded;
        } catch (e) {
          console.error('Failed to decode return URL:', e);
        }
      }
      return '../Module_1/Dashboard.html';
    }

    document.addEventListener("DOMContentLoaded", () => {
      cacheElements();
      const backUrl = getBackUrl();
      
      domCache.backButton.onclick = (e) => {
        e.preventDefault();
        window.location.href = backUrl;
      };

      const token = getAuthToken();
      if (!token) {
        window.location.href = '/login';
        return;
      }
      loadStartups();
      
      domCache.industryFilter.addEventListener("change", filterStartups, { passive: true });
      domCache.riskFilter.addEventListener("change", filterStartups, { passive: true });
      domCache.searchInput.addEventListener("input", filterStartups, { passive: true });
    });

    async function loadStartups() {
      try {
        const token = getAuthToken();
        if (!token) {
          window.location.href = '/login';
          return;
        }
        const response = await fetch(`${apiBase}/investor/startups/?limit=1000`, {
          headers: {
            "Authorization": `Bearer ${token}`
          }
        });
        if (!response.ok) throw new Error("Failed to fetch startups");
        const data = await response.json();
        let allStartups = data.results || data.startups || data;
        if (!Array.isArray(allStartups)) {
          allStartups = [];
        }
        
        startups = allStartups;
        
        renderStartups(startups);
      } catch (error) {
        console.error("Error loading startups:", error);
        domCache.emptyState.classList.remove("hidden");
      }
    }


    function renderStartups(data) {
      domCache.startupsGrid.innerHTML = "";
      if (!data.length) {
        domCache.emptyState.classList.remove("hidden");
        return;
      }
      domCache.emptyState.classList.add("hidden");

      data.forEach(startup => {
        const card = document.createElement("div");
        const cardIndex = Array.from(domCache.startupsGrid.children).length;
        card.className = "startup-card bg-slate-900 border border-slate-700 rounded-lg p-6 hover:border-slate-600 transition-all cursor-pointer fade-in";
        card.style.animationDelay = `${Math.min(cardIndex * 0.05, 0.5)}s`;
        card.dataset.startupId = startup.id;
        card.dataset.startupName = startup.company_name;
        card.dataset.industry = startup.industry;
        
        const isDeck = !!(startup.is_deck_builder || startup.source_deck_id || startup.source_deck);
        
        let riskBadge;
        if (isDeck) {
          riskBadge = '<span class="bg-yellow-500/20 text-yellow-300 text-xs font-medium px-3 py-1 rounded-full border border-yellow-500/30">Pitch Deck</span>';
        } else if (startup.risk_level) {
          const riskLevel = startup.risk_level.toLowerCase();
          if (riskLevel === 'low') {
            riskBadge = '<span class="bg-accent-500/20 text-accent-300 text-xs font-medium px-3 py-1 rounded-full border border-accent-500/30">Low Risk</span>';
          } else if (riskLevel === 'medium') {
            riskBadge = '<span class="bg-yellow-500/20 text-yellow-300 text-xs font-medium px-3 py-1 rounded-full border border-yellow-500/30">Medium Risk</span>';
          } else {
            riskBadge = '<span class="bg-red-500/20 text-red-300 text-xs font-medium px-3 py-1 rounded-full border border-red-500/30">High Risk</span>';
          }
        } else {
          riskBadge = '<span class="bg-gray-500/20 text-gray-300 text-xs font-medium px-3 py-1 rounded-full border border-gray-500/30">Risk N/A</span>';
        }

        const industry = startup.industry || '—';
          let reward = 'N/A';
          if (startup.reward_potential != null) {
            if (typeof startup.reward_potential === 'string') {
              reward = startup.reward_potential.split(',')[0].trim();
            } else if (Array.isArray(startup.reward_potential)) {
              reward = startup.reward_potential[0];
            } else {
              reward = String(startup.reward_potential);
            }
          }
          const rewardDisplay = reward === 'N/A' ? 'N/A' : `${reward}/5`;
          const estimatedGrowth = (startup.estimated_growth_rate != null && startup.estimated_growth_rate !== '') 
            ? `${startup.estimated_growth_rate >= 0 ? '+' : ''}${startup.estimated_growth_rate}%` 
            : 'N/A';

        card.innerHTML = `
          <div class="flex justify-between items-start mb-4">
            <div class="flex-1">
              <h3 class="text-lg font-semibold mb-1">${escapeHtml(startup.company_name)}</h3>
              <p class="text-sm text-gray-400">${escapeHtml(industry)}</p>
            </div>
            <div class="flex flex-col items-end space-y-2">
              ${riskBadge}
              <div class="selection-indicator border-2 border-slate-600 rounded-full w-6 h-6 flex items-center justify-center transition-all">
                <svg class="w-4 h-4 text-white hidden" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path>
                </svg>
              </div>
            </div>
          </div>
          <div class="space-y-3">
          <div class="flex justify-between items-center">
            <span class="text-sm text-gray-400">Reward Potential</span>
            <span class="text-sm font-semibold text-white">${escapeHtml(rewardDisplay)}</span>
          </div>
          <div class="flex justify-between items-center">
            <span class="text-sm text-gray-400">Estimated Growth Rate</span>
            <span class="text-sm font-semibold ${startup.estimated_growth_rate != null && startup.estimated_growth_rate >= 0 ? 'text-accent-400' : 'text-red-400'}">${escapeHtml(estimatedGrowth)}</span>
          </div>
        </div>
        `;
        card.addEventListener("click", () => toggleStartupSelection(card), { passive: true });
        domCache.startupsGrid.appendChild(card);
      });
    }

    function escapeHtml(unsafe) {
      if (unsafe === null || unsafe === undefined) return '';
      return String(unsafe)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    function toggleStartupSelection(card) {
      const id = card.dataset.startupId;
      const indicator = card.querySelector(".selection-indicator");
      const checkmark = indicator.querySelector("svg");

      if (selectedStartups.has(id)) {
        selectedStartups.delete(id);
        card.classList.remove("border-brand-500", "bg-brand-500/10");
        card.classList.add("border-slate-700");
        indicator.classList.remove("bg-brand-600", "border-brand-600");
        indicator.classList.add("border-slate-600");
        checkmark.classList.add("hidden");
      } else if (selectedStartups.size < maxSelections) {
        selectedStartups.add(id);
        card.classList.remove("border-slate-700");
        card.classList.add("border-brand-500", "bg-brand-500/10");
        indicator.classList.remove("border-slate-600");
        indicator.classList.add("bg-brand-600", "border-brand-600");
        checkmark.classList.remove("hidden");
      }
      updateSelectedDisplay();
      updateCompareButton();
    }

    function updateSelectedDisplay() {
      domCache.selectedCount.textContent = selectedStartups.size;
      if (selectedStartups.size > 0) {
        domCache.selectedStartups.classList.remove("hidden");
        domCache.selectedList.innerHTML = "";
        selectedStartups.forEach(id => {
          const startup = startups.find(s => s.id == id);
          if (!startup) return;
          const badge = document.createElement("span");
          badge.className = "bg-brand-500/20 text-brand-300 text-sm font-medium px-3 py-2 rounded-lg flex items-center border border-brand-500/30 scale-in transition-all hover:bg-brand-500/30";
          badge.innerHTML = `
            ${startup.company_name}
            <button onclick="removeFromSelection('${id}')" class="ml-2 text-brand-400 hover:text-brand-200 transition-colors">
              <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
              </svg>
            </button>
          `;
          domCache.selectedList.appendChild(badge);
        });
      } else {
        domCache.selectedStartups.classList.add("hidden");
      }
    }

    function removeFromSelection(id) {
      const card = document.querySelector(`[data-startup-id="${id}"]`);
      if (card) toggleStartupSelection(card);
    }

    function updateCompareButton() {
      if (selectedStartups.size >= 2) {
        domCache.compareBtn.disabled = false;
        domCache.compareBtn.classList.remove("bg-slate-700", "text-gray-400", "cursor-not-allowed");
        domCache.compareBtn.classList.add("bg-brand-600", "hover:bg-brand-700", "text-white", "btn-pulse");
        domCache.compareBtn.textContent = `Compare Selected Startups (${selectedStartups.size})`;
        domCache.compareBtn.onclick = async () => {
          await recordComparisonAndNavigate();
        };
      } else {
        domCache.compareBtn.disabled = true;
        domCache.compareBtn.classList.remove("bg-brand-600", "hover:bg-brand-700", "text-white", "btn-pulse");
        domCache.compareBtn.classList.add("bg-slate-700", "text-gray-400", "cursor-not-allowed");
        domCache.compareBtn.textContent = "Select at least 2-3 startups to compare";
        domCache.compareBtn.onclick = null;
      }
    }

    async function recordComparisonAndNavigate() {
      const ids = Array.from(selectedStartups).map(id => parseInt(id));
      
      console.log('📊 Recording comparison for startups:', ids);
      
      // Show loading state
      domCache.compareBtn.disabled = true;
      const originalText = domCache.compareBtn.textContent;
      domCache.compareBtn.innerHTML = `
        <svg class="animate-spin -ml-1 mr-3 h-5 w-5 text-white inline" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
          <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
          <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
        </svg>
        Recording comparison...
      `;
      
      try {
        const token = getAuthToken();
        const response = await fetch(RECORD_COMPARISON_ENDPOINT, {
          method: 'POST',
          headers: {
            'Authorization': `Bearer ${token}`,
            'Content-Type': 'application/json',
            'Accept': 'application/json'
          },
          body: JSON.stringify({ startup_ids: ids }),
          mode: 'cors',
          credentials: 'include'
        });

        const responseText = await response.text();
        let result;
        try {
          result = JSON.parse(responseText);
        } catch (parseError) {
          console.error('Failed to parse response:', parseError);
          throw new Error('Invalid server response');
        }

        if (response.ok || response.status === 201) {
          console.log('✅ Comparison recorded successfully:', result);
          console.log('📊 Analytics:', {
            total_comparisons: result.total_comparisons,
            unique_comparers: result.unique_comparers
          });
          
          // Mark that a comparison was made (to trigger refresh on added-startups)
          localStorage.setItem('comparisonMade', Date.now().toString());
          
          // Add a small delay to ensure database transaction completes
          await new Promise(resolve => setTimeout(resolve, 500));
          
          // Navigate to comparison page
          window.location.href = `Startup_Comparison.html?startups=${ids.join(",")}`;
        } else {
          console.error('❌ Failed to record comparison:', result);
          // Still mark comparison attempt and navigate
          localStorage.setItem('comparisonMade', Date.now().toString());
          window.location.href = `Startup_Comparison.html?startups=${ids.join(",")}`;
        }
      } catch (error) {
        console.error('❌ Error recording comparison:', error);
        // Mark comparison attempt even on error
        localStorage.setItem('comparisonMade', Date.now().toString());
        // Navigate anyway even if recording fails
        window.location.href = `Startup_Comparison.html?startups=${ids.join(",")}`;
      }
    }

    function filterStartups() {
      const searchTerm = domCache.searchInput.value.toLowerCase();
      const industry = domCache.industryFilter.value;
      const risk = domCache.riskFilter.value;
      
      const filtered = startups.filter(s => {
        const matchesSearch = !searchTerm || s.company_name.toLowerCase().includes(searchTerm);
        const matchesIndustry = !industry || s.industry === industry;
        
        let matchesRisk = true;
        if (risk) {
          const isDeck = !!(s.is_deck_builder || s.source_deck_id || s.source_deck);
          if (isDeck) {
            matchesRisk = risk === 'Medium';
          } else {
            const riskLevel = s.risk_level;
            if (risk === 'Low' && riskLevel !== 'Low') matchesRisk = false;
            if (risk === 'Medium' && riskLevel !== 'Medium') matchesRisk = false;
            if (risk === 'High' && riskLevel !== 'High') matchesRisk = false;
          }
        }
        
        return matchesSearch && matchesIndustry && matchesRisk;
      });
      
      renderStartups(filtered);
      
      selectedStartups.forEach(id => {
        const card = document.querySelector(`[data-startup-id="${id}"]`);
        if (card) {
          const indicator = card.querySelector(".selection-indicator");
          const checkmark = indicator.querySelector("svg");
          card.classList.add("border-brand-500", "bg-brand-500/10");
          indicator.classList.add("bg-brand-600", "border-brand-600");
          checkmark.classList.remove("hidden");
        }
      });
    }
  </script>
</body>
</html>
