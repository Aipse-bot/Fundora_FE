<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Compare Startups - Fundora</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 min-h-screen">
  <div class="max-w-6xl mx-auto p-6">
    <div class="flex items-center mb-8">
      <a href="../Module1/Dashboard.html" class="mr-4 p-2 hover:bg-gray-100 rounded-full">
        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path>
        </svg>
      </a>
      <div>
        <h1 class="text-3xl font-bold text-gray-900">Compare Startups</h1>
        <p class="text-gray-600 mt-1" id="compare-subtitle"></p>
      </div>
    </div>

    <div class="flex flex-col md:flex-row gap-4 mb-8">
      <div class="flex-1 relative">
        <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
          <svg class="h-5 w-5 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path>
          </svg>
        </div>
        <input id="search-input" type="text" placeholder="Search startups..." class="w-full pl-10 pr-4 py-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent">
      </div>

      <div class="relative">
        <select id="industry-filter" class="appearance-none bg-white border border-gray-300 rounded-lg px-4 py-3 pr-8 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent">
          <option value="">All Industries</option>
          <option value="AI/Machine Learning">AI/Machine Learning</option>
          <option value="E-Commerce">E-Commerce</option>
          <option value="Finance">Finance</option>
          <option value="Healthcare">Healthcare</option>
          <option value="Technology">Technology</option>
        </select>
        <div class="absolute inset-y-0 right-0 flex items-center px-2 pointer-events-none">
          <svg class="w-4 h-4 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path>
          </svg>
        </div>
      </div>

      <div class="relative">
        <select id="risk-filter" class="appearance-none bg-white border border-gray-300 rounded-lg px-4 py-3 pr-8 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent">
          <option value="">All Risk Levels</option>
          <option value="Low">Low Risk</option>
          <option value="Medium">Medium Risk</option>
          <option value="High">High Risk</option>
        </select>
        <div class="absolute inset-y-0 right-0 flex items-center px-2 pointer-events-none">
          <svg class="w-4 h-4 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path>
          </svg>
        </div>
      </div>
    </div>

    <div class="mb-8">
      <div class="flex justify-between items-center mb-6">
        <h2 class="text-xl font-semibold text-gray-900">Select Startups to Compare (Max 3)</h2>
        <div class="text-sm text-gray-600"><span id="selected-count">0</span> of 3 selected</div>
      </div>

      <div id="selected-startups" class="mb-6 hidden">
        <h3 class="text-lg font-medium text-gray-900 mb-3">Selected for Comparison:</h3>
        <div id="selected-list" class="flex flex-wrap gap-2"></div>
      </div>

      <div id="startups-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6"></div>

      <div id="empty-state" class="text-center py-12 hidden">
        <div class="w-16 h-16 bg-gray-100 rounded-full flex items-center justify-center mx-auto mb-4">
          <svg class="w-8 h-8 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z"></path>
          </svg>
        </div>
        <h3 class="text-lg font-medium text-gray-900 mb-2">No Startups in Watchlist</h3>
        <p class="text-gray-600 mb-4">Add startups to your watchlist to compare them here.</p>
        <a href="../Module1/Dashboard.html" class="bg-blue-600 hover:bg-blue-700 text-white font-medium py-2 px-4 rounded-lg transition-colors duration-200">Browse Startups</a>
      </div>
    </div>

    <div class="flex justify-center">
      <button id="compare-btn" class="bg-gray-400 text-white font-medium py-3 px-8 rounded-lg transition-colors duration-200 cursor-not-allowed" disabled>
        Select Startups to Compare
      </button>
    </div>
  </div>

  <script>
    const apiBase = "http://127.0.0.1:8000/api";
    let startups = [];
    let selectedStartups = new Set();
    const maxSelections = 3;

    document.addEventListener("DOMContentLoaded", () => {
      loadStartups();
      document.getElementById("industry-filter").addEventListener("change", filterStartups);
      document.getElementById("risk-filter").addEventListener("change", filterStartups);
      document.getElementById("search-input").addEventListener("input", filterStartups);
    });

    async function loadStartups() {
      try {
        const response = await fetch(`${apiBase}/startups/`, {
          headers: {
            "Authorization": `Bearer ${localStorage.getItem("access_token") || ""}`
          }
        });
        if (!response.ok) throw new Error("Failed to fetch startups");
        startups = await response.json();
        renderStartups(startups);
      } catch (error) {
        console.error("Error loading startups:", error);
        document.getElementById("empty-state").classList.remove("hidden");
      }
    }

    function renderStartups(data) {
      const grid = document.getElementById("startups-grid");
      grid.innerHTML = "";
      if (!data.length) {
        document.getElementById("empty-state").classList.remove("hidden");
        return;
      }
      document.getElementById("empty-state").classList.add("hidden");

      data.forEach(startup => {
        const card = document.createElement("div");
        card.className = "startup-card border border-gray-200 rounded-lg p-5 bg-white hover:shadow-md transition cursor-pointer";
        card.dataset.startupId = startup.id;
        card.dataset.startupName = startup.company_name;
        card.dataset.industry = startup.industry;
        card.dataset.risk = startup.risk_level;

        card.innerHTML = `
          <div class="flex justify-between items-center mb-3">
            <h3 class="text-lg font-semibold text-gray-800">${startup.company_name}</h3>
            <div class="selection-indicator border border-gray-300 rounded-full w-6 h-6 flex items-center justify-center">
              <svg class="w-4 h-4 text-white hidden" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path>
              </svg>
            </div>
          </div>
          <p class="text-sm text-gray-600 mb-2">${startup.industry || "—"}</p>
          <p class="text-sm text-gray-500">Risk: ${startup.risk_level || "—"}</p>
        `;
        card.addEventListener("click", () => toggleStartupSelection(card));
        grid.appendChild(card);
      });
    }

    function toggleStartupSelection(card) {
      const id = card.dataset.startupId;
      const indicator = card.querySelector(".selection-indicator");
      const checkmark = indicator.querySelector("svg");

      if (selectedStartups.has(id)) {
        selectedStartups.delete(id);
        card.classList.remove("border-blue-500", "bg-blue-50");
        card.classList.add("border-gray-200");
        indicator.classList.remove("bg-blue-600", "border-blue-600");
        indicator.classList.add("border-gray-300");
        checkmark.classList.add("hidden");
      } else if (selectedStartups.size < maxSelections) {
        selectedStartups.add(id);
        card.classList.remove("border-gray-200");
        card.classList.add("border-blue-500", "bg-blue-50");
        indicator.classList.remove("border-gray-300");
        indicator.classList.add("bg-blue-600", "border-blue-600");
        checkmark.classList.remove("hidden");
      }
      updateSelectedDisplay();
      updateCompareButton();
    }

    function updateSelectedDisplay() {
      const count = document.getElementById("selected-count");
      const section = document.getElementById("selected-startups");
      const list = document.getElementById("selected-list");
      count.textContent = selectedStartups.size;
      if (selectedStartups.size > 0) {
        section.classList.remove("hidden");
        list.innerHTML = "";
        selectedStartups.forEach(id => {
          const startup = startups.find(s => s.id == id);
          const badge = document.createElement("span");
          badge.className = "bg-blue-100 text-blue-800 text-sm font-medium px-3 py-1 rounded-full flex items-center";
          badge.innerHTML = `
            ${startup.company_name}
            <button onclick="removeFromSelection('${id}')" class="ml-2 text-blue-600 hover:text-blue-800">
              <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
              </svg>
            </button>
          `;
          list.appendChild(badge);
        });
      } else {
        section.classList.add("hidden");
      }
    }

    function removeFromSelection(id) {
      const card = document.querySelector(`[data-startup-id="${id}"]`);
      if (card) toggleStartupSelection(card);
    }

    function updateCompareButton() {
      const btn = document.getElementById("compare-btn");
      if (selectedStartups.size >= 2) {
        btn.disabled = false;
        btn.classList.remove("bg-gray-400", "cursor-not-allowed");
        btn.classList.add("bg-blue-600", "hover:bg-blue-700");
        btn.textContent = `Compare Selected Startups (${selectedStartups.size})`;
        btn.onclick = () => {
          const ids = Array.from(selectedStartups);
          window.location.href = `../Module2/Comparison_Result.html?startups=${ids.join(",")}`;
        };
      } else {
        btn.disabled = true;
        btn.classList.remove("bg-blue-600", "hover:bg-blue-700");
        btn.classList.add("bg-gray-400", "cursor-not-allowed");
        btn.textContent = "Select at least 2 startups to compare";
        btn.onclick = null;
      }
    }

    function filterStartups() {
      const searchTerm = document.getElementById("search-input").value.toLowerCase();
      const industry = document.getElementById("industry-filter").value;
      const risk = document.getElementById("risk-filter").value;
      const filtered = startups.filter(s =>
        (!searchTerm || s.company_name.toLowerCase().includes(searchTerm)) &&
        (!industry || s.industry === industry) &&
        (!risk || s.risk_level === risk)
      );
      renderStartups(filtered);
    }
  </script>
</body>
</html>
