<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Startup Comparison - Fundora</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 min-h-screen">
    <div class="max-w-7xl mx-auto p-6">
        <!-- Header -->
        <div class="flex justify-between items-center mb-8">
            <div>
                <h1 class="text-3xl font-bold text-gray-900">Startup Comparison</h1>
                <p id="comparison-count" class="text-gray-600 mt-1">Loading...</p>
            </div>
                <div class="flex gap-3">
                <a href="/dashboard.html" class="text-gray-600 hover:text-gray-800 font-medium flex items-center">
                <svg class="w-4 h-4 mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path>
                </svg>
                Dashboard
                </a>
            </div>
        </div>

        <!-- Company Headers -->
        <div id="comparison-header" class="grid gap-6 mb-8"></div>

        <!-- Comparison Table -->
        <div id="comparison-table" class="bg-white rounded-lg shadow-sm border border-gray-200 overflow-hidden"></div>

        <!-- Action Buttons -->
        <div class="flex justify-center gap-4 mt-8">
            <button id="export-btn" class="bg-blue-600 hover:bg-blue-700 text-white font-medium py-3 px-6 rounded-lg transition-colors duration-200 flex items-center disabled:opacity-50 disabled:cursor-not-allowed">
                <svg class="w-5 h-5 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                        d="M12 10v6m0 0l-3-3m3 3l3-3m2 8H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path>
                </svg>
                <span id="export-text">Export PDF Report</span>
            </button>

            <a href="/compare.html" class="border border-gray-300 text-gray-700 hover:bg-gray-50 font-medium py-3 px-6 rounded-lg transition-colors duration-200 flex items-center">
                Compare Different Startups
            </a>
        </div>
    </div>

    <!-- Loading Modal -->
    <div id="loading-modal" class="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50 hidden">
        <div class="bg-white rounded-lg p-6 max-w-sm w-full mx-4">
            <div class="flex items-center justify-center mb-4">
                <div class="animate-spin rounded-full h-8 w-8 border-b-2 border-blue-600"></div>
            </div>
            <p class="text-center text-gray-700 font-medium">Generating PDF Report...</p>
            <p class="text-center text-gray-500 text-sm mt-2">This may take a few moments</p>
        </div>
    </div>
