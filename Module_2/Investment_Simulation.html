<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Investment Simulation</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/3.9.1/chart.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: {
              50: '#eff6ff',
              100: '#dbeafe',
              200: '#bfdbfe',
              300: '#93c5fd',
              400: '#60a5fa',
              500: '#3b82f6',
              600: '#2563eb',
              700: '#1d4ed8',
              800: '#1e40af',
              900: '#1e3a8a'
            },
            accent: {
              50: '#ecfdf5',
              100: '#d1fae5',
              200: '#a7f3d0',
              300: '#6ee7b7',
              400: '#34d399',
              500: '#10b981',
              600: '#059669',
              700: '#047857',
              800: '#065f46',
              900: '#064e3b'
            }
          },
          fontFamily: { 'sans': ['Inter', 'system-ui', 'sans-serif'] }
        }
      }
    };
  </script>
  <style>
    body { 
      font-family: 'Inter', sans-serif;
      contain: layout style paint;
    }
    .hero-gradient { 
      background: linear-gradient(135deg, #0f172a 0%, #1e293b 50%, #0f172a 100%); 
    }
    @keyframes fadeIn { 
      from { opacity: 0; } 
      to { opacity: 1; } 
    }
    .fade-in { 
      animation: fadeIn 0.4s ease-out forwards;
      opacity: 0;
    }
    .delay-1 { animation-delay: 0.1s; }
    .delay-2 { animation-delay: 0.2s; }
    .delay-3 { animation-delay: 0.3s; }
    .card-base {
      background-color: rgba(15, 23, 42, 0.8);
      contain: layout style;
    }
    .transition-smooth {
      transition: all 150ms ease-out;
      will-change: color, background-color;
    }
  </style>
</head>
<body class="bg-slate-950 text-white min-h-screen hero-gradient">
  <!-- Header -->
  <header class="border-b border-slate-800 fade-in">
    <div class="max-w-7xl mx-auto px-6 py-6 flex items-center justify-between">
      <div class="flex items-center">
        <button id="back-button" class="mr-6 p-2.5 hover:bg-slate-800/50 rounded-lg transition-all border border-slate-700">
          <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path>
          </svg>
        </button>
        <div>
          <h1 class="text-2xl font-bold">Investment Simulation</h1>
          <p id="startupName" class="text-lg text-gray-400 mt-1">Loading...</p>
        </div>
      </div>
      <span id="risk-badge" class="bg-gray-500/20 text-gray-300 text-sm font-medium px-4 py-2 rounded-full border border-gray-500/30">Loading...</span>
    </div>
  </header>

  <main class="max-w-7xl mx-auto px-6 py-8">
    <!-- Parameters Section -->
    <section class="card-base border border-slate-800 rounded-2xl p-8 mb-8 fade-in delay-1">
      <h2 class="text-2xl font-semibold mb-6">Simulation Parameters</h2>

      <div class="grid grid-cols-1 md:grid-cols-2 gap-8 md:justify-center">
        <div>
          <label class="text-sm font-medium text-gray-300 mb-3 block">Investment Amount</label>
          <input type="number" id="investment-input" placeholder="Enter amount in ₱" value="100000" min="1000" step="1000" class="w-full px-4 py-3 bg-slate-900 border border-slate-700 rounded-lg text-white placeholder-gray-500 focus:outline-none focus:border-brand-500">
        </div>

        <div>
          <label class="text-sm font-medium text-gray-300 mb-3 block">Investment Duration (Years)</label>
          <input type="number" id="duration-input" placeholder="Enter years" value="5" min="1" max="30" step="1" class="w-full px-4 py-3 bg-slate-900 border border-slate-700 rounded-lg text-white placeholder-gray-500 focus:outline-none focus:border-brand-500">
        </div>
      </div>

      <button id="simulate-btn" class="mt-8 w-full bg-brand-600 hover:bg-brand-700 text-white font-semibold py-3 px-6 rounded-lg transition-all">Run Simulation</button>
    </section>

    <!-- Results Section (Hidden until simulation runs) -->
    <section id="results-section" class="hidden">
      <div class="card-base border border-slate-800 rounded-2xl p-8 mb-8 fade-in delay-3">
        <h2 class="text-2xl font-semibold mb-6">Investment Returns</h2>

        <div class="grid grid-cols-1 md:grid-cols-4 gap-4 mb-8">
          <div class="bg-slate-900/50 rounded-lg p-4 border border-slate-700">
            <p class="text-xs text-gray-500 mb-2">Initial Investment</p>
            <p class="text-xl font-semibold text-white" id="initial-investment">₱0</p>
          </div>
          <div class="bg-slate-900/50 rounded-lg p-4 border border-slate-700">
            <p class="text-xs text-gray-500 mb-2">Duration</p>
            <p class="text-xl font-semibold text-white"><span id="duration-display">0</span> years</p>
          </div>
          <div class="bg-slate-900/50 rounded-lg p-4 border border-slate-700">
            <p class="text-xs text-gray-500 mb-2">Final Value</p>
            <p class="text-xl font-semibold text-accent-400" id="final-value">₱0</p>
          </div>
          <div class="bg-slate-900/50 rounded-lg p-4 border border-slate-700">
            <p class="text-xs text-gray-500 mb-2">Total Gain</p>
            <p class="text-xl font-semibold text-accent-300" id="total-gain">₱0</p>
          </div>
        </div>

        <div class="bg-slate-900/50 rounded-lg p-6 border border-slate-700 mb-8">
          <p class="text-sm text-gray-400 mb-3">Return on Investment (ROI)</p>
          <p class="text-4xl font-bold text-accent-400" id="roi-percentage">0%</p>
        </div>
      </div>

      <div class="card-base border border-slate-800 rounded-2xl p-8 fade-in delay-3">
        <h2 class="text-2xl font-semibold mb-6">Year-by-Year Breakdown</h2>
        <div class="overflow-x-auto">
          <table class="w-full text-sm">
            <thead>
              <tr class="border-b border-slate-700">
                <th class="px-6 py-4 text-left font-semibold text-gray-300">Year</th>
                <th class="px-6 py-4 text-left font-semibold text-gray-300">Starting Value</th>
                <th class="px-6 py-4 text-left font-semibold text-gray-300">Annual Growth</th>
                <th class="px-6 py-4 text-left font-semibold text-gray-300">Ending Value</th>
              </tr>
            </thead>
            <tbody id="breakdown-table">
              <tr>
                <td colspan="4" class="px-6 py-8 text-center text-gray-500">No data yet</td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>
    </section>
  </main>

  <script>
    const domCache = {
      investmentInput: document.getElementById('investment-input'),
      durationInput: document.getElementById('duration-input'),
      growthRateDisplay: document.getElementById('growth-rate-display'),
      simulateBtn: document.getElementById('simulate-btn'),
      cagrSource: document.getElementById('cagr-source'),
      dataSourceText: document.getElementById('data-source-text'),
      cagrValue: document.getElementById('cagr-value'),
      backButton: document.getElementById('back-button'),
      startupName: document.getElementById('startupName'),
      riskBadge: document.getElementById('risk-badge'),
      resultsSection: document.getElementById('results-section'),
      initialInvestment: document.getElementById('initial-investment'),
      durationDisplay: document.getElementById('duration-display'),
      finalValue: document.getElementById('final-value'),
      totalGain: document.getElementById('total-gain'),
      roiPercentage: document.getElementById('roi-percentage'),
      breakdownTable: document.getElementById('breakdown-table')
    };

    let startupData = null;
    let simulationData = null;

    // Initialize
    document.addEventListener('DOMContentLoaded', () => {
      const startupId = new URLSearchParams(window.location.search).get('startup_id');
      if (startupId) {
        fetchStartupData(startupId);
      } else {
        alert('No startup selected');
      }
      domCache.backButton.addEventListener('click', () => window.history.back());
      domCache.simulateBtn.addEventListener('click', runSimulation);
    });

    function fetchStartupData(startupId) {
      const apiUrl = `https://fundora-be-singapore.onrender.com/api/investor/startups/${startupId}/`;
      const token = localStorage.getItem('authToken');
      
      fetch(apiUrl, {
        headers: {
          'Authorization': `Bearer ${token}`,
          'Content-Type': 'application/json'
        }
      })
        .then(response => {
          if (!response.ok) throw new Error('Failed to fetch startup data');
          return response.json();
        })
        .then(data => {
          console.log('[v0] Fetched startup data:', data);
          startupData = data;
          initializeUI();
        })
        .catch(error => {
          console.error('[v0] Error fetching startup data:', error);
          alert('Error loading startup data. Please try again.');
        });
    }

    function initializeUI() {
      if (!startupData) return;

      const isDeckBuilder = startupData.is_deck_builder === true || startupData.source_deck_id != null;
      const riskLevel = startupData.risk_level;
      const projectedReturn = isDeckBuilder ? startupData.estimated_growth_rate : startupData.projected_return;

      console.log('[v0] Initializing UI:', {
        isDeckBuilder,
        riskLevel,
        projectedReturn,
        startupName: startupData.company_name
      });

      // Update startup name
      domCache.startupName.textContent = startupData.company_name || 'Unknown Startup';

      // Check if we have a valid growth rate from backend
      if (projectedReturn === null || projectedReturn === undefined) {
          const errorMsg = isDeckBuilder 
            ? 'This pitch deck does not have sufficient financial projections for investment simulation.\n\nRequired: At least 2 years of revenue projections'
            : 'This startup does not have sufficient financial data for investment simulation.\n\nRequired: Revenue history (current and previous period revenue)';
          
          alert(errorMsg);
          
          domCache.simulateBtn.disabled = true;
          domCache.simulateBtn.classList.add('opacity-50', 'cursor-not-allowed');
          domCache.simulateBtn.textContent = 'Insufficient Data';
          
          domCache.riskBadge.textContent = 'No Financial Data';
          domCache.riskBadge.className = 'bg-gray-500/20 text-gray-300 text-sm font-medium px-4 py-2 rounded-full border border-gray-500/30';
          
          return;
      }

      // Update risk badge
      if (isDeckBuilder) {
        domCache.riskBadge.textContent = 'Pitch Deck';
        domCache.riskBadge.className = 'bg-brand-500/20 text-brand-300 text-sm font-medium px-4 py-2 rounded-full border border-brand-500/30';
      } else if (riskLevel === null || riskLevel === undefined || riskLevel === 'Data Pending') {
        domCache.riskBadge.textContent = 'Risk Pending';
        domCache.riskBadge.className = 'bg-gray-500/20 text-gray-300 text-sm font-medium px-4 py-2 rounded-full border border-gray-500/30';
      } else {
        domCache.riskBadge.textContent = `${riskLevel} Risk`;
        
        const riskColors = {
          'Low': 'bg-accent-500/20 text-accent-300 border-accent-500/30',
          'Medium': 'bg-yellow-500/20 text-yellow-300 border-yellow-500/30',
          'High': 'bg-red-500/20 text-red-300 border-red-500/30'
        };
        
        const colorClass = riskColors[riskLevel] || 'bg-gray-500/20 text-gray-300 border-gray-500/30';
        domCache.riskBadge.className = `${colorClass} text-sm font-medium px-4 py-2 rounded-full border`;
      }
    }

    function runSimulation() {
      const investmentAmount = parseFloat(domCache.investmentInput.value);
      const durationYears = parseInt(domCache.durationInput.value);
      
      // Use correct field based on startup type
      const isDeckBuilder = startupData.is_deck_builder === true || startupData.source_deck_id != null;
      const projectedReturn = isDeckBuilder ? startupData.estimated_growth_rate : startupData.projected_return;
      const riskLevel = startupData.risk_level;
      
      console.log('[v0] Running simulation with:', {
        isDeckBuilder,
        projectedReturn,
        riskLevel,
        investmentAmount,
        durationYears
      });
      
      if (projectedReturn === null || projectedReturn === undefined) {
        alert('Cannot run simulation: No growth rate available');
        return;
      }

      if (isNaN(investmentAmount) || investmentAmount <= 0) {
        alert('Please enter a valid investment amount');
        return;
      }

      if (isNaN(durationYears) || durationYears <= 0) {
        alert('Please enter a valid duration');
        return;
      }

      console.log('[v0] === RUNNING SIMULATION ===');
      console.log('[v0] Startup Type:', isDeckBuilder ? 'Pitch Deck' : 'Regular Startup');
      console.log('[v0] Investment Amount:', investmentAmount);
      console.log('[v0] Duration:', durationYears, 'years');
      console.log('[v0] Base Growth Rate:', projectedReturn.toFixed(2) + '%');

      // Apply risk adjustment ONLY for regular startups, NOT for pitch decks
      let adjustedGrowthRate = projectedReturn;
      
      if (!isDeckBuilder && riskLevel) {
        const riskMultipliers = {
          'Low': 1.00,
          'Medium': 0.75,
          'High': 0.50
        };
        const multiplier = riskMultipliers[riskLevel] || 0.75;
        adjustedGrowthRate = projectedReturn * multiplier;
        
        console.log('[v0] Risk Level:', riskLevel);
        console.log('[v0] Risk Multiplier:', multiplier);
        console.log('[v0] Risk-Adjusted Growth Rate:', adjustedGrowthRate.toFixed(2) + '%');
      } else if (isDeckBuilder) {
        console.log('[v0] Pitch Deck - No risk adjustment applied');
      }

      console.log('[v0] Formula: FV = amount × (1 + adjustedGrowthRate)^years');

      // Calculate using risk-adjusted rate
      const growthRate = adjustedGrowthRate / 100;
      const finalValue = investmentAmount * Math.pow(1 + growthRate, durationYears);
      const totalGain = finalValue - investmentAmount;
      const roiPercentage = (totalGain / investmentAmount) * 100;

      const yearlyBreakdown = [];
      let currentValue = investmentAmount;
      for (let year = 1; year <= durationYears; year++) {
        const start = currentValue;
        const growth = start * growthRate;
        const end = start + growth;
        yearlyBreakdown.push({ year, start, growth, end });
        currentValue = end;
      }

      simulationData = { 
        investmentAmount, 
        durationYears, 
        finalValue, 
        totalGain, 
        roiPercentage, 
        yearlyBreakdown,
        growthRate: adjustedGrowthRate,
        baseGrowthRate: projectedReturn,
        riskAdjusted: !isDeckBuilder && riskLevel != null
      };

      console.log('[v0] Simulation Results:', {
        finalValue: finalValue.toFixed(2),
        totalGain: totalGain.toFixed(2),
        roi: roiPercentage.toFixed(2) + '%',
        riskAdjusted: simulationData.riskAdjusted
      });

      displayResults();
    }

    function displayResults() {
      const { investmentAmount, durationYears, finalValue, totalGain, roiPercentage, yearlyBreakdown } = simulationData;
      
      domCache.initialInvestment.textContent = `₱${investmentAmount.toLocaleString()}`;
      domCache.durationDisplay.textContent = durationYears;
      domCache.finalValue.textContent = `₱${Math.round(finalValue).toLocaleString()}`;
      domCache.totalGain.textContent = `₱${Math.round(totalGain).toLocaleString()}`;
      domCache.roiPercentage.textContent = `${roiPercentage.toFixed(2)}%`;

      domCache.breakdownTable.innerHTML = yearlyBreakdown.map(({ year, start, growth, end }) => `
        <tr class="hover:bg-slate-800/30">
          <td class="px-6 py-4 text-sm font-semibold text-white">Year ${year}</td>
          <td class="px-6 py-4 text-sm text-gray-300">₱${Math.round(start).toLocaleString()}</td>
          <td class="px-6 py-4 text-sm text-accent-400 font-medium">₱${Math.round(growth).toLocaleString()}</td>
          <td class="px-6 py-4 text-sm font-semibold text-white">₱${Math.round(end).toLocaleString()}</td>
        </tr>
      `).join('');

      domCache.resultsSection.classList.remove('hidden');
    }
  </script>
</body>
</html>
