<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign In</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script defer>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: {
              50: '#eff6ff',
              100: '#dbeafe',
              200: '#bfdbfe',
              300: '#93c5fd',
              400: '#60a5fa',
              500: '#3b82f6',
              600: '#2563eb',
              700: '#1d4ed8',
              800: '#1e40af',
              900: '#1e3a8a'
            },
            accent: {
              50: '#ecfdf5',
              100: '#d1fae5',
              200: '#a7f3d0',
              300: '#6ee7b7',
              400: '#34d399',
              500: '#10b981',
              600: '#059669',
              700: '#047857',
              800: '#065f46',
              900: '#064e3b'
            }
          },
          fontFamily: {
            'sans': ['Inter', 'system-ui', 'sans-serif']
          }
        }
      }
    }
  </script>
  <style>
    body { font-family: 'Inter', sans-serif; }
    .hero-gradient { background: linear-gradient(135deg, #0f172a 0%, #1e293b 50%, #0f172a 100%); }
    
    @keyframes slideIn { from { transform: translateY(-100%); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
    @keyframes slideOut { from { transform: translateY(0); opacity: 1; } to { transform: translateY(-100%); opacity: 0; } }
    @keyframes fadeInUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes float { 0%, 100% { transform: translateY(0px); } 50% { transform: translateY(-20px); } }
    @keyframes pulse-glow { 0%, 100% { opacity: 0.5; } 50% { opacity: 0.8; } }
    @keyframes shimmer { 0% { background-position: -1000px 0; } 100% { background-position: 1000px 0; } }
    @keyframes rotate { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
    
    .toast-enter { animation: slideIn 0.3s ease-out; }
    .toast-exit { animation: slideOut 0.3s ease-out; }
    .container-optimize { contain: layout style paint; }
    .fade-in-up { animation: fadeInUp 0.6s ease-out forwards; opacity: 0; }
    .delay-100 { animation-delay: 0.1s; }
    .delay-200 { animation-delay: 0.2s; }
    .delay-300 { animation-delay: 0.3s; }
    .delay-400 { animation-delay: 0.4s; }
    
    .floating { animation: float 6s ease-in-out infinite; }
    .floating-delayed { animation: float 6s ease-in-out 3s infinite; }
    
    .glow-pulse { animation: pulse-glow 3s ease-in-out infinite; }
    
    .shimmer-bg {
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.1), transparent);
      background-size: 1000px 100%;
      animation: shimmer 3s infinite;
    }
    
    .input-focus-glow {
      transition: all 0.3s ease;
    }
    
    .input-focus-glow:focus {
      box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.1), 0 0 20px rgba(59, 130, 246, 0.2);
      transform: translateY(-1px);
    }
    
    .btn-hover-lift {
      transition: all 0.3s ease;
    }
    
    .btn-hover-lift:hover:not(:disabled) {
      transform: translateY(-2px);
      box-shadow: 0 10px 25px -5px rgba(59, 130, 246, 0.4), 0 8px 10px -6px rgba(59, 130, 246, 0.3);
    }
    
    .btn-hover-lift:active:not(:disabled) {
      transform: translateY(0);
    }
    
    .link-underline {
      position: relative;
      transition: color 0.3s ease;
    }
    
    .link-underline::after {
      content: '';
      position: absolute;
      bottom: -2px;
      left: 0;
      width: 0;
      height: 2px;
      background: currentColor;
      transition: width 0.3s ease;
    }
    
    .link-underline:hover::after {
      width: 100%;
    }
    
    .checkbox-bounce {
      transition: all 0.2s cubic-bezier(0.68, -0.55, 0.265, 1.55);
    }
    
    .checkbox-bounce:checked {
      transform: scale(1.1);
    }
    
    .particle {
      position: absolute;
      width: 4px;
      height: 4px;
      background: rgba(59, 130, 246, 0.6);
      border-radius: 50%;
      pointer-events: none;
    }
    
    @keyframes particle-float {
      0% {
        transform: translate(0, 0) scale(1);
        opacity: 0;
      }
      10% {
        opacity: 1;
      }
      90% {
        opacity: 1;
      }
      100% {
        transform: translate(var(--tx), var(--ty)) scale(0);
        opacity: 0;
      }
    }
    
    .gradient-border {
      position: relative;
      background: linear-gradient(135deg, rgba(59, 130, 246, 0.1), rgba(16, 185, 129, 0.1));
      border: 1px solid transparent;
      background-clip: padding-box;
    }
    
    .gradient-border::before {
      content: '';
      position: absolute;
      inset: -1px;
      border-radius: inherit;
      padding: 1px;
      background: linear-gradient(135deg, #3b82f6, #10b981);
      -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
      -webkit-mask-composite: xor;
      mask-composite: exclude;
      opacity: 0;
      transition: opacity 0.3s ease;
    }
    
    .gradient-border:hover::before {
      opacity: 0.6;
    }
  </style>
</head>
<body class="bg-slate-950 text-gray-100 min-h-screen overflow-x-hidden">

  <div id="toastContainer" class="fixed top-4 right-4 z-[9999] space-y-2 container-optimize"></div>

  <!-- Enhanced Background Effects -->
  <div class="fixed inset-0 overflow-hidden pointer-events-none">
    <div class="absolute top-0 left-0 right-0 h-96 bg-gradient-to-b from-blue-500/5 to-transparent floating"></div>
    <div class="absolute bottom-0 right-0 w-96 h-96 bg-gradient-to-tl from-emerald-500/3 to-transparent floating-delayed"></div>
    <div class="absolute top-1/2 left-1/4 w-64 h-64 bg-blue-500/5 rounded-full blur-3xl glow-pulse"></div>
    <div class="absolute bottom-1/4 right-1/4 w-64 h-64 bg-emerald-500/5 rounded-full blur-3xl glow-pulse" style="animation-delay: 1.5s;"></div>
  </div>

  TODO: Remove Logo, turn it into a back button.
  <!-- Navbar -->
  <nav class="fixed top-0 left-0 right-0 z-50 bg-slate-900/90 backdrop-blur-sm border-b border-slate-800">
    <div class="max-w-7xl mx-auto px-6 py-4">
      <div class="flex items-center justify-between">
        <a href="/index.html" class="flex items-center space-x-3 group logo-spin">
          <div class="relative w-12 h-12 transition-transform duration-300 group-hover:scale-110">
            <img src="Fundora_Logo.png" alt="Fundora Logo" class="w-full h-full object-contain">
          </div>
        </a>
      </div>
    </div>
  </nav>

  <!-- Main Content -->
  <div class="relative min-h-screen flex items-center justify-center pt-24 pb-12 px-4">
    <div class="w-full max-w-md mx-auto">
      <div class="bg-slate-900/40 border border-slate-800/60 rounded-xl p-8 backdrop-blur-sm gradient-border shadow-2xl">
        <div class="mb-8 text-center fade-in-up">
          <h2 class="text-3xl font-bold text-white mb-2 bg-gradient-to-r from-blue-400 to-emerald-400 bg-clip-text text-transparent">Welcome Back</h2>
          <p class="text-gray-400 text-sm">Sign in to your account and continue</p>
        </div>

        <form id="loginForm" class="space-y-5">
          <!-- Email -->
          <div class="fade-in-up delay-100">
            <label for="email" class="block text-xs font-semibold text-gray-300 mb-2 uppercase tracking-wide">Email Address</label>
            <div class="relative">
              <input type="email" id="email" name="email"
                class="w-full px-4 py-2.5 bg-slate-800/50 border border-slate-700/60 rounded-lg focus:outline-none focus:ring-2 focus:ring-brand-500 focus:border-transparent text-white placeholder-gray-600 transition-all duration-200 input-focus-glow">
              <div class="absolute inset-0 rounded-lg shimmer-bg opacity-0 hover:opacity-100 transition-opacity pointer-events-none"></div>
            </div>
            <p class="text-red-400 text-xs mt-1.5 hidden" id="emailError"></p>
          </div>

          <!-- Password -->
          <div class="fade-in-up delay-200">
            <label for="password" class="block text-xs font-semibold text-gray-300 mb-2 uppercase tracking-wide">Password</label>
            <div class="relative">
              <input type="password" id="password" name="password"
                class="w-full px-4 py-2.5 pr-12 bg-slate-800/50 border border-slate-700/60 rounded-lg focus:outline-none focus:ring-2 focus:ring-brand-500 focus:border-transparent text-white placeholder-gray-600 transition-all duration-200 input-focus-glow">
              <button type="button" onclick="togglePassword()" class="absolute right-3 top-1/2 -translate-y-1/2 text-gray-400 hover:text-gray-300 transition-all duration-200 hover:scale-110 active:scale-95">
                <svg id="passwordEyeIcon" class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path>
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"></path>
                </svg>
              </button>
              <div class="absolute inset-0 rounded-lg shimmer-bg opacity-0 hover:opacity-100 transition-opacity pointer-events-none"></div>
            </div>
            <p class="text-red-400 text-xs mt-1.5 hidden" id="passwordError"></p>
          </div>

          <!-- Submit Button -->
          <button type="submit" id="submitBtn"
            class="w-full bg-gradient-to-r from-brand-600 to-brand-700 hover:from-brand-700 hover:to-brand-800 text-white py-2.5 px-4 rounded-lg font-semibold transition-all duration-200 disabled:opacity-50 disabled:cursor-not-allowed btn-hover-lift fade-in-up delay-400 relative overflow-hidden group">
            <span class="relative z-10">Sign In</span>
            <div class="absolute inset-0 bg-gradient-to-r from-brand-500 to-emerald-500 opacity-0 group-hover:opacity-20 transition-opacity duration-300"></div>
          </button>
        </form>

        <!-- Sign Up Link -->
        <div class="text-center mt-6 pt-6 border-t border-slate-800 fade-in-up delay-400">
          <p class="text-xs text-gray-400 mb-4">New to Fundora?</p>
          <div class="grid grid-cols-2 gap-2">
            <a href="/Module_3/startup_register.html" class="text-xs text-brand-400 hover:text-brand-300 font-semibold transition-all duration-200 link-underline py-2 px-3 rounded-lg hover:bg-brand-500/10">Sign up as Startup</a>
            <a href="/Module_1/investor_register.html" class="text-xs text-accent-400 hover:text-accent-300 font-semibold transition-all duration-200 link-underline py-2 px-3 rounded-lg hover:bg-accent-500/10">Sign up as Investor</a>
          </div>
        </div>
      </div>
    </div>
  </div>

<script>
    let activeToasts = new Set();
    
    function showToast(message, type = 'success') {
        if (activeToasts.has(message)) return;
        
        activeToasts.add(message);
        const container = document.getElementById('toastContainer');
        const toast = document.createElement('div');
        
        const bgColor = type === 'success' ? 'bg-emerald-600' : 'bg-red-600';
        const icon = type === 'success' 
            ? '<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path>'
            : '<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>';
        
        toast.className = `${bgColor} text-white px-5 py-3 rounded-lg shadow-lg flex items-center space-x-3 min-w-[280px] toast-enter text-sm`;
        toast.innerHTML = `
            <svg class="w-5 h-5 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                ${icon}
            </svg>
            <span class="flex-1 font-medium">${message}</span>
        `;
        
        container.appendChild(toast);
        
        setTimeout(() => {
            toast.classList.remove('toast-enter');
            toast.classList.add('toast-exit');
            setTimeout(() => {
                toast.remove();
                activeToasts.delete(message);
            }, 300);
        }, 3000);
    }

    function isValidEmail(email) {
        const emailRegex = /^[a-zA-Z0-9.!#$%&'*+/=?^_`{|}~-]+@[a-zA-Z0-9](?:[a-zA-Z0-9-]{0,61}[a-zA-Z0-9])?(?:\.[a-zA-Z0-9](?:[a-zA-Z0-9-]{0,61}[a-zA-Z0-9])?)*$/;
        
        if (!emailRegex.test(email)) return false;
        
        const parts = email.split('@');
        if (parts.length !== 2) return false;
        
        const domain = parts[1];
        if (!domain.includes('.')) return false;
        
        const domainParts = domain.split('.');
        const tld = domainParts[domainParts.length - 1];
        
        if (tld.length < 2) return false;
        
        const invalidTLDs = ['co', 'cm', 'con', 'cmo', 'comm', 'om', 'ocm'];
        if (invalidTLDs.includes(tld.toLowerCase())) return false;
        
        return true;
    }

    function togglePassword() {
        const field = document.getElementById('password');
        const icon = document.getElementById('passwordEyeIcon');
        
        if (field.type === 'password') {
            field.type = 'text';
            icon.innerHTML = `
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.88 9.88l-3.29-3.29m7.532 7.532l3.29 3.29M3 3l3.59 3.59m0 0A9.953 9.953 0 0112 5c4.478 0 8.268 2.943 9.543 7a10.025 10.025 0 01-4.132 5.411m0 0L21 21"></path>
            `;
        } else {
            field.type = 'password';
            icon.innerHTML = `
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path>
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"></path>
            `;
        }
    }

    function clearError(fieldId) {
        const errorElement = document.getElementById(fieldId + 'Error');
        const inputElement = document.getElementById(fieldId);
        if (errorElement) {
            errorElement.classList.add('hidden');
            errorElement.textContent = '';
        }
        if (inputElement) {
            inputElement.classList.remove('border-red-500');
        }
    }

    function showError(fieldId, message) {
        const errorElement = document.getElementById(fieldId + 'Error');
        const inputElement = document.getElementById(fieldId);
        if (errorElement) {
            errorElement.textContent = message;
            errorElement.classList.remove('hidden');
        }
        if (inputElement) {
            inputElement.classList.add('border-red-500');
        }
    }

    ['email', 'password'].forEach(fieldId => {
        const element = document.getElementById(fieldId);
        if (element) {
            element.addEventListener('input', () => clearError(fieldId));
        }
    });

    document.getElementById('loginForm').addEventListener('submit', async function (e) {
        e.preventDefault();

        ['email', 'password'].forEach(clearError);

        const email = document.getElementById('email').value.trim();
        const password = document.getElementById('password').value;
        const submitBtn = document.getElementById('submitBtn');
        const originalText = submitBtn.textContent;

        let hasError = false;

        if (!isValidEmail(email)) {
            showError('email', 'Please enter a valid email address');
            hasError = true;
        }

        if (password.length < 1) {
            showError('password', 'Password is required');
            hasError = true;
        }

        if (hasError) {
            showToast('Please fix the errors in the form', 'error');
            return;
        }

        submitBtn.disabled = true;
        submitBtn.textContent = 'Signing In...';

        try {
            const response = await fetch('fundorabe-production-5ccb.up.railway.app/api/login/', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email, password })
            });

            const data = await response.json();

            if (response.ok) {
                sessionStorage.setItem('authToken', data.token);
                sessionStorage.setItem('userData', JSON.stringify(data.user));

                showToast('Login successful! Redirecting...', 'success');

                setTimeout(() => {
                    if (data.user.label === 'startup') {
                        window.location.href = '/Module_3/added-startups.html';
                    } else if (data.user.label === 'investor') {
                        window.location.href = '/Module_1/Dashboard.html';
                    } else {
                        console.error('Unexpected user label:', data.user.label);
                        showToast('Unexpected user type. Contact support.', 'error');
                        submitBtn.disabled = false;
                        submitBtn.textContent = originalText;
                    }
                }, 1500);
            } else {
                const errorMsg = data.detail || data.error || 'Invalid credentials';
                
                if (errorMsg.toLowerCase().includes('email')) {
                    showError('email', errorMsg);
                } else if (errorMsg.toLowerCase().includes('password')) {
                    showError('password', errorMsg);
                } else {
                    showToast(errorMsg, 'error');
                }

                submitBtn.disabled = false;
                submitBtn.textContent = originalText;
            }

        } catch (err) {
            console.error('Login error:', err);
            showToast('Connection error. Please check your internet and try again.', 'error');
            submitBtn.disabled = false;
            submitBtn.textContent = originalText;
        }
    });
</script>

</body>
</html>
