<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Fundora - Welcome Back</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="min-h-screen bg-cover bg-center bg-no-repeat bg-[url('assets/img/sign-in-bg.jpg')] flex items-center justify-center p-4">

  <div class="bg-gray-400 shadow-lg w-full max-w-5xl h-[40rem] flex bg-opacity-75">
    <div class="shadow-lg p-8 w-full max-w-5xl flex items-center justify-center">
      <h2 class="text-white text-3xl font-semibold text-center">Empowering startups. Connecting investors. Fueling Ideas.</h2>
    </div>
  </div>

  <div class="bg-gray-200 shadow-lg p-8 w-full max-w-md h-[40rem] bg-opacity-75">
    <div class="text-center mb-6">
      <h1 class="text-xl font-semibold text-gray-900">Fundora</h1>
    </div>

    <div class="text-center mb-8">
      <h2 class="text-2xl font-bold text-gray-900 mb-2">Welcome</h2>
      <p class="text-gray-600">Sign in to your account to continue</p>
    </div>

    <!-- Error Message Container -->
    <div id="errorMessage" class="mb-6 hidden">
      <div class="bg-red-100 border border-red-400 text-red-700 px-4 py-3 rounded">
        <span id="errorText"></span>
      </div>
    </div>

    <!-- Login Form -->
    <form id="loginForm" class="space-y-6">
      <div>
        <label for="email" class="block text-sm font-medium text-gray-700 mb-2">Email Address</label>
        <input type="email" id="email" name="email" placeholder="Enter your email"
          class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent placeholder-gray-400" required>
      </div>

      <div>
        <label for="password" class="block text-sm font-medium text-gray-700 mb-2">Password</label>
        <input type="password" id="password" name="password" placeholder="Enter your password"
          class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent placeholder-gray-400" required>
      </div>

      <div class="flex items-center justify-between">
        <div class="flex items-center">
          <input type="checkbox" id="remember" name="remember"
            class="h-4 w-4 text-blue-600 focus:ring-blue-500 border-gray-300 rounded">
          <label for="remember" class="ml-2 text-sm text-gray-600">Remember me</label>
        </div>
        <a href="#" class="text-sm text-blue-600 hover:text-blue-800">Forgot password?</a>
      </div>

      <button type="submit"
        class="w-full bg-blue-600 text-white py-2 px-4 rounded-md hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-offset-2 font-medium">
        Sign In
      </button>
    </form>

    <div class="text-center mt-6">
      <p class="text-sm text-gray-600 mb-3">Don't have an account?</p>
      <div class="flex flex-col space-y-2">
        <a href="/index.html" class="text-blue-600 hover:text-blue-800 font-medium text-sm">Sign up Here</a>
      </div>
    </div>
  </div>

<script>
  document.getElementById('loginForm').addEventListener('submit', async function (e) {
    e.preventDefault();

    const email = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value.trim();

    try {
      const response = await fetch('http://127.0.0.1:8000/api/login/', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json'
        },
        body: JSON.stringify({ email, password })
      });

      const data = await response.json();
      
      if (response.ok) {
        console.log('Login successful:', data);

        // Store token if returned
        if (data.token) {
          localStorage.setItem('authToken', data.token);
        }

        // Redirect based on label
        if (data.user.label === 'startup') {
          window.location.href = '/Module_3/added-startups.html';
        } else if (data.user.label === 'investor') {
          window.location.href = '/Module_1/Dashboard.html';
        } else {
          // Fallback if label is missing or unexpected
          console.error('Unexpected user label:', data.user.label);
          //window.location.href = '/login.html';
        }
      } else {
        throw new Error(data.detail || 'Invalid credentials');
      }
    } catch (err) {
      const errorBox = document.getElementById('errorMessage');
      const errorText = document.getElementById('errorText');
      errorText.textContent = err.message;
      errorBox.classList.remove('hidden');
    }
  });
</script>
</body>
</html>
