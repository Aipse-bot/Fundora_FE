<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign In</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script defer>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: {
              50: '#eff6ff',
              100: '#dbeafe',
              200: '#bfdbfe',
              300: '#93c5fd',
              400: '#60a5fa',
              500: '#3b82f6',
              600: '#2563eb',
              700: '#1d4ed8',
              800: '#1e40af',
              900: '#1e3a8a'
            },
            accent: {
              50: '#ecfdf5',
              100: '#d1fae5',
              200: '#a7f3d0',
              300: '#6ee7b7',
              400: '#34d399',
              500: '#10b981',
              600: '#059669',
              700: '#047857',
              800: '#065f46',
              900: '#064e3b'
            }
          },
          fontFamily: {
            'sans': ['Inter', 'system-ui', 'sans-serif']
          }
        }
      }
    }
  </script>
  <style>
    body { font-family: 'Inter', sans-serif; }
    .hero-gradient { background: linear-gradient(135deg, #0f172a 0%, #1e293b 50%, #0f172a 100%); }
    @keyframes slideIn { from { transform: translateY(-100%); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
    @keyframes slideOut { from { transform: translateY(0); opacity: 1; } to { transform: translateY(-100%); opacity: 0; } }
    .toast-enter { animation: slideIn 0.3s ease-out; }
    .toast-exit { animation: slideOut 0.3s ease-out; }
    .container-optimize { contain: layout style paint; }
  </style>
</head>
<body class="bg-slate-950 text-gray-100 min-h-screen">

  <div id="toastContainer" class="fixed top-4 right-4 z-[9999] space-y-2 container-optimize"></div>

  <div class="fixed inset-0 overflow-hidden pointer-events-none">
    <div class="absolute top-0 left-0 right-0 h-96 bg-gradient-to-b from-blue-500/5 to-transparent"></div>
    <div class="absolute bottom-0 right-0 w-96 h-96 bg-gradient-to-tl from-emerald-500/3 to-transparent"></div>
  </div>

  <!-- Navbar -->
  <nav class="fixed top-0 left-0 right-0 z-50 bg-slate-900/90 backdrop-blur-sm border-b border-slate-800">
    <div class="max-w-7xl mx-auto px-6 py-4">
      <div class="flex items-center justify-between">
        <a href="/index.html" class="flex items-center space-x-3 group">
          <div class="relative w-10 h-10">
            <svg viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg">
              <circle cx="20" cy="20" r="18" fill="url(#logo-gradient)" stroke="#3b82f6" stroke-width="2"/>
              <path d="M20 10 L20 30 M12 20 L28 20" stroke="white" stroke-width="2.5" stroke-linecap="round"/>
              <circle cx="20" cy="12" r="2" fill="white"/>
              <circle cx="20" cy="28" r="2" fill="white"/>
              <circle cx="12" cy="20" r="2" fill="white"/>
              <circle cx="28" cy="20" r="2" fill="white"/>
              <defs>
                <linearGradient id="logo-gradient" x1="0" y1="0" x2="40" y2="40" gradientUnits="userSpaceOnUse">
                  <stop offset="0%" stop-color="#3b82f6"/>
                  <stop offset="100%" stop-color="#10b981"/>
                </linearGradient>
              </defs>
            </svg>
          </div>
          <span class="text-2xl font-bold text-white">Fundora</span>
        </a>
      </div>
    </div>
  </nav>

  <!-- Main Content -->
  <div class="relative min-h-screen flex items-center justify-center pt-24 pb-12 px-4">
    <div class="w-full max-w-md mx-auto">
      <div class="bg-slate-900/40 border border-slate-800/60 rounded-xl p-8 backdrop-blur-sm">
        <div class="mb-8 text-center">
          <h2 class="text-3xl font-bold text-white mb-2">Welcome Back</h2>
          <p class="text-gray-400 text-sm">Sign in to your account and continue</p>
        </div>

        <form id="loginForm" class="space-y-5">
          <!-- Email -->
          <div>
            <label for="email" class="block text-xs font-semibold text-gray-300 mb-2 uppercase tracking-wide">Email Address</label>
            <input type="email" id="email" name="email"
              class="w-full px-4 py-2.5 bg-slate-800/50 border border-slate-700/60 rounded-lg focus:outline-none focus:ring-2 focus:ring-brand-500 focus:border-transparent text-white placeholder-gray-600 transition-all duration-200">
            <p class="text-red-400 text-xs mt-1.5 hidden" id="emailError"></p>
          </div>

          <!-- Password -->
          <div>
            <label for="password" class="block text-xs font-semibold text-gray-300 mb-2 uppercase tracking-wide">Password</label>
            <div class="relative">
              <input type="password" id="password" name="password"
                class="w-full px-4 py-2.5 pr-12 bg-slate-800/50 border border-slate-700/60 rounded-lg focus:outline-none focus:ring-2 focus:ring-brand-500 focus:border-transparent text-white placeholder-gray-600 transition-all duration-200">
              <button type="button" onclick="togglePassword()" class="absolute right-3 top-1/2 -translate-y-1/2 text-gray-400 hover:text-gray-300 transition-colors">
                <svg id="passwordEyeIcon" class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path>
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"></path>
                </svg>
              </button>
            </div>
            <p class="text-red-400 text-xs mt-1.5 hidden" id="passwordError"></p>
          </div>

          <!-- Remember Me & Forgot Password -->
          <div class="flex items-center justify-between">
            <div class="flex items-center">
              <input type="checkbox" id="remember" name="remember"
                class="h-4 w-4 text-brand-600 focus:ring-brand-500 border-slate-600 rounded bg-slate-800">
              <label for="remember" class="ml-3 text-xs text-gray-400">Remember me</label>
            </div>
            <a href="#" class="text-xs text-brand-400 hover:text-brand-300 transition-colors">Forgot password?</a>
          </div>

          <!-- Submit Button -->
          <button type="submit" id="submitBtn"
            class="w-full bg-brand-600 hover:bg-brand-700 text-white py-2.5 px-4 rounded-lg font-semibold transition-all duration-200 disabled:opacity-50 disabled:cursor-not-allowed">
            Sign In
          </button>
        </form>

        <!-- Sign Up Link -->
        <div class="text-center mt-6 pt-6 border-t border-slate-800">
          <p class="text-xs text-gray-400 mb-4">New to Fundora?</p>
          <div class="grid grid-cols-2 gap-2">
            <a href="/Module_3/startup_register.html" class="text-xs text-brand-400 hover:text-brand-300 font-semibold transition-colors">Sign up as Startup</a>
            <a href="/Module_1/investor_register.html" class="text-xs text-accent-400 hover:text-accent-300 font-semibold transition-colors">Sign up as Investor</a>
          </div>
        </div>
      </div>
    </div>
  </div>

<script>
    let activeToasts = new Set();
    
    function showToast(message, type = 'success') {
        if (activeToasts.has(message)) return;
        
        activeToasts.add(message);
        const container = document.getElementById('toastContainer');
        const toast = document.createElement('div');
        
        const bgColor = type === 'success' ? 'bg-emerald-600' : 'bg-red-600';
        const icon = type === 'success' 
            ? '<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path>'
            : '<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>';
        
        toast.className = `${bgColor} text-white px-5 py-3 rounded-lg shadow-lg flex items-center space-x-3 min-w-[280px] toast-enter text-sm`;
        toast.innerHTML = `
            <svg class="w-5 h-5 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                ${icon}
            </svg>
            <span class="flex-1 font-medium">${message}</span>
        `;
        
        container.appendChild(toast);
        
        setTimeout(() => {
            toast.classList.remove('toast-enter');
            toast.classList.add('toast-exit');
            setTimeout(() => {
                toast.remove();
                activeToasts.delete(message);
            }, 300);
        }, 3000);
    }

    function isValidEmail(email) {
        const emailRegex = /^[a-zA-Z0-9.!#$%&'*+/=?^_`{|}~-]+@[a-zA-Z0-9](?:[a-zA-Z0-9-]{0,61}[a-zA-Z0-9])?(?:\.[a-zA-Z0-9](?:[a-zA-Z0-9-]{0,61}[a-zA-Z0-9])?)*$/;
        
        if (!emailRegex.test(email)) return false;
        
        const parts = email.split('@');
        if (parts.length !== 2) return false;
        
        const domain = parts[1];
        if (!domain.includes('.')) return false;
        
        const domainParts = domain.split('.');
        const tld = domainParts[domainParts.length - 1];
        
        if (tld.length < 2) return false;
        
        const invalidTLDs = ['co', 'cm', 'con', 'cmo', 'comm', 'om', 'ocm'];
        if (invalidTLDs.includes(tld.toLowerCase())) return false;
        
        return true;
    }

    function togglePassword() {
        const field = document.getElementById('password');
        const icon = document.getElementById('passwordEyeIcon');
        
        if (field.type === 'password') {
            field.type = 'text';
            icon.innerHTML = `
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.88 9.88l-3.29-3.29m7.532 7.532l3.29 3.29M3 3l3.59 3.59m0 0A9.953 9.953 0 0112 5c4.478 0 8.268 2.943 9.543 7a10.025 10.025 0 01-4.132 5.411m0 0L21 21"></path>
            `;
        } else {
            field.type = 'password';
            icon.innerHTML = `
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path>
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"></path>
            `;
        }
    }

    function clearError(fieldId) {
        const errorElement = document.getElementById(fieldId + 'Error');
        const inputElement = document.getElementById(fieldId);
        if (errorElement) {
            errorElement.classList.add('hidden');
            errorElement.textContent = '';
        }
        if (inputElement) {
            inputElement.classList.remove('border-red-500');
        }
    }

    function showError(fieldId, message) {
        const errorElement = document.getElementById(fieldId + 'Error');
        const inputElement = document.getElementById(fieldId);
        if (errorElement) {
            errorElement.textContent = message;
            errorElement.classList.remove('hidden');
        }
        if (inputElement) {
            inputElement.classList.add('border-red-500');
        }
    }

    ['email', 'password'].forEach(fieldId => {
        const element = document.getElementById(fieldId);
        if (element) {
            element.addEventListener('input', () => clearError(fieldId));
        }
    });

    document.getElementById('loginForm').addEventListener('submit', async function (e) {
        e.preventDefault();

        ['email', 'password'].forEach(clearError);

        const email = document.getElementById('email').value.trim();
        const password = document.getElementById('password').value;
        const submitBtn = document.getElementById('submitBtn');
        const originalText = submitBtn.textContent;

        let hasError = false;

        if (!isValidEmail(email)) {
            showError('email', 'Please enter a valid email address');
            hasError = true;
        }

        if (password.length < 1) {
            showError('password', 'Password is required');
            hasError = true;
        }

        if (hasError) {
            showToast('Please fix the errors in the form', 'error');
            return;
        }

        submitBtn.disabled = true;
        submitBtn.textContent = 'Signing In...';

        try {
            const response = await fetch('https://fundora-be-singapore.onrender.com/api/login/', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email, password })
            });

            const data = await response.json();

            if (response.ok) {
                localStorage.setItem('authToken', data.token);
                localStorage.setItem('userData', JSON.stringify(data.user));

                showToast('Login successful! Redirecting...', 'success');

                setTimeout(() => {
                    if (data.user.label === 'startup') {
                        window.location.href = '/Module_3/added-startups.html';
                    } else if (data.user.label === 'investor') {
                        window.location.href = '/Module_1/Dashboard.html';
                    } else {
                        console.error('Unexpected user label:', data.user.label);
                        showToast('Unexpected user type. Contact support.', 'error');
                        submitBtn.disabled = false;
                        submitBtn.textContent = originalText;
                    }
                }, 1500);
            } else {
                const errorMsg = data.detail || data.error || 'Invalid credentials';
                
                if (errorMsg.toLowerCase().includes('email')) {
                    showError('email', errorMsg);
                } else if (errorMsg.toLowerCase().includes('password')) {
                    showError('password', errorMsg);
                } else {
                    showToast(errorMsg, 'error');
                }

                submitBtn.disabled = false;
                submitBtn.textContent = originalText;
            }

        } catch (err) {
            console.error('Login error:', err);
            showToast('Connection error. Please check your internet and try again.', 'error');
            submitBtn.disabled = false;
            submitBtn.textContent = originalText;
        }
    });
</script>

</body>
</html>
