<section id="mainContent" class="px-4 sm:px-6 lg:px-8 w-full max-w-screen-lg mx-auto p-3 min-h-full pb-10">
  <div>
    <h1 class="text-4xl sm:text-5xl font-bold mb-8">The Team</h1>

    <form id="teamForm">
      <!-- Team Members Container -->
      <div id="teamMembers" class="space-y-6 mb-6"></div>

      <!-- Add Member Button -->
      <button type="button" id="addMemberBtn"
        class="bg-gray-300 px-4 py-2 font-semibold rounded-lg hover:bg-gray-400 transition">
        + Add Member
      </button>

      <!-- Submit Button -->
      <div class="flex justify-end mt-6">
        <button type="submit"
          class="px-6 py-2 bg-green-600 text-white rounded hover:bg-green-700 transition">
          Next
        </button>
      </div>
    </form>
  </div>
</section>

<template id="teamMemberTemplate">
  <div class="space-y-3 border-b pb-6 relative team-form">
    <input type="text" name="name" placeholder="Name"
      class="w-full p-3 border border-gray-300 rounded-lg shadow-sm" />
    <input type="text" name="title" placeholder="Title"
      class="w-full p-3 border border-gray-300 rounded-lg shadow-sm" />
    <button type="button"
      class="absolute top-0 right-2 text-red-600 font-bold hover:text-red-700 transition remove-member">
      ✕
    </button>
  </div>
</template>

<section id="card-panel" class="min-h-screen flex px-5 py-6 items-center justify-center">
  <div class="w-full max-w-lg bg-white rounded-lg p-8 shadow-lg space-y-6">

    <h1 class="text-3xl font-bold text-gray-800 text-center">Our Team</h1>

    <div id="teamPreview" class="space-y-6">
      <p class="text-center text-gray-500 text-base">Loading team members...</p>
    </div>

  </div>
</section>
