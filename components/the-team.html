<!-- Team Form Section -->
<section id="mainContent" class="bg-slate-950 text-gray-100 min-h-screen py-20 px-6">
  <div class="max-w-4xl mx-auto">
    <h1 class="text-4xl md:text-5xl font-bold text-white mb-10 text-center">Build Your Team</h1>

    <form id="teamForm" class="space-y-8 bg-slate-900/50 border border-slate-800 rounded-2xl p-8">
      <!-- Team Members Container -->
      <div id="teamMembers" class="space-y-6 mb-6"></div>

      <!-- Add Member Button -->
      <button type="button" id="addMemberBtn"
        class="w-full sm:w-auto bg-brand-600 hover:bg-brand-700 text-white px-6 py-3 rounded-lg font-medium transition-colors">
        + Add Member
      </button>

      <!-- Submit Button -->
      <div class="flex justify-end">
        <button type="submit"
          class="px-8 py-3 bg-accent-600 hover:bg-accent-700 text-white rounded-lg font-medium transition-colors">
          Next
        </button>
      </div>
    </form>
  </div>
</section>

<!-- Template for Dynamic Members -->
<template id="teamMemberTemplate">
  <div class="relative space-y-4 border border-slate-700 bg-slate-800/40 rounded-xl p-6">
    <input type="text" name="name" placeholder="Name"
      class="w-full p-3 bg-slate-900/60 border border-slate-700 rounded-lg text-gray-100 placeholder-gray-500 focus:outline-none focus:ring-2 focus:ring-brand-600" />
    <input type="text" name="title" placeholder="Title"
      class="w-full p-3 bg-slate-900/60 border border-slate-700 rounded-lg text-gray-100 placeholder-gray-500 focus:outline-none focus:ring-2 focus:ring-brand-600" />

    <button type="button"
      class="absolute top-3 right-3 text-red-400 hover:text-red-500 font-bold text-lg transition remove-member">
      ✕
    </button>
  </div>
</template>

<!-- Team Preview Section -->
<section id="card-panel" class="bg-slate-900 py-20 px-6 border-t border-slate-800">
  <div class="max-w-5xl mx-auto text-center">
    <h1 class="text-4xl font-bold text-white mb-10">Our Team Preview</h1>

    <div id="teamPreview" class="grid sm:grid-cols-2 lg:grid-cols-3 gap-10">
      <p class="text-center text-gray-500 text-base col-span-full">Loading team members...</p>
    </div>
  </div>
</section>
