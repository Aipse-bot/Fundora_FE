<section id="mainContent" class="bg-slate-900 text-gray-100 min-h-screen flex items-center justify-center p-6">
  <div class="w-full max-w-5xl">
    <!-- Header Section -->
    <div class="text-center mb-8 fade-in-up">
      <div class="inline-flex items-center justify-center w-16 h-16 bg-slate-700 rounded-2xl mb-4">
        <svg class="w-8 h-8 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 7h6m0 10v-3m-3 3h.01M9 17h.01M9 14h.01M12 14h.01M15 11h.01M12 11h.01M9 11h.01M7 21h10a2 2 0 002-2V5a2 2 0 00-2-2H7a2 2 0 00-2 2v14a2 2 0 002 2z"></path>
        </svg>
      </div>
      <h1 class="text-3xl sm:text-4xl font-bold text-white mb-2">Financial Projections</h1>
      <p class="text-gray-400 text-lg">Show investors your growth potential</p>
    </div>

    <!-- Form Card -->
    <div class="bg-slate-800/50 border border-slate-700 rounded-2xl shadow-2xl overflow-hidden fade-in-up" style="animation-delay: 0.1s;">
      <!-- Progress Bar -->
      <div class="bg-slate-900/50 px-8 py-4 border-b border-slate-700">
        <div class="flex items-center justify-between mb-2">
          <span class="text-sm font-medium text-gray-300">Step 6 of 7</span>
          <span class="text-sm font-medium text-emerald-400">Financial Projections</span>
        </div>
        <div class="w-full bg-slate-700 rounded-full h-2">
          <div class="bg-blue-600 h-2 rounded-full transition-all duration-500" style="width: 85.71%"></div>
        </div>
      </div>

      <!-- Form Content -->
      <form id="financialForm" class="p-8 space-y-8">
        
        <!-- Key Metrics Section -->
        <div class="bg-slate-900/30 border border-slate-600/50 rounded-xl p-6">
          <h2 class="text-xl font-bold text-white mb-6 flex items-center">
          <svg class="w-6 h-6 mr-2 text-blue-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 7h6m0 10v-3m-3 3h.01M9 17h.01M9 14h.01M12 14h.01M15 11h.01M12 11h.01M9 11h.01M7 21h10a2 2 0 002-2V5a2 2 0 00-2-2H7a2 2 0 00-2 2v14a2 2 0 002 2z"></path>
            </svg>
            Key Financial Metrics
          </h2>
          
          <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
            <!-- Current Valuation -->
            <div class="group">
              <label class="flex items-center mb-3 text-gray-300 font-semibold text-sm">
                <svg class="w-4 h-4 mr-2 text-blue-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8c-1.657 0-3 .895-3 2s1.343 2 3 2 3 .895 3 2-1.343 2-3 2m0-8c1.11 0 2.08.402 2.599 1M12 8V7m0 1v8m0 0v1m0-1c-1.11 0-2.08-.402-2.599-1M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path>
                </svg>
                Current Valuation
                <span class="text-red-400 ml-1">*</span>
              </label>
              <div class="relative">
                <span class="absolute left-4 top-1/2 transform -translate-y-1/2 text-gray-400 font-semibold">₱</span>
                <input
                  type="number"
                  id="currentValuation"
                  placeholder="0.00"
                  step="0.01"
                  min="0.01"
                  required
                  class="w-full pl-10 pr-4 py-3.5 bg-slate-900/50 border border-slate-600 rounded-xl text-gray-100 placeholder-gray-500 focus:ring-2 focus:ring-emerald-500 focus:border-transparent transition-all duration-300 hover:border-slate-500"
                />
              </div>
            </div>

            <!-- Industry Valuation Multiple -->
            <div class="group">
              <label class="flex items-center mb-3 text-gray-300 font-semibold text-sm">
                <svg class="w-4 h-4 mr-2 text-blue-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 12l3-3 3 3 4-4M8 21l4-4 4 4M3 4h18M4 4h16v12a1 1 0 01-1 1H5a1 1 0 01-1-1V4z"></path>
                </svg>
                Industry Valuation Multiple
                <span class="text-red-400 ml-1">*</span>
              </label>
              <div class="relative">
                <input
                  type="number"
                  id="industryValuationMultiple"
                  placeholder="0.00"
                  step="0.01"
                  min="0.01"
                  required
                  class="w-full px-4 py-3.5 bg-slate-900/50 border border-slate-600 rounded-xl text-gray-100 placeholder-gray-500 focus:ring-2 focus:ring-blue-500 focus:border-transparent transition-all duration-300 hover:border-slate-500"
                />
                <span class="absolute right-4 top-1/2 transform -translate-y-1/2 text-gray-400 font-semibold">x</span>
              </div>
            </div>

            <!-- Years to Projection -->
            <div class="group">
              <label class="flex items-center mb-3 text-gray-300 font-semibold text-sm">
                <svg class="w-4 h-4 mr-2 text-blue-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"></path>
                </svg>
                Years to Projection
                <span class="text-red-400 ml-1">*</span>
              </label>
              <input
                type="number"
                id="yearsToProjection"
                placeholder="3"
                step="1"
                min="1"
                max="10"
                required
                class="w-full px-4 py-3.5 bg-slate-900/50 border border-slate-600 rounded-xl text-gray-100 placeholder-gray-500 focus:ring-2 focus:ring-emerald-500 focus:border-transparent transition-all duration-300 hover:border-slate-500"
              />
            </div>

            <!-- Future Projected Revenue -->
            <div class="group">
              <label class="flex items-center mb-3 text-gray-300 font-semibold text-sm">
                <svg class="w-4 h-4 mr-2 text-blue-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 7h8m0 0v8m0-8l-8 8-4-4-6 6"></path>
                </svg>
                Future Projected Revenue (Final Year)
                <span class="text-red-400 ml-1">*</span>
              </label>
              <div class="relative">
                <span class="absolute left-4 top-1/2 transform -translate-y-1/2 text-gray-400 font-semibold">₱</span>
                <input
                  type="number"
                  id="futureProjectedRevenue"
                  placeholder="0.00"
                  step="0.01"
                  min="0.01"
                  required
                  class="w-full pl-10 pr-4 py-3.5 bg-slate-900/50 border border-slate-600 rounded-xl text-gray-100 placeholder-gray-500 focus:ring-2 focus:ring-blue-500 focus:border-transparent transition-all duration-300 hover:border-slate-500"
                />
              </div>
            </div>
          </div>
        </div>

        <!-- Action Buttons -->
        <div class="flex justify-between gap-3 pt-4">
          <button
            type="button"
            onclick="window.parent.loadSection && window.parent.loadSection('the-team', localStorage.getItem('deck_id'))"
            class="flex items-center gap-2 px-6 py-3.5 bg-slate-700 text-white font-semibold rounded-xl hover:bg-slate-600 transition-all duration-300"
          >
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path>
            </svg>
            <span>Back</span>
          </button>
          
          <button
            type="submit"
            class="group flex items-center gap-2 px-8 py-3.5 bg-blue-600 text-white font-semibold rounded-xl hover:bg-blue-700 transition-all duration-300 shadow-lg hover:shadow-xl"
          >
            <span>Continue</span>
            <svg class="w-5 h-5 group-hover:translate-x-1 transition-transform" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 7l5 5m0 0l-5 5m5-5H6"></path>
            </svg>
          </button>
        </div>
      </form>
    </div>
  </div>
</section>

<!-- Card Panel - Shows Live Calculations -->
<section id="card-panel" class="w-full h-full bg-slate-800 border-l border-slate-700 overflow-y-auto p-8 flex items-center justify-center">
  <div class="w-full max-w-lg">
    <div class="text-center mb-6">
      <h3 class="text-xl font-bold text-white mb-2">Live Projections</h3>
      <p class="text-sm text-gray-400">Real-time calculation as you type</p>
    </div>
    
    <!-- Calculations Card -->
    <div class="bg-gradient-to-br from-slate-900 to-slate-800 border border-slate-700 rounded-2xl shadow-2xl overflow-hidden mb-6">
      <div class="bg-blue-500/10 border-b border-blue-500/30 px-6 py-3">
        <h4 class="text-sm font-bold text-blue-400">KEY METRICS</h4>
      </div>
      
      <div class="p-6">
        <table class="w-full">
          <tbody id="financialPreviewTable" class="divide-y divide-slate-700">
            <tr>
              <td colspan="2" class="text-center py-8 text-gray-400">
                <svg class="w-12 h-12 mx-auto mb-3 text-gray-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 7h6m0 10v-3m-3 3h.01M9 17h.01M9 14h.01M12 14h.01M15 11h.01M12 11h.01M9 11h.01M7 21h10a2 2 0 002-2V5a2 2 0 00-2-2H7a2 2 0 00-2 2v14a2 2 0 002 2z"></path>
                </svg>
                <p class="text-sm">Fill in the form to see calculations</p>
              </td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>

    <!-- Chart Section -->
    <div class="bg-gradient-to-br from-slate-900 to-slate-800 border border-slate-700 rounded-2xl shadow-2xl overflow-hidden p-6">
      <h4 class="text-sm font-bold text-blue-400 mb-4 text-center">GROWTH PROJECTION</h4>
      <div class="bg-slate-900/50 rounded-xl p-4">
        <canvas id="irrChart" class="w-full" style="height: 250px;"></canvas>
      </div>
    </div>
  </div>
</section>

<style>
  @keyframes fadeInUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
  .fade-in-up { animation: fadeInUp 0.6s ease-out forwards; opacity: 0; }
  
  input:focus {
    transform: translateY(-1px);
  }
  
  .group:hover label {
    color: #93c5fd;
  }
</style>

<script>
function waitForChart(callback) {
  if (typeof Chart !== 'undefined') {
    callback();
  } else {
    setTimeout(() => waitForChart(callback), 100);
  }
}

document.addEventListener('DOMContentLoaded', function() {
  waitForChart(() => {
    initializeFinancialForm();
  });
});

let chartInstance = null;

function initializeFinancialForm() {
  const financialForm = document.getElementById('financialForm');
  const currentValuationInput = document.getElementById('currentValuation');
  const industryMultipleInput = document.getElementById('industryValuationMultiple');
  const yearsInput = document.getElementById('yearsToProjection');
  const revenueInput = document.getElementById('futureProjectedRevenue');
  
  if (!financialForm) return;

  // Load existing data
  loadExistingFinancials();

  // Live update on input
  [currentValuationInput, industryMultipleInput, yearsInput, revenueInput].forEach(input => {
    if (input) {
      input.addEventListener('input', updateCalculations);
    }
  });

  // Form submission - FIXED
  financialForm.addEventListener('submit', async (e) => {
    e.preventDefault();
    e.stopPropagation();
    await saveFinancials();
  });

  async function loadExistingFinancials() {
    try {
      const deckId = localStorage.getItem('deck_id');
      if (!deckId) return;

      const savedData = localStorage.getItem(`financials_pitch_${deckId}`);
      if (savedData) {
        const data = JSON.parse(savedData);
        currentValuationInput.value = data.currentValuation || '';
        industryMultipleInput.value = data.industryValuationMultiple || '';
        yearsInput.value = data.yearsToProjection || '';
        revenueInput.value = data.projectedRevenue || '';
        updateCalculations();
      }
    } catch (error) {
      console.error('Error loading financials:', error);
    }
  }

  function updateCalculations() {
    const currentVal = parseFloat(currentValuationInput.value);
    const industryMultiple = parseFloat(industryMultipleInput.value);
    const years = parseInt(yearsInput.value);
    const futureRevenue = parseFloat(revenueInput.value);

    // Clear preview if any field is empty
    if (!currentVal || !industryMultiple || !years || !futureRevenue) {
        const previewTable = document.getElementById('financialPreviewTable');
        previewTable.innerHTML = `
          <tr>
            <td colspan="2" class="text-center py-8 text-gray-400">
              <svg class="w-12 h-12 mx-auto mb-3 text-gray-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 7h6m0 10v-3m-3 3h.01M9 17h.01M9 14h.01M12 14h.01M15 11h.01M12 11h.01M9 11h.01M7 21h10a2 2 0 002-2V5a2 2 0 00-2-2H7a2 2 0 00-2 2v14a2 2 0 002 2z"></path>
              </svg>
              <p class="text-sm">Fill in the form to see calculations</p>
            </td>
          </tr>
        `;
        return;
    }
  }

  function updatePreviewTable(currentVal, futureRevenue, industryMultiple, futureValuation, irrPercentage, years) {
    const previewTable = document.getElementById('financialPreviewTable');
    
    previewTable.innerHTML = `
      <tr class="hover:bg-slate-700/30 transition">
        <td class="py-3 text-gray-300 text-sm font-medium">Current Valuation</td>
        <td class="py-3 text-right text-white font-semibold">₱${currentVal.toLocaleString('en-US', {minimumFractionDigits: 2, maximumFractionDigits: 2})}</td>
      </tr>
      <tr class="hover:bg-slate-700/30 transition">
        <td class="py-3 text-gray-300 text-sm font-medium">Future Revenue</td>
        <td class="py-3 text-right text-white font-semibold">₱${futureRevenue.toLocaleString('en-US', {minimumFractionDigits: 2, maximumFractionDigits: 2})}</td>
      </tr>
      <tr class="hover:bg-slate-700/30 transition">
        <td class="py-3 text-gray-300 text-sm font-medium">Valuation Multiple</td>
        <td class="py-3 text-right text-white font-semibold">${industryMultiple.toFixed(2)}x</td>
      </tr>
      <tr class="bg-blue-500/10 hover:bg-blue-500/20 transition">
        <td class="py-3 text-blue-300 text-sm font-bold">Future Valuation</td>
        <td class="py-3 text-right text-blue-400 font-bold text-lg">₱${futureValuation.toLocaleString('en-US', {minimumFractionDigits: 2, maximumFractionDigits: 2})}</td>
      </tr>
      <tr class="bg-blue-500/10 hover:bg-blue-500/20 transition">
        <td class="py-3 text-blue-300 text-sm font-bold">IRR (${years} years)</td>
        <td class="py-3 text-right text-blue-400 font-bold text-lg">${irrPercentage.toFixed(2)}%</td>
      </tr>
    `;
  }

  function updateIRRChart(irrPercentage, years, currentVal, futureValuation) {
    const canvas = document.getElementById('irrChart');
    if (!canvas) return;

    const ctx = canvas.getContext('2d');
    if (!ctx) return;

    if (chartInstance) {
      chartInstance.destroy();
    }

    const yearLabels = ['Year 0'];
    const valuationData = [currentVal];
    
    const irrDecimal = irrPercentage / 100;
    for (let i = 1; i <= years; i++) {
      yearLabels.push(`Year ${i}`);
      valuationData.push(currentVal * Math.pow(1 + irrDecimal, i));
    }

    chartInstance = new Chart(ctx, {
      type: 'line',
      data: {
        labels: yearLabels,
        datasets: [{
          label: 'Projected Valuation',
          data: valuationData,
          borderColor: 'rgb(59, 130, 246)',
          backgroundColor: 'rgba(59, 130, 246, 0.1)',
          tension: 0.4,
          fill: true,
          pointRadius: 6,
          pointBackgroundColor: 'rgb(59, 130, 246)',
          pointBorderColor: '#fff',
          pointBorderWidth: 2,
          pointHoverRadius: 8
        }]
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        plugins: {
          legend: {
            labels: {
              color: '#e5e7eb',
              font: { size: 11, weight: '600' }
            }
          },
          tooltip: {
            backgroundColor: 'rgba(15, 23, 42, 0.95)',
            titleColor: '#fff',
            bodyColor: '#cbd5e1',
            borderColor: 'rgba(59, 130, 246, 0.5)',
            borderWidth: 1,
            padding: 12,
            callbacks: {
              label: function(context) {
                return 'Valuation: ₱' + context.parsed.y.toLocaleString('en-US', {minimumFractionDigits: 2, maximumFractionDigits: 2});
              }
            }
          }
        },
        scales: {
          x: {
            ticks: { color: '#9ca3af', font: { size: 10 } },
            grid: { color: 'rgba(148, 163, 184, 0.1)' }
          },
          y: {
            beginAtZero: true,
            ticks: {
              color: '#9ca3af',
              font: { size: 10 },
              callback: function(value) {
                return '₱' + (value / 1000000).toFixed(1) + 'M';
              }
            },
            grid: { color: 'rgba(148, 163, 184, 0.1)' }
          }
        }
      }
    });
  }

  async function saveFinancials() {
    try {
      const deckId = localStorage.getItem('deck_id');
      if (!deckId) {
        alert('Error: No deck ID found');
        return;
      }

      const currentVal = parseFloat(currentValuationInput.value);
      const industryMultiple = parseFloat(industryMultipleInput.value);
      const years = parseInt(yearsInput.value);
      const futureRevenue = parseFloat(revenueInput.value);

      if (!currentVal || !industryMultiple || !years || !futureRevenue) {
        alert('Please fill in all required fields');
        return;
      }

      const token = sessionStorage.getItem('authToken');
      if (!token) {
        alert('Authentication required. Please log in again.');
        return;
      }

      // Save to market analysis (for valuation multiple)
      const marketResponse = await fetch('https://fundora-be-singapore.onrender.com/api/deck/market-analysis/', {
        method: 'POST',
        headers: {
          'Authorization': `Bearer ${token}`,
          'Content-Type': 'application/json'
        },
        body: JSON.stringify({
          deck_id: deckId,
          valuation_multiple: industryMultiple
        })
      });

      if (!marketResponse.ok) {
        console.error('Market analysis save failed:', await marketResponse.text());
      }

      // Save financial data with proper year calculation
      const financialResponse = await fetch('https://fundora-be-singapore.onrender.com/api/deck/financial/', {
        method: 'POST',
        headers: {
          'Authorization': `Bearer ${token}`,
          'Content-Type': 'application/json'
        },
        body: JSON.stringify({
          deck_id: deckId,
          financials: [
            {
              year: 0,
              revenue: currentVal,
              profit: currentVal * 0.2
            },
            {
              year: years,
              revenue: futureRevenue,
              profit: futureRevenue * 0.2
            }
          ]
        })
      });

      if (!financialResponse.ok) {
        const errorText = await financialResponse.text();
        console.error('Financial save failed:', errorText);
        alert('Failed to save financials: ' + errorText);
        return;
      }

      const result = await financialResponse.json();
      
      // Save to localStorage for retrieval
      localStorage.setItem(`financials_pitch_${deckId}`, JSON.stringify({
        currentValuation: currentVal,
        industryValuationMultiple: industryMultiple,
        yearsToProjection: years,
        projectedRevenue: futureRevenue
      }));

      alert('Financials saved successfully!');
      
      const loadSection = window.loadSection || window.parent?.loadSection;
      if (typeof loadSection === 'function') {
        loadSection('the-ask', deckId);
      } else {
        console.error('Cannot access loadSection function');
      }
    } catch (error) {
      console.error('Error saving financials:', error);
      alert('Failed to save financials. Please try again.');
    }
  }
}
</script>
