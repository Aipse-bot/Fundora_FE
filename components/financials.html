<section id="mainContent" class="bg-slate-900 text-gray-100 min-h-screen">
  <div class="px-4 sm:px-6 lg:px-8 w-full max-w-screen-lg mx-auto p-6 pb-10">
    <div class="bg-slate-800 border border-slate-700 rounded-2xl shadow-lg p-8">
      <h1 class="text-4xl sm:text-5xl font-bold mb-10 text-white">Pitch Deck Financials</h1>

      <form id="financialForm" class="space-y-6">
        <div class="bg-slate-700/50 p-6 rounded-lg border border-slate-600 space-y-4">
          <h2 class="text-2xl font-bold text-white mb-6">Required Fields</h2>
          
          <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
            <!-- Current Valuation -->
            <div>
              <label class="block text-gray-300 font-semibold mb-2">Current Valuation (₱)</label>
              <input
                type="number"
                id="currentValuation"
                placeholder="0.00"
                step="0.01"
                min="0.01"
                required
                class="w-full px-3 py-2 bg-slate-700 text-gray-200 rounded-lg border border-slate-600 focus:ring-2 focus:ring-blue-500 focus:outline-none"
              />
            </div>

            <!-- Industry Valuation Multiple -->
            <div>
              <label class="block text-gray-300 font-semibold mb-2">Industry Valuation Multiple</label>
              <input
                type="number"
                id="industryValuationMultiple"
                placeholder="0.00"
                step="0.01"
                min="0.01"
                required
                class="w-full px-3 py-2 bg-slate-700 text-gray-200 rounded-lg border border-slate-600 focus:ring-2 focus:ring-blue-500 focus:outline-none"
              />
            </div>

            <!-- Years to Projection -->
            <div>
              <label class="block text-gray-300 font-semibold mb-2">Years to Projection</label>
              <input
                type="number"
                id="yearsToProjection"
                placeholder="0"
                step="1"
                min="1"
                required
                class="w-full px-3 py-2 bg-slate-700 text-gray-200 rounded-lg border border-slate-600 focus:ring-2 focus:ring-blue-500 focus:outline-none"
              />
            </div>

            <!-- Future Projected Revenue (final year) -->
            <div>
              <label class="block text-gray-300 font-semibold mb-2">Future Projected Revenue - Final Year (₱)</label>
              <input
                type="number"
                id="futureProjectedRevenue"
                placeholder="0.00"
                step="0.01"
                min="0.01"
                required
                class="w-full px-3 py-2 bg-slate-700 text-gray-200 rounded-lg border border-slate-600 focus:ring-2 focus:ring-blue-500 focus:outline-none"
              />
            </div>
          </div>
        </div>

        <!-- Submit -->
        <div class="flex justify-end pt-6">
          <button
            type="submit"
            class="px-8 py-2.5 bg-gradient-to-r from-green-500 to-green-600 text-white font-semibold rounded-lg hover:from-green-600 hover:to-green-700 transform hover:scale-[1.02] transition shadow-lg"
          >
            Next →
          </button>
        </div>
      </form>
    </div>
  </div>
</section>

<!-- Card Panel - Shows Calculation Results -->
<section id="card-panel" class="min-h-screen flex px-5 py-10 items-center justify-center bg-slate-900">
  <div class="w-full max-w-2xl bg-slate-800 border border-slate-700 rounded-2xl p-8 shadow-xl space-y-8">
    <h1 class="text-3xl font-bold text-white">Financial Projections</h1>

    <div class="overflow-x-auto rounded-lg border border-slate-700">
      <table class="w-full text-left border-collapse">
        <thead class="bg-slate-700">
          <tr>
            <th class="px-4 py-3 font-semibold text-gray-200">Metric</th>
            <th class="px-4 py-3 font-semibold text-gray-200">Value</th>
          </tr>
        </thead>
        <tbody id="financialPreviewTable" class="divide-y divide-slate-700">
          <tr>
            <td colspan="2" class="text-center py-4 text-gray-400">Fill in the form to see calculations</td>
          </tr>
        </tbody>
      </table>
    </div>

    <!-- Chart Section - Shows IRR Visualization -->
    <div class="mt-8">
      <h2 class="text-xl font-semibold text-gray-200 text-center mb-4">
        IRR Projection
      </h2>
      <canvas
        id="irrChart"
        class="w-full h-64 bg-slate-700/40 rounded-lg p-3 shadow-inner"
      ></canvas>
    </div>
  </div>
</section>

<script>
function waitForChart(callback) {
  if (typeof Chart !== 'undefined') {
    callback();
  } else {
    console.warn('Chart.js not loaded yet, waiting...');
    setTimeout(() => waitForChart(callback), 100);
  }
}

// Initialize financial form when loaded
document.addEventListener('DOMContentLoaded', function() {
  console.log('Pitch Deck Financials page loaded');
  
  // Check if Chart.js is available
  waitForChart(() => {
    console.log('Chart.js is ready');
    initializeFinancialForm();
  });
});

function initializeFinancialForm() {
  const financialForm = document.getElementById('financialForm');
  const currentValuationInput = document.getElementById('currentValuation');
  const industryMultipleInput = document.getElementById('industryValuationMultiple');
  const yearsInput = document.getElementById('yearsToProjection');
  const revenueInput = document.getElementById('futureProjectedRevenue');
  
  if (!financialForm) {
    console.error('Financial form not found');
    return;
  }

  let chartInstance = null;

  // Load existing data if editing
  loadExistingFinancials();

  [currentValuationInput, industryMultipleInput, yearsInput, revenueInput].forEach(input => {
    input.addEventListener('input', () => {
      updateCalculations();
    });
  });

  // Form submission
  financialForm.addEventListener('submit', async (e) => {
    e.preventDefault();
    await saveFinancials();
  });

  async function loadExistingFinancials() {
    try {
      const urlParams = new URLSearchParams(window.location.search);
      const deckId = urlParams.get('deck_id');
      
      if (!deckId) {
        console.log('No deck_id found, starting fresh');
        return;
      }

      const savedData = localStorage.getItem(`financials_pitch_${deckId}`);
      if (savedData) {
        const data = JSON.parse(savedData);
        document.getElementById('currentValuation').value = data.currentValuation || '';
        document.getElementById('industryValuationMultiple').value = data.industryValuationMultiple || '';
        document.getElementById('yearsToProjection').value = data.yearsToProjection || '';
        document.getElementById('futureProjectedRevenue').value = data.projectedRevenue || '';
        updateCalculations();
      }
    } catch (error) {
      console.error('Error loading financials:', error);
    }
  }

  function updateCalculations() {
    const currentVal = parseFloat(currentValuationInput.value) || 0;
    const industryMultiple = parseFloat(industryMultipleInput.value) || 0;
    const years = parseInt(yearsInput.value) || 0;
    const futureRevenue = parseFloat(revenueInput.value) || 0;

    if (currentVal > 0 && industryMultiple > 0 && years > 0 && futureRevenue > 0) {
      const futureValuation = futureRevenue * industryMultiple;
      
      const irr = Math.pow(futureValuation / currentVal, 1 / years) - 1;
      const irrPercentage = irr * 100;

      updatePreviewTable(currentVal, futureRevenue, industryMultiple, futureValuation, irrPercentage, years);
      updateIRRChart(irrPercentage, years, currentVal, futureValuation);
    }
  }

  function updatePreviewTable(currentVal, futureRevenue, industryMultiple, futureValuation, irrPercentage, years) {
    const previewTable = document.getElementById('financialPreviewTable');
    
    previewTable.innerHTML = `
      <tr class="hover:bg-slate-700/50 transition">
        <td class="px-4 py-3 text-gray-200 font-semibold">Current Valuation</td>
        <td class="px-4 py-3 text-gray-200">₱${currentVal.toLocaleString('en-US', {minimumFractionDigits: 2, maximumFractionDigits: 2})}</td>
      </tr>
      <tr class="hover:bg-slate-700/50 transition">
        <td class="px-4 py-3 text-gray-200 font-semibold">Future Projected Revenue</td>
        <td class="px-4 py-3 text-gray-200">₱${futureRevenue.toLocaleString('en-US', {minimumFractionDigits: 2, maximumFractionDigits: 2})}</td>
      </tr>
      <tr class="hover:bg-slate-700/50 transition">
        <td class="px-4 py-3 text-gray-200 font-semibold">Industry Valuation Multiple</td>
        <td class="px-4 py-3 text-gray-200">${industryMultiple.toLocaleString('en-US', {minimumFractionDigits: 2, maximumFractionDigits: 2})}x</td>
      </tr>
      <tr class="hover:bg-slate-700/50 transition bg-slate-700/30">
        <td class="px-4 py-3 text-gray-200 font-semibold">Future Valuation</td>
        <td class="px-4 py-3 text-green-400 font-bold">₱${futureValuation.toLocaleString('en-US', {minimumFractionDigits: 2, maximumFractionDigits: 2})}</td>
      </tr>
      <tr class="hover:bg-slate-700/50 transition bg-slate-700/30">
        <td class="px-4 py-3 text-gray-200 font-semibold">IRR (${years} years)</td>
        <td class="px-4 py-3 text-blue-400 font-bold">${irrPercentage.toLocaleString('en-US', {minimumFractionDigits: 2, maximumFractionDigits: 2})}%</td>
      </tr>
    `;
  }

  function updateIRRChart(irrPercentage, years, currentVal, futureValuation) {
    const canvas = document.getElementById('irrChart');
    if (!canvas) return;

    const ctx = canvas.getContext('2d');

    if (chartInstance) {
      chartInstance.destroy();
    }

    // Create year-by-year growth projection based on IRR
    const yearLabels = ['Year 0'];
    const valuationData = [currentVal];
    
    const irrDecimal = irrPercentage / 100;
    for (let i = 1; i <= years; i++) {
      yearLabels.push(`Year ${i}`);
      const projectedValue = currentVal * Math.pow(1 + irrDecimal, i);
      valuationData.push(projectedValue);
    }

    chartInstance = new Chart(ctx, {
      type: 'line',
      data: {
        labels: yearLabels,
        datasets: [
          {
            label: 'Valuation Growth (₱)',
            data: valuationData,
            borderColor: 'rgb(59, 130, 246)',
            backgroundColor: 'rgba(59, 130, 246, 0.1)',
            tension: 0.3,
            fill: true,
            pointRadius: 5,
            pointBackgroundColor: 'rgb(59, 130, 246)',
            pointBorderColor: '#fff',
            pointBorderWidth: 2
          }
        ]
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        plugins: {
          legend: {
            labels: {
              color: '#e5e7eb',
              font: { size: 12 }
            }
          },
          tooltip: {
            backgroundColor: 'rgba(15, 23, 42, 0.9)',
            titleColor: '#fff',
            bodyColor: '#cbd5e1',
            callbacks: {
              label: function(context) {
                return 'Valuation: ₱' + context.parsed.y.toLocaleString('en-US', {minimumFractionDigits: 2, maximumFractionDigits: 2});
              }
            }
          }
        },
        scales: {
          x: {
            ticks: { color: '#9ca3af' },
            grid: { color: 'rgba(148, 163, 184, 0.1)' }
          },
          y: {
            beginAtZero: true,
            ticks: {
              color: '#9ca3af',
              callback: function(value) {
                return '₱' + value.toLocaleString('en-US', {minimumFractionDigits: 0, maximumFractionDigits: 0});
              }
            },
            grid: { color: 'rgba(148, 163, 184, 0.1)' }
          }
        }
      }
    });
  }

  async function saveFinancials() {
    try {
      const urlParams = new URLSearchParams(window.location.search);
      const deckId = urlParams.get('deck_id');

      if (!deckId) {
        alert('Error: No deck ID found');
        return;
      }

      const currentVal = parseFloat(currentValuationInput.value);
      const industryMultiple = parseFloat(industryMultipleInput.value);
      const years = parseInt(yearsInput.value);
      const futureRevenue = parseFloat(revenueInput.value);

      if (!currentVal || !industryMultiple || !years || !futureRevenue) {
        alert('Please fill in all required fields');
        return;
      }

      const financialData = {
        current_valuation: currentVal,
        industry_multiple: industryMultiple,
        years_to_projection: years,
        projected_revenue: futureRevenue,
        future_valuation: futureRevenue * industryMultiple,
        irr: (Math.pow((futureRevenue * industryMultiple) / currentVal, 1 / years) - 1) * 100
      };

      // Save to localStorage for backup
      localStorage.setItem(`financials_pitch_${deckId}`, JSON.stringify(financialData));

      const token = localStorage.getItem('authToken');
      const response = await fetch('https://fundora-be-singapore.onrender.com/api/deck-builder/pitch-financials/', {
        method: 'POST',
        headers: {
          'Authorization': `Bearer ${token}`,
          'Content-Type': 'application/json'
        },
        body: JSON.stringify({
          deck_id: deckId,
          ...financialData
        })
      });

      const result = await response.json();

      if (response.ok) {
        console.log('Pitch Deck Financials saved successfully');
        // Navigate to next section
        window.location.href = `base.html?section=the-ask&deck_id=${deckId}`;
      } else {
        alert('Error saving financials: ' + (result.error || 'Unknown error'));
      }
    } catch (error) {
      console.error('Error saving financials:', error);
      alert('Failed to save financials. Please try again.');
    }
  }
}
</script>
