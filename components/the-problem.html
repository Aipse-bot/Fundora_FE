<section id="mainContent" class="px-4 sm:px-6 lg:px-8 w-full max-w-screen-lg mx-auto p-3 min-h-full pb-10">
  <div class="bg-slate-800/70 p-8 rounded-2xl shadow-xl border border-slate-700">
    <h1 class="text-4xl sm:text-5xl font-bold mb-10 text-blue-600">
      The Problem
    </h1>

    <form id="problemForm" class="space-y-6">
      <!-- Problem Description -->
      <div>
        <label for="problemDescription" class="block mb-3 text-gray-300 font-semibold text-xl">Describe the problem you're solving</label>
        <textarea
          id="problemDescription"
          name="description"
          rows="6"
          placeholder="Describe the problem you're solving..."
          class="w-full p-3 bg-slate-900 border border-slate-700 rounded-lg text-gray-100 placeholder-gray-500 focus:ring-2 focus:ring-blue-600 focus:border-blue-600 resize-none outline-none transition"
        ></textarea>
        <p id="descriptionError" class="text-red-500 text-sm mt-1 hidden"></p>
      </div>

      <!-- Submit Button -->
      <div class="flex justify-end">
        <button
          type="submit"
          class="px-6 py-2 bg-blue-600 text-white rounded-lg font-medium hover:bg-blue-700 transition-all duration-200 shadow-md hover:shadow-blue-500/30"
        >
          Next
        </button>
      </div>
    </form>
  </div>
</section>

<!-- Preview Panel -->
<section id="card-panel" class="min-h-screen flex px-5 py-10 items-center justify-center">
  <div class="w-full max-w-lg bg-slate-800/70 rounded-2xl p-8 shadow-xl border border-slate-700 text-center">
    <h1 class="text-3xl font-bold text-white mb-6">The Problem</h1>

    <!-- Problem Description -->
    <div>
      <div class="mb-2 text-gray-400 font-semibold text-xl">What's the challenge you're solving?</div>
      <p id="problemPreview" class="text-gray-300 text-base leading-relaxed">
        <span class="text-gray-500 italic">Loading problem description...</span>
      </p>
    </div>
  </div>
</section>
