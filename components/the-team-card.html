<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Our Team</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Inter', sans-serif; contain: layout style paint; }
    .team-card { contain: layout style paint; transition: box-shadow 0.2s ease-out; }
    .team-card:hover { box-shadow: 0 10px 25px rgba(59, 130, 246, 0.15); }
  </style>
</head>
<body class="bg-slate-900 text-gray-100">
  <header class="bg-slate-900 border-b border-slate-800 sticky top-0 z-50">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
      <div class="flex justify-between items-center h-16">
        <a href="/index.html" class="text-2xl font-bold text-blue-500 hover:text-blue-400 transition-colors">
          Fundora
        </a>
        <div id="header-user" class="flex items-center space-x-4"></div>
      </div>
    </div>
    <script>
      function renderHeaderUser(user) {
        const container = document.getElementById('header-user');
        container.innerHTML = '';
        if (!user || !user.name) return;
        container.innerHTML = `
          <span class="text-gray-300 text-sm">Welcome, <span class="font-medium text-white">${user.name}</span></span>
          <a href="/logout.html" class="inline-flex items-center px-3 py-2 text-sm font-medium rounded-md text-gray-300 hover:text-white border border-slate-700 hover:border-blue-500 bg-slate-800 hover:bg-slate-700 transition-all duration-200">Logout</a>`;
      }
    </script>
  </header>

  <section class="min-h-screen bg-slate-900 text-gray-100 py-24 px-6">
    <div class="max-w-6xl mx-auto text-center mb-16">
      <h1 class="text-4xl md:text-5xl font-bold text-white mb-4">Meet Our Team</h1>
      <p class="text-gray-400 max-w-2xl mx-auto">The people building Fundora — passionate innovators dedicated to connecting startups with investors.</p>
    </div>

    <div id="teamContainer" class="max-w-6xl mx-auto grid sm:grid-cols-2 lg:grid-cols-3 gap-10">
      <p class="text-center text-gray-500 text-base col-span-full">Loading team members...</p>
    </div>
  </section>

  <script>
    const domCache = {};
    function getCachedElement(id) {
      if (!domCache[id]) domCache[id] = document.getElementById(id);
      return domCache[id];
    }

    async function loadTeamMembers() {
      try {
        const urlParams = new URLSearchParams(window.location.search);
        const deckId = urlParams.get('deck_id');
        if (!deckId) return;

        const token = localStorage.getItem('authToken');
        const response = await fetch(`https://fundora-be-singapore.onrender.com/api/deck-builder/team/?deck_id=${deckId}`, {
          headers: { 'Authorization': `Bearer ${token}`, 'Content-Type': 'application/json' }
        });

        if (!response.ok) return;
        const teamMembers = await response.json();
        renderTeamMembers(teamMembers);
      } catch (error) {
        console.error('Error loading team:', error);
      }
    }

    function renderTeamMembers(members) {
      const container = getCachedElement('teamContainer');
      if (!members || members.length === 0) {
        container.innerHTML = '<p class="text-center text-gray-500 text-base col-span-full">No team members added yet.</p>';
        return;
      }

      container.innerHTML = '';
      const fragment = document.createDocumentFragment();
      
      members.forEach((member, index) => {
        const initial = (member.name || '').charAt(0).toUpperCase() || 'M';
        const colors = ['from-blue-600 to-blue-500', 'from-emerald-600 to-emerald-500'];
        const colorClass = colors[index % colors.length];

        const div = document.createElement('div');
        div.className = `team-card bg-slate-800 border border-slate-700 rounded-2xl p-8 text-center`;
        div.innerHTML = `
          <div class="relative mx-auto w-24 h-24 mb-5">
            <div class="w-24 h-24 rounded-full bg-gradient-to-br ${colorClass} p-[2px]">
              <div class="w-full h-full bg-slate-900 rounded-full flex items-center justify-center">
                <span class="text-xl font-bold text-gray-300">${initial}</span>
              </div>
            </div>
          </div>
          <h3 class="text-xl font-semibold text-white mb-1">${member.name || 'Team Member'}</h3>
          <p class="text-gray-400 text-sm mb-4">${member.title || 'Role'}</p>
          ${member.bio ? `<p class="text-gray-500 text-sm">${member.bio}</p>` : ''}
        `;
        fragment.appendChild(div);
      });

      container.appendChild(fragment);
    }

    document.addEventListener('DOMContentLoaded', loadTeamMembers, { passive: true });
  </script>
</body>
</html>
