<section id="mainContent" class="bg-slate-900 text-gray-100 min-h-screen flex items-center justify-center p-6">
  <div class="w-full max-w-4xl">
    <!-- Header Section -->
    <div class="text-center mb-8 fade-in-up">
      <div class="inline-flex items-center justify-center w-16 h-16 bg-gradient-to-br from-emerald-500 to-teal-500 rounded-2xl mb-4">
        <svg class="w-8 h-8 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path>
        </svg>
      </div>
      <h1 class="text-3xl sm:text-4xl font-bold text-white mb-2">The Solution</h1>
      <p class="text-gray-400 text-lg">How are you solving the problem?</p>
    </div>

    <!-- Form Card -->
    <div class="bg-slate-800/50 border border-slate-700 rounded-2xl shadow-2xl overflow-hidden fade-in-up" style="animation-delay: 0.1s;">
      <!-- Progress Bar -->
      <div class="bg-slate-900/50 px-8 py-4 border-b border-slate-700">
        <div class="flex items-center justify-between mb-2">
          <span class="text-sm font-medium text-gray-300">Step 3 of 7</span>
          <span class="text-sm font-medium text-emerald-400">The Solution</span>
        </div>
        <div class="w-full bg-slate-700 rounded-full h-2">
          <div class="bg-gradient-to-r from-emerald-500 to-teal-500 h-2 rounded-full transition-all duration-500" style="width: 42.86%"></div>
        </div>
      </div>

      <!-- Form Content -->
      <form id="solutionForm" class="p-8 space-y-8">
        
        <!-- Solution Description -->
        <div class="group">
          <label for="solutionDescription" class="flex items-center mb-3 text-gray-300 font-semibold text-base">
            <svg class="w-5 h-5 mr-2 text-emerald-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path>
            </svg>
            Solution Description
            <span class="text-red-400 ml-1">*</span>
          </label>
          <textarea
            id="solutionDescription"
            name="description"
            rows="8"
            required
            class="w-full px-4 py-3.5 bg-slate-900/50 border border-slate-600 rounded-xl text-gray-100 placeholder-gray-500 focus:ring-2 focus:ring-emerald-500 focus:border-transparent transition-all duration-300 hover:border-slate-500 resize-none"
            placeholder="Describe your solution in detail. How does your product or service solve the problem? What makes your approach unique and effective?"
          ></textarea>
          <p id="descriptionError" class="text-red-400 text-sm mt-2 hidden flex items-center">
            <svg class="w-4 h-4 mr-1" fill="currentColor" viewBox="0 0 20 20">
              <path fill-rule="evenodd" d="M18 10a8 8 0 11-16 0 8 8 0 0116 0zm-7 4a1 1 0 11-2 0 1 1 0 012 0zm-1-9a1 1 0 00-1 1v4a1 1 0 102 0V6a1 1 0 00-1-1z" clip-rule="evenodd"></path>
            </svg>
            <span></span>
          </p>
        </div>

        <!-- Action Buttons -->
        <div class="flex justify-between gap-3 pt-4">
          <button
            type="button"
            onclick="window.parent.loadSection && window.parent.loadSection('the-problem', localStorage.getItem('deck_id'))"
            class="flex items-center gap-2 px-6 py-3.5 bg-slate-700 text-white font-semibold rounded-xl hover:bg-slate-600 transition-all duration-300"
          >
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path>
            </svg>
            <span>Back</span>
          </button>
          
          <button
            type="submit"
            class="group flex items-center gap-2 px-8 py-3.5 bg-gradient-to-r from-emerald-600 to-teal-600 text-white font-semibold rounded-xl hover:from-emerald-700 hover:to-teal-700 transition-all duration-300 shadow-lg hover:shadow-xl hover:scale-105"
          >
            <span>Continue</span>
            <svg class="w-5 h-5 group-hover:translate-x-1 transition-transform" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 7l5 5m0 0l-5 5m5-5H6"></path>
            </svg>
          </button>
        </div>
      </form>
    </div>
  </div>
</section>

<!-- Card Preview Panel -->
<section id="card-panel" class="w-full h-full bg-slate-800 border-l border-slate-700 overflow-y-auto p-8 flex items-center justify-center">
  <div class="w-full max-w-lg">
    
    <div class="bg-gradient-to-br from-slate-900 to-slate-800 border border-slate-700 rounded-2xl shadow-2xl overflow-hidden">
      <!-- Header -->
      <div class="bg-emerald-500/10 border-b border-emerald-500/30 px-6 py-4">
        <h2 class="text-2xl font-bold text-white flex items-center">
          <svg class="w-6 h-6 mr-2 text-emerald-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path>
          </svg>
          Our Solution
        </h2>
      </div>

      <!-- Content -->
      <div class="p-6">
        <div class="bg-slate-900/50 rounded-xl p-5 border border-slate-700 min-h-[200px]">
          <div class="flex items-start mb-3 text-emerald-400 font-semibold text-sm">
            <svg class="w-4 h-4 mr-2 mt-0.5 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"></path>
            </svg>
            HOW WE SOLVE IT
          </div>
          <p id="solutionPreview" class="text-gray-300 text-base leading-relaxed">
            Describe your solution in detail. How does your product or service solve the problem?
          </p>
        </div>
      </div>
    </div>
  </div>
</section>

<style>
  @keyframes fadeInUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
  .fade-in-up { animation: fadeInUp 0.6s ease-out forwards; opacity: 0; }
  
  textarea:focus {
    transform: translateY(-1px);
  }
  
  .group:hover label {
    color: #6ee7b7;
  }
</style>

<script>
document.addEventListener('DOMContentLoaded', function() {
  const solutionForm = document.getElementById('solutionForm');
  const solutionDescriptionInput = document.getElementById('solutionDescription');
  const solutionPreview = document.getElementById('solutionPreview');
  const descriptionError = document.getElementById('descriptionError');

  if (!solutionForm) return;

  // Load existing data
  loadExistingSolution();

  // Live preview updates
  solutionDescriptionInput.addEventListener('input', (e) => {
    const value = e.target.value.trim();
    solutionPreview.textContent = value || 'Describe your solution in detail. How does your product or service solve the problem?';
  });

  // Form submission
  solutionForm.addEventListener('submit', async (e) => {
    e.preventDefault();
    e.stopPropagation();
    await saveSolution();
  });

  async function loadExistingSolution() {
    try {
      const deckId = localStorage.getItem('deck_id');
      if (!deckId) return;

      const savedData = localStorage.getItem(`solution_pitch_${deckId}`);
      if (savedData) {
        const data = JSON.parse(savedData);
        solutionDescriptionInput.value = data.description || '';
        solutionPreview.textContent = data.description || 'Describe your solution in detail. How does your product or service solve the problem?';
      }
    } catch (error) {
      console.error('Error loading solution:', error);
    }
  }

  async function saveSolution() {
    try {
      const deckId = localStorage.getItem('deck_id');
      if (!deckId) {
        alert('Error: No deck ID found');
        return;
      }

      const description = solutionDescriptionInput.value.trim();

      if (!description) {
        descriptionError.classList.remove('hidden');
        descriptionError.querySelector('span').textContent = 'Please describe your solution';
        return;
      }

      descriptionError.classList.add('hidden');

      const token = sessionStorage.getItem('authToken');

      const response = await fetch('https://fundora-be-singapore.onrender.com/api/deck/solution/', {
        method: 'POST',
        headers: {
          'Authorization': `Bearer ${token}`,
          'Content-Type': 'application/json'
        },
        body: JSON.stringify({
          deck_id: deckId,
          description: description
        })
      });

      const result = await response.json();

      if (response.ok) {
        localStorage.setItem('deck_id', result.deck_id);
        localStorage.setItem(`solution_pitch_${result.deck_id}`, JSON.stringify({ description }));
        
        // Navigate to next section
        if (window.parent && typeof window.parent.loadSection === 'function') {
          window.parent.loadSection('market-analysis', result.deck_id);
        } else {
          console.error('Cannot access parent loadSection function');
          alert('Solution saved! Please click "Market Analysis" in the sidebar to continue.');
        }
      } else {
        alert('Error saving solution: ' + (result.detail || 'Unknown error'));
      }
    } catch (error) {
      console.error('Error saving solution:', error);
      alert('Failed to save solution. Please try again.');
    }
  }
});
</script>
