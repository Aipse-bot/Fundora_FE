<section id="mainContent" class="px-4 sm:px-6 lg:px-8 w-full max-w-screen-lg mx-auto p-3 min-h-full pb-10">
  <div class="bg-slate-800/70 p-8 rounded-2xl shadow-xl border border-slate-700 backdrop-blur-md">
    <h1 class="text-4xl sm:text-5xl font-bold mb-10 bg-gradient-to-r from-blue-400 to-blue-600 bg-clip-text text-transparent">
      The Ask
    </h1>

    <form id="askForm" class="space-y-8">
      <!-- Funding Amount -->
      <div>
        <label for="amount" class="block mb-3 text-gray-300 font-semibold text-xl">Funding Amount Sought</label>
        <input
          type="number"
          id="amount"
          name="amount"
          placeholder="₱0.00"
          class="w-full p-3 bg-slate-900 border border-slate-700 rounded-lg text-gray-100 placeholder-gray-500 focus:ring-2 focus:ring-blue-600 focus:border-blue-600 outline-none transition"
        />
      </div>

      <!-- Usage Description -->
      <div>
        <label for="usage_description" class="block mb-3 text-gray-300 font-semibold text-xl">How will the funds be used?</label>
        <textarea
          id="usage_description"
          name="usage_description"
          rows="6"
          placeholder="Describe how the funds will be allocated..."
          class="w-full p-3 bg-slate-900 border border-slate-700 rounded-lg text-gray-100 placeholder-gray-500 resize-none focus:ring-2 focus:ring-blue-600 focus:border-blue-600 outline-none transition"
        ></textarea>
      </div>

      <!-- Submit -->
      <div class="flex justify-end">
        <button
          type="submit"
          class="px-6 py-2 bg-blue-600 text-white rounded-lg font-medium hover:bg-blue-700 transition-all duration-200 shadow-md hover:shadow-blue-500/30"
        >
          Submit
        </button>
      </div>
    </form>
  </div>
</section>

<!-- Preview Panel -->
<section id="card-panel" class="min-h-screen flex px-5 py-10 items-center justify-center">
  <div class="w-full max-w-lg bg-slate-800/70 rounded-2xl p-8 shadow-xl border border-slate-700 text-center backdrop-blur-md">
    <h1 class="text-3xl font-bold text-white mb-6">We Are Seeking</h1>

    <!-- Funding Amount -->
    <div class="mb-6">
      <div class="mb-2 text-gray-400 font-semibold text-xl">Funding Amount (₱)</div>
      <p id="preview-amount" class="text-4xl font-extrabold text-green-400">Loading...</p>
    </div>

    <!-- Usage Description -->
    <div>
      <div class="mb-2 text-gray-400 font-semibold text-xl">Use of Funds</div>
      <p id="preview-usage" class="text-gray-300 text-base leading-relaxed">Loading...</p>
    </div>
  </div>
</section>
