<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="csrf-token" content="{{ csrf_token }}">
  <title>Deck Report</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <style>
    body { 
      font-family: 'Inter', sans-serif; 
      contain: layout style paint;
      background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
    }
    
    @keyframes fadeInUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes slideDown { from { opacity: 0; transform: translateY(-10px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes scaleIn { from { opacity: 0; transform: scale(0.98); } to { opacity: 1; transform: scale(1); } }
    
    .fade-in-up { animation: fadeInUp 0.6s ease-out forwards; opacity: 0; }
    .scale-in { animation: scaleIn 0.5s ease-out forwards; opacity: 0; }
    
    .report-card { 
      contain: layout style paint;
      transition: all 0.3s ease;
      opacity: 0;
      animation: scaleIn 0.5s ease-out forwards;
    }
    .report-card:hover {
      transform: translateY(-4px);
      box-shadow: 0 8px 20px rgba(59, 130, 246, 0.15);
    }
    
    .report-card:nth-child(1) { animation-delay: 0.05s; }
    .report-card:nth-child(2) { animation-delay: 0.1s; }
    .report-card:nth-child(3) { animation-delay: 0.15s; }
    .report-card:nth-child(4) { animation-delay: 0.2s; }
    .report-card:nth-child(5) { animation-delay: 0.25s; }
    .report-card:nth-child(6) { animation-delay: 0.3s; }
    
    header { animation: slideDown 0.5s ease-out; }
    
    button, a { transition: all 0.3s ease; }
    button:hover, a:hover {
      transform: translateY(-1px);
    }
    button:active, a:active {
      transform: translateY(0);
    }
  </style>
</head>

<body class="bg-slate-950 text-gray-100 min-h-screen">

  <!-- Header -->
  <header class="bg-slate-900/95 backdrop-blur-sm border-b border-slate-800 shadow-lg sticky top-0 z-50">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
      <div class="flex justify-between items-center h-16">
        <div class="flex items-center space-x-3">
          <div class="w-10 h-10 bg-gradient-to-br from-blue-500 to-emerald-500 rounded-xl flex items-center justify-center">
            <svg class="w-6 h-6 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path>
            </svg>
          </div>
          <span class="text-2xl font-bold text-white">Fundora</span>
        </div>
        <div id="header-user" class="flex items-center space-x-4"></div>
      </div>
    </div>

    <script>
      function renderHeaderUser(user) {
        const container = document.getElementById('header-user');
        container.innerHTML = '';
        if (!user || !user.name) return;
        container.innerHTML = `
          <span class="text-gray-400 text-sm">Welcome, <span class="font-semibold text-white">${user.name}</span></span>
          <a href="/logout.html" class="inline-flex items-center px-4 py-2 text-sm font-medium rounded-lg text-gray-300 hover:text-white border border-slate-700 hover:border-blue-500 bg-slate-800 hover:bg-slate-700 transition-all">Logout</a>`;
      }
    </script>
  </header>

  <!-- Report Container -->
  <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-10">
    
    <!-- Back Button -->
    <div class="mb-6 fade-in-up">
      <button onclick="history.back()" class="flex items-center gap-2 px-4 py-2.5 bg-slate-800 hover:bg-slate-700 border border-slate-700 text-gray-300 hover:text-white rounded-xl transition-all">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path>
        </svg>
        <span class="font-medium">Back</span>
      </button>
    </div>

    <div id="deckReportContainer" class="space-y-8">

      <!-- Company Header -->
      <div class="bg-gradient-to-r from-blue-600 to-emerald-600 text-white px-8 py-8 rounded-2xl shadow-2xl fade-in-up" style="animation-delay: 0.1s;">
        <div class="flex flex-col sm:flex-row items-start sm:items-center justify-between gap-6">
          <div class="flex items-center space-x-5">
            <div id="companyInitial" class="bg-white text-blue-600 font-bold w-16 h-16 flex items-center justify-center text-2xl rounded-2xl shadow-lg">L</div>
            <div>
              <h1 id="companyName" class="text-4xl font-bold mb-2">Loading...</h1>
              <p id="companyTagline" class="text-blue-100 text-xl">Loading tagline...</p>
            </div>
          </div>
          <div class="flex items-center gap-3">
            <div class="bg-white/10 backdrop-blur-sm border border-white/20 rounded-xl px-4 py-2">
              <p class="text-xs text-blue-100 font-medium">PITCH DECK REPORT</p>
            </div>
          </div>
        </div>
      </div>

      <!-- Main Content -->
      <div class="space-y-8 fade-in-up" style="animation-delay: 0.2s;">

        <!-- Problem & Solution -->
        <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
          <div class="report-card bg-slate-800/50 border border-slate-700 rounded-2xl overflow-hidden shadow-xl">
            <div class="bg-red-500/10 border-b border-red-500/30 px-6 py-4">
              <h2 class="text-xl font-bold text-white flex items-center">
                <svg class="w-6 h-6 mr-2 text-red-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"></path>
                </svg>
                The Problem
              </h2>
            </div>
            <div class="p-6">
              <p id="problemDescription" class="text-gray-300 text-base leading-relaxed">—</p>
            </div>
          </div>

          <div class="report-card bg-slate-800/50 border border-slate-700 rounded-2xl overflow-hidden shadow-xl">
            <div class="bg-emerald-500/10 border-b border-emerald-500/30 px-6 py-4">
              <h2 class="text-xl font-bold text-white flex items-center">
                <svg class="w-6 h-6 mr-2 text-emerald-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path>
                </svg>
                The Solution
              </h2>
            </div>
            <div class="p-6">
              <p id="solutionDescription" class="text-gray-300 text-base leading-relaxed">—</p>
            </div>
          </div>
        </div>

        <!-- Market & Financials Grid -->
        <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">

          <!-- Market Analysis -->
          <div class="report-card bg-slate-800/50 border border-slate-700 rounded-2xl overflow-hidden shadow-xl">
            <div class="bg-purple-500/10 border-b border-purple-500/30 px-6 py-4">
              <h2 class="text-xl font-bold text-white flex items-center">
                <svg class="w-6 h-6 mr-2 text-purple-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3.055 11H5a2 2 0 012 2v1a2 2 0 002 2 2 2 0 012 2v2.945M8 3.935V5.5A2.5 2.5 0 0010.5 8h.5a2 2 0 012 2 2 2 0 104 0 2 2 0 012-2h1.064M15 20.488V18a2 2 0 012-2h3.064M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path>
                </svg>
                Market Analysis
              </h2>
            </div>
            <div class="p-6 space-y-4">
              <div class="flex justify-between items-start py-3 border-b border-slate-700">
                <span class="text-gray-400 font-medium">Primary Market</span>
                <span id="primaryMarket" class="text-white font-semibold text-right max-w-xs">—</span>
              </div>
              <div class="flex justify-between items-start py-3 border-b border-slate-700">
                <span class="text-gray-400 font-medium">Target Audience</span>
                <span id="targetAudience" class="text-white font-semibold text-right max-w-xs">—</span>
              </div>
              <div class="flex justify-between items-start py-3 border-b border-slate-700">
                <span class="text-gray-400 font-medium">Market Growth</span>
                <span id="marketGrowthRate" class="text-emerald-400 font-bold text-right">—</span>
              </div>
              <div class="flex justify-between items-start py-3">
                <span class="text-gray-400 font-medium">Our Advantage</span>
                <span id="competitiveAdvantage" class="text-blue-400 font-semibold text-right max-w-xs">—</span>
              </div>
            </div>
          </div>

          <!-- Financial Table -->
          <div class="report-card bg-slate-800/50 border border-slate-700 rounded-2xl overflow-hidden shadow-xl">
            <div class="bg-blue-500/10 border-b border-blue-500/30 px-6 py-4">
              <h2 class="text-xl font-bold text-white flex items-center">
                <svg class="w-6 h-6 mr-2 text-blue-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 7h6m0 10v-3m-3 3h.01M9 17h.01M9 14h.01M12 14h.01M15 11h.01M12 11h.01M9 11h.01M7 21h10a2 2 0 002-2V5a2 2 0 00-2-2H7a2 2 0 00-2 2v14a2 2 0 002 2z"></path>
                </svg>
                Financial Projection
              </h2>
            </div>
            <div class="p-6 overflow-x-auto">
              <table class="w-full text-sm">
                <thead>
                  <tr class="border-b border-slate-700">
                    <th class="px-4 py-3 text-left font-semibold text-gray-300">Year</th>
                    <th class="px-4 py-3 text-right font-semibold text-gray-300">Revenue</th>
                    <th class="px-4 py-3 text-right font-semibold text-gray-300">Profit</th>
                  </tr>
                </thead>
                <tbody id="financialTableBody" class="divide-y divide-slate-700"></tbody>
              </table>
            </div>
          </div>

          <!-- Funding Request -->
          <div class="report-card bg-gradient-to-br from-emerald-500/10 to-blue-500/10 border border-emerald-500/30 rounded-2xl shadow-xl p-8 text-center">
            <div class="inline-flex items-center justify-center w-16 h-16 bg-emerald-500/20 border border-emerald-500/30 rounded-2xl mb-4">
              <svg class="w-8 h-8 text-emerald-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8c-1.657 0-3 .895-3 2s1.343 2 3 2 3 .895 3 2-1.343 2-3 2m0-8c1.11 0 2.08.402 2.599 1M12 8V7m0 1v8m0 0v1m0-1c-1.11 0-2.08-.402-2.599-1M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path>
              </svg>
            </div>
            <h2 class="text-xl font-bold text-white mb-3">Funding Request</h2>
            <p id="askAmount" class="text-5xl font-extrabold text-emerald-400 mb-4">₱0</p>
            <div class="bg-slate-800/50 rounded-xl p-4 border border-slate-700">
              <p class="text-sm text-gray-400 mb-2 font-medium">Use of Funds</p>
              <span id="askUsage" class="text-gray-300">Loading...</span>
            </div>
          </div>

          <!-- Chart -->
          <div class="report-card bg-slate-800/50 border border-slate-700 rounded-2xl overflow-hidden shadow-xl">
            <div class="bg-yellow-500/10 border-b border-yellow-500/30 px-6 py-4">
              <h2 class="text-xl font-bold text-white flex items-center">
                <svg class="w-6 h-6 mr-2 text-yellow-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 7h8m0 0v8m0-8l-8 8-4-4-6 6"></path>
                </svg>
                Growth Chart
              </h2>
            </div>
            <div class="p-6">
              <canvas id="financialChart" class="w-full" style="max-height: 300px;"></canvas>
            </div>
          </div>

        </div>
      </div>
    </div>
  </div>

  <script>
    const domCache = {};
    function getCachedElement(id) {
      if (!domCache[id]) domCache[id] = document.getElementById(id);
      return domCache[id];
    }

    const startupId = new URLSearchParams(window.location.search).get('id');
    const token = sessionStorage.getItem('authToken');

    async function loadData() {
      try {
        const res = await fetch(`http://127.0.0.1:8000/api/startup/${startupId}/report/`, {
          headers: { Authorization: `Bearer ${token}` }
        });

        if (!res.ok) throw new Error(`HTTP error! status: ${res.status}`);
        const data = await res.json();

        if (data.report_type !== 'deck') {
          alert('This startup is not linked to a deck.');
          return;
        }

        getCachedElement('companyInitial').textContent = data.deck_info.company_name?.charAt(0) || '—';
        getCachedElement('companyName').textContent = data.deck_info.company_name || '—';
        getCachedElement('companyTagline').textContent = data.deck_info.tagline || '—';

        getCachedElement('problemDescription').textContent = data.problem?.description || '—';
        getCachedElement('solutionDescription').textContent = data.solution?.description || '—';

        getCachedElement('primaryMarket').textContent = data.market_analysis?.primary_market || '—';
        getCachedElement('targetAudience').textContent = data.market_analysis?.target_audience || '—';
        getCachedElement('marketGrowthRate').textContent = data.market_analysis?.market_growth_rate || '—';
        getCachedElement('competitiveAdvantage').textContent = data.market_analysis?.competitive_advantage || '—';

        const tbody = getCachedElement('financialTableBody');
        tbody.innerHTML = '';
        if (data.financials?.length) {
          data.financials.forEach(row => {
            const tr = document.createElement('tr');
            tr.className = 'hover:bg-slate-700/30 transition';
            tr.innerHTML = `
              <td class="px-4 py-3 text-gray-300">${row.year}</td>
              <td class="px-4 py-3 text-right text-white font-semibold">₱${parseFloat(row.revenue).toLocaleString()}</td>
              <td class="px-4 py-3 text-right text-emerald-400 font-semibold">₱${parseFloat(row.profit).toLocaleString()}</td>
            `;
            tbody.appendChild(tr);
          });
        } else {
          tbody.innerHTML = `<tr><td colspan="3" class="px-4 py-6 text-center text-gray-500">No financial data available</td></tr>`;
        }

        getCachedElement('askAmount').textContent = `₱${parseFloat(data.ask?.amount || 0).toLocaleString(undefined, { maximumFractionDigits: 0 })}`;
        getCachedElement('askUsage').textContent = data.ask?.usage_description || '—';

        renderFinancialChart(data.financials || []);
      } catch (err) {
        console.error('Failed to load report:', err);
        alert('Failed to load report data. Please try again.');
      }
    }

    let financialChart = null;
    function renderFinancialChart(financials) {
      const ctx = getCachedElement('financialChart').getContext('2d');
      const years = financials.map(f => f.year);
      const revenues = financials.map(f => parseFloat(f.revenue));
      const profits = financials.map(f => parseFloat(f.profit));

      if (financialChart) financialChart.destroy();
      
      financialChart = new Chart(ctx, {
        type: 'line',
        data: {
          labels: years,
          datasets: [
            { 
              label: 'Revenue', 
              data: revenues, 
              borderColor: 'rgb(59, 130, 246)',
              backgroundColor: 'rgba(59, 130, 246, 0.1)',
              tension: 0.4,
              fill: true,
              pointRadius: 5,
              pointBackgroundColor: 'rgb(59, 130, 246)',
              pointBorderColor: '#fff',
              pointBorderWidth: 2
            },
            { 
              label: 'Profit', 
              data: profits, 
              borderColor: 'rgb(16, 185, 129)',
              backgroundColor: 'rgba(16, 185, 129, 0.1)',
              tension: 0.4,
              fill: true,
              pointRadius: 5,
              pointBackgroundColor: 'rgb(16, 185, 129)',
              pointBorderColor: '#fff',
              pointBorderWidth: 2
            }
          ]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          plugins: {
            legend: { 
              labels: { 
                color: '#E5E7EB',
                font: { size: 12, weight: '600' },
                padding: 15
              } 
            },
            tooltip: {
              backgroundColor: 'rgba(15, 23, 42, 0.95)',
              titleColor: '#fff',
              bodyColor: '#cbd5e1',
              borderColor: 'rgba(59, 130, 246, 0.5)',
              borderWidth: 1,
              padding: 12
            }
          },
          scales: {
            x: {
              ticks: { color: '#9ca3af' },
              grid: { color: 'rgba(148, 163, 184, 0.1)' }
            },
            y: {
              beginAtZero: true,
              ticks: { 
                color: '#9ca3af',
                callback: function(value) {
                  return '₱' + (value / 1000000).toFixed(1) + 'M';
                }
              },
              grid: { color: 'rgba(148, 163, 184, 0.1)' }
            }
          }
        }
      });
    }

    document.addEventListener('DOMContentLoaded', loadData, { passive: true });
  </script>
</body>
</html>
