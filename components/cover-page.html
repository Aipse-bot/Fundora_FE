<section id="mainContent" class="bg-gray-100 text-black">
  <div class="px-4 sm:px-6 lg:px-8 w-full max-w-screen-lg mx-auto p-3 min-h-full pb-10">
    <div>
      <h1 class="text-4xl sm:text-5xl font-bold mb-8">Cover Page</h1>

      <form id="coverForm" enctype="multipart/form-data">
        <!-- Company Name -->
        <div class="mb-5">
          <label for="company_name" class="mb-2 block text-gray-500 font-semibold text-xl">Company Name</label>
          <input type="text" id="company_name" name="company_name" class="w-full p-3 border rounded" required />
          <p id="errorCompanyName" class="text-red-500 text-sm mt-1 hidden"></p>
        </div>

        <!-- Tagline -->
        <div class="mb-5">
          <label for="tagline" class="mb-2 block text-gray-500 font-semibold text-xl">Tagline</label>
          <input type="text" id="tagline" name="tagline" class="w-full p-3 border rounded" required />
          <p id="errorTagline" class="text-red-500 text-sm mt-1 hidden"></p>
        </div>

        <!-- Logo Upload -->
        <div class="mb-5">
          <label for="logo" class="mb-2 block text-gray-500 font-semibold text-xl">Logo</label>
          <div class="flex flex-col sm:flex-row items-start sm:items-center gap-4">
            <button type="button" id="openButton" class="px-4 py-2 bg-blue-600 text-white rounded hover:bg-blue-700 transition">Choose File</button>
            <input type="file" id="logo" name="logo" class="hidden" accept="image/*" />
            <p id="fileName" class="text-sm text-gray-700">No file chosen</p>
          </div>
          <p id="errorLogo" class="text-red-500 text-sm mt-1 hidden"></p>
        </div>

        <!-- Submit Button -->
        <div class="flex justify-end mt-6">
          <button type="submit" class="px-6 py-2 bg-green-600 text-white rounded hover:bg-green-700 transition">Next</button>
        </div>
      </form>
    </div>
  </div>
