<section id="mainContent" class="bg-slate-900 text-gray-100 min-h-screen flex items-center justify-center p-6">
  <div class="w-full max-w-4xl">
    <!-- Header Section -->
    <div class="text-center mb-8 fade-in-up">
      <div class="inline-flex items-center justify-center w-16 h-16 bg-blue-600 rounded-2xl mb-4">
        <svg class="w-8 h-8 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path>
        </svg>
      </div>
      <h1 class="text-3xl sm:text-4xl font-bold text-white mb-2">Let's Start Your Pitch Deck</h1>
      <p class="text-gray-400 text-lg">First, tell us about your company</p>
    </div>

    <!-- Form Card -->
    <div class="bg-slate-800/50 border border-slate-700 rounded-2xl shadow-2xl overflow-hidden fade-in-up" style="animation-delay: 0.1s;">
      <!-- Progress Bar -->
      <div class="bg-slate-900/50 px-8 py-4 border-b border-slate-700">
        <div class="flex items-center justify-between mb-2">
          <span class="text-sm font-medium text-gray-300">Step 1 of 7</span>
          <span class="text-sm font-medium text-blue-400">Cover Page</span>
        </div>
        <div class="w-full bg-slate-700 rounded-full h-2">
          <div class="bg-blue-500 h-2 rounded-full transition-all duration-500" style="width: 14.28%"></div>
        </div>
      </div>

      <!-- Form Content -->
      <form id="coverForm" enctype="multipart/form-data" class="p-8 space-y-8">
        
        <!-- Company Name -->
        <div class="group">
          <label for="company_name" class="flex items-center mb-3 text-gray-300 font-semibold text-base">
            <svg class="w-5 h-5 mr-2 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16m14 0h2m-2 0h-5m-9 0H3m2 0h5M9 7h1m-1 4h1m4-4h1m-1 4h1m-5 10v-5a1 1 0 011-1h2a1 1 0 011 1v5m-4 0h4"></path>
            </svg>
            Company Name
            <span class="text-red-400 ml-1">*</span>
          </label>
          <input
            type="text"
            id="company_name"
            name="company_name"
            class="w-full px-4 py-3.5 bg-slate-900/50 border border-slate-600 rounded-xl text-gray-100 placeholder-gray-500 focus:ring-2 focus:ring-blue-500 focus:border-transparent transition-all duration-300 hover:border-slate-500"
            placeholder="e.g., Acme Corporation"
            required
          />
          <p id="errorCompanyName" class="text-red-400 text-sm mt-2 hidden flex items-center">
            <svg class="w-4 h-4 mr-1" fill="currentColor" viewBox="0 0 20 20">
              <path fill-rule="evenodd" d="M18 10a8 8 0 11-16 0 8 8 0 0116 0zm-7 4a1 1 0 11-2 0 1 1 0 012 0zm-1-9a1 1 0 00-1 1v4a1 1 0 102 0V6a1 1 0 00-1-1z" clip-rule="evenodd"></path>
            </svg>
            <span></span>
          </p>
        </div>

        <!-- Tagline -->
        <div class="group">
          <label for="tagline" class="flex items-center mb-3 text-gray-300 font-semibold text-base">
            <svg class="w-5 h-5 mr-2 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 8h10M7 12h4m1 8l-4-4H5a2 2 0 01-2-2V6a2 2 0 012-2h14a2 2 0 012 2v8a2 2 0 01-2 2h-3l-4 4z"></path>
            </svg>
            Tagline
            <span class="text-red-400 ml-1">*</span>
          </label>
          <input
            type="text"
            id="tagline"
            name="tagline"
            class="w-full px-4 py-3.5 bg-slate-900/50 border border-slate-600 rounded-xl text-gray-100 placeholder-gray-500 focus:ring-2 focus:ring-blue-500 focus:border-transparent transition-all duration-300 hover:border-slate-500"
            placeholder="e.g., Revolutionizing the future of technology"
            required
          />
          <p id="errorTagline" class="text-red-400 text-sm mt-2 hidden flex items-center">
            <svg class="w-4 h-4 mr-1" fill="currentColor" viewBox="0 0 20 20">
              <path fill-rule="evenodd" d="M18 10a8 8 0 11-16 0 8 8 0 0116 0zm-7 4a1 1 0 11-2 0 1 1 0 012 0zm-1-9a1 1 0 00-1 1v4a1 1 0 102 0V6a1 1 0 00-1-1z" clip-rule="evenodd"></path>
            </svg>
            <span></span>
          </p>
        </div>

        <!-- Action Buttons -->
        <div class="flex justify-end gap-3 pt-4">
          <button
            type="submit"
            class="group flex items-center gap-2 px-8 py-3.5 bg-blue-600 text-white font-semibold rounded-xl hover:bg-blue-700 transition-all duration-300 shadow-lg hover:shadow-xl hover:scale-105"
          >
            <span>Continue</span>
            <svg class="w-5 h-5 group-hover:translate-x-1 transition-transform" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 7l5 5m0 0l-5 5m5-5H6"></path>
            </svg>
          </button>
        </div>
      </form>
    </div>
  </div>
</section>

<section id="card-panel" class="w-full h-full bg-slate-800 border-l border-slate-700 overflow-y-auto p-8 flex items-center justify-center">
  <div class="w-full max-w-md">
    <div class="bg-gradient-to-br from-slate-900 to-slate-800 border border-slate-700 rounded-2xl p-8 shadow-2xl min-h-[400px] flex flex-col items-center justify-center text-center">
      <div id="preview-initial" class="w-20 h-20 bg-blue-600 rounded-2xl flex items-center justify-center text-3xl font-bold text-white mb-6 shadow-lg">
        ?
      </div>
      <h2 id="preview-company-name" class="text-3xl font-bold text-white mb-3">Your Company Name</h2>
      <p id="preview-tagline" class="text-lg text-gray-400">Your tagline will appear here</p>
    </div>
  </div>
</section>

<style>
  @keyframes fadeInUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
  .fade-in-up { animation: fadeInUp 0.6s ease-out forwards; opacity: 0; }
  
  input:focus {
    transform: translateY(-1px);
  }
  
  .group:hover label {
    color: #93c5fd;
  }
</style>

<script>
  // Live preview updates
  const companyNameInput = document.getElementById('company_name');
  const taglineInput = document.getElementById('tagline');
  const previewCompanyName = document.getElementById('preview-company-name');
  const previewTagline = document.getElementById('preview-tagline');
  const previewInitial = document.getElementById('preview-initial');

  if (companyNameInput && previewCompanyName && previewInitial) {
    companyNameInput.addEventListener('input', (e) => {
      const value = e.target.value.trim();
      previewCompanyName.textContent = value || 'Your Company Name';
      previewInitial.textContent = value ? value.charAt(0).toUpperCase() : '?';
    });
  }

  if (taglineInput && previewTagline) {
    taglineInput.addEventListener('input', (e) => {
      const value = e.target.value.trim();
      previewTagline.textContent = value || 'Your tagline will appear here';
    });
  }
</script>
