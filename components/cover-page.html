<section id="mainContent" class="bg-slate-900 text-gray-100 min-h-screen">
  <div class="px-4 sm:px-6 lg:px-8 w-full max-w-screen-lg mx-auto p-6 pb-10">
    <div class="bg-slate-800 border border-slate-700 rounded-2xl shadow-lg p-8">
      <h1 class="text-4xl sm:text-5xl font-bold mb-10 text-white">Cover Page</h1>

      <form id="coverForm" enctype="multipart/form-data" class="space-y-6">

        <!-- Company Name -->
        <div>
          <label for="company_name" class="mb-2 block text-gray-300 font-semibold text-lg">Company Name</label>
          <input
            type="text"
            id="company_name"
            name="company_name"
            class="w-full p-3.5 bg-slate-700 border border-slate-600 rounded-lg text-gray-100 placeholder-gray-400 focus:ring-2 focus:ring-blue-500 focus:outline-none transition"
            placeholder="Enter your company name"
            required
          />
          <p id="errorCompanyName" class="text-red-500 text-sm mt-1 hidden"></p>
        </div>

        <!-- Tagline -->
        <div>
          <label for="tagline" class="mb-2 block text-gray-300 font-semibold text-lg">Tagline</label>
          <input
            type="text"
            id="tagline"
            name="tagline"
            class="w-full p-3.5 bg-slate-700 border border-slate-600 rounded-lg text-gray-100 placeholder-gray-400 focus:ring-2 focus:ring-blue-500 focus:outline-none transition"
            placeholder="Your company tagline"
            required
          />
          <p id="errorTagline" class="text-red-500 text-sm mt-1 hidden"></p>
        </div>

        <!-- Submit Button -->
        <div class="flex justify-end pt-6">
          <button
            type="submit"
            class="px-8 py-2.5 bg-gradient-to-r from-green-500 to-green-600 text-white font-semibold rounded-lg hover:from-green-600 hover:to-green-700 transform hover:scale-[1.02] transition shadow-lg"
          >
            Next →
          </button>
        </div>
      </form>
    </div>
  </div>
</section>
