<header class="bg-white shadow-sm border-b border-gray-200 sticky top-0 z-50">
  <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
    <div class="flex justify-between items-center h-16">
      
      <!-- Left side - Fundora logo/title -->
      <div class="flex items-center">
        <a href="/index.html" class="text-2xl font-bold text-blue-600 hover:text-blue-700 transition-colors duration-200">
          Fundora
        </a>
      </div>

      <!-- Right side - Welcome message and logout -->
      <div id="header-user" class="flex items-center space-x-4"></div>

    </div>
  </div>
  <script>
    function renderHeaderUser(user) {
        const container = document.getElementById('header-user');
        container.innerHTML = '';

        if (!user || !user.name) return;

        container.innerHTML = `
            <span class="text-gray-700 text-sm">
            Welcome, <span class="font-medium">${user.name}</span>
            </span>
            <a href="/logout.html"
            class="inline-flex items-center px-3 py-2 border border-transparent text-sm leading-4 font-medium rounded-md text-gray-500 hover:text-gray-700 hover:bg-gray-100 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500 transition-colors duration-200">
            Logout
            </a>
        `;
    }
  </script>
</header>
