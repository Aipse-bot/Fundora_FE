<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="csrf-token" content="{{ csrf_token }}">
  <title>Fundora | Edit Startup Information</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    body {
      font-family: 'Inter', sans-serif;
      background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
      height: 100vh;
      color: #e2e8f0;
      margin: 0;
    }

    .form-input-modern {
      background-color: #1e293b;
      border: 1px solid #334155;
      color: #f1f5f9;
      transition: all 0.2s ease-in-out;
    }
    .form-input-modern::placeholder {
      color: #94a3b8;
    }
    .form-input-modern:focus {
      border-color: #3b82f6;
      box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.3);
      outline: none;
    }
    .form-input-modern:hover {
      border-color: #475569;
    }

    .financial-section {
      background-color: #1e293b;
      border-left: 4px solid;
      transition: all 0.3s ease;
    }
    .financial-section:hover {
      transform: translateX(2px);
      box-shadow: 0 4px 10px rgba(0,0,0,0.2);
    }

    .dynamic-tooltip {
      visibility: hidden;
      background-color: #1e293b;
      color: #f8fafc;
      text-align: center;
      border-radius: 6px;
      padding: 8px 12px;
      position: fixed;
      z-index: 100;
      opacity: 0;
      transition: opacity 0.3s;
      max-width: 220px;
      font-size: 0.875rem;
      pointer-events: none;
    }
    .dynamic-tooltip.visible {
      visibility: visible;
      opacity: 1;
    }
    .tooltip-top::after {
      top: 100%;
      left: 50%;
      margin-left: -5px;
      border-color: #1e293b transparent transparent transparent;
    }

    .loading-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(15, 23, 42, 0.8);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 9999;
    }
    .loading-overlay.hidden {
      display: none;
    }

    .form-container {
      overflow-y: auto;
      overflow-x: hidden;
    }

    ::-webkit-scrollbar {
      width: 8px;
    }
    ::-webkit-scrollbar-thumb {
      background-color: #475569;
      border-radius: 4px;
    }
  </style>
</head>
<body class="flex flex-col h-screen">

  <!-- Loading Overlay -->
  <div id="loadingOverlay" class="loading-overlay">
    <div class="bg-slate-800 p-6 rounded-lg shadow-xl text-center border border-slate-700">
      <div class="animate-spin rounded-full h-12 w-12 border-b-2 border-blue-500 mx-auto mb-4"></div>
      <p class="text-slate-300 font-medium">Loading startup data...</p>
    </div>
  </div>

  <!-- Header -->
  <header class="bg-slate-900 border-b border-slate-700 shadow-sm sticky top-0 z-50">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
      <div class="flex justify-between items-center h-16">
        <div class="flex items-center space-x-3">
          <div class="bg-blue-600 p-2 rounded-lg">
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="none"
              stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M19 21V5a2 2 0 0 0-2-2H7a2 2 0 0 0-2 2v16m14 0h2m-2 0h-5m-9 0H3m2 0h5M9 7h1m-1 4h1m4-4h1m-1 4h1m-5 10v-5a1 1 0 0 1 1-1h2a1 1 0 0 1 1 1v5m-4 0h4"></path>
            </svg>
          </div>
          <span class="text-2xl font-bold text-white tracking-tight">Fundora</span>
        </div>
        <div class="flex items-center space-x-4">
          <span class="text-slate-400 text-sm">
            Welcome, <span class="font-semibold text-blue-400" id="user-email">Loading...</span>
          </span>
          <button onclick="window.location.href='added-startups.html'"
            class="text-slate-400 hover:text-blue-400 text-sm font-medium flex items-center space-x-1 transition">
            <i data-lucide="arrow-left" class="w-4 h-4"></i>
            <span>Back to Startups</span>
          </button>
        </div>
      </div>
    </div>
  </header>

  <!-- Main Form -->
  <main class="flex-1 min-h-0 py-2 overflow-hidden">
    <div class="max-w-full mx-auto px-2 h-full">
      <form id="editStartupForm" novalidate class="bg-slate-900 rounded-xl shadow-xl border border-slate-700 h-full flex flex-col">

        <!-- Form Header -->
        <div class="bg-gradient-to-r from-blue-600 to-blue-700 rounded-t-xl px-6 py-3">
          <h2 class="text-xl font-bold text-white flex items-center space-x-2">
            <i data-lucide="edit-3" class="w-6 h-6"></i>
            <span>Edit Startup Information</span>
          </h2>
        </div>

        <!-- Form Content -->
        <div class="form-container flex-1 px-6 py-4 overflow-y-auto overflow-x-hidden">
          <div class="grid lg:grid-cols-5 gap-6 h-full">

            <!-- LEFT COLUMN -->
            <div class="lg:col-span-2 flex flex-col space-y-4 h-full">
              <div class="bg-slate-800 rounded-lg p-5 border border-slate-700 flex-1 flex flex-col">
                <h3 class="text-base font-bold text-slate-100 mb-4 flex items-center space-x-2">
                  <i data-lucide="building-2" class="w-5 h-5 text-blue-500"></i>
                  <span>Core Information</span>
                </h3>

                <div class="flex-1 flex flex-col justify-between">
                  <div class="mb-4">
                    <label for="company-name" class="block text-sm font-semibold text-slate-300 mb-2">
                      Company Name <span class="text-red-500">*</span>
                    </label>
                    <input type="text" id="company-name" name="company-name"
                      class="form-input-modern w-full px-4 py-2.5 text-base rounded-lg"
                      placeholder="Enter company name" required />
                  </div>

                  <div class="mb-4">
                    <label for="industry" class="block text-sm font-semibold text-slate-300 mb-2">
                      Industry <span class="text-red-500">*</span>
                    </label>
                    <select id="industry" name="industry"
                      class="form-input-modern w-full px-4 py-2.5 text-base rounded-lg" required>
                      <option value="">Select Industry</option>
                      <option>Technology</option>
                      <option>Finance</option>
                      <option>Healthcare</option>
                      <option>E-commerce</option>
                      <option>Education</option>
                      <option>Real Estate</option>
                      <option>Manufacturing</option>
                      <option>Retail</option>
                      <option>Food & Beverage</option>
                      <option>Transportation</option>
                      <option>Energy</option>
                      <option>Entertainment</option>
                      <option>Agriculture</option>
                      <option>Other</option>
                    </select>
                  </div>

                  <div class="mb-0 flex-1 flex flex-col">
                    <label for="company-description" class="block text-sm font-semibold text-slate-300 mb-2">
                      Company Description
                    </label>
                    <textarea id="company-description" name="company-description"
                      class="form-input-modern w-full px-4 py-2.5 text-base rounded-lg resize-none flex-1"
                      placeholder="Brief description of your company..."></textarea>
                  </div>
                </div>
              </div>

              <!-- Data Completeness -->
              <div class="bg-slate-800 rounded-lg p-5 border border-slate-700">
                <div class="flex items-center justify-between mb-3">
                  <h4 class="text-sm font-bold text-slate-100 flex items-center space-x-2">
                    <i data-lucide="pie-chart" class="w-4 h-4 text-blue-400"></i>
                    <span>Data Completeness</span>
                  </h4>
                  <span id="completeness-text"
                    class="text-sm font-semibold text-slate-300 bg-slate-700 px-3 py-1 rounded-full">0% Complete</span>
                </div>
                <div class="w-full bg-slate-700 rounded-full h-3 shadow-inner">
                  <div id="completeness-bar"
                    class="h-3 rounded-full transition-all duration-500 bg-blue-500"
                    style="width: 0%"></div>
                </div>
                <p class="text-xs text-slate-400 mt-3 flex items-center space-x-1">
                  <i data-lucide="info" class="w-3 h-3"></i>
                  <span>Fill in more fields to increase confidence level</span>
                </p>
                <input type="hidden" id="data-completeness-level" name="data-completeness-level" value="Low" />
              </div>
            </div>

                    <!-- Right Column: Financials & Actions -->
                    <div class="lg:col-span-3 flex flex-col space-y-4 h-full">
                        <!-- Income Statement Section -->
                        <div class="financial-section border-green-500 rounded-lg p-5 flex-1">
                            <h3 class="text-base font-bold text-slate-100 mb-3 flex items-center space-x-2">
                            <i data-lucide="trending-up" class="w-5 h-5 text-green-400"></i>
                            <span>Income Statement</span>
                            </h3>
                            <div class="grid md:grid-cols-2 gap-4">
                                <div>
                                    <label for="current-revenue" class="flex items-center text-sm font-medium text-slate-700 mb-2">
                                        Current Revenue (PHP)
                                        <button type="button" class="tooltip-trigger ml-1.5 text-slate-400 hover:text-slate-600" data-tooltip-text="Total revenue in the most recent period">
                                            <i data-lucide="info" class="w-3.5 h-3.5"></i>
                                        </button>
                                    </label>
                                    <input 
                                        type="number" 
                                        id="current-revenue" 
                                        name="current-revenue" 
                                        class="form-input-modern w-full px-4 py-2.5 text-base rounded-lg focus:outline-none" 
                                        placeholder="0.00"
                                        step="0.01"
                                    />
                                </div>
                                <div>
                                    <label for="previous-revenue" class="flex items-center text-sm font-medium text-slate-700 mb-2">
                                        Previous Revenue (PHP)
                                        <button type="button" class="tooltip-trigger ml-1.5 text-slate-400 hover:text-slate-600" data-tooltip-text="Total revenue in the previous period">
                                            <i data-lucide="info" class="w-3.5 h-3.5"></i>
                                        </button>
                                    </label>
                                    <input 
                                        type="number" 
                                        id="previous-revenue" 
                                        name="previous-revenue" 
                                        class="form-input-modern w-full px-4 py-2.5 text-base rounded-lg focus:outline-none" 
                                        placeholder="0.00"
                                        step="0.01"
                                    />
                                </div>
                                <div>
                                    <label for="net-income" class="flex items-center text-sm font-medium text-slate-700 mb-2">
                                        Net Income (PHP)
                                        <button type="button" class="tooltip-trigger ml-1.5 text-slate-400 hover:text-slate-600" data-tooltip-text="Net profit after all expenses">
                                            <i data-lucide="info" class="w-3.5 h-3.5"></i>
                                        </button>
                                    </label>
                                    <input 
                                        type="number" 
                                        id="net-income" 
                                        name="net-income" 
                                        class="form-input-modern w-full px-4 py-2.5 text-base rounded-lg focus:outline-none" 
                                        placeholder="0.00"
                                        step="0.01"
                                    />
                                </div>
                                <div>
                                    <label for="income-period" class="block text-sm font-medium text-slate-700 mb-2">Reporting Period</label>
                                    <select 
                                        id="income-period" 
                                        name="income-period" 
                                        class="form-input-modern w-full px-4 py-2.5 text-base rounded-lg focus:outline-none"
                                    >
                                        <option value="yearly">Yearly</option>
                                        <option value="quarterly">Quarterly</option>
                                        <option value="monthly">Monthly</option>
                                    </select>
                                </div>
                            </div>
                        </div>

                        <!-- Balance Sheet Section -->
                        <div class="financial-section border-purple-500 rounded-lg p-5 flex-1">
                            <h3 class="text-base font-bold text-slate-100 mb-3 flex items-center space-x-2">
                            <i data-lucide="scale" class="w-5 h-5 text-purple-400"></i>
                            <span>Balance Sheet</span>
                            </h3>
                            <div class="grid md:grid-cols-2 gap-4">
                                <div>
                                    <label for="total-assets" class="flex items-center text-sm font-medium text-slate-700 mb-2">
                                        Total Assets (PHP)
                                        <button type="button" class="tooltip-trigger ml-1.5 text-slate-400 hover:text-slate-600" data-tooltip-text="Sum of all company assets">
                                            <i data-lucide="info" class="w-3.5 h-3.5"></i>
                                        </button>
                                    </label>
                                    <input 
                                        type="number" 
                                        id="total-assets" 
                                        name="total-assets" 
                                        class="form-input-modern w-full px-4 py-2.5 text-base rounded-lg focus:outline-none" 
                                        placeholder="0.00"
                                        step="0.01"
                                    />
                                </div>
                                <div>
                                    <label for="total-liabilities" class="flex items-center text-sm font-medium text-slate-700 mb-2">
                                        Total Liabilities (PHP)
                                        <button type="button" class="tooltip-trigger ml-1.5 text-slate-400 hover:text-slate-600" data-tooltip-text="Sum of all company liabilities">
                                            <i data-lucide="info" class="w-3.5 h-3.5"></i>
                                        </button>
                                    </label>
                                    <input 
                                        type="number" 
                                        id="total-liabilities" 
                                        name="total-liabilities" 
                                        class="form-input-modern w-full px-4 py-2.5 text-base rounded-lg focus:outline-none" 
                                        placeholder="0.00"
                                        step="0.01"
                                    />
                                </div>
                                <div class="md:col-span-2">
                                    <label for="shareholder-equity" class="flex items-center text-sm font-medium text-slate-700 mb-2">
                                        Shareholder Equity (PHP)
                                        <span class="ml-2 text-xs text-blue-600 bg-blue-50 px-2 py-1 rounded">Auto-calculated</span>
                                    </label>
                                    <input 
                                        type="text" 
                                        id="shareholder-equity" 
                                        name="shareholder-equity" 
                                        class="form-input-modern w-full px-4 py-2.5 text-base rounded-lg focus:outline-none bg-slate-50" 
                                        placeholder="₱ 0.00"
                                        disabled
                                    />
                                </div>
                            </div>
                        </div>

                        <!-- Cash Flow Section -->
                        <div class="financial-section border-blue-500 rounded-lg p-5 flex-1">
                            <h3 class="text-base font-bold text-slate-100 mb-3 flex items-center space-x-2">
                            <i data-lucide="dollar-sign" class="w-5 h-5 text-blue-400"></i>
                            <span>Cash Flow Statement</span>
                            </h3>
                            <div class="grid md:grid-cols-3 gap-4">
                                <div>
                                    <label for="cash-flow" class="flex items-center text-sm font-medium text-slate-700 mb-2">
                                        Operations (PHP)
                                        <button type="button" class="tooltip-trigger ml-1.5 text-slate-400 hover:text-slate-600" data-tooltip-text="Cash from operations">
                                            <i data-lucide="info" class="w-3.5 h-3.5"></i>
                                        </button>
                                    </label>
                                    <input 
                                        type="number" 
                                        id="cash-flow" 
                                        name="cash-flow" 
                                        class="form-input-modern w-full px-4 py-2.5 text-base rounded-lg focus:outline-none" 
                                        placeholder="0.00"
                                        step="0.01"
                                    />
                                </div>
                                <div>
                                    <label for="investment-flow" class="flex items-center text-sm font-medium text-slate-700 mb-2">
                                        Investing (PHP)
                                        <button type="button" class="tooltip-trigger ml-1.5 text-slate-400 hover:text-slate-600" data-tooltip-text="Cash from investing activities">
                                            <i data-lucide="info" class="w-3.5 h-3.5"></i>
                                        </button>
                                    </label>
                                    <input 
                                        type="number" 
                                        id="investment-flow" 
                                        name="investment-flow" 
                                        class="form-input-modern w-full px-4 py-2.5 text-base rounded-lg focus:outline-none" 
                                        placeholder="0.00"
                                        step="0.01"
                                    />
                                </div>
                                <div>
                                    <label for="financing-flow" class="flex items-center text-sm font-medium text-slate-700 mb-2">
                                        Financing (PHP)
                                        <button type="button" class="tooltip-trigger ml-1.5 text-slate-400 hover:text-slate-600" data-tooltip-text="Cash from financing activities">
                                            <i data-lucide="info" class="w-3.5 h-3.5"></i>
                                        </button>
                                    </label>
                                    <input 
                                        type="number" 
                                        id="financing-flow" 
                                        name="financing-flow" 
                                        class="form-input-modern w-full px-4 py-2.5 text-base rounded-lg focus:outline-none" 
                                        placeholder="0.00"
                                        step="0.01"
                                    />
                                </div>
                            </div>
                        </div>

                        <!-- Qualitative Assessment Section -->
                        <div class="financial-section border-purple-500 rounded-lg p-5 flex-1">
                            <h3 class="text-base font-bold text-slate-100 mb-3 flex items-center space-x-2">
                            <i data-lucide="users" class="w-5 h-5 text-purple-400"></i>
                            <span>Qualitative Assessment</span>
                            </h3>
                            <div class="space-y-4">
                                <div>
                                    <label for="team-strength" class="flex items-center text-sm font-medium text-slate-700 mb-2">
                                        Team Strength
                                        <button type="button" class="tooltip-trigger ml-1.5 text-slate-400 hover:text-slate-600" data-tooltip-text="Describe the leadership team's experience, skills, and track record">
                                            <i data-lucide="info" class="w-3.5 h-3.5"></i>
                                        </button>
                                    </label>
                                    <textarea 
                                        id="team-strength" 
                                        name="team-strength" 
                                        rows="3" 
                                        class="form-input-modern w-full px-4 py-2.5 text-base rounded-lg focus:outline-none resize-none" 
                                        placeholder="Describe the team's expertise, experience, and key strengths..."
                                    ></textarea>
                                </div>
                                <div>
                                    <label for="market-position" class="flex items-center text-sm font-medium text-slate-700 mb-2">
                                        Market Position
                                        <button type="button" class="tooltip-trigger ml-1.5 text-slate-400 hover:text-slate-600" data-tooltip-text="Describe the company's competitive position and market share">
                                            <i data-lucide="info" class="w-3.5 h-3.5"></i>
                                        </button>
                                    </label>
                                    <textarea 
                                        id="market-position" 
                                        name="market-position" 
                                        rows="3" 
                                        class="form-input-modern w-full px-4 py-2.5 text-base rounded-lg focus:outline-none resize-none" 
                                        placeholder="Explain the company's standing in the market, competitive advantages..."
                                    ></textarea>
                                </div>
                                <div>
                                    <label for="brand-reputation" class="flex items-center text-sm font-medium text-slate-700 mb-2">
                                        Brand Reputation
                                        <button type="button" class="tooltip-trigger ml-1.5 text-slate-400 hover:text-slate-600" data-tooltip-text="Assess the company's brand value and public perception">
                                            <i data-lucide="info" class="w-3.5 h-3.5"></i>
                                        </button>
                                    </label>
                                    <textarea 
                                        id="brand-reputation" 
                                        name="brand-reputation" 
                                        rows="3" 
                                        class="form-input-modern w-full px-4 py-2.5 text-base rounded-lg focus:outline-none resize-none" 
                                        placeholder="Describe brand recognition, customer loyalty, reputation..."
                                    ></textarea>
                                </div>
                            </div>
                        </div>

                        <!-- Action Buttons -->
                        <div class="flex flex-col sm:flex-row gap-4 pt-4">
                            <button type="submit"
                            class="flex-1 bg-gradient-to-r from-blue-600 to-blue-700 hover:from-blue-700 hover:to-blue-800 text-white font-bold py-3.5 px-6 rounded-lg transition-all duration-200 flex items-center justify-center space-x-2 shadow-lg hover:shadow-xl transform hover:-translate-y-0.5">
                            <i data-lucide="save" class="w-5 h-5"></i>
                            <span>Update Startup</span>
                            </button>
                            <button type="button" onclick="window.location.href='added-startups.html'"
                            class="flex-1 bg-slate-700 hover:bg-slate-600 text-slate-200 font-semibold py-3.5 px-6 rounded-lg transition-all duration-200 flex items-center justify-center space-x-2 shadow">
                            <i data-lucide="x" class="w-5 h-5"></i>
                            <span>Cancel</span>
                            </button>
                        </div>
                        </div>

                    </div>
                    </div>
                </form>
                </div>
            </main>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            lucide.createIcons();

            const form = document.getElementById('editStartupForm');
            const totalAssetsInput = document.getElementById('total-assets');
            const totalLiabilitiesInput = document.getElementById('total-liabilities');
            const shareholderEquityInput = document.getElementById('shareholder-equity');
            const completenessBar = document.getElementById('completeness-bar');
            const completenessText = document.getElementById('completeness-text');
            const completenessHiddenInput = document.getElementById('data-completeness-level');
            const loadingOverlay = document.getElementById('loadingOverlay');
            let tooltipElement;
            
            // --- Submission state management
            let isSubmitting = false;
            let hasSuccessfulSubmission = false;
            let startupId = null;

            // --- Get Startup ID from URL ---
            function getStartupIdFromUrl() {
                const urlParams = new URLSearchParams(window.location.search);
                return urlParams.get('id');
            }

            // --- Load User Information ---
            async function loadUserInfo() {
                const token = localStorage.getItem('authToken');
                const userEmailElement = document.getElementById('user-email');

                if (!token) {
                    userEmailElement.textContent = 'No user logged in';
                    userEmailElement.className = 'font-semibold text-red-600';
                    alert('Please log in to access this page.');
                    window.location.href = '../login.html';
                    return;
                }

                const storedUserData = localStorage.getItem('userData');
                if (storedUserData) {
                    try {
                        const userData = JSON.parse(storedUserData);
                        userEmailElement.textContent = userData.email || 'User';
                        userEmailElement.className = 'font-semibold text-slate-800';
                        return;
                    } catch (error) {
                        console.error('Error parsing user data:', error);
                    }
                }

                userEmailElement.textContent = 'Token found, no user info';
                userEmailElement.className = 'font-semibold text-yellow-600';
            }

            // --- Load Startup Data ---
            async function loadStartupData() {
                startupId = getStartupIdFromUrl();
                
                if (!startupId || startupId === 'unknown') {
                    alert('Invalid startup ID. Redirecting back...');
                    window.location.href = 'added-startups.html';
                    return;
                }

                const token = localStorage.getItem('authToken');
                if (!token) {
                    alert('Please log in to edit startup information.');
                    window.location.href = '../login.html';
                    return;
                }

                // Loading overlay is already visible by default

                try {
                    const response = await fetch(`https://fundora-be-singapore.onrender.com/api/startup/${startupId}/`, {
                        method: 'GET',
                        headers: {
                            'Authorization': `Bearer ${token}`,
                            'Content-Type': 'application/json'
                        }
                    });

                    if (!response.ok) {
                        const errorData = await response.json();
                        throw new Error(errorData.error || errorData.detail || 'Failed to load startup data');
                    }

                    const data = await response.json();
                    console.log('Loaded startup data:', data);

                    // Populate form with startup data
                    const startup = data.startup || data;
                    populateForm(startup);

                } catch (error) {
                    console.error('Error loading startup:', error);
                    alert(`Failed to load startup data: ${error.message}`);
                    window.location.href = 'added-startups.html';
                } finally {
                    // Hide loading overlay
                    loadingOverlay.classList.add('hidden');
                }
            }

            // --- Populate Form with Startup Data ---
            function populateForm(startup) {
                // Basic Information
                document.getElementById('company-name').value = startup.company_name || '';
                document.getElementById('industry').value = startup.industry || '';
                document.getElementById('company-description').value = startup.company_description || '';

                // Income Statement
                document.getElementById('current-revenue').value = startup.current_revenue || startup.revenue || '';
                document.getElementById('previous-revenue').value = startup.previous_revenue || '';
                document.getElementById('net-income').value = startup.net_income || '';
                document.getElementById('income-period').value = startup.reporting_period || 'yearly';

                // Balance Sheet
                document.getElementById('total-assets').value = startup.total_assets || '';
                document.getElementById('total-liabilities').value = startup.total_liabilities || '';
                
                // Cash Flow
                document.getElementById('cash-flow').value = startup.cash_flow || '';
                document.getElementById('investment-flow').value = startup.investment_flow || '';
                document.getElementById('financing-flow').value = startup.financing_flow || '';

                // Qualitative Assessment
                document.getElementById('team-strength').value = startup.team_strength || '';
                document.getElementById('market-position').value = startup.market_position || '';
                document.getElementById('brand-reputation').value = startup.brand_reputation || '';

                // Calculate shareholder equity
                calculateEquity();
                
                // Update completeness
                updateCompleteness();
            }

            // --- Auto-calculation for Shareholder Equity ---
            function calculateEquity() {
                const assets = parseFloat(totalAssetsInput.value) || 0;
                const liabilities = parseFloat(totalLiabilitiesInput.value) || 0;
                const equity = assets - liabilities;
                
                if (equity > 0) {
                    shareholderEquityInput.value = new Intl.NumberFormat('en-PH', { 
                        style: 'currency', 
                        currency: 'PHP' 
                    }).format(equity);
                } else {
                    shareholderEquityInput.value = '₱ 0.00';
                }
            }
            totalAssetsInput.addEventListener('input', calculateEquity);
            totalLiabilitiesInput.addEventListener('input', calculateEquity);

            // --- Dynamic Tooltip Logic ---
            function createTooltip() {
                if (!tooltipElement) {
                    tooltipElement = document.createElement('div');
                    tooltipElement.className = 'dynamic-tooltip tooltip-top';
                    document.body.appendChild(tooltipElement);
                }
            }
            
            document.querySelectorAll('.tooltip-trigger').forEach(trigger => {
                trigger.addEventListener('mouseenter', (e) => {
                    createTooltip();
                    const text = trigger.getAttribute('data-tooltip-text');
                    tooltipElement.textContent = text;
                    const rect = trigger.getBoundingClientRect();
                    
                    tooltipElement.classList.add('visible');
                    const tooltipRect = tooltipElement.getBoundingClientRect();

                    let top = rect.top - tooltipRect.height - 8;
                    let left = rect.left + (rect.width / 2) - (tooltipRect.width / 2);

                    if (left < 0) left = 5;
                    if (top < 0) {
                        top = rect.bottom + 8;
                        tooltipElement.className = 'dynamic-tooltip tooltip-bottom visible';
                    }

                    tooltipElement.style.top = `${top}px`;
                    tooltipElement.style.left = `${left}px`;
                });
                trigger.addEventListener('mouseleave', () => {
                    if (tooltipElement) {
                        tooltipElement.classList.remove('visible');
                    }
                });
            });

            // --- Data Completeness Calculation ---
            const formInputs = Array.from(form.querySelectorAll('input[type="text"], input[type="number"], select, textarea')).filter(el => !el.disabled);
            const totalFields = formInputs.length;

            function updateCompleteness() {
                let filledFields = 0;
                formInputs.forEach(input => {
                    if ((input.type === 'select-one' && input.value !== "") || (input.type !== 'select-one' && input.value && input.value.trim() !== '')) {
                        filledFields++;
                    }
                });

                const percentage = totalFields > 0 ? (filledFields / totalFields) * 100 : 0;
                completenessBar.style.width = percentage + '%';
                
                let level = 'Low';
                let barColor = 'bg-red-500';

                if (percentage > 75) {
                    level = 'High';
                    barColor = 'bg-green-500';
                    completenessText.textContent = `High Confidence (${Math.round(percentage)}%)`;
                } else if (percentage > 40) {
                    level = 'Medium';
                    barColor = 'bg-yellow-500';
                    completenessText.textContent = `Medium Confidence (${Math.round(percentage)}%)`;
                } else {
                    level = 'Low';
                    barColor = 'bg-red-500';
                    if(filledFields > 0) {
                        completenessText.textContent = `Low Confidence (${Math.round(percentage)}%)`;
                    } else {
                        completenessText.textContent = `Low Confidence (0%)`;
                    }
                }
                
                completenessHiddenInput.value = level;
                completenessBar.className = `h-2.5 rounded-full transition-all duration-300 ${barColor}`;
            }

            form.addEventListener('input', updateCompleteness);

            // --- Create Updated Startup Data Object ---
            function createUpdatedStartupData() {
                function parseNumericValue(value) {
                    if (!value || value.trim() === '') return null;
                    const cleaned = value.toString().replace(/[₱,\s]/g, '');
                    const parsed = parseFloat(cleaned);
                    return isNaN(parsed) ? null : parsed;
                }

                const assets = parseNumericValue(document.getElementById('total-assets').value);
                const liabilities = parseNumericValue(document.getElementById('total-liabilities').value);
                const calculatedEquity = (assets && liabilities) ? assets - liabilities : null;

                // Calculate confidence percentage
                const formInputs = Array.from(form.querySelectorAll('input[type="text"], input[type="number"], select, textarea')).filter(el => !el.disabled);
                const totalFields = formInputs.length;
                let filledFields = 0;
                
                formInputs.forEach(input => {
                    if ((input.type === 'select-one' && input.value !== "") || (input.type !== 'select-one' && input.value && input.value.trim() !== '')) {
                        filledFields++;
                    }
                });
                
                const actualPercentage = totalFields > 0 ? Math.round((filledFields / totalFields) * 100) : 0;
                
                let confidenceLevel = 'Low';
                if (actualPercentage > 75) {
                    confidenceLevel = 'High';
                } else if (actualPercentage > 40) {
                    confidenceLevel = 'Medium';
                }

                const startupData = {
                    company_name: document.getElementById('company-name').value.trim(),
                    industry: document.getElementById('industry').value,
                    company_description: document.getElementById('company-description').value.trim(),
                    
                    revenue: parseNumericValue(document.getElementById('current-revenue').value),
                    net_income: parseNumericValue(document.getElementById('net-income').value),
                    total_assets: parseNumericValue(document.getElementById('total-assets').value),
                    total_liabilities: parseNumericValue(document.getElementById('total-liabilities').value),
                    shareholder_equity: calculatedEquity,
                    cash_flow: parseNumericValue(document.getElementById('cash-flow').value),
                    
                    current_revenue: parseNumericValue(document.getElementById('current-revenue').value),
                    previous_revenue: parseNumericValue(document.getElementById('previous-revenue').value),
                    investment_flow: parseNumericValue(document.getElementById('investment-flow').value),
                    financing_flow: parseNumericValue(document.getElementById('financing-flow').value),
                    reporting_period: document.getElementById('income-period').value || 'yearly',
                    
                    team_strength: document.getElementById('team-strength').value.trim(),
                    market_position: document.getElementById('market-position').value.trim(),
                    brand_reputation: document.getElementById('brand-reputation').value.trim(),
                    
                    data_source_confidence: confidenceLevel,
                    confidence_percentage: actualPercentage,
                    
                    funding_ask: null
                };
                
                console.log('=== UPDATE DATA BEING SENT ===');
                console.log(JSON.stringify(startupData, null, 2));
                console.log('=============================');
                
                return startupData;
            }

            // --- Update Startup API Call ---
            async function updateStartupData(startupData) {
                const submitButton = form.querySelector('button[type="submit"]');
                const originalText = submitButton.innerHTML;
                
                try {
                    // Disable button and show loading state
                    submitButton.disabled = true;
                    submitButton.innerHTML = '<div class="animate-spin rounded-full h-5 w-5 border-b-2 border-white mx-auto"></div>';

                    const token = localStorage.getItem('authToken');
                    if (!token) {
                        throw new Error('No authentication token found');
                    }

                    console.log(`Updating startup ID: ${startupId}`);
                    const response = await fetch(`https://fundora-be-singapore.onrender.com/api/startup/${startupId}/`, {
                        method: 'PUT',
                        headers: {
                            'Authorization': `Bearer ${token}`,
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify(startupData)
                    });

                    const data = await response.json();
                    console.log('API Response:', data);

                    if (!response.ok) {
                        if (response.status === 401) {
                            throw new Error('Session expired. Please log in again.');
                        } else if (response.status === 403) {
                            throw new Error('You do not have permission to update this startup.');
                        } else if (response.status === 404) {
                            throw new Error('Startup not found.');
                        } else if (data.errors) {
                            const errorMessages = Object.entries(data.errors)
                                .map(([field, messages]) => `${field}: ${Array.isArray(messages) ? messages.join(', ') : messages}`)
                                .join('\n');
                            throw new Error(`Validation errors:\n${errorMessages}`);
                        } else {
                            throw new Error(data.error || data.detail || 'Failed to update startup');
                        }
                    }

                    // Success - Mark as successfully submitted
                    hasSuccessfulSubmission = true;
                    showSuccessMessage(data.message || 'Startup updated successfully!', startupId);
                    
                    // Keep button disabled and show success state
                    submitButton.disabled = true;
                    submitButton.innerHTML = `
                        <i data-lucide="check-circle" class="w-5 h-5 mr-2"></i>
                        <span>Updated Successfully</span>
                    `;
                    submitButton.className = "flex-1 bg-green-600 text-white font-bold py-3.5 px-6 rounded-lg flex items-center justify-center space-x-2 shadow-lg cursor-not-allowed";
                    lucide.createIcons();
                    
                    // Redirect after short delay
                    setTimeout(() => {
                        window.location.href = 'added-startups.html';
                    }, 2000);

                } catch (error) {
                    console.error('Update failed:', error);
                    showErrorMessage(error.message);
                    
                    // Re-enable button only on error
                    submitButton.disabled = false;
                    submitButton.innerHTML = originalText;
                    submitButton.className = "flex-1 bg-gradient-to-r from-blue-600 to-blue-700 hover:from-blue-700 hover:to-blue-800 text-white font-bold py-3.5 px-6 rounded-lg transition-all duration-200 flex items-center justify-center space-x-2 shadow-lg hover:shadow-xl transform hover:-translate-y-0.5";
                    lucide.createIcons();
                    isSubmitting = false;
                }
            }

            // --- Success/Error Messages ---
            function showSuccessMessage(message, startupId) {
                const notification = document.createElement('div');
                notification.className = 'fixed top-4 right-4 bg-green-500 text-white p-4 rounded-lg shadow-lg z-50 max-w-sm';
                notification.innerHTML = `
                    <div class="flex items-start space-x-3">
                        <i data-lucide="check-circle" class="w-6 h-6 flex-shrink-0"></i>
                        <div>
                            <p class="font-semibold">Success!</p>
                            <p class="text-sm">${message}</p>
                        </div>
                    </div>
                `;
                document.body.appendChild(notification);
                lucide.createIcons();
                
                setTimeout(() => {
                    notification.remove();
                }, 5000);
            }

            function showErrorMessage(message) {
                const notification = document.createElement('div');
                notification.className = 'fixed top-4 right-4 bg-red-500 text-white p-4 rounded-lg shadow-lg z-50 max-w-sm';
                notification.innerHTML = `
                    <div class="flex items-start space-x-3">
                        <i data-lucide="alert-circle" class="w-6 h-6 flex-shrink-0"></i>
                        <div>
                            <p class="font-semibold">Error</p>
                            <p class="text-sm">${message}</p>
                        </div>
                    </div>
                `;
                document.body.appendChild(notification);
                lucide.createIcons();
                
                setTimeout(() => {
                    notification.remove();
                }, 7000);
            }

            // --- Form Submission Handler ---
            form.addEventListener('submit', function(e) {
                e.preventDefault();
                
                // Prevent submission if already submitting
                if (isSubmitting) {
                    console.log('⚠️ Already submitting, please wait...');
                    return;
                }
                
                // Prevent resubmission after successful submission
                if (hasSuccessfulSubmission) {
                    console.log('⚠️ Form already submitted successfully. Redirecting...');
                    return;
                }
                
                if (!form.checkValidity()) {
                    form.reportValidity();
                    return;
                }
                
                const startupData = createUpdatedStartupData();
                
                // Check if minimum required fields are filled
                if (!startupData.company_name || !startupData.industry) {
                    showErrorMessage('Please fill in at least Company Name and Industry.');
                    return;
                }
                
                // Set submission flag
                isSubmitting = true;
                
                // Call update function
                updateStartupData(startupData);
            });

            // --- Initialize Page ---
            loadUserInfo();
            loadStartupData();
            createTooltip();
        });
    </script>
</body>
</html>
