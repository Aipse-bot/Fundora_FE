<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="csrf-token" content="{{ csrf_token }}">
  <title>Edit Startup Information</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    body {
      font-family: 'Inter', sans-serif;
      background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
      height: 100vh;
      color: #e2e8f0;
      margin: 0;
    }

    .form-input-modern {
      background-color: #1e293b;
      border: 1px solid #334155;
      color: #f1f5f9;
      transition: border-color 0.2s ease-in-out;
      contain: layout style;
    }
    .form-input-modern::placeholder {
      color: #94a3b8;
    }
    .form-input-modern:focus {
      border-color: #3b82f6;
      box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.3);
      outline: none;
    }
    .form-input-modern:hover {
      border-color: #475569;
    }

    .financial-section {
      background-color: #1e293b;
      border-left: 4px solid;
      transition: box-shadow 0.2s ease;
      contain: layout style paint;
    }
    .financial-section:hover {
      box-shadow: 0 4px 10px rgba(0,0,0,0.2);
    }

    .dynamic-tooltip {
      visibility: hidden;
      background-color: #1e293b;
      color: #f8fafc;
      text-align: center;
      border-radius: 6px;
      padding: 8px 12px;
      position: fixed;
      z-index: 100;
      opacity: 0;
      transition: opacity 0.2s;
      max-width: 220px;
      font-size: 0.875rem;
      pointer-events: none;
    }
    .dynamic-tooltip.visible {
      visibility: visible;
      opacity: 1;
    }
    .tooltip-top::after {
      top: 100%;
      left: 50%;
      margin-left: -5px;
      border-color: #1e293b transparent transparent transparent;
    }

    .loading-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(15, 23, 42, 0.8);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 9999;
    }
    .loading-overlay.hidden {
      display: none;
    }

    .form-container {
      overflow-y: auto;
      overflow-x: hidden;
    }

    ::-webkit-scrollbar {
      width: 8px;
    }
    ::-webkit-scrollbar-thumb {
      background-color: #475569;
      border-radius: 4px;
    }
  </style>
</head>
<body class="flex flex-col h-screen">

  <!-- Loading Overlay -->
  <div id="loadingOverlay" class="loading-overlay">
    <div class="bg-slate-800 p-6 rounded-lg shadow-xl text-center border border-slate-700">
      <div class="w-12 h-12 border-2 border-blue-500 border-t-transparent rounded-full animate-spin mx-auto mb-4"></div>
      <p class="text-slate-300 font-medium">Loading startup data...</p>
    </div>
  </div>

  <!-- Header -->
  <header class="bg-slate-900 border-b border-slate-700 shadow-sm sticky top-0 z-50">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
      <div class="flex justify-between items-center h-16">
        <div class="flex items-center space-x-3">
          <div class="bg-blue-600 p-2 rounded-lg">
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="none"
              stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M19 21V5a2 2 0 0 0-2-2H7a2 2 0 0 0-2 2v16m14 0h2m-2 0h-5m-9 0H3m2 0h5M9 7h1m-1 4h1m4-4h1m-1 4h1m-5 10v-5a1 1 0 0 1 1-1h2a1 1 0 0 1 1 1v5m-4 0h4"></path>
            </svg>
          </div>
          <span class="text-2xl font-bold text-white tracking-tight">Fundora</span>
        </div>
        <div class="flex items-center space-x-4">
          <span class="text-slate-400 text-sm">
            Welcome, <span class="font-semibold text-blue-400" id="user-email">Loading...</span>
          </span>
          <button onclick="window.location.href='added-startups.html'"
            class="text-slate-400 hover:text-blue-400 text-sm font-medium flex items-center space-x-1 transition">
            ← Back to Startups
          </button>
        </div>
      </div>
    </div>
  </header>

  <!-- Main Form -->
  <main class="flex-1 min-h-0 py-2 overflow-hidden">
    <div class="max-w-full mx-auto px-2 h-full">
      <form id="editStartupForm" novalidate class="bg-slate-900 rounded-xl shadow-xl border border-slate-700 h-full flex flex-col">

        <!-- Form Header -->
        <div class="bg-blue-600 rounded-t-xl px-6 py-3">
          <h2 class="text-xl font-bold text-white">Edit Startup Information</h2>
        </div>

        <!-- Form Content -->
        <div class="form-container flex-1 px-6 py-4 overflow-y-auto overflow-x-hidden">
          <div class="grid lg:grid-cols-5 gap-6 h-full">

            <!-- LEFT COLUMN -->
            <div class="lg:col-span-2 flex flex-col space-y-4 h-full">
              <div class="bg-slate-800 rounded-lg p-5 border border-slate-700 flex-1 flex flex-col">
                <h3 class="text-base font-bold text-slate-100 mb-4">Core Information</h3>

                <div class="flex-1 flex flex-col justify-between">
                  <div class="mb-4">
                    <label for="company-name" class="block text-sm font-semibold text-slate-300 mb-2">
                      Company Name <span class="text-red-500">*</span>
                    </label>
                    <input type="text" id="company-name" name="company-name"
                      class="form-input-modern w-full px-4 py-2.5 text-base rounded-lg"
                      placeholder="Enter company name" required />
                  </div>

                  <div class="mb-4">
                    <label for="industry" class="block text-sm font-semibold text-slate-300 mb-2">
                      Industry <span class="text-red-500">*</span>
                    </label>
                    <select id="industry" name="industry"
                      class="form-input-modern w-full px-4 py-2.5 text-base rounded-lg" required>
                      <option value="">Select Industry</option>
                      <option>Technology</option>
                      <option>Finance</option>
                      <option>Healthcare</option>
                      <option>E-commerce</option>
                      <option>Education</option>
                      <option>Real Estate</option>
                      <option>Manufacturing</option>
                      <option>Retail</option>
                      <option>Food & Beverage</option>
                      <option>Transportation</option>
                      <option>Energy</option>
                      <option>Entertainment</option>
                      <option>Agriculture</option>
                      <option>Other</option>
                    </select>
                  </div>

                  <div class="mb-0 flex-1 flex flex-col">
                    <label for="company-description" class="block text-sm font-semibold text-slate-300 mb-2">
                      Company Description
                    </label>
                    <textarea id="company-description" name="company-description"
                      class="form-input-modern w-full px-4 py-2.5 text-base rounded-lg resize-none flex-1"
                      placeholder="Brief description of your company..."></textarea>
                  </div>
                </div>
              </div>

              <!-- Data Completeness -->
              <div class="bg-slate-800 rounded-lg p-5 border border-slate-700">
                <div class="flex items-center justify-between mb-3">
                  <h4 class="text-sm font-bold text-slate-100">Confidence Level</h4>
                  <span id="completeness-text"
                    class="text-sm font-semibold text-slate-300 bg-slate-700 px-3 py-1 rounded-full">0% Complete</span>
                </div>
                <div class="w-full bg-slate-700 rounded-full h-3 shadow-inner">
                  <div id="completeness-bar"
                    class="h-3 rounded-full transition-all duration-500 bg-blue-500"
                    style="width: 0%"></div>
                </div>
                <p class="text-xs text-slate-400 mt-3">Fill in more fields to increase confidence level</p>
                <input type="hidden" id="data-completeness-level" name="data-completeness-level" value="Low" />
              </div>
            </div>

            <!-- Right Column: Financials & Actions -->
            <div class="lg:col-span-3 flex flex-col space-y-4 h-full">
              <!-- Income Statement Section -->
              <div class="financial-section border-blue-500 rounded-lg p-5 flex-1">
                <h3 class="text-base font-bold text-slate-100 mb-3">Income Statement</h3>
                <div class="grid md:grid-cols-2 gap-4">
                  <div>
                    <label for="current-revenue" class="flex items-center text-sm font-medium text-slate-300 mb-2">
                      Current Period Revenue (PHP)
                      <span class="ml-2 text-xs text-blue-400">?</span>
                    </label>
                    <input 
                      type="number" 
                      id="current-revenue" 
                      name="current-revenue" 
                      class="form-input-modern w-full px-4 py-2.5 text-base rounded-lg" 
                      placeholder="0.00"
                      step="0.01"
                    />
                  </div>
                  <div>
                    <label for="prior-revenue" class="flex items-center text-sm font-medium text-slate-300 mb-2">
                      Prior Period Revenue (PHP)
                      <span class="ml-2 text-xs text-blue-400">?</span>
                    </label>
                    <input 
                      type="number" 
                      id="prior-revenue" 
                      name="prior-revenue" 
                      class="form-input-modern w-full px-4 py-2.5 text-base rounded-lg" 
                      placeholder="0.00"
                      step="0.01"
                    />
                  </div>
                  <div>
                    <label for="current-net-income" class="flex items-center text-sm font-medium text-slate-300 mb-2">
                      Current Period Net Income (PHP)
                      <span class="ml-2 text-xs text-blue-400">?</span>
                    </label>
                    <input 
                      type="number" 
                      id="current-net-income" 
                      name="current-net-income" 
                      class="form-input-modern w-full px-4 py-2.5 text-base rounded-lg" 
                      placeholder="0.00"
                      step="0.01"
                    />
                  </div>
                  <div>
                    <label for="ebit" class="flex items-center text-sm font-medium text-slate-300 mb-2">
                      EBIT (PHP)
                      <span class="ml-2 text-xs text-blue-400">?</span>
                    </label>
                    <input 
                      type="number" 
                      id="ebit" 
                      name="ebit" 
                      class="form-input-modern w-full px-4 py-2.5 text-base rounded-lg" 
                      placeholder="0.00"
                      step="0.01"
                    />
                  </div>
                  <div>
                    <label for="time-between-periods" class="flex items-center text-sm font-medium text-slate-300 mb-2">
                      Time Between Periods (Days)
                      <span class="ml-2 text-xs text-blue-400">?</span>
                    </label>
                    <input 
                      type="number" 
                      id="time-between-periods" 
                      name="time-between-periods" 
                      class="form-input-modern w-full px-4 py-2.5 text-base rounded-lg" 
                      placeholder="365"
                      step="1"
                    />
                  </div>
                </div>
              </div>

              <!-- Balance Sheet Section -->
              <div class="financial-section border-emerald-500 rounded-lg p-5 flex-1">
                <h3 class="text-base font-bold text-slate-100 mb-3">Balance Sheet</h3>
                <div class="grid md:grid-cols-2 gap-4">
                  <div>
                    <label for="total-assets" class="flex items-center text-sm font-medium text-slate-300 mb-2">
                      Total Assets (PHP)
                      <span class="ml-2 text-xs text-emerald-400">?</span>
                    </label>
                    <input 
                      type="number" 
                      id="total-assets" 
                      name="total-assets" 
                      class="form-input-modern w-full px-4 py-2.5 text-base rounded-lg" 
                      placeholder="0.00"
                      step="0.01"
                    />
                  </div>
                  <div>
                    <label for="current-assets" class="flex items-center text-sm font-medium text-slate-300 mb-2">
                      Current Assets (PHP)
                      <span class="ml-2 text-xs text-emerald-400">?</span>
                    </label>
                    <input 
                      type="number" 
                      id="current-assets" 
                      name="current-assets" 
                      class="form-input-modern w-full px-4 py-2.5 text-base rounded-lg" 
                      placeholder="0.00"
                      step="0.01"
                    />
                  </div>
                  <div>
                    <label for="total-liabilities" class="flex items-center text-sm font-medium text-slate-300 mb-2">
                      Total Liabilities (PHP)
                      <span class="ml-2 text-xs text-emerald-400">?</span>
                    </label>
                    <input 
                      type="number" 
                      id="total-liabilities" 
                      name="total-liabilities" 
                      class="form-input-modern w-full px-4 py-2.5 text-base rounded-lg" 
                      placeholder="0.00"
                      step="0.01"
                    />
                  </div>
                  <div>
                    <label for="current-liabilities" class="flex items-center text-sm font-medium text-slate-300 mb-2">
                      Current Liabilities (PHP)
                      <span class="ml-2 text-xs text-emerald-400">?</span>
                    </label>
                    <input 
                      type="number" 
                      id="current-liabilities" 
                      name="current-liabilities" 
                      class="form-input-modern w-full px-4 py-2.5 text-base rounded-lg" 
                      placeholder="0.00"
                      step="0.01"
                    />
                  </div>
                  <div>
                    <label for="retained-earnings" class="flex items-center text-sm font-medium text-slate-300 mb-2">
                      Retained Earnings (PHP)
                      <span class="ml-2 text-xs text-emerald-400">?</span>
                    </label>
                    <input 
                      type="number" 
                      id="retained-earnings" 
                      name="retained-earnings" 
                      class="form-input-modern w-full px-4 py-2.5 text-base rounded-lg" 
                      placeholder="0.00"
                      step="0.01"
                    />
                  </div>
                  <div class="md:col-span-1">
                    <label for="shareholder-equity" class="text-sm font-medium text-slate-300 mb-2 block">
                      Shareholder Equity (PHP) - Auto-calculated
                    </label>
                    <input 
                      type="text" 
                      id="shareholder-equity" 
                      name="shareholder-equity" 
                      class="form-input-modern w-full px-4 py-2.5 text-base rounded-lg bg-slate-700" 
                      placeholder="₱ 0.00"
                      disabled
                    />
                  </div>
                </div>
              </div>

              <!-- Cash Flow Section -->
              <div class="financial-section border-purple-500 rounded-lg p-5 flex-1">
                <h3 class="text-base font-bold text-slate-100 mb-3">Cash Flow & Valuation</h3>
                <div class="grid md:grid-cols-2 gap-4">
                  <div>
                    <label for="cash-flow" class="flex items-center text-sm font-medium text-slate-300 mb-2">
                      Operations Cash Flow (PHP)
                      <span class="ml-2 text-xs text-purple-400">?</span>
                    </label>
                    <input 
                      type="number" 
                      id="cash-flow" 
                      name="cash-flow" 
                      class="form-input-modern w-full px-4 py-2.5 text-base rounded-lg" 
                      placeholder="0.00"
                      step="0.01"
                    />
                  </div>
                  <div>
                    <label for="current-valuation" class="flex items-center text-sm font-medium text-slate-300 mb-2">
                      Current Valuation (PHP)
                      <span class="ml-2 text-xs text-purple-400">?</span>
                    </label>
                    <input 
                      type="number" 
                      id="current-valuation" 
                      name="current-valuation" 
                      class="form-input-modern w-full px-4 py-2.5 text-base rounded-lg" 
                      placeholder="0.00"
                      step="0.01"
                    />
                  </div>
                  <div>
                    <label for="expected-future-valuation" class="flex items-center text-sm font-medium text-slate-300 mb-2">
                      Expected Future Valuation (PHP)
                      <span class="ml-2 text-xs text-purple-400">?</span>
                    </label>
                    <input 
                      type="number" 
                      id="expected-future-valuation" 
                      name="expected-future-valuation" 
                      class="form-input-modern w-full px-4 py-2.5 text-base rounded-lg" 
                      placeholder="0.00"
                      step="0.01"
                    />
                  </div>
                  <div>
                    <label for="years-to-future-valuation" class="flex items-center text-sm font-medium text-slate-300 mb-2">
                      Years to Future Valuation
                      <span class="ml-2 text-xs text-purple-400">?</span>
                    </label>
                    <input 
                      type="number" 
                      id="years-to-future-valuation" 
                      name="years-to-future-valuation" 
                      class="form-input-modern w-full px-4 py-2.5 text-base rounded-lg" 
                      placeholder="0"
                      step="0.1"
                    />
                  </div>
                </div>
              </div>

              <!-- Qualitative Assessment Section -->
              <div class="financial-section border-slate-600 rounded-lg p-5 flex-1">
                <h3 class="text-base font-bold text-slate-100 mb-3">Qualitative Assessment</h3>
                <div class="space-y-4">
                  <div>
                    <label for="team-strength" class="flex items-center text-sm font-medium text-slate-300 mb-2">
                      Team Strength
                      <span class="ml-2 text-xs text-slate-400">?</span>
                    </label>
                    <textarea 
                      id="team-strength" 
                      name="team-strength" 
                      rows="3" 
                      class="form-input-modern w-full px-4 py-2.5 text-base rounded-lg resize-none" 
                      placeholder="Describe the team's expertise and experience..."
                    ></textarea>
                  </div>
                  <div>
                    <label for="market-position" class="flex items-center text-sm font-medium text-slate-300 mb-2">
                      Market Position
                      <span class="ml-2 text-xs text-slate-400">?</span>
                    </label>
                    <textarea 
                      id="market-position" 
                      name="market-position" 
                      rows="3" 
                      class="form-input-modern w-full px-4 py-2.5 text-base rounded-lg resize-none" 
                      placeholder="Explain market standing and competitive advantages..."
                    ></textarea>
                  </div>
                  <div>
                    <label for="brand-reputation" class="flex items-center text-sm font-medium text-slate-300 mb-2">
                      Brand Reputation
                      <span class="ml-2 text-xs text-slate-400">?</span>
                    </label>
                    <textarea 
                      id="brand-reputation" 
                      name="brand-reputation" 
                      rows="3" 
                      class="form-input-modern w-full px-4 py-2.5 text-base rounded-lg resize-none" 
                      placeholder="Describe brand recognition and reputation..."
                    ></textarea>
                  </div>
                </div>
              </div>

              <!-- Action Buttons -->
              <div class="flex flex-col sm:flex-row gap-4 pt-4">
                <button type="submit"
                  class="flex-1 bg-blue-600 hover:bg-blue-700 text-white font-bold py-3.5 px-6 rounded-lg transition-colors duration-200 flex items-center justify-center shadow-lg">
                  Update Startup
                </button>
                <button type="button" onclick="window.location.href='added-startups.html'"
                  class="flex-1 bg-slate-700 hover:bg-slate-600 text-slate-200 font-semibold py-3.5 px-6 rounded-lg transition-colors duration-200 flex items-center justify-center">
                  Cancel
                </button>
              </div>
            </div>

          </div>
        </div>
      </form>
    </div>
  </main>

  <script>
    document.addEventListener('DOMContentLoaded', function() {
      const form = document.getElementById('editStartupForm');
      const domCache = {
        totalAssetsInput: document.getElementById('total-assets'),
        totalLiabilitiesInput: document.getElementById('total-liabilities'),
        shareholderEquityInput: document.getElementById('shareholder-equity'),
        completenessBar: document.getElementById('completeness-bar'),
        completenessText: document.getElementById('completeness-text'),
        completenessHiddenInput: document.getElementById('data-completeness-level'),
        loadingOverlay: document.getElementById('loadingOverlay'),
        userEmailElement: document.getElementById('user-email'),
        submitButton: form.querySelector('button[type="submit"]')
      };
      
      let tooltipElement;
      let isSubmitting = false;
      let hasSuccessfulSubmission = false;
      let startupId = null;

      function getStartupIdFromUrl() {
        const urlParams = new URLSearchParams(window.location.search);
        return urlParams.get('id');
      }

      async function loadUserInfo() {
        const token = sessionStorage.getItem('authToken');

        if (!token) {
          domCache.userEmailElement.textContent = 'No user logged in';
          domCache.userEmailElement.className = 'font-semibold text-red-600';
          alert('Please log in to access this page.');
          window.location.href = '../login.html';
          return;
        }

        const storedUserData = localStorage.getItem('userData');
        if (storedUserData) {
          try {
            const userData = JSON.parse(storedUserData);
            domCache.userEmailElement.textContent = userData.email || 'User';
            domCache.userEmailElement.className = 'font-semibold text-slate-300';
            return;
          } catch (error) {
            console.error('Error parsing user data:', error);
          }
        }

        domCache.userEmailElement.textContent = 'Token found, no user info';
      }

      async function loadStartupData() {
        startupId = getStartupIdFromUrl();
        
        if (!startupId || startupId === 'unknown') {
          alert('Invalid startup ID. Redirecting back...');
          window.location.href = 'added-startups.html';
          return;
        }

        const token = sessionStorage.getItem('authToken');
        if (!token) {
          alert('Please log in to edit startup information.');
          window.location.href = '../login.html';
          return;
        }

        try {
          const response = await fetch(`https://fundora-be-singapore.onrender.com/api/startup/${startupId}/`, {
            method: 'GET',
            headers: {
              'Authorization': `Bearer ${token}`,
              'Content-Type': 'application/json'
            }
          });

          if (!response.ok) {
            const errorData = await response.json();
            throw new Error(errorData.error || errorData.detail || 'Failed to load startup data');
          }

          const data = await response.json();
          const startup = data.startup || data;
          populateForm(startup);

        } catch (error) {
          console.error('Error loading startup:', error);
          alert(`Failed to load startup data: ${error.message}`);
          window.location.href = 'added-startups.html';
        } finally {
          domCache.loadingOverlay.classList.add('hidden');
        }
      }

      function populateForm(startup) {
        document.getElementById('company-name').value = startup.company_name || '';
        document.getElementById('industry').value = startup.industry || '';
        document.getElementById('company-description').value = startup.company_description || '';

        document.getElementById('current-revenue').value = startup.current_revenue || startup.revenue || '';
        document.getElementById('prior-revenue').value = startup.prior_revenue || startup.previous_revenue || '';
        document.getElementById('current-net-income').value = startup.current_net_income || startup.net_income || '';
        document.getElementById('ebit').value = startup.ebit || '';
        document.getElementById('time-between-periods').value = startup.time_between_periods || '';

        domCache.totalAssetsInput.value = startup.total_assets || '';
        document.getElementById('current-assets').value = startup.current_assets || '';
        domCache.totalLiabilitiesInput.value = startup.total_liabilities || '';
        document.getElementById('current-liabilities').value = startup.current_liabilities || '';
        document.getElementById('retained-earnings').value = startup.retained_earnings || '';
        
        document.getElementById('cash-flow').value = startup.cash_flow || '';
        document.getElementById('current-valuation').value = startup.current_valuation || '';
        document.getElementById('expected-future-valuation').value = startup.expected_future_valuation || '';
        document.getElementById('years-to-future-valuation').value = startup.years_to_future_valuation || '';

        document.getElementById('team-strength').value = startup.team_strength || '';
        document.getElementById('market-position').value = startup.market_position || '';
        document.getElementById('brand-reputation').value = startup.brand_reputation || '';

        calculateEquity();
        updateCompleteness();
      }

      function calculateEquity() {
        const assets = parseFloat(domCache.totalAssetsInput.value) || 0;
        const liabilities = parseFloat(domCache.totalLiabilitiesInput.value) || 0;
        const equity = assets - liabilities;
        
        if (equity > 0) {
          domCache.shareholderEquityInput.value = new Intl.NumberFormat('en-PH', { 
            style: 'currency', 
            currency: 'PHP' 
          }).format(equity);
        } else {
          domCache.shareholderEquityInput.value = '₱ 0.00';
        }
      }

      domCache.totalAssetsInput.addEventListener('input', calculateEquity, { passive: true });
      domCache.totalLiabilitiesInput.addEventListener('input', calculateEquity, { passive: true });

      function createTooltip() {
        if (!tooltipElement) {
          tooltipElement = document.createElement('div');
          tooltipElement.className = 'dynamic-tooltip tooltip-top';
          document.body.appendChild(tooltipElement);
        }
      }
      
      document.querySelectorAll('.tooltip-trigger').forEach(trigger => {
          trigger.addEventListener('mouseenter', (e) => {
              createTooltip();
              const text = trigger.getAttribute('data-tooltip-text');
              tooltipElement.textContent = text;
              const rect = trigger.getBoundingClientRect();
              
              tooltipElement.classList.add('visible');
              const tooltipRect = tooltipElement.getBoundingClientRect();

              let top = rect.top - tooltipRect.height - 8;
              let left = rect.left + (rect.width / 2) - (tooltipRect.width / 2);

              if (left < 0) left = 5;
              if (top < 0) {
                  top = rect.bottom + 8;
                  tooltipElement.className = 'dynamic-tooltip tooltip-bottom visible';
              }

              tooltipElement.style.top = `${top}px`;
              tooltipElement.style.left = `${left}px`;
          });
          trigger.addEventListener('mouseleave', () => {
              if (tooltipElement) {
                  tooltipElement.classList.remove('visible');
              }
          });
      });

      const formInputs = Array.from(form.querySelectorAll('input[type="text"], input[type="number"], select, textarea')).filter(el => !el.disabled);
      const totalFields = formInputs.length;

      function updateCompleteness() {
        let filledFields = 0;
        formInputs.forEach(input => {
          if ((input.type === 'select-one' && input.value !== "") || (input.type !== 'select-one' && input.value && input.value.trim() !== '')) {
            filledFields++;
          }
        });

        const percentage = totalFields > 0 ? (filledFields / totalFields) * 100 : 0;
        domCache.completenessBar.style.width = percentage + '%';
        
        let level = 'Low';
        let barColor = 'bg-blue-500';

        if (percentage > 75) {
          level = 'High';
          barColor = 'bg-emerald-500';
          domCache.completenessText.textContent = `High Confidence (${Math.round(percentage)}%)`;
        } else if (percentage > 40) {
          level = 'Medium';
          barColor = 'bg-yellow-500';
          domCache.completenessText.textContent = `Medium Confidence (${Math.round(percentage)}%)`;
        } else {
          level = 'Low';
          barColor = 'bg-red-500';
          if(filledFields > 0) {
            domCache.completenessText.textContent = `Low Confidence (${Math.round(percentage)}%)`;
          } else {
            domCache.completenessText.textContent = `Low Confidence (0%)`;
          }
        }
        
        domCache.completenessHiddenInput.value = level;
        domCache.completenessBar.className = `h-3 rounded-full transition-all duration-300 ${barColor}`;
      }

      form.addEventListener('input', updateCompleteness, { passive: true });

      function createUpdatedStartupData() {
        function parseNumericValue(value) {
          if (!value || value.trim() === '') return null;
          const cleaned = value.toString().replace(/[₱,\s]/g, '');
          const parsed = parseFloat(cleaned);
          return isNaN(parsed) ? null : parsed;
        }

        const assets = parseNumericValue(document.getElementById('total-assets').value);
        const liabilities = parseNumericValue(document.getElementById('total-liabilities').value);
        const calculatedEquity = (assets && liabilities) ? assets - liabilities : null;

        let filledFields = 0;
        formInputs.forEach(input => {
          if ((input.type === 'select-one' && input.value !== "") || (input.type !== 'select-one' && input.value && input.value.trim() !== '')) {
            filledFields++;
          }
        });
        
        const actualPercentage = totalFields > 0 ? Math.round((filledFields / totalFields) * 100) : 0;
        
        let confidenceLevel = 'Low';
        if (actualPercentage > 75) {
          confidenceLevel = 'High';
        } else if (actualPercentage > 40) {
          confidenceLevel = 'Medium';
        }

        return {
          company_name: document.getElementById('company-name').value.trim(),
          industry: document.getElementById('industry').value,
          company_description: document.getElementById('company-description').value.trim(),
          
          current_revenue: parseNumericValue(document.getElementById('current-revenue').value),
          prior_revenue: parseNumericValue(document.getElementById('prior-revenue').value),
          current_net_income: parseNumericValue(document.getElementById('current-net-income').value),
          ebit: parseNumericValue(document.getElementById('ebit').value),
          time_between_periods: parseNumericValue(document.getElementById('time-between-periods').value),
          
          total_assets: parseNumericValue(document.getElementById('total-assets').value),
          current_assets: parseNumericValue(document.getElementById('current-assets').value),
          total_liabilities: parseNumericValue(document.getElementById('total-liabilities').value),
          current_liabilities: parseNumericValue(document.getElementById('current-liabilities').value),
          retained_earnings: parseNumericValue(document.getElementById('retained-earnings').value),
          shareholder_equity: calculatedEquity,
          
          cash_flow: parseNumericValue(document.getElementById('cash-flow').value),
          current_valuation: parseNumericValue(document.getElementById('current-valuation').value),
          expected_future_valuation: parseNumericValue(document.getElementById('expected-future-valuation').value),
          years_to_future_valuation: parseNumericValue(document.getElementById('years-to-future-valuation').value),
          
          team_strength: document.getElementById('team-strength').value.trim(),
          market_position: document.getElementById('market-position').value.trim(),
          brand_reputation: document.getElementById('brand-reputation').value.trim(),
          
          data_completeness_level: confidenceLevel,
          confidence_percentage: actualPercentage
        };
      }

      async function updateStartupData(startupData) {
        const originalText = domCache.submitButton.innerHTML;
        
        try {
          domCache.submitButton.disabled = true;
          domCache.submitButton.innerHTML = 'Updating...';

          const token = sessionStorage.getItem('authToken');
          if (!token) {
            throw new Error('No authentication token found');
          }

          const response = await fetch(`https://fundora-be-singapore.onrender.com/api/startup/${startupId}/`, {
            method: 'PUT',
            headers: {
              'Authorization': `Bearer ${token}`,
              'Content-Type': 'application/json'
            },
            body: JSON.stringify(startupData)
          });

          const data = await response.json();

          if (!response.ok) {
            if (response.status === 401) {
              throw new Error('Session expired. Please log in again.');
            } else if (response.status === 403) {
              throw new Error('You do not have permission to update this startup.');
            } else if (response.status === 404) {
              throw new Error('Startup not found.');
            } else if (data.errors) {
              const errorMessages = Object.entries(data.errors)
                .map(([field, messages]) => `${field}: ${Array.isArray(messages) ? messages.join(', ') : messages}`)
                .join('\n');
              throw new Error(`Validation errors:\n${errorMessages}`);
            } else {
              throw new Error(data.error || data.detail || 'Failed to update startup');
            }
          }

          hasSuccessfulSubmission = true;
          showSuccessMessage(data.message || 'Startup updated successfully!');
          
          domCache.submitButton.disabled = true;
          domCache.submitButton.innerHTML = 'Updated Successfully';
          domCache.submitButton.className = "flex-1 bg-emerald-600 text-white font-bold py-3.5 px-6 rounded-lg flex items-center justify-center shadow-lg";
          
          setTimeout(() => {
            window.location.href = 'added-startups.html';
          }, 1500);

        } catch (error) {
          console.error('Update failed:', error);
          showErrorMessage(error.message);
          
          domCache.submitButton.disabled = false;
          domCache.submitButton.innerHTML = originalText;
          isSubmitting = false;
        }
      }

      function showSuccessMessage(message) {
        const notification = document.createElement('div');
        notification.className = 'fixed top-4 right-4 bg-emerald-500 text-white p-4 rounded-lg shadow-lg z-50 max-w-sm';
        notification.innerHTML = `
          <div class="flex items-start space-x-3">
            <div class="text-lg font-bold">✓</div>
            <div>
              <p class="font-semibold">Success</p>
              <p class="text-sm">${message}</p>
            </div>
          </div>
        `;
        document.body.appendChild(notification);
        
        setTimeout(() => {
          notification.remove();
        }, 4000);
      }

      function showErrorMessage(message) {
        const notification = document.createElement('div');
        notification.className = 'fixed top-4 right-4 bg-red-500 text-white p-4 rounded-lg shadow-lg z-50 max-w-sm';
        notification.innerHTML = `
          <div class="flex items-start space-x-3">
            <div class="text-lg font-bold">!</div>
            <div>
              <p class="font-semibold">Error</p>
              <p class="text-sm">${message}</p>
            </div>
          </div>
        `;
        document.body.appendChild(notification);
        
        setTimeout(() => {
          notification.remove();
        }, 5000);
      }

      form.addEventListener('submit', function(e) {
        e.preventDefault();
        
        if (isSubmitting || hasSuccessfulSubmission) {
          return;
        }
        
        if (!form.checkValidity()) {
          form.reportValidity();
          return;
        }
        
        const startupData = createUpdatedStartupData();
        
        if (!startupData.company_name || !startupData.industry) {
          showErrorMessage('Please fill in at least Company Name and Industry.');
          return;
        }
        
        isSubmitting = true;
        updateStartupData(startupData);
      }, { passive: true });

      loadUserInfo();
      loadStartupData();
    });
  </script>
</body>
</html>
