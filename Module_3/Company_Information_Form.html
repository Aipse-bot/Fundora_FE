<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="csrf-token" content="{{ csrf_token }}">
  <title>Company Information Form</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Inter', sans-serif;
      background: linear-gradient(140deg, #0f172a 0%, #1e293b 50%, #0f172a 100%);
      min-height: 100vh;
      color: #fff;
    }

    .card {
      background: rgba(30, 41, 59, 0.65);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 1rem;
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.4);
      backdrop-filter: blur(10px);
      transition: all 0.3s ease;
    }
    .card:hover {
      background: rgba(30, 41, 59, 0.8);
      border-color: rgba(255, 255, 255, 0.15);
      transform: translateY(-3px);
    }

    .form-input-modern {
      background-color: #1e293b;
      border: 1px solid #334155;
      color: #f1f5f9;
      border-radius: 0.5rem;
      transition: all 0.3s ease;
    }
    .form-input-modern:focus {
      border-color: #3b82f6;
      box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.2);
      outline: none;
    }

    header {
      backdrop-filter: blur(8px);
      background: rgba(15, 23, 42, 0.9);
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
    }

    .section-title {
      font-weight: 700;
      font-size: 1.2rem;
      margin-bottom: 1rem;
      color: #e2e8f0;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .tooltip-trigger {
      display: inline-flex;
      justify-content: center;
      align-items: center;
      width: 16px;
      height: 16px;
      background: #334155;
      border-radius: 50%;
      color: #94a3b8;
      font-size: 11px;
      cursor: help;
      transition: all 0.3s ease;
    }
    .tooltip-trigger:hover {
      background: #3b82f6;
      color: #fff;
      transform: scale(1.15);
    }

    .grid-balanced {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(480px, 1fr));
      gap: 2rem;
    }

    .form-section {
      display: flex;
      flex-direction: column;
      gap: 1.25rem;
    }

    .fade-in {
      animation: fadeIn 0.6s ease-out;
    }
    @keyframes fadeIn {
      from {opacity: 0; transform: translateY(15px);}
      to {opacity: 1; transform: translateY(0);}
    }

    @media (max-width: 768px) {
      .grid-balanced { grid-template-columns: 1fr; }
    }
  </style>
</head>

<body class="min-h-screen">
  <!-- Header -->
  <header class="sticky top-0 z-50 shadow-md">
    <div class="max-w-7xl mx-auto px-5 py-4 flex justify-between items-center">
      <div class="flex items-center gap-3">
        <div class="bg-gradient-to-br from-blue-600 to-blue-500 p-2 rounded-lg shadow-lg shadow-blue-500/30">
          <svg class="h-6 w-6 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" d="M2.25 18L9 11.25l4.306 4.307a11.95 11.95 0 015.814-5.519l2.74-1.22m0 0l-5.94-2.28m5.94 2.28l-2.28 5.941" />
          </svg>
        </div>
        <span class="text-2xl font-bold bg-gradient-to-r from-blue-400 to-emerald-400 bg-clip-text text-transparent">Fundora</span>
      </div>
      <div class="flex items-center gap-4">
        <span class="text-slate-400 text-sm">
          Welcome, <span id="user-email" class="font-semibold text-blue-400">Loading...</span>
        </span>
        <img class="h-9 w-9 rounded-full border-2 border-blue-500/50 shadow-md" src="https://i.pravatar.cc/150?u=a042581f4e29026704d" alt="User Avatar">
      </div>
    </div>
  </header>

  <!-- Main Form -->
  <main class="max-w-7xl mx-auto p-8 fade-in">
    <form id="companyForm" novalidate class="space-y-10">
      <div class="border-b border-slate-700 pb-6">
        <h1 class="text-3xl font-bold bg-gradient-to-r from-blue-400 via-emerald-400 to-blue-400 bg-clip-text text-transparent mb-3">Company Information Form</h1>
        <p class="text-slate-400 text-sm">Fill out your company details to generate an investment analysis report.</p>
      </div>

      <div class="grid-balanced">
        <!-- LEFT COLUMN -->
        <div class="form-section">
          <!-- Company Details -->
          <div class="card p-6">
            <h2 class="section-title">
              <span class="w-2 h-2 bg-blue-500 rounded-full"></span> Company Profile
            </h2>
            <div class="space-y-4">
              <div>
                <label class="text-sm font-medium text-slate-300 mb-2 flex items-center gap-2">
                  Company Name <span class="tooltip-trigger">?</span>
                </label>
                <input type="text" id="company-name" name="company-name" class="w-full px-4 py-2.5 form-input-modern" required>
              </div>
              <div>
                <label class="text-sm font-medium text-slate-300 mb-2">Industry</label>
                <select id="industry" name="industry" class="w-full px-4 py-2.5 form-input-modern appearance-none">
                  <option value="" disabled selected>Select an industry</option>
                  <option>Technology</option>
                  <option>Finance</option>
                  <option>Healthcare</option>
                  <option>E-commerce</option>
                  <option>Education</option>
                  <option>Real Estate</option>
                  <option>Manufacturing</option>
                  <option>Retail</option>
                  <option>Food & Beverage</option>
                  <option>Transportation</option>
                  <option>Energy</option>
                  <option>Entertainment</option>
                  <option>Agriculture</option>
                  <option>Fintech</option>
                  <option>Other</option>
                </select>
              </div>
              <div>
                <label class="text-sm font-medium text-slate-300 mb-2">Company Description</label>
                <textarea id="company-description" name="company-description" rows="3" class="w-full px-4 py-2.5 form-input-modern resize-none"></textarea>
              </div>
              <div>
                <label class="text-sm font-medium text-slate-300 mb-2">Year Founded</label>
                <input type="number" id="year-founded" name="year-founded" class="w-full px-4 py-2.5 form-input-modern">
              </div>
            </div>
          </div>

          <!-- Income Statement -->
          <div class="card p-6">
            <h2 class="section-title">
              <span class="w-2 h-2 bg-emerald-500 rounded-full"></span> Income Statement
            </h2>
            <div class="space-y-4">
              <div>
                <label class="text-sm font-medium text-slate-300 mb-2">Time Between Periods (Years)</label>
                <input type="number" id="time-between-periods" name="time-between-periods" class="w-full px-4 py-2.5 form-input-modern" step="any">
              </div>
              <div>
                <label class="text-sm font-medium text-slate-300 mb-2">Prior Period Revenue (₱)</label>
                <input type="number" id="previous-revenue" name="previous-revenue" class="w-full px-4 py-2.5 form-input-modern">
              </div>
              <div>
                <label class="text-sm font-medium text-slate-300 mb-2">Current Period Revenue (₱)</label>
                <input type="number" id="current-revenue" name="current-revenue" class="w-full px-4 py-2.5 form-input-modern">
              </div>
              <div>
                <label class="text-sm font-medium text-slate-300 mb-2">Current Period Net Income (₱)</label>
                <input type="number" id="net-income" name="net-income" class="w-full px-4 py-2.5 form-input-modern">
              </div>
              <div>
                <label class="text-sm font-medium text-slate-300 mb-2">EBIT (₱)</label>
                <input type="number" id="ebit" name="ebit" class="w-full px-4 py-2.5 form-input-modern">
              </div>
            </div>
          </div>

          <!-- Cash Flow -->
          <div class="card p-6">
            <h2 class="section-title">
              <span class="w-2 h-2 bg-cyan-500 rounded-full"></span> Cash Flow
            </h2>
            <div class="space-y-4">
              <div>
                <label class="text-sm font-medium text-slate-300 mb-2">Operations Cash Flow (₱)</label>
                <input type="number" id="cash-flow" name="cash-flow" class="w-full px-4 py-2.5 form-input-modern">
              </div>
            </div>
          </div>

          <!-- Market Metrics -->
          <div class="card p-6">
            <h2 class="section-title">
              <span class="w-2 h-2 bg-rose-500 rounded-full"></span> Market Metrics
            </h2>
            <div class="space-y-4">
              <div>
                <label class="text-sm font-medium text-slate-300 mb-2">Total Addressable Market (₱)</label>
                <input type="number" id="market-size" name="market-size" class="w-full px-4 py-2.5 form-input-modern">
              </div>
              <div>
                <label class="text-sm font-medium text-slate-300 mb-2">Current Market Share (%)</label>
                <input type="number" id="market-share" name="market-share" class="w-full px-4 py-2.5 form-input-modern" step="any">
              </div>
              <div>
                <label class="text-sm font-medium text-slate-300 mb-2">Total Customers</label>
                <input type="number" id="customer-count" name="customer-count" class="w-full px-4 py-2.5 form-input-modern">
              </div>
            </div>
          </div>
        </div>

        <!-- RIGHT COLUMN -->
        <div class="form-section">
          <!-- Qualitative Metrics -->
          <div class="card p-6">
            <h2 class="section-title">
              <span class="w-2 h-2 bg-orange-500 rounded-full"></span> Qualitative Assessment
            </h2>
            <div class="space-y-4">
              <div>
                <label class="text-sm font-medium text-slate-300 mb-2">Team Strength</label>
                <textarea id="team-strength" name="team-strength" rows="3" class="w-full px-4 py-2.5 form-input-modern resize-none"></textarea>
              </div>
              <div>
                <label class="text-sm font-medium text-slate-300 mb-2">Market Position</label>
                <textarea id="market-position" name="market-position" rows="3" class="w-full px-4 py-2.5 form-input-modern resize-none"></textarea>
              </div>
              <div>
                <label class="text-sm font-medium text-slate-300 mb-2">Brand Reputation</label>
                <textarea id="brand-reputation" name="brand-reputation" rows="3" class="w-full px-4 py-2.5 form-input-modern resize-none"></textarea>
              </div>
            </div>
          </div>

          <!-- Balance Sheet -->
          <div class="card p-6">
            <h2 class="section-title">
              <span class="w-2 h-2 bg-indigo-500 rounded-full"></span> Balance Sheet
            </h2>
            <div class="space-y-4">
              <div>
                <label class="text-sm font-medium text-slate-300 mb-2">Total Assets (₱)</label>
                <input type="number" id="total-assets" name="total-assets" class="w-full px-4 py-2.5 form-input-modern">
              </div>
              <div>
                <label class="text-sm font-medium text-slate-300 mb-2">Current Assets (₱)</label>
                <input type="number" id="current-assets" name="current-assets" class="w-full px-4 py-2.5 form-input-modern">
              </div>
              <div>
                <label class="text-sm font-medium text-slate-300 mb-2">Total Liabilities (₱)</label>
                <input type="number" id="total-liabilities" name="total-liabilities" class="w-full px-4 py-2.5 form-input-modern">
              </div>
              <div>
                <label class="text-sm font-medium text-slate-300 mb-2">Current Liabilities (₱)</label>
                <input type="number" id="current-liabilities" name="current-liabilities" class="w-full px-4 py-2.5 form-input-modern">
              </div>
              <div>
                <label class="text-sm font-medium text-slate-300 mb-2">Retained Earnings (₱)</label>
                <input type="number" id="retained-earnings" name="retained-earnings" class="w-full px-4 py-2.5 form-input-modern">
              </div>
            </div>
          </div>

          <!-- Valuation -->
          <div class="card p-6">
            <h2 class="section-title">
              <span class="w-2 h-2 bg-purple-500 rounded-full"></span> Valuation
            </h2>
            <div class="space-y-4">
              <div>
                <label class="text-sm font-medium text-slate-300 mb-2">Current Valuation (₱)</label>
                <input type="number" id="current-valuation" name="current-valuation" class="w-full px-4 py-2.5 form-input-modern">
              </div>
              <div>
                <label class="text-sm font-medium text-slate-300 mb-2">Expected Future Valuation (₱)</label>
                <input type="number" id="expected-future-valuation" name="expected-future-valuation" class="w-full px-4 py-2.5 form-input-modern">
              </div>
              <div>
                <label class="text-sm font-medium text-slate-300 mb-2">Years to Future Valuation</label>
                <input type="number" id="years-to-future-valuation" name="years-to-future-valuation" class="w-full px-4 py-2.5 form-input-modern" step="0.1">
              </div>
            </div>
          </div>

          <!-- Growth & Efficiency -->
          <div class="card p-6">
            <h2 class="section-title">
              <span class="w-2 h-2 bg-amber-500 rounded-full"></span> Growth & Efficiency
            </h2>
            <div class="space-y-4">
              <div>
                <label class="text-sm font-medium text-slate-300 mb-2">Monthly Growth Rate (%)</label>
                <input type="number" id="monthly-growth-rate" name="monthly-growth-rate" class="w-full px-4 py-2.5 form-input-modern" step="0.01">
              </div>
              <div>
                <label class="text-sm font-medium text-slate-300 mb-2">Customer Acquisition Cost (₱)</label>
                <input type="number" id="customer-acquisition-cost" name="customer-acquisition-cost" class="w-full px-4 py-2.5 form-input-modern">
              </div>
              <div>
                <label class="text-sm font-medium text-slate-300 mb-2">Customer Lifetime Value (₱)</label>
                <input type="number" id="customer-lifetime-value" name="customer-lifetime-value" class="w-full px-4 py-2.5 form-input-modern">
              </div>
              <div>
                <label class="text-sm font-medium text-slate-300 mb-2">Monthly Burn Rate (₱)</label>
                <input type="number" id="burn-rate" name="burn-rate" class="w-full px-4 py-2.5 form-input-modern">
              </div>
            </div>
          </div>
        </div>
      </div>

      <!-- Submit Buttons -->
      <div class="flex justify-end gap-4 border-t border-slate-700 pt-6">
        <button type="reset" class="px-6 py-2.5 border border-slate-600 text-slate-300 rounded-lg hover:bg-slate-700/50 transition-all">Cancel</button>
        <button type="submit" class="px-6 py-2.5 rounded-lg bg-gradient-to-r from-blue-600 to-emerald-500 text-white shadow-md hover:scale-105 transition-all">Save & Generate Report</button>
      </div>
    </form>
  </main>

    <script>
        let tooltipElement;
        const domCache = {
            form: null,
            completenessBar: null,
            completenessText: null,
            completenessHiddenInput: null,
            userEmailElement: null
        };

        document.addEventListener('DOMContentLoaded', function() {
            domCache.form = document.getElementById('companyForm');
            domCache.completenessBar = document.getElementById('completeness-bar');
            domCache.completenessText = document.getElementById('completeness-text');
            domCache.completenessHiddenInput = document.getElementById('data-completeness-level');
            domCache.userEmailElement = document.getElementById('user-email');

            const formInputs = Array.from(domCache.form.querySelectorAll('input[type="text"], input[type="number"], select, textarea')).filter(el => !el.disabled);
            const totalFields = formInputs.length;
            
            // Submission state management
            let isSubmitting = false;
            let hasSuccessfulSubmission = false;

            // --- Load User Information ---
            async function loadUserInfo() {
                const token = sessionStorage.getItem('authToken');

                if (!token) {
                    domCache.userEmailElement.textContent = 'No user logged in';
                    domCache.userEmailElement.className = 'font-semibold text-red-400';
                    alert('Please log in to access this page.');
                    window.location.href = '../login.html';
                    return;
                }

                const storedUserData = localStorage.getItem('userData');
                if (storedUserData) {
                    try {
                        const user = JSON.parse(storedUserData);
                        domCache.userEmailElement.textContent = user.email || 'Unknown user';
                        domCache.userEmailElement.className = 'font-semibold text-blue-400';
                        return;
                    } catch (error) {
                        console.error('Error parsing user data:', error);
                    }
                }

                domCache.userEmailElement.textContent = 'Token found, no user info';
                domCache.userEmailElement.className = 'font-semibold text-yellow-400';
            }

            loadUserInfo();

            // --- Dynamic Tooltip Logic ---
            function createTooltip() {
                if (!tooltipElement) {
                    tooltipElement = document.createElement('div');
                    tooltipElement.className = 'dynamic-tooltip tooltip-top';
                    document.body.appendChild(tooltipElement);
                }
            }
            
            document.querySelectorAll('.tooltip-trigger').forEach(trigger => {
                trigger.addEventListener('mouseenter', (e) => {
                    createTooltip();
                    const text = trigger.getAttribute('data-tooltip-text');
                    tooltipElement.textContent = text;
                    const rect = trigger.getBoundingClientRect();
                    
                    tooltipElement.classList.add('visible');
                    const tooltipRect = tooltipElement.getBoundingClientRect();

                    let top = rect.top - tooltipRect.height - 8;
                    let left = rect.left + (rect.width / 2) - (tooltipRect.width / 2);

                    if (left < 0) left = 5;
                    if (top < 0) top = rect.bottom + 8;

                    tooltipElement.style.top = `${top}px`;
                    tooltipElement.style.left = `${left}px`;
                }, { passive: true });
                
                trigger.addEventListener('mouseleave', () => {
                    if (tooltipElement) {
                        tooltipElement.classList.remove('visible');
                    }
                }, { passive: true });
            });

            // --- Data Completeness Calculation ---
            function updateCompleteness() {

              if (!domCache.completenessBar || !domCache.completenessText || !domCache.completenessHiddenInput) {
                  return;
              }

                let filledFields = 0;
                formInputs.forEach(input => {
                    if ((input.type === 'select-one' && input.value !== "") || (input.type !== 'select-one' && input.value && input.value.trim() !== '')) {
                        filledFields++;
                    }
                });

                const percentage = totalFields > 0 ? (filledFields / totalFields) * 100 : 0;
                domCache.completenessBar.style.width = percentage + '%';
                
                let level = 'Low';
                let barColor = 'bg-red-500';

                if (percentage > 75) {
                    level = 'High';
                    barColor = 'bg-emerald-500';
                    domCache.completenessText.textContent = `High Confidence (${Math.round(percentage)}%)`;
                } else if (percentage > 40) {
                    level = 'Medium';
                    barColor = 'bg-yellow-500';
                    domCache.completenessText.textContent = `Medium Confidence (${Math.round(percentage)}%)`;
                } else {
                    level = 'Low';
                    barColor = 'bg-red-500';
                    if(filledFields > 0) {
                        domCache.completenessText.textContent = `Low Confidence (${Math.round(percentage)}%)`;
                    } else {
                        domCache.completenessText.textContent = `Please fill the form`;
                    }
                }
                
                domCache.completenessHiddenInput.value = level;
                domCache.completenessBar.className = `h-3 rounded-full transition-all duration-300 ${barColor}`;
            }

            domCache.form.addEventListener('input', updateCompleteness, { passive: true });

            // --- Company Data Object Constructor ---
            function createCompanyDataObject() {
                // Helper function to parse numeric values
                function parseNumericValue(value) {
                    if (!value || value.trim() === '') return null;
                    const cleaned = value.toString().replace(/[₱,\s]/g, '');
                    const parsed = parseFloat(cleaned);
                    return isNaN(parsed) ? null : parsed;
                }

                // Calculate shareholder equity automatically
                const assets = parseNumericValue(document.getElementById('total-assets').value);
                const liabilities = parseNumericValue(document.getElementById('total-liabilities').value);
                const calculatedEquity = (assets && liabilities) ? assets - liabilities : null;

                // Calculate working capital automatically
                const currentAssets = parseNumericValue(document.getElementById('current-assets').value);
                const currentLiabilities = parseNumericValue(document.getElementById('current-liabilities').value);
                const workingCapital = (currentAssets && currentLiabilities) ? currentAssets - currentLiabilities : null;

                // Calculate actual confidence percentage
                const actualPercentage = totalFields > 0 ? Math.round((Array.from(formInputs).filter(input => 
                    (input.type === 'select-one' && input.value !== "") || 
                    (input.type !== 'select-one' && input.value && input.value.trim() !== '')
                ).length / totalFields) * 100) : 0;
                
                let confidenceLevel = 'Low';
                if (actualPercentage > 75) {
                    confidenceLevel = 'High';
                } else if (actualPercentage > 40) {
                    confidenceLevel = 'Medium';
                }

                const companyData = {
                    company_name: document.getElementById('company-name').value.trim(),
                    industry: document.getElementById('industry').value,
                    company_description: document.getElementById('company-description').value.trim(),
                    
                    // Financial Data - Income Statement
                    time_between_periods: parseNumericValue(document.getElementById('time-between-periods').value),
                    previous_revenue: parseNumericValue(document.getElementById('previous-revenue').value),
                    current_revenue: parseNumericValue(document.getElementById('current-revenue').value),
                    revenue: parseNumericValue(document.getElementById('current-revenue').value),
                    net_income: parseNumericValue(document.getElementById('net-income').value),
                    ebit: parseNumericValue(document.getElementById('ebit').value),
                    
                    // Financial Data - Balance Sheet
                    total_assets: parseNumericValue(document.getElementById('total-assets').value),
                    current_assets: parseNumericValue(document.getElementById('current-assets').value),
                    total_liabilities: parseNumericValue(document.getElementById('total-liabilities').value),
                    current_liabilities: parseNumericValue(document.getElementById('current-liabilities').value),
                    retained_earnings: parseNumericValue(document.getElementById('retained-earnings').value),
                    shareholder_equity: calculatedEquity,
                    working_capital: workingCapital,
                    
                    // Financial Data - Cash Flow
                    cash_flow: parseNumericValue(document.getElementById('cash-flow').value),
                    
                    // Financial Data - Valuation
                    current_valuation: parseNumericValue(document.getElementById('current-valuation').value),
                    expected_future_valuation: parseNumericValue(document.getElementById('expected-future-valuation').value),
                    years_to_future_valuation: parseNumericValue(document.getElementById('years-to-future-valuation').value),
                    
                    // Qualitative Assessment
                    team_strength: document.getElementById('team-strength').value.trim(),
                    market_position: document.getElementById('market-position').value.trim(),
                    brand_reputation: document.getElementById('brand-reputation').value.trim(),
                    
                    // Company Details
                    year_founded: parseNumericValue(document.getElementById('year-founded').value),

                    // Confidence Metrics
                    data_source_confidence: confidenceLevel,
                    confidence_percentage: actualPercentage
                };
                
                
                return companyData;
            }

            // --- API Call Function ---
            async function submitStartupData(companyData) {
                const submitButton = domCache.form.querySelector('button[type="submit"]');
                const originalText = submitButton.innerHTML;
                
                try {
                    const token = sessionStorage.getItem('authToken');
                    
                    if (!token) {
                        showErrorMessage('Authentication required. Please log in again.');
                        setTimeout(() => {
                            window.location.href = '../login.html';
                        }, 2000);
                        return;
                    }
                    
                    // Show loading state
                    submitButton.disabled = true;
                    submitButton.textContent = 'Saving...';
                    submitButton.classList.add('opacity-50', 'cursor-not-allowed');
                    
                    // API call
                    const response = await fetch('http://127.0.0.1:8000/api/startup/add/', {
                        method: 'POST',
                        headers: {
                            'Authorization': `Bearer ${token}`,
                            'Content-Type': 'application/json',
                            'Accept': 'application/json',
                        },
                        body: JSON.stringify(companyData)
                    });
                    
                    if (!response.ok) {
                        let errorData;
                        try {
                            errorData = await response.json();
                        } catch (parseError) {
                            console.error('Server returned non-JSON response:', parseError);
                            showErrorMessage(`Server error (${response.status}). Please try again later or contact support.`);
                            return;
                        }
                        
                        if (response.status === 400 && errorData.errors) {
                            const errorMessages = Object.entries(errorData.errors)
                                .map(([field, messages]) => `${field}: ${Array.isArray(messages) ? messages.join(', ') : messages}`)
                                .join('\n');
                            showErrorMessage(`Validation errors:\n${errorMessages}`);
                        } else if (response.status === 401) {
                            showErrorMessage('Authentication failed. Please log in again.');
                            setTimeout(() => {
                                window.location.href = '../login.html';
                            }, 2000);
                        } else if (response.status === 403) {
                            showErrorMessage('Access denied. Only startup users can submit company information.');
                        } else {
                            showErrorMessage(errorData.error || errorData.message || 'An error occurred while saving the startup data.');
                        }
                        return;
                    }
                    
                    let result;
                    try {
                        result = await response.json();
                    } catch (parseError) {
                        console.error('Failed to parse success response:', parseError);
                        showErrorMessage('Server error: Invalid response format. Please contact support.');
                        return;
                    }
                    
                    if (result.success) {
                        hasSuccessfulSubmission = true;
                        
                        showSuccessMessage(result.message, result.startup_id);
                        
                        submitButton.textContent = 'Successfully Submitted';
                        submitButton.classList.remove('bg-blue-600', 'hover:bg-blue-700');
                        submitButton.classList.add('bg-emerald-600', 'cursor-not-allowed');
                        
                        
                        setTimeout(() => {
                            window.location.href = 'added-startups.html';
                        }, 2000);
                    } else {
                        showErrorMessage(result.error || 'An unexpected error occurred.');
                    }
                    
                } catch (error) {
                    console.error('API Error:', error);
                    
                    if (error.name === 'TypeError' && error.message.includes('fetch')) {
                        showErrorMessage('Network error. Please check your connection.');
                    } else {
                        showErrorMessage('An unexpected error occurred. Please try again.');
                    }
                } finally {
                    if (!hasSuccessfulSubmission) {
                        isSubmitting = false;
                        submitButton.disabled = false;
                        submitButton.innerHTML = originalText;
                        submitButton.classList.remove('opacity-50', 'cursor-not-allowed');
                    }
                }
            }

            function showSuccessMessage(message, startupId) {
                const notification = document.createElement('div');
                notification.className = 'fixed top-4 right-4 bg-emerald-500 text-white p-4 rounded-lg shadow-lg z-50 max-w-sm';
                notification.textContent = `Success: ${message}`;
                document.body.appendChild(notification);
                
                setTimeout(() => {
                    notification.remove();
                }, 5000);
            }

            function showErrorMessage(message) {
                const notification = document.createElement('div');
                notification.className = 'fixed top-4 right-4 bg-red-500 text-white p-4 rounded-lg shadow-lg z-50 max-w-sm';
                notification.textContent = `Error: ${message}`;
                document.body.appendChild(notification);
                
                setTimeout(() => {
                    notification.remove();
                }, 7000);
            }

            // --- Form Submission Handler ---
            domCache.form.addEventListener('submit', function(e) {
                e.preventDefault();
                
                if (isSubmitting) {
                    return;
                }
                
                if (hasSuccessfulSubmission) {
                    showErrorMessage('Form has already been submitted successfully.');
                    return;
                }
                
                if (!domCache.form.checkValidity()) {
                    domCache.form.reportValidity();
                    return;
                }
                
                const companyData = createCompanyDataObject();
                
                // Validate required fields
                if (!companyData.company_name || !companyData.industry) {
                    showErrorMessage('Please fill in all required fields (Company Name and Industry).');
                    return;
                }
                
                isSubmitting = true;
                submitStartupData(companyData);
            }, { passive: false });

            // --- Initial Setup ---
            createTooltip();
            updateCompleteness();
        });
    </script>
</body>
</html>
