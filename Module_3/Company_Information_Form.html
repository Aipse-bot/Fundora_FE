<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="csrf-token" content="{{ csrf_token }}">
    <title>Company Information Form</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
        .hero-gradient {
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 50%, #0f172a 100%);
        }
        .form-input-modern {
            background-color: #1e293b;
            border: 1px solid #334155;
            color: #f1f5f9;
            transition: border-color 0.2s ease;
            contain: layout style;
        }
        .form-input-modern:focus {
            border-color: #3b82f6;
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.1);
            outline: none;
        }
        .form-input-modern:hover {
            border-color: #475569;
        }
        .form-input-modern::placeholder {
            color: #64748b;
        }
        .dynamic-tooltip {
            visibility: hidden;
            background-color: #0f172a;
            color: #fff;
            text-align: center;
            border-radius: 6px;
            padding: 6px 10px;
            position: fixed;
            z-index: 100;
            opacity: 0;
            transition: opacity 0.2s;
            max-width: 200px;
            font-size: 0.8125rem;
            pointer-events: none;
            border: 1px solid #334155;
            contain: layout style paint;
        }
        .dynamic-tooltip.visible {
            visibility: visible;
            opacity: 1;
        }
        .dynamic-tooltip::after {
            content: "";
            position: absolute;
            border-width: 5px;
            border-style: solid;
        }
        .tooltip-top::after {
           top: 100%;
           left: 50%;
           margin-left: -5px;
           border-color: #0f172a transparent transparent transparent;
        }
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        .fade-in {
            animation: fadeIn 0.3s ease-out;
        }
        header {
            contain: layout style paint;
        }
        .section-card {
            contain: layout style paint;
        }
    </style>
</head>
<body class="bg-slate-950 text-white min-h-screen hero-gradient">

    <!-- Header -->
    <header class="bg-slate-900 border-b border-slate-800 sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between items-center h-16">
                <div class="flex items-center space-x-3">
                    <div class="bg-blue-600 p-2 rounded-lg">
                        <svg class="h-6 w-6 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor">
                           <path stroke-linecap="round" stroke-linejoin="round" d="M2.25 18L9 11.25l4.306 4.307a11.95 11.95 0 015.814-5.519l2.74-1.22m0 0l-5.94-2.28m5.94 2.28l-2.28 5.941" />
                        </svg>
                    </div>
                    <span class="text-2xl font-bold text-white tracking-tight">Fundora</span>
                </div>
                <div class="flex items-center space-x-4">
                    <span class="text-slate-400 text-sm">
                        Welcome, <span class="font-semibold text-white" id="user-email">Loading...</span>
                    </span>
                     <img class="h-9 w-9 rounded-full object-cover" src="https://i.pravatar.cc/150?u=a042581f4e29026704d" alt="User Avatar">
                </div>
            </div>
        </div>
    </header>

    <main class="max-w-7xl mx-auto p-6">
        <div class="bg-slate-900 border border-slate-800 rounded-2xl shadow-2xl p-6 sm:p-8 fade-in">
            <form id="companyForm" novalidate class="h-full">
                <div class="grid lg:grid-cols-5 gap-8">

                    <!-- Left Column: Core Info -->
                    <div class="lg:col-span-2 section-card">
                        <div class="flex items-center gap-3 mb-6">
                            <div class="w-10 h-10 bg-blue-600 rounded-lg flex items-center justify-center text-white font-bold">i</div>
                            <h2 class="text-2xl font-bold text-white">Company Profile</h2>
                        </div>
                        <div class="space-y-4">
                            <div>
                                <label for="company-name" class="flex items-center text-sm font-medium text-slate-300 mb-2">Company Name
                                    <span class="tooltip-trigger ml-1.5 cursor-help" data-tooltip-text="Enter the full legal name of the company.">?</span>
                                </label>
                                <input type="text" name="company-name" id="company-name" class="w-full px-4 py-2.5 rounded-lg form-input-modern text-sm" placeholder="e.g., Acme Corporation" required>
                            </div>
                            <div>
                                <label for="industry" class="flex items-center text-sm font-medium text-slate-300 mb-2">Industry
                                    <span class="tooltip-trigger ml-1.5 cursor-help" data-tooltip-text="Select the primary industry sector.">?</span>
                                </label>
                                <select id="industry" name="industry" class="w-full px-4 py-2.5 rounded-lg appearance-none form-input-modern text-sm" required>
                                    <option value="" disabled selected>Select an industry</option>
                                    <option value="Technology">Technology</option>
                                    <option value="Finance">Finance</option>
                                    <option value="Healthcare">Healthcare</option>
                                    <option value="E-commerce">E-commerce</option>
                                    <option value="Education">Education</option>
                                    <option value="Real Estate">Real Estate</option>
                                    <option value="Manufacturing">Manufacturing</option>
                                    <option value="Retail">Retail</option>
                                    <option value="Food & Beverage">Food & Beverage</option>
                                    <option value="Transportation">Transportation</option>
                                    <option value="Energy">Energy</option>
                                    <option value="Entertainment">Entertainment</option>
                                    <option value="Agriculture">Agriculture</option>
                                    <option value="Other">Other</option>
                                </select>
                            </div>
                            <div>
                                <label for="company-description" class="flex items-center text-sm font-medium text-slate-300 mb-2">Company Description
                                    <span class="tooltip-trigger ml-1.5 cursor-help" data-tooltip-text="Describe the company's core business and target market.">?</span>
                                </label>
                                <textarea id="company-description" name="company-description" rows="4" class="w-full px-4 py-2.5 rounded-lg form-input-modern text-sm resize-none" placeholder="Provide a brief overview of the company's mission..."></textarea>
                            </div>

                            <div class="bg-slate-800 border border-slate-700 rounded-xl p-5">
                                <h3 class="font-semibold text-white mb-4 text-sm">Qualitative Assessment</h3>
                                <div class="space-y-4">
                                    <div>
                                        <label for="team-strength" class="flex items-center text-sm font-medium text-slate-300 mb-2">Team Strength
                                            <span class="tooltip-trigger ml-1.5 cursor-help" data-tooltip-text="Describe the leadership team's experience and skills.">?</span>
                                        </label>
                                        <textarea id="team-strength" name="team-strength" rows="3" class="w-full px-4 py-2.5 rounded-lg form-input-modern text-sm resize-none" placeholder="Describe the team's expertise and key strengths..."></textarea>
                                    </div>
                                    <div>
                                        <label for="market-position" class="flex items-center text-sm font-medium text-slate-300 mb-2">Market Position
                                            <span class="tooltip-trigger ml-1.5 cursor-help" data-tooltip-text="Describe the company's competitive position.">?</span>
                                        </label>
                                        <textarea id="market-position" name="market-position" rows="3" class="w-full px-4 py-2.5 rounded-lg form-input-modern text-sm resize-none" placeholder="Explain the company's market standing..."></textarea>
                                    </div>
                                    <div>
                                        <label for="brand-reputation" class="flex items-center text-sm font-medium text-slate-300 mb-2">Brand Reputation
                                            <span class="tooltip-trigger ml-1.5 cursor-help" data-tooltip-text="Assess the company's brand value and perception.">?</span>
                                        </label>
                                        <textarea id="brand-reputation" name="brand-reputation" rows="3" class="w-full px-4 py-2.5 rounded-lg form-input-modern text-sm resize-none" placeholder="Describe brand recognition and reputation..."></textarea>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- Right Column: Financials & Actions -->
                    <div class="lg:col-span-3 section-card">
                        <div class="flex items-center gap-3 mb-6">
                            <div class="w-10 h-10 bg-blue-600 rounded-lg flex items-center justify-center text-white font-bold">$</div>
                            <h2 class="text-2xl font-bold text-white">Financial Metrics</h2>
                        </div>
                        <div class="grid grid-cols-2 gap-6">

                            <!-- Income Statement -->
                            <div class="bg-slate-800 border border-slate-700 rounded-xl p-5">
                                <h3 class="font-semibold text-white mb-4 text-center text-sm">Income Statement</h3>
                                <div class="space-y-4">
                                    <div>
                                        <label for="time-between-periods" class="flex items-center text-sm font-medium text-slate-300 mb-2">Time Between Periods (Years)
                                            <span class="tooltip-trigger ml-1.5 cursor-help" data-tooltip-text="Time span between reporting periods (e.g., 1 for annual).">?</span>
                                        </label>
                                        <input type="number" name="time-between-periods" id="time-between-periods" class="w-full px-4 py-2.5 rounded-lg form-input-modern text-sm" placeholder="1" step="0.1" min="0">
                                    </div>
                                    <div>
                                        <label for="previous-revenue" class="flex items-center text-sm font-medium text-slate-300 mb-2">Prior Period Revenue (₱)
                                            <span class="tooltip-trigger ml-1.5 cursor-help" data-tooltip-text="Total revenue from prior fiscal period.">?</span>
                                        </label>
                                        <input type="number" name="previous-revenue" id="previous-revenue" class="w-full px-4 py-2.5 rounded-lg form-input-modern text-sm" placeholder="800,000">
                                    </div>
                                    <div>
                                        <label for="current-revenue" class="flex items-center text-sm font-medium text-slate-300 mb-2">Current Period Revenue (₱)
                                            <span class="tooltip-trigger ml-1.5 cursor-help" data-tooltip-text="Total revenue from most recent fiscal period.">?</span>
                                        </label>
                                        <input type="number" name="current-revenue" id="current-revenue" class="w-full px-4 py-2.5 rounded-lg form-input-modern text-sm" placeholder="1,000,000">
                                    </div>
                                    <div>
                                        <label for="net-income" class="flex items-center text-sm font-medium text-slate-300 mb-2">Current Period Net Income (₱)
                                            <span class="tooltip-trigger ml-1.5 cursor-help" data-tooltip-text="Profit after all expenses and taxes.">?</span>
                                        </label>
                                        <input type="number" name="net-income" id="net-income" class="w-full px-4 py-2.5 rounded-lg form-input-modern text-sm" placeholder="150,000">
                                    </div>
                                    <div>
                                        <label for="ebit" class="flex items-center text-sm font-medium text-slate-300 mb-2">EBIT (₱)
                                            <span class="tooltip-trigger ml-1.5 cursor-help" data-tooltip-text="Earnings Before Interest and Tax.">?</span>
                                        </label>
                                        <input type="number" name="ebit" id="ebit" class="w-full px-4 py-2.5 rounded-lg form-input-modern text-sm" placeholder="200,000">
                                    </div>
                                </div>
                            </div>

                            <!-- Balance Sheet -->
                            <div class="bg-slate-800 border border-slate-700 rounded-xl p-5">
                                <h3 class="font-semibold text-white mb-4 text-center text-sm">Balance Sheet</h3>
                                <div class="space-y-4">
                                    <div>
                                        <label for="total-assets" class="flex items-center text-sm font-medium text-slate-300 mb-2">Total Assets (₱)
                                            <span class="tooltip-trigger ml-1.5 cursor-help" data-tooltip-text="Total value of all company assets.">?</span>
                                        </label>
                                        <input type="number" name="total-assets" id="total-assets" class="w-full px-4 py-2.5 rounded-lg form-input-modern text-sm" placeholder="2,500,000">
                                    </div>
                                    <div>
                                        <label for="current-assets" class="flex items-center text-sm font-medium text-slate-300 mb-2">Current Assets (₱)
                                            <span class="tooltip-trigger ml-1.5 cursor-help" data-tooltip-text="Assets convertible to cash within one year.">?</span>
                                        </label>
                                        <input type="number" name="current-assets" id="current-assets" class="w-full px-4 py-2.5 rounded-lg form-input-modern text-sm" placeholder="1,200,000">
                                    </div>
                                    <div>
                                        <label for="total-liabilities" class="flex items-center text-sm font-medium text-slate-300 mb-2">Total Liabilities (₱)
                                            <span class="tooltip-trigger ml-1.5 cursor-help" data-tooltip-text="Total debt and obligations.">?</span>
                                        </label>
                                        <input type="number" name="total-liabilities" id="total-liabilities" class="w-full px-4 py-2.5 rounded-lg form-input-modern text-sm" placeholder="800,000">
                                    </div>
                                    <div>
                                        <label for="current-liabilities" class="flex items-center text-sm font-medium text-slate-300 mb-2">Current Liabilities (₱)
                                            <span class="tooltip-trigger ml-1.5 cursor-help" data-tooltip-text="Obligations due within one year.">?</span>
                                        </label>
                                        <input type="number" name="current-liabilities" id="current-liabilities" class="w-full px-4 py-2.5 rounded-lg form-input-modern text-sm" placeholder="400,000">
                                    </div>
                                    <div>
                                        <label for="retained-earnings" class="flex items-center text-sm font-medium text-slate-300 mb-2">Retained Earnings (₱)
                                            <span class="tooltip-trigger ml-1.5 cursor-help" data-tooltip-text="Cumulative profits retained in company.">?</span>
                                        </label>
                                        <input type="number" name="retained-earnings" id="retained-earnings" class="w-full px-4 py-2.5 rounded-lg form-input-modern text-sm" placeholder="600,000">
                                    </div>
                                </div>
                            </div>

                            <!-- Cash Flow -->
                            <div class="bg-slate-800 border border-slate-700 rounded-xl p-5">
                                <h3 class="font-semibold text-white mb-4 text-center text-sm">Cash Flow</h3>
                                <div class="space-y-4">
                                    <div>
                                        <label for="cash-flow" class="flex items-center text-sm font-medium text-slate-300 mb-2">Operations Cash Flow (₱)
                                            <span class="tooltip-trigger ml-1.5 cursor-help" data-tooltip-text="Cash from business operations.">?</span>
                                        </label>
                                        <input type="number" name="cash-flow" id="cash-flow" class="w-full px-4 py-2.5 rounded-lg form-input-modern text-sm" placeholder="200,000">
                                    </div>
                                </div>
                            </div>

                            <!-- Valuation -->
                            <div class="bg-slate-800 border border-slate-700 rounded-xl p-5">
                                <h3 class="font-semibold text-white mb-4 text-center text-sm">Valuation</h3>
                                <div class="space-y-4">
                                    <div>
                                        <label for="current-valuation" class="flex items-center text-sm font-medium text-slate-300 mb-2">Current Valuation (₱)
                                            <span class="tooltip-trigger ml-1.5 cursor-help" data-tooltip-text="Current market valuation of the company.">?</span>
                                        </label>
                                        <input type="number" name="current-valuation" id="current-valuation" class="w-full px-4 py-2.5 rounded-lg form-input-modern text-sm" placeholder="5,000,000">
                                    </div>
                                    <div>
                                        <label for="expected-future-valuation" class="flex items-center text-sm font-medium text-slate-300 mb-2">Expected Future Valuation (₱)
                                            <span class="tooltip-trigger ml-1.5 cursor-help" data-tooltip-text="Projected valuation at a future date.">?</span>
                                        </label>
                                        <input type="number" name="expected-future-valuation" id="expected-future-valuation" class="w-full px-4 py-2.5 rounded-lg form-input-modern text-sm" placeholder="10,000,000">
                                    </div>
                                    <div>
                                        <label for="years-to-future-valuation" class="flex items-center text-sm font-medium text-slate-300 mb-2">Years to Future Valuation
                                            <span class="tooltip-trigger ml-1.5 cursor-help" data-tooltip-text="Number of years until expected future valuation is reached.">?</span>
                                        </label>
                                        <input type="number" name="years-to-future-valuation" id="years-to-future-valuation" class="w-full px-4 py-2.5 rounded-lg form-input-modern text-sm" placeholder="5" step="0.1" min="0">
                                    </div>
                                </div>
                            </div>

                            <!-- Actions & Confidence -->
                            <div class="bg-slate-800 border border-slate-700 rounded-xl p-5 flex flex-col justify-between">
                                 <div>
                                    <h3 class="font-semibold text-white mb-4 text-center text-sm">Data Confidence</h3>
                                    <div class="w-full bg-slate-700 rounded-full h-3 mb-3">
                                        <div id="completeness-bar" class="bg-blue-600 h-3 rounded-full transition-all duration-300" style="width: 0%"></div>
                                    </div>
                                    <p id="completeness-text" class="text-sm text-slate-400 text-center font-medium">Please fill the form</p>
                                    <input type="hidden" id="data-completeness-level" name="data-completeness-level" value="Low">
                                 </div>
                                <div class="mt-6 space-y-3">
                                    <button type="submit" class="w-full flex items-center justify-center gap-2 bg-blue-600 text-white font-semibold py-3.5 px-4 rounded-lg shadow-lg hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500 focus:ring-offset-slate-900 transition-colors duration-200">
                                        Save & Generate Report
                                    </button>
                                    <button type="button" onclick="window.history.back()" class="w-full bg-slate-700 text-slate-300 font-semibold py-3.5 px-4 rounded-lg hover:bg-slate-600 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-slate-500 focus:ring-offset-slate-900 transition-colors duration-200 border border-slate-600">
                                        Cancel
                                    </button>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </form>
        </div>
    </main>

    <script>
        let tooltipElement;
        const domCache = {
            form: null,
            completenessBar: null,
            completenessText: null,
            completenessHiddenInput: null,
            userEmailElement: null
        };

        document.addEventListener('DOMContentLoaded', function() {
            domCache.form = document.getElementById('companyForm');
            domCache.completenessBar = document.getElementById('completeness-bar');
            domCache.completenessText = document.getElementById('completeness-text');
            domCache.completenessHiddenInput = document.getElementById('data-completeness-level');
            domCache.userEmailElement = document.getElementById('user-email');

            const formInputs = Array.from(domCache.form.querySelectorAll('input[type="text"], input[type="number"], select, textarea')).filter(el => !el.disabled);
            const totalFields = formInputs.length;
            
            // Submission state management
            let isSubmitting = false;
            let hasSuccessfulSubmission = false;

            // --- Load User Information ---
            async function loadUserInfo() {
                const token = localStorage.getItem('authToken');

                if (!token) {
                    domCache.userEmailElement.textContent = 'No user logged in';
                    domCache.userEmailElement.className = 'font-semibold text-red-400';
                    alert('Please log in to access this page.');
                    window.location.href = '../login.html';
                    return;
                }

                const storedUserData = localStorage.getItem('userData');
                if (storedUserData) {
                    try {
                        const user = JSON.parse(storedUserData);
                        domCache.userEmailElement.textContent = user.email || 'Unknown user';
                        domCache.userEmailElement.className = 'font-semibold text-blue-400';
                        return;
                    } catch (error) {
                        console.error('Error parsing user data:', error);
                    }
                }

                domCache.userEmailElement.textContent = 'Token found, no user info';
                domCache.userEmailElement.className = 'font-semibold text-yellow-400';
            }

            loadUserInfo();

            // --- Dynamic Tooltip Logic ---
            function createTooltip() {
                if (!tooltipElement) {
                    tooltipElement = document.createElement('div');
                    tooltipElement.className = 'dynamic-tooltip tooltip-top';
                    document.body.appendChild(tooltipElement);
                }
            }
            
            document.querySelectorAll('.tooltip-trigger').forEach(trigger => {
                trigger.addEventListener('mouseenter', (e) => {
                    createTooltip();
                    const text = trigger.getAttribute('data-tooltip-text');
                    tooltipElement.textContent = text;
                    const rect = trigger.getBoundingClientRect();
                    
                    tooltipElement.classList.add('visible');
                    const tooltipRect = tooltipElement.getBoundingClientRect();

                    let top = rect.top - tooltipRect.height - 8;
                    let left = rect.left + (rect.width / 2) - (tooltipRect.width / 2);

                    if (left < 0) left = 5;
                    if (top < 0) top = rect.bottom + 8;

                    tooltipElement.style.top = `${top}px`;
                    tooltipElement.style.left = `${left}px`;
                }, { passive: true });
                
                trigger.addEventListener('mouseleave', () => {
                    if (tooltipElement) {
                        tooltipElement.classList.remove('visible');
                    }
                }, { passive: true });
            });

            // --- Data Completeness Calculation ---
            function updateCompleteness() {
                let filledFields = 0;
                formInputs.forEach(input => {
                    if ((input.type === 'select-one' && input.value !== "") || (input.type !== 'select-one' && input.value && input.value.trim() !== '')) {
                        filledFields++;
                    }
                });

                const percentage = totalFields > 0 ? (filledFields / totalFields) * 100 : 0;
                domCache.completenessBar.style.width = percentage + '%';
                
                let level = 'Low';
                let barColor = 'bg-red-500';

                if (percentage > 75) {
                    level = 'High';
                    barColor = 'bg-emerald-500';
                    domCache.completenessText.textContent = `High Confidence (${Math.round(percentage)}%)`;
                } else if (percentage > 40) {
                    level = 'Medium';
                    barColor = 'bg-yellow-500';
                    domCache.completenessText.textContent = `Medium Confidence (${Math.round(percentage)}%)`;
                } else {
                    level = 'Low';
                    barColor = 'bg-red-500';
                    if(filledFields > 0) {
                        domCache.completenessText.textContent = `Low Confidence (${Math.round(percentage)}%)`;
                    } else {
                        domCache.completenessText.textContent = `Please fill the form`;
                    }
                }
                
                domCache.completenessHiddenInput.value = level;
                domCache.completenessBar.className = `h-3 rounded-full transition-all duration-300 ${barColor}`;
            }

            domCache.form.addEventListener('input', updateCompleteness, { passive: true });

            // --- Company Data Object Constructor ---
            function createCompanyDataObject() {
                // Helper function to parse numeric values
                function parseNumericValue(value) {
                    if (!value || value.trim() === '') return null;
                    const cleaned = value.toString().replace(/[₱,\s]/g, '');
                    const parsed = parseFloat(cleaned);
                    return isNaN(parsed) ? null : parsed;
                }

                // Calculate shareholder equity automatically
                const assets = parseNumericValue(document.getElementById('total-assets').value);
                const liabilities = parseNumericValue(document.getElementById('total-liabilities').value);
                const calculatedEquity = (assets && liabilities) ? assets - liabilities : null;

                // Calculate working capital automatically
                const currentAssets = parseNumericValue(document.getElementById('current-assets').value);
                const currentLiabilities = parseNumericValue(document.getElementById('current-liabilities').value);
                const workingCapital = (currentAssets && currentLiabilities) ? currentAssets - currentLiabilities : null;

                // Calculate actual confidence percentage
                const actualPercentage = totalFields > 0 ? Math.round((Array.from(formInputs).filter(input => 
                    (input.type === 'select-one' && input.value !== "") || 
                    (input.type !== 'select-one' && input.value && input.value.trim() !== '')
                ).length / totalFields) * 100) : 0;
                
                let confidenceLevel = 'Low';
                if (actualPercentage > 75) {
                    confidenceLevel = 'High';
                } else if (actualPercentage > 40) {
                    confidenceLevel = 'Medium';
                }

                const companyData = {
                    company_name: document.getElementById('company-name').value.trim(),
                    industry: document.getElementById('industry').value,
                    company_description: document.getElementById('company-description').value.trim(),
                    
                    // Financial Data - Income Statement
                    time_between_periods: parseNumericValue(document.getElementById('time-between-periods').value),
                    previous_revenue: parseNumericValue(document.getElementById('previous-revenue').value),
                    current_revenue: parseNumericValue(document.getElementById('current-revenue').value),
                    revenue: parseNumericValue(document.getElementById('current-revenue').value),
                    net_income: parseNumericValue(document.getElementById('net-income').value),
                    ebit: parseNumericValue(document.getElementById('ebit').value),
                    
                    // Financial Data - Balance Sheet
                    total_assets: parseNumericValue(document.getElementById('total-assets').value),
                    current_assets: parseNumericValue(document.getElementById('current-assets').value),
                    total_liabilities: parseNumericValue(document.getElementById('total-liabilities').value),
                    current_liabilities: parseNumericValue(document.getElementById('current-liabilities').value),
                    retained_earnings: parseNumericValue(document.getElementById('retained-earnings').value),
                    shareholder_equity: calculatedEquity,
                    working_capital: workingCapital,
                    
                    // Financial Data - Cash Flow
                    cash_flow: parseNumericValue(document.getElementById('cash-flow').value),
                    
                    // Financial Data - Valuation
                    current_valuation: parseNumericValue(document.getElementById('current-valuation').value),
                    expected_future_valuation: parseNumericValue(document.getElementById('expected-future-valuation').value),
                    years_to_future_valuation: parseNumericValue(document.getElementById('years-to-future-valuation').value),
                    
                    // Qualitative Assessment
                    team_strength: document.getElementById('team-strength').value.trim(),
                    market_position: document.getElementById('market-position').value.trim(),
                    brand_reputation: document.getElementById('brand-reputation').value.trim(),
                    
                    // Confidence Metrics
                    data_source_confidence: confidenceLevel,
                    confidence_percentage: actualPercentage
                };
                
                console.log('Company data object created with confidence level:', confidenceLevel);
                
                return companyData;
            }

            // --- API Call Function ---
            async function submitStartupData(companyData) {
                const submitButton = domCache.form.querySelector('button[type="submit"]');
                const originalText = submitButton.innerHTML;
                
                try {
                    const token = localStorage.getItem('authToken');
                    
                    if (!token) {
                        showErrorMessage('Authentication required. Please log in again.');
                        setTimeout(() => {
                            window.location.href = '../login.html';
                        }, 2000);
                        return;
                    }
                    
                    // Show loading state
                    submitButton.disabled = true;
                    submitButton.textContent = 'Saving...';
                    submitButton.classList.add('opacity-50', 'cursor-not-allowed');
                    
                    // API call
                    const response = await fetch('https://fundora-be-singapore.onrender.com/api/startup/add/', {
                        method: 'POST',
                        headers: {
                            'Authorization': `Bearer ${token}`,
                            'Content-Type': 'application/json',
                            'Accept': 'application/json',
                        },
                        body: JSON.stringify(companyData)
                    });
                    
                    if (!response.ok) {
                        let errorData;
                        try {
                            errorData = await response.json();
                        } catch (parseError) {
                            console.error('Server returned non-JSON response:', parseError);
                            showErrorMessage(`Server error (${response.status}). Please try again later or contact support.`);
                            return;
                        }
                        
                        if (response.status === 400 && errorData.errors) {
                            const errorMessages = Object.entries(errorData.errors)
                                .map(([field, messages]) => `${field}: ${Array.isArray(messages) ? messages.join(', ') : messages}`)
                                .join('\n');
                            showErrorMessage(`Validation errors:\n${errorMessages}`);
                        } else if (response.status === 401) {
                            showErrorMessage('Authentication failed. Please log in again.');
                            setTimeout(() => {
                                window.location.href = '../login.html';
                            }, 2000);
                        } else if (response.status === 403) {
                            showErrorMessage('Access denied. Only startup users can submit company information.');
                        } else {
                            showErrorMessage(errorData.error || errorData.message || 'An error occurred while saving the startup data.');
                        }
                        return;
                    }
                    
                    let result;
                    try {
                        result = await response.json();
                    } catch (parseError) {
                        console.error('Failed to parse success response:', parseError);
                        showErrorMessage('Server error: Invalid response format. Please contact support.');
                        return;
                    }
                    
                    if (result.success) {
                        hasSuccessfulSubmission = true;
                        
                        showSuccessMessage(result.message, result.startup_id);
                        
                        submitButton.textContent = 'Successfully Submitted';
                        submitButton.classList.remove('bg-blue-600', 'hover:bg-blue-700');
                        submitButton.classList.add('bg-emerald-600', 'cursor-not-allowed');
                        
                        console.log('Startup saved with ID:', result.startup_id);
                        
                        setTimeout(() => {
                            window.location.href = 'added-startups.html';
                        }, 2000);
                    } else {
                        showErrorMessage(result.error || 'An unexpected error occurred.');
                    }
                    
                } catch (error) {
                    console.error('API Error:', error);
                    
                    if (error.name === 'TypeError' && error.message.includes('fetch')) {
                        showErrorMessage('Network error. Please check your connection.');
                    } else {
                        showErrorMessage('An unexpected error occurred. Please try again.');
                    }
                } finally {
                    if (!hasSuccessfulSubmission) {
                        isSubmitting = false;
                        submitButton.disabled = false;
                        submitButton.innerHTML = originalText;
                        submitButton.classList.remove('opacity-50', 'cursor-not-allowed');
                    }
                }
            }

            function showSuccessMessage(message, startupId) {
                const notification = document.createElement('div');
                notification.className = 'fixed top-4 right-4 bg-emerald-500 text-white p-4 rounded-lg shadow-lg z-50 max-w-sm';
                notification.textContent = `Success: ${message}`;
                document.body.appendChild(notification);
                
                setTimeout(() => {
                    notification.remove();
                }, 5000);
            }

            function showErrorMessage(message) {
                const notification = document.createElement('div');
                notification.className = 'fixed top-4 right-4 bg-red-500 text-white p-4 rounded-lg shadow-lg z-50 max-w-sm';
                notification.textContent = `Error: ${message}`;
                document.body.appendChild(notification);
                
                setTimeout(() => {
                    notification.remove();
                }, 7000);
            }

            // --- Form Submission Handler ---
            domCache.form.addEventListener('submit', function(e) {
                e.preventDefault();
                
                if (isSubmitting) {
                    console.log('Submission already in progress');
                    return;
                }
                
                if (hasSuccessfulSubmission) {
                    showErrorMessage('Form has already been submitted successfully.');
                    return;
                }
                
                if (!domCache.form.checkValidity()) {
                    domCache.form.reportValidity();
                    return;
                }
                
                const companyData = createCompanyDataObject();
                
                // Validate required fields
                if (!companyData.company_name || !companyData.industry) {
                    showErrorMessage('Please fill in all required fields (Company Name and Industry).');
                    return;
                }
                
                isSubmitting = true;
                submitStartupData(companyData);
            }, { passive: false });

            // --- Initial Setup ---
            createTooltip();
            updateCompleteness();
        });
    </script>
</body>
</html>
