<!DOCTYPE html>
<html>
<head>
    <title>Test Company Form</title>
</head>
<body>
    <h2>Test Company Information Form</h2>
    <form id="testForm">
        <input type="text" id="company_name" placeholder="Company Name" required><br><br>
        <input type="text" id="industry" placeholder="Industry" required><br><br>
        <textarea id="company_description" placeholder="Company Description"></textarea><br><br>
        <input type="number" id="current_revenue" placeholder="Current Revenue"><br><br>
        <input type="number" id="net_income" placeholder="Net Income"><br><br>
        <button type="submit">Submit</button>
    </form>

    <script>
        document.getElementById('testForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const token = localStorage.getItem('authToken');
            const data = {
                company_name: document.getElementById('company_name').value,
                industry: document.getElementById('industry').value,
                company_description: document.getElementById('company_description').value,
                current_revenue: document.getElementById('current_revenue').value,
                net_income: document.getElementById('net_income').value,
                data_source_confidence: 'Medium'
            };
            
            try {
                
                const response = await fetch('http://127.0.0.1:8000/api/startup/add/', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${token}`
                    },
                    body: JSON.stringify(data)
                });
                
                const result = await response.json();
                console.log('Response:', result);
                alert(JSON.stringify(result, null, 2));
            } catch (error) {
                console.error('Error:', error);
                alert('Error: ' + error.message);
            }
        });
    </script>
</body>
</html>
