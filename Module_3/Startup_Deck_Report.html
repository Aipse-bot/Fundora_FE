<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Deck Report</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50: '#eff6ff',
                            100: '#dbeafe',
                            200: '#bfdbfe',
                            300: '#93c5fd',
                            400: '#60a5fa',
                            500: '#3b82f6',
                            600: '#2563eb',
                            700: '#1d4ed8',
                            800: '#1e40af',
                            900: '#1e3a8a'
                        },
                        accent: {
                            50: '#ecfdf5',
                            100: '#d1fae5',
                            200: '#a7f3d0',
                            300: '#6ee7b7',
                            400: '#34d399',
                            500: '#10b981',
                            600: '#059669',
                            700: '#047857',
                            800: '#065f46',
                            900: '#064e3b'
                        }
                    },
                    fontFamily: {
                        'sans': ['Inter', 'system-ui', 'sans-serif']
                    }
                }
            }
        }
    </script>
    <style>
        body { 
            font-family: 'Inter', sans-serif;
        }
        
        @keyframes fadeInUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes slideDown { from { opacity: 0; transform: translateY(-10px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes scaleIn { from { opacity: 0; transform: scale(0.98); } to { opacity: 1; transform: scale(1); } }
        
        .fade-in-up { animation: fadeInUp 0.5s ease-out forwards; opacity: 0; }
        
        .card-hover {
            transition: all 0.3s ease;
            contain: layout style paint;
            opacity: 0;
            animation: scaleIn 0.5s ease-out forwards;
        }
        .card-hover:hover {
            transform: translateY(-4px);
            box-shadow: 0 12px 24px rgba(59, 130, 246, 0.2);
        }
        
        .card-hover:nth-of-type(1) { animation-delay: 0.1s; }
        .card-hover:nth-of-type(2) { animation-delay: 0.15s; }
        .card-hover:nth-of-type(3) { animation-delay: 0.2s; }
        .card-hover:nth-of-type(4) { animation-delay: 0.25s; }
        .card-hover:nth-of-type(5) { animation-delay: 0.3s; }
        
        nav { animation: slideDown 0.5s ease-out; }
        
        button, a { transition: all 0.3s ease; }
        button:hover:not(:disabled), a:hover {
            transform: translateY(-1px);
        }
        button:active:not(:disabled), a:active {
            transform: translateY(0);
        }
        
        canvas { transition: opacity 0.3s ease; }
    </style>
</head>
<body class="bg-slate-950 text-gray-100 min-h-screen" style="contain: layout style paint;">
    
    <!-- Navbar -->
    <nav class="fixed top-0 left-0 right-0 z-50 bg-slate-900 border-b border-slate-800">
        <div class="max-w-7xl mx-auto px-6 py-4">
            <div class="flex items-center justify-between">
                <div class="flex items-center space-x-3">
                    <span class="text-2xl font-bold text-white">Fundora</span>
                </div>
                <div id="header-user" class="flex items-center space-x-4"></div>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <div class="pt-24 pb-12 px-6">
        <div class="max-w-7xl mx-auto space-y-8">

            <!-- Header Card -->
            <div class="bg-slate-800 border border-slate-700 rounded-2xl p-8 fade-in-up">
                <div class="flex flex-col md:flex-row items-start md:items-center justify-between gap-6">
                    <div class="flex items-start gap-4">
                        <div id="deck-initial" class="w-16 h-16 bg-brand-600 text-white font-bold flex items-center justify-center text-2xl rounded-xl shrink-0">
                            L
                        </div>
                        <div>
                            <h1 id="deck-company-name" class="text-3xl font-bold text-white mb-2">Company Name</h1>
                            <p id="deck-tagline" class="text-lg text-gray-400">Tagline</p>
                        </div>
                    </div>
                    <a id="deck-back-link" href="#" class="bg-slate-800 hover:bg-slate-700 border border-slate-700 text-white px-6 py-3 rounded-lg font-medium transition-colors flex items-center gap-2">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"/>
                        </svg>
                        Back
                    </a>
                </div>
            </div>

            <!-- Problem & Solution -->
            <div class="grid md:grid-cols-2 gap-6 fade-in-up" style="animation-delay: 0.1s;">
                <div class="bg-slate-800/50 border border-slate-700 rounded-2xl p-8 card-hover">
                    <div class="flex items-center gap-3 mb-4">
                        <div class="w-10 h-10 bg-red-500/10 border border-red-500/20 rounded-xl flex items-center justify-center">
                            <svg class="w-5 h-5 text-red-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"/>
                            </svg>
                        </div>
                        <h2 class="text-xl font-bold text-white">The Problem</h2>
                    </div>
                    <p id="problem-description" class="text-gray-400 leading-relaxed">—</p>
                </div>
                
                <div class="bg-slate-800/50 border border-slate-700 rounded-2xl p-8 card-hover">
                    <div class="flex items-center gap-3 mb-4">
                        <div class="w-10 h-10 bg-emerald-500/10 border border-emerald-500/20 rounded-xl flex items-center justify-center">
                            <svg class="w-5 h-5 text-emerald-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"/>
                            </svg>
                        </div>
                        <h2 class="text-xl font-bold text-white">The Solution</h2>
                    </div>
                    <p id="solution-description" class="text-gray-400 leading-relaxed">—</p>
                </div>
            </div>

            <!-- Market Analysis & Financial Projection -->
            <div class="grid md:grid-cols-2 gap-6 fade-in-up" style="animation-delay: 0.2s;">
                
                <!-- Market Analysis -->
                <div class="bg-slate-800/50 border border-slate-700 rounded-2xl p-8 card-hover">
                    <div class="flex items-center gap-3 mb-6">
                        <div class="w-10 h-10 bg-brand-500/10 border border-brand-500/20 rounded-xl flex items-center justify-center">
                            <svg class="w-5 h-5 text-brand-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z"/>
                            </svg>
                        </div>
                        <h2 class="text-xl font-bold text-white">Market Analysis</h2>
                    </div>
                    
                    <div class="space-y-4">
                        <div class="flex justify-between items-start">
                            <span class="text-gray-400 font-medium">Primary Market:</span>
                            <span id="primary-market" class="text-white font-semibold text-right">—</span>
                        </div>
                        <div class="h-px bg-slate-700"></div>
                        
                        <div class="flex justify-between items-start">
                            <span class="text-gray-400 font-medium">Target Audience:</span>
                            <span id="target-audience" class="text-white font-semibold text-right">—</span>
                        </div>
                        <div class="h-px bg-slate-700"></div>
                        
                        <div class="flex justify-between items-start">
                            <span class="text-gray-400 font-medium">Market Growth (YOY):</span>
                            <span id="market-growth" class="text-accent-400 font-semibold text-right">—</span>
                        </div>
                        <div class="h-px bg-slate-700"></div>
                        
                        <div class="pt-2">
                            <span class="text-gray-400 font-medium block mb-2">Our Advantage:</span>
                            <p id="competitive-advantage" class="text-brand-400 leading-relaxed">—</p>
                        </div>
                    </div>
                </div>

                <!-- Financial Projection -->
                <div class="bg-slate-800/50 border border-slate-700 rounded-2xl p-8 card-hover">
                    <div class="flex items-center gap-3 mb-6">
                        <div class="w-10 h-10 bg-accent-500/10 border border-accent-500/20 rounded-xl flex items-center justify-center">
                            <svg class="w-5 h-5 text-accent-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 7h8m0 0v8m0-8l-8 8-4-4-6 6"/>
                            </svg>
                        </div>
                        <h2 class="text-xl font-bold text-white">Financial Projection</h2>
                    </div>
                    
                    <div id="financial-table-container" class="overflow-x-auto mb-6"></div>
                    
                    <div class="bg-slate-900/50 rounded-xl p-4 border border-slate-700" style="contain: layout style paint;">
                        <h3 class="text-sm font-semibold text-gray-400 mb-3 text-center">Revenue & Profit Chart</h3>
                        <canvas id="revenueProfitChart" class="w-full"></canvas>
                    </div>
                </div>
            </div>

            <!-- Funding Request -->
            <div class="bg-slate-800/50 border border-slate-700 rounded-2xl p-8 card-hover fade-in-up" style="animation-delay: 0.3s;">
                <div class="flex items-center gap-3 mb-6">
                    <div class="w-10 h-10 bg-brand-500/10 border border-brand-500/20 rounded-xl flex items-center justify-center">
                        <svg class="w-5 h-5 text-brand-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8c-1.657 0-3 .895-3 2s1.343 2 3 2 3 .895 3 2-1.343 2-3 2m0-8c1.11 0 2.08.402 2.599 1M12 8V7m0 1v8m0 0v1m0-1c-1.11 0-2.08-.402-2.599-1M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/>
                        </svg>
                    </div>
                    <h2 class="text-xl font-bold text-white">Funding Request</h2>
                </div>
                <div id="ask-section" class="text-gray-400">
                    <p>Loading funding information...</p>
                </div>
            </div>

        </div>
    </div>

    <script>
        const domCache = {};
        
        function getCachedElement(id) {
            if (!domCache[id]) {
                domCache[id] = document.getElementById(id);
            }
            return domCache[id];
        }

        function renderHeaderUser(user) {
            const container = getCachedElement('header-user');
            container.innerHTML = '';

            if (!user || !user.name) return;

            container.innerHTML = `
                <span class="text-gray-400 text-sm">
                    Welcome, <span class="font-medium text-white">${user.name}</span>
                </span>
                <a href="/logout.html" class="bg-slate-800 hover:bg-slate-700 border border-slate-700 text-white px-4 py-2 rounded-lg text-sm font-medium transition-colors">
                    Logout
                </a>
            `;
        }

        if (document.addEventListener) {
            document.addEventListener('click', function() {}, { passive: true });
        }
    </script>

</body>
</html>
