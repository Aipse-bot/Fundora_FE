<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="csrf-token" content="{{ csrf_token }}">
  <title>Company Profile Form</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <script src="https://unpkg.com/lucide@latest"></script>

  <style>
    body {
      font-family: "Inter", sans-serif;
      background: linear-gradient(135deg, #0f172a 0%, #1e293b 50%, #0f172a 100%);
      min-height: 100vh;
      margin: 0;
      color: #e2e8f0;
      contain: layout style paint;
    }

    .form-input-modern {
      background-color: #1e293b;
      border: 1px solid #334155;
      color: #f1f5f9;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      contain: layout style;
    }

    .form-input-modern::placeholder {
      color: #94a3b8;
    }

    .form-input-modern:focus {
      border-color: #3b82f6;
      box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.2);
      outline: none;
      transform: translateY(-1px);
    }

    .form-input-modern:hover {
      border-color: #475569;
      background-color: #1e293bee;
    }

    .dynamic-tooltip {
      visibility: hidden;
      background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
      color: #f8fafc;
      text-align: center;
      border-radius: 8px;
      padding: 10px 14px;
      position: fixed;
      z-index: 100;
      opacity: 0;
      transition: opacity 0.3s ease, transform 0.3s ease;
      max-width: 220px;
      font-size: 0.875rem;
      pointer-events: none;
      border: 1px solid #334155;
      box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.3);
      transform: translateY(5px);
    }

    .dynamic-tooltip.visible {
      visibility: visible;
      opacity: 1;
      transform: translateY(0);
    }

    .dynamic-tooltip::after {
      content: "";
      position: absolute;
      border-width: 6px;
      border-style: solid;
    }

    .tooltip-top::after {
      top: 100%;
      left: 50%;
      margin-left: -6px;
      border-color: #1e293b transparent transparent transparent;
    }

    ::-webkit-scrollbar {
      width: 8px;
    }
    ::-webkit-scrollbar-thumb {
      background: linear-gradient(180deg, #475569 0%, #334155 100%);
      border-radius: 4px;
    }
    ::-webkit-scrollbar-track {
      background: #1e293b;
    }

    header {
      contain: layout style paint;
      will-change: auto;
      backdrop-filter: blur(10px);
      background: rgba(15, 23, 42, 0.9);
    }

    #completeness-bar {
      will-change: width;
      transition: width 0.5s cubic-bezier(0.4, 0, 0.2, 1);
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(20px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes slideDown {
      from {
        opacity: 0;
        transform: translateY(-10px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes pulse {
      0%, 100% {
        opacity: 1;
      }
      50% {
        opacity: 0.6;
      }
    }

    .fade-in {
      animation: fadeIn 0.6s ease-out;
    }

    .slide-down {
      animation: slideDown 0.4s ease-out;
    }

    .section-card {
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .section-card:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 20px -5px rgba(59, 130, 246, 0.2);
    }

    .tooltip-trigger svg {
      transition: all 0.3s ease;
    }

    .tooltip-trigger:hover svg {
      transform: scale(1.2);
      filter: drop-shadow(0 0 4px rgba(59, 130, 246, 0.5));
    }
  </style>
</head>

<body class="flex flex-col min-h-screen">

  <!-- Header -->
  <header class="bg-slate-900 border-b border-slate-700 shadow-sm sticky top-0 z-50 slide-down">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
      <div class="flex justify-between items-center h-16">
        <div class="flex items-center space-x-3 group">
          <div class="bg-gradient-to-br from-blue-600 to-blue-500 p-2 rounded-lg shadow-lg shadow-blue-500/30 transform transition-transform group-hover:scale-110">
            <svg class="h-6 w-6 text-white" xmlns="http://www.w3.org/2000/svg" fill="none"
              viewBox="0 0 24 24" stroke-width="2" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round"
                d="M2.25 18L9 11.25l4.306 4.307a11.95 11.95 0 015.814-5.519l2.74-1.22m0 0l-5.94-2.28m5.94 2.28l-2.28 5.941" />
            </svg>
          </div>
          <span class="text-2xl font-bold bg-gradient-to-r from-blue-400 to-emerald-400 bg-clip-text text-transparent tracking-tight">Fundora</span>
        </div>
        <div class="flex items-center space-x-4">
          <span class="text-slate-400 text-sm">
            Welcome, <span class="font-semibold text-blue-400" id="user-email">Loading...</span>
          </span>
          <img class="h-9 w-9 rounded-full object-cover border-2 border-blue-500/50 shadow-lg transform transition-transform hover:scale-110"
            src="https://i.pravatar.cc/150?u=a042581f4e29026704d" alt="User Avatar" />
        </div>
      </div>
    </div>
  </header>

  <main class="flex-1 py-6 px-4 sm:px-6 lg:px-8">
    <div class="max-w-7xl mx-auto bg-slate-900 border border-slate-700 rounded-2xl shadow-lg p-6 sm:p-8">
      <div class="mb-6 bg-gradient-to-br from-slate-800 to-slate-900 rounded-xl p-5 border border-slate-700 shadow-xl fade-in">
          <div class="flex items-center justify-between mb-3">
            <div class="flex items-center gap-2">
              <svg class="w-5 h-5 text-blue-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path>
              </svg>
              <span class="text-sm font-semibold text-slate-200">Form Completeness</span>
            </div>
            <span class="text-sm font-medium text-slate-300" id="completeness-text">Please fill the form</span>
          </div>
          <div class="w-full bg-slate-700 rounded-full h-3 overflow-hidden shadow-inner">
            <div id="completeness-bar" class="h-3 rounded-full bg-gradient-to-r from-blue-500 to-blue-400 transition-all duration-500 shadow-lg" style="width: 0%"></div>
          </div>
          <input type="hidden" id="data-completeness-level" name="data-completeness-level" value="Low" />
      </div>

      <form id="companyForm" novalidate class="space-y-8">
        <div class="grid lg:grid-cols-5 gap-8">

          <!-- Left Column -->
          <div class="lg:col-span-2">
            <div class="flex items-center gap-3 mb-6 group">
                <div class="bg-gradient-to-br from-blue-600 to-blue-500 p-2.5 rounded-lg shadow-lg shadow-blue-500/30 transform transition-transform group-hover:scale-110">
                  <svg class="w-5 h-5 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16m14 0h2m-2 0h-5m-9 0H3m2 0h5M9 7h1m-1 4h1m4-4h1m-1 4h1m-5 10v-5a1 1 0 011-1h2a1 1 0 011 1v5m-4 0h4" /></svg>
                </div>
                <h2 class="text-xl font-bold bg-gradient-to-r from-blue-400 to-emerald-400 bg-clip-text text-transparent">Company Profile</h2>
            </div>
            <div class="space-y-6">
              <div>
                <label for="company-name" class="flex items-center text-sm font-medium text-slate-300 mb-1.5">
                  Company Name
                  <span class="tooltip-trigger ml-1.5"
                    data-tooltip-text="Enter the full legal name of the company being analyzed.">
                    <svg class="w-4 h-4 text-slate-500 hover:text-blue-400 cursor-help" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" /></svg>
                  </span>
                </label>
                <input type="text" name="company-name" id="company-name"
                  class="w-full px-4 py-2.5 rounded-lg border form-input-modern text-sm"
                  placeholder="e.g., Acme Corporation" required />
              </div>

              <div>
                <label for="industry" class="flex items-center text-sm font-medium text-slate-300 mb-1.5">Industry
                  <span class="tooltip-trigger ml-1.5"
                    data-tooltip-text="Select the primary industry sector in which the company operates.">
                    <svg class="w-4 h-4 text-slate-500 hover:text-blue-400 cursor-help" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" /></svg>
                  </span>
                </label>
                <select id="industry" name="industry"
                  class="w-full px-4 py-2.5 rounded-lg border form-input-modern text-sm appearance-none" required>
                  <option value="" disabled selected>Select an industry</option>
                  <option value="Technology">Technology</option>
                  <option value="Finance">Finance</option>
                  <option value="Healthcare">Healthcare</option>
                  <option value="Retail">Retail</option>
                  <option value="Manufacturing">Manufacturing</option>
                </select>
              </div>

              <div>
                <label for="company-description"
                  class="flex items-center text-sm font-medium text-slate-300 mb-1.5">Company Description
                  <span class="tooltip-trigger ml-1.5"
                    data-tooltip-text="Describe the company's core business, products/services, target market, and competitive landscape.">
                    <svg class="w-4 h-4 text-slate-500 hover:text-blue-400 cursor-help" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" /></svg>
                  </span>
                </label>
                <textarea id="company-description" name="company-description" rows="8"
                  class="w-full px-4 py-2.5 rounded-lg border form-input-modern text-sm resize-none"
                  placeholder="Provide a brief overview of the company, its mission, and its core products or services."></textarea>
              </div>
            </div>
          </div>

          <!-- Right Column -->
          <div class="lg:col-span-3 space-y-8">
            
            <!-- Income Statement -->
            <div class="bg-slate-800 border border-slate-700 rounded-xl p-4 section-card shadow-lg">
              <h3 class="font-semibold text-white mb-4 text-center text-sm flex items-center justify-center gap-2">
                <span class="inline-block w-2.5 h-2.5 bg-blue-500 rounded-full shadow-lg shadow-blue-500/50 animate-pulse"></span>
                Income Statement
              </h3>
              <div class="space-y-3">
                <div>
                  <label for="time-between-periods" class="flex items-center text-sm font-medium text-slate-300">Time Between Periods (Years)
                    <span class="tooltip-trigger ml-1.5"
                      data-tooltip-text="Time span between reporting periods (e.g., 1 for annual).">
                      <svg class="w-4 h-4 text-slate-500 hover:text-blue-400 cursor-help" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" /></svg>
                    </span>
                  </label>
                  <input type="number" name="time-between-periods" id="time-between-periods"
                    class="mt-1 w-full p-2.5 border rounded-md form-input-modern text-sm" placeholder="1" step="0.1" min="0" />
                </div>
                <div>
                  <label for="previous-revenue" class="flex items-center text-sm font-medium text-slate-300">
                    Prior Period Revenue (₱)
                    <span class="tooltip-trigger ml-1.5"
                      data-tooltip-text="Enter the total revenue from the prior fiscal period.">
                      <svg class="w-4 h-4 text-slate-500 hover:text-blue-400 cursor-help" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" /></svg>
                    </span>
                  </label>
                  <input type="number" name="previous-revenue" id="previous-revenue"
                    class="mt-1 w-full p-2.5 border rounded-md form-input-modern text-sm" placeholder="800,000" />
                </div>
                <div>
                  <label for="current-revenue" class="flex items-center text-sm font-medium text-slate-300">
                    Current Period Revenue (₱)
                    <span class="tooltip-trigger ml-1.5"
                      data-tooltip-text="Enter the total revenue from the most recent fiscal period.">
                      <svg class="w-4 h-4 text-slate-500 hover:text-blue-400 cursor-help" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" /></svg>
                    </span>
                  </label>
                  <input type="number" name="current-revenue" id="current-revenue"
                    class="mt-1 w-full p-2.5 border rounded-md form-input-modern text-sm" placeholder="1,000,000" />
                </div>
                <div>
                  <label for="net-income" class="flex items-center text-sm font-medium text-slate-300">
                    Current Period Net Income (₱)
                    <span class="tooltip-trigger ml-1.5"
                      data-tooltip-text="Profit after all expenses and taxes have been deducted.">
                      <svg class="w-4 h-4 text-slate-500 hover:text-blue-400 cursor-help" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" /></svg>
                    </span>
                  </label>
                  <input type="number" name="net-income" id="net-income"
                    class="mt-1 w-full p-2.5 border rounded-md form-input-modern text-sm" placeholder="150,000" />
                </div>
                <!-- Added EBIT field -->
                <div>
                  <label for="ebit" class="flex items-center text-sm font-medium text-slate-300">
                    EBIT (₱)
                    <span class="tooltip-trigger ml-1.5"
                      data-tooltip-text="Earnings Before Interest and Tax.">
                      <svg class="w-4 h-4 text-slate-500 hover:text-blue-400 cursor-help" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" /></svg>
                    </span>
                  </label>
                  <input type="number" name="ebit" id="ebit"
                    class="mt-1 w-full p-2.5 border rounded-md form-input-modern text-sm" placeholder="200,000" />
                </div>
              </div>
            </div>

            <!-- Balance Sheet -->
            <div class="bg-slate-800 border border-slate-700 rounded-xl p-4 section-card shadow-lg">
              <h3 class="font-semibold text-white mb-4 text-center text-sm flex items-center justify-center gap-2">
                <span class="inline-block w-2.5 h-2.5 bg-emerald-500 rounded-full shadow-lg shadow-emerald-500/50 animate-pulse"></span>
                Balance Sheet
              </h3>
              <div class="space-y-3">
                <div>
                  <label for="total-assets" class="flex items-center text-sm font-medium text-slate-300">
                    Total Assets (₱)
                    <span class="tooltip-trigger ml-1.5"
                      data-tooltip-text="The total value of all assets owned by the company.">
                      <svg class="w-4 h-4 text-slate-500 hover:text-blue-400 cursor-help" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" /></svg>
                    </span>
                  </label>
                  <input type="number" name="total-assets" id="total-assets"
                    class="mt-1 w-full p-2.5 border rounded-md form-input-modern text-sm" placeholder="2,500,000" />
                </div>
                <div>
                  <label for="current-assets" class="flex items-center text-sm font-medium text-slate-300">
                    Current Assets (₱)
                    <span class="tooltip-trigger ml-1.5"
                      data-tooltip-text="Assets convertible to cash within one year.">
                      <svg class="w-4 h-4 text-slate-500 hover:text-blue-400 cursor-help" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" /></svg>
                    </span>
                  </label>
                  <input type="number" name="current-assets" id="current-assets"
                    class="mt-1 w-full p-2.5 border rounded-md form-input-modern text-sm" placeholder="1,200,000" />
                </div>
                <div>
                  <label for="total-liabilities" class="flex items-center text-sm font-medium text-slate-300">
                    Total Liabilities (₱)
                    <span class="tooltip-trigger ml-1.5"
                      data-tooltip-text="The total amount of debt and obligations owed by the company.">
                      <svg class="w-4 h-4 text-slate-500 hover:text-blue-400 cursor-help" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" /></svg>
                    </span>
                  </label>
                  <input type="number" name="total-liabilities" id="total-liabilities"
                    class="mt-1 w-full p-2.5 border rounded-md form-input-modern text-sm" placeholder="800,000" />
                </div>
                <div>
                  <label for="current-liabilities" class="flex items-center text-sm font-medium text-slate-300">
                    Current Liabilities (₱)
                    <span class="tooltip-trigger ml-1.5"
                      data-tooltip-text="Obligations due within one year.">
                      <svg class="w-4 h-4 text-slate-500 hover:text-blue-400 cursor-help" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" /></svg>
                    </span>
                  </label>
                  <input type="number" name="current-liabilities" id="current-liabilities"
                    class="mt-1 w-full p-2.5 border rounded-md form-input-modern text-sm" placeholder="400,000" />
                </div>
                <div>
                  <label for="retained-earnings" class="flex items-center text-sm font-medium text-slate-300">
                    Retained Earnings (₱)
                    <span class="tooltip-trigger ml-1.5"
                      data-tooltip-text="Cumulative profits retained in company.">
                      <svg class="w-4 h-4 text-slate-500 hover:text-blue-400 cursor-help" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" /></svg>
                    </span>
                  </label>
                  <input type="number" name="retained-earnings" id="retained-earnings"
                    class="mt-1 w-full p-2.5 border rounded-md form-input-modern text-sm" placeholder="600,000" />
                </div>
              </div>
            </div>

            <!-- Cash Flow -->
            <div class="bg-slate-800 border border-slate-700 rounded-xl p-4 section-card shadow-lg">
              <h3 class="font-semibold text-white mb-4 text-center text-sm flex items-center justify-center gap-2">
                <span class="inline-block w-2.5 h-2.5 bg-blue-500 rounded-full shadow-lg shadow-blue-500/50 animate-pulse"></span>
                Cash Flow
              </h3>
              <div class="space-y-3">
                <div>
                  <label for="cash-flow" class="flex items-center text-sm font-medium text-slate-300">
                    Operations Cash Flow (₱)
                    <span class="tooltip-trigger ml-1.5"
                      data-tooltip-text="Cash generated from normal business operations.">
                      <svg class="w-4 h-4 text-slate-500 hover:text-blue-400 cursor-help" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" /></svg>
                    </span>
                  </label>
                  <input type="number" name="cash-flow" id="cash-flow"
                    class="mt-1 w-full p-2.5 border rounded-md form-input-modern text-sm" placeholder="200,000" />
                </div>
              </div>
            </div>

            <!-- Valuation -->
            <div class="bg-slate-800 border border-slate-700 rounded-xl p-4 section-card shadow-lg">
              <h3 class="font-semibold text-white mb-4 text-center text-sm flex items-center justify-center gap-2">
                <span class="inline-block w-2.5 h-2.5 bg-purple-500 rounded-full shadow-lg shadow-purple-500/50 animate-pulse"></span>
                Valuation
              </h3>
              <div class="space-y-3">
                <div>
                  <label for="current-valuation" class="flex items-center text-sm font-medium text-slate-300">
                    Current Valuation (₱)
                    <span class="tooltip-trigger ml-1.5"
                      data-tooltip-text="The company's current market valuation or estimated worth.">
                      <svg class="w-4 h-4 text-slate-500 hover:text-blue-400 cursor-help" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" /></svg>
                    </span>
                  </label>
                  <input type="number" name="current-valuation" id="current-valuation"
                    class="mt-1 w-full p-2.5 border rounded-md form-input-modern text-sm" placeholder="5,000,000" />
                </div>
                <div>
                  <label for="expected-future-valuation" class="flex items-center text-sm font-medium text-slate-300">
                    Expected Future Valuation (₱)
                    <span class="tooltip-trigger ml-1.5"
                      data-tooltip-text="Projected valuation at the target future date.">
                      <svg class="w-4 h-4 text-slate-500 hover:text-blue-400 cursor-help" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" /></svg>
                    </span>
                  </label>
                  <input type="number" name="expected-future-valuation" id="expected-future-valuation"
                    class="mt-1 w-full p-2.5 border rounded-md form-input-modern text-sm" placeholder="12,000,000" />
                </div>
                <div>
                  <label for="years-to-future-valuation" class="flex items-center text-sm font-medium text-slate-300">
                    Years to Future Valuation
                    <span class="tooltip-trigger ml-1.5"
                      data-tooltip-text="Number of years until the expected future valuation is reached.">
                      <svg class="w-4 h-4 text-slate-500 hover:text-blue-400 cursor-help" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" /></svg>
                    </span>
                  </label>
                  <input type="number" name="years-to-future-valuation" id="years-to-future-valuation"
                    class="mt-1 w-full p-2.5 border rounded-md form-input-modern text-sm" placeholder="3" step="0.1" min="0" />
                </div>
              </div>
            </div>

            <!-- Qualitative Assessment -->
            <div class="bg-slate-800 border border-slate-700 rounded-xl p-4 section-card shadow-lg">
              <h3 class="font-semibold text-white mb-4 text-center text-sm flex items-center justify-center gap-2">
                <span class="inline-block w-2.5 h-2.5 bg-orange-500 rounded-full shadow-lg shadow-orange-500/50 animate-pulse"></span>
                Qualitative Assessment
              </h3>
              <div class="space-y-3">
                <div>
                  <label for="team-strength" class="flex items-center text-sm font-medium text-slate-300">
                    Team Strength
                    <span class="tooltip-trigger ml-1.5"
                      data-tooltip-text="Describe the leadership team's experience and skills.">
                      <svg class="w-4 h-4 text-slate-500 hover:text-blue-400 cursor-help" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" /></svg>
                    </span>
                  </label>
                  <textarea id="team-strength" name="team-strength" rows="2"
                    class="mt-1 w-full p-2.5 border rounded-md form-input-modern text-sm resize-none"
                    placeholder="Describe the team's expertise and key strengths..."></textarea>
                </div>
                <div>
                  <label for="market-position" class="flex items-center text-sm font-medium text-slate-300">
                    Market Position
                    <span class="tooltip-trigger ml-1.5"
                      data-tooltip-text="Describe the company's competitive position.">
                      <svg class="w-4 h-4 text-slate-500 hover:text-blue-400 cursor-help" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" /></svg>
                    </span>
                  </label>
                  <textarea id="market-position" name="market-position" rows="2"
                    class="mt-1 w-full p-2.5 border rounded-md form-input-modern text-sm resize-none"
                    placeholder="Explain the company's market standing..."></textarea>
                </div>
                <div>
                  <label for="brand-reputation" class="flex items-center text-sm font-medium text-slate-300">
                    Brand Reputation
                    <span class="tooltip-trigger ml-1.5"
                      data-tooltip-text="Assess the company's brand value and perception.">
                      <svg class="w-4 h-4 text-slate-500 hover:text-blue-400 cursor-help" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" /></svg>
                    </span>
                  </label>
                  <textarea id="brand-reputation" name="brand-reputation" rows="2"
                    class="mt-1 w-full p-2.5 border rounded-md form-input-modern text-sm resize-none"
                    placeholder="Describe brand recognition and reputation..."></textarea>
                </div>
              </div>
            </div>
          </div>
        </div>

        <div class="flex justify-end gap-3 pt-6 border-t border-slate-700">
          <button type="submit" class="px-8 py-3 bg-gradient-to-r from-blue-600 to-blue-500 hover:from-blue-700 hover:to-blue-600 text-white rounded-lg font-semibold transition-all duration-300 shadow-lg shadow-blue-500/30 hover:shadow-xl hover:shadow-blue-500/40 hover:-translate-y-0.5 flex items-center gap-2">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path>
            </svg>
            Save Profile
          </button>
      </div>
      </form>
    </div>
  </main>

    <script>
        const domCache = {};
        
        function getCachedElement(id) {
          if (!domCache[id]) {
            domCache[id] = document.getElementById(id);
          }
          return domCache[id];
        }

        document.addEventListener('DOMContentLoaded', function() {
            lucide.createIcons();

            const form = document.getElementById('companyForm');
            let tooltipElement;

            // --- Load User Information ---
            async function loadUserInfo() {
                const token = sessionStorage.getItem('authToken');
                const userEmailElement = getCachedElement('user-email');

                if (!token) {
                    userEmailElement.textContent = 'No user logged in';
                    userEmailElement.className = 'font-semibold text-red-600';
                    return;
                }

                const storedUserData = localStorage.getItem('userData');
                if (storedUserData) {
                    try {
                        const user = JSON.parse(storedUserData);
                        userEmailElement.textContent = user.email || 'Unknown user';
                        userEmailElement.className = 'font-semibold text-green-600';
                        return;
                    } catch (error) {
                        console.error('Error parsing user data:', error);
                    }
                }

                userEmailElement.textContent = 'Token found, no user info';
                userEmailElement.className = 'font-semibold text-yellow-600';
            }

            loadUserInfo();

            // --- Dynamic Tooltip Logic ---
            function createTooltip() {
                if (!tooltipElement) {
                    tooltipElement = document.createElement('div');
                    tooltipElement.className = 'dynamic-tooltip tooltip-top';
                    document.body.appendChild(tooltipElement);
                }
            }
            
            document.querySelectorAll('.tooltip-trigger').forEach(trigger => {
                trigger.addEventListener('mouseenter', (e) => {
                    createTooltip();
                    const text = trigger.getAttribute('data-tooltip-text');
                    tooltipElement.textContent = text;
                    const rect = trigger.getBoundingClientRect();
                    
                    tooltipElement.classList.add('visible');
                    const tooltipRect = tooltipElement.getBoundingClientRect();

                    let top = rect.top - tooltipRect.height - 8;
                    let left = rect.left + (rect.width / 2) - (tooltipRect.width / 2);

                    if (left < 0) left = 5;
                    if (top < 0) {
                        top = rect.bottom + 8;
                    }

                    tooltipElement.style.top = `${top}px`;
                    tooltipElement.style.left = `${left}px`;
                }, { passive: true });
                trigger.addEventListener('mouseleave', () => {
                    if (tooltipElement) {
                        tooltipElement.classList.remove('visible');
                    }
                }, { passive: true });
            });

            // --- Data Completeness Calculation ---
            const formInputs = Array.from(form.querySelectorAll('input[type="text"], input[type="number"], select, textarea')).filter(el => !el.disabled);
            const totalFields = formInputs.length;
            const completenessBar = getCachedElement('completeness-bar');
            const completenessText = getCachedElement('completeness-text');
            const completenessHiddenInput = getCachedElement('data-completeness-level');

            function updateCompleteness() {
                let filledFields = 0;
                formInputs.forEach(input => {
                    if ((input.type === 'select-one' && input.value !== "") || (input.type !== 'select-one' && input.value && input.value.trim() !== '')) {
                         filledFields++;
                    }
                });

                const percentage = totalFields > 0 ? (filledFields / totalFields) * 100 : 0;
                completenessBar.style.width = percentage + '%';
                
                let level = 'Low';
                let barColor = 'bg-blue-500';

                if (percentage > 75) {
                    level = 'High';
                    barColor = 'bg-emerald-500';
                    completenessText.textContent = `High Confidence (${Math.round(percentage)}%)`;
                } else if (percentage > 40) {
                    level = 'Medium';
                    barColor = 'bg-yellow-500';
                    completenessText.textContent = `Medium Confidence (${Math.round(percentage)}%)`;
                } else {
                    level = 'Low';
                    barColor = 'bg-red-500';
                    if (filledFields > 0) {
                        completenessText.textContent = `Low Confidence (${Math.round(percentage)}%)`;
                    } else {
                        completenessText.textContent = `Please fill the form`;
                    }
                }
                
                completenessHiddenInput.value = level;
                completenessBar.className = `h-2.5 rounded-full transition-all duration-300 ${barColor}`;
            }

            form.addEventListener('input', updateCompleteness, { passive: true });

            // --- Company Data Object Constructor ---
            function createCompanyDataObject() {
                const companyData = {
                    company_name: getCachedElement('company-name').value.trim(),
                    industry: getCachedElement('industry').value,
                    company_description: getCachedElement('company-description').value.trim(),
                    
                    // Financial Data - Income Statement
                    time_between_periods: getCachedElement('time-between-periods').value || null,
                    previous_revenue: getCachedElement('previous-revenue').value || null,
                    current_revenue: getCachedElement('current-revenue').value || null,
                    net_income: getCachedElement('net-income').value || null,
                    ebit: getCachedElement('ebit').value || null,
                    
                    // Financial Data - Balance Sheet
                    total_assets: getCachedElement('total-assets').value || null,
                    current_assets: getCachedElement('current-assets').value || null,
                    total_liabilities: getCachedElement('total-liabilities').value || null,
                    current_liabilities: getCachedElement('current-liabilities').value || null,
                    retained_earnings: getCachedElement('retained-earnings').value || null,
                    
                    // Financial Data - Cash Flow
                    cash_flow: getCachedElement('cash-flow').value || null,
                    
                    // Valuation
                    current_valuation: getCachedElement('current-valuation').value || null,
                    expected_future_valuation: getCachedElement('expected-future-valuation').value || null,
                    years_to_future_valuation: getCachedElement('years-to-future-valuation').value || null,
                    
                    // Qualitative Assessment
                    team_strength: getCachedElement('team-strength').value.trim() || null,
                    market_position: getCachedElement('market-position').value.trim() || null,
                    brand_reputation: getCachedElement('brand-reputation').value.trim() || null,
                    
                    data_completeness_level: getCachedElement('data-completeness-level').value
                };
                
                return companyData;
            }

            // --- Form Submission Handler ---
            form.addEventListener('submit', function(e) {
                e.preventDefault();
                
                if (!form.checkValidity()) {
                    form.reportValidity();
                    return;
                }
                
                const companyData = createCompanyDataObject();
                console.log('Form submitted with data:', companyData);
                
                // Validate required fields
                if (!companyData.company_name || !companyData.industry) {
                    alert('Please fill in all required fields (Company Name and Industry).');
                    return;
                }
                
                alert('Form data ready for submission:\n' + JSON.stringify(companyData, null, 2));
            }, { passive: false });

            // --- Initial State Setup ---
            createTooltip();
            updateCompleteness();
        });
    </script>
</body>
</html>
