<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="csrf-token" content="{{ csrf_token }}">
  <title>Company Profile Form</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <script src="https://unpkg.com/lucide@latest"></script>

  <style>
    body {
      font-family: "Inter", sans-serif;
      background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
      min-height: 100vh;
      margin: 0;
      color: #e2e8f0;
      contain: layout style paint;
    }

    .form-input-modern {
      background-color: #1e293b;
      border: 1px solid #334155;
      color: #f1f5f9;
      transition: border-color 0.2s ease-in-out, box-shadow 0.2s ease-in-out;
      contain: layout style;
    }

    .form-input-modern::placeholder {
      color: #94a3b8;
    }

    .form-input-modern:focus {
      border-color: #3b82f6;
      box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.2);
      outline: none;
    }

    .form-input-modern:hover {
      border-color: #475569;
    }

    .dynamic-tooltip {
      visibility: hidden;
      background-color: #1e293b;
      color: #f8fafc;
      text-align: center;
      border-radius: 6px;
      padding: 8px 12px;
      position: fixed;
      z-index: 100;
      opacity: 0;
      transition: opacity 0.2s;
      max-width: 220px;
      font-size: 0.875rem;
      pointer-events: none;
      border: 1px solid #334155;
    }

    .dynamic-tooltip.visible {
      visibility: visible;
      opacity: 1;
    }

    .dynamic-tooltip::after {
      content: "";
      position: absolute;
      border-width: 5px;
      border-style: solid;
    }

    .tooltip-top::after {
      top: 100%;
      left: 50%;
      margin-left: -5px;
      border-color: #1e293b transparent transparent transparent;
    }

    ::-webkit-scrollbar {
      width: 8px;
    }
    ::-webkit-scrollbar-thumb {
      background-color: #475569;
      border-radius: 4px;
    }

    header {
      contain: layout style paint;
      will-change: auto;
    }

    #completeness-bar {
      will-change: width;
      transition: width 0.3s ease-out;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
      }
      to {
        opacity: 1;
      }
    }
  </style>
</head>

<body class="flex flex-col min-h-screen">

  <!-- Header -->
  <header class="bg-slate-900 border-b border-slate-700 shadow-sm sticky top-0 z-50">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
      <div class="flex justify-between items-center h-16">
        <div class="flex items-center space-x-3">
          <div class="bg-blue-600 p-2 rounded-lg">
            <svg class="h-6 w-6 text-white" xmlns="http://www.w3.org/2000/svg" fill="none"
              viewBox="0 0 24 24" stroke-width="2" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round"
                d="M2.25 18L9 11.25l4.306 4.307a11.95 11.95 0 015.814-5.519l2.74-1.22m0 0l-5.94-2.28m5.94 2.28l-2.28 5.941" />
            </svg>
          </div>
          <span class="text-2xl font-bold text-white tracking-tight">Fundora</span>
        </div>
        <div class="flex items-center space-x-4">
          <span class="text-slate-400 text-sm">
            Welcome, <span class="font-semibold text-blue-400" id="user-email">Loading...</span>
          </span>
          <img class="h-9 w-9 rounded-full object-cover border border-slate-600"
            src="https://i.pravatar.cc/150?u=a042581f4e29026704d" alt="User Avatar" />
        </div>
      </div>
    </div>
  </header>

  <main class="flex-1 py-6 px-4 sm:px-6 lg:px-8">
    <div class="max-w-7xl mx-auto bg-slate-900 border border-slate-700 rounded-2xl shadow-lg p-6 sm:p-8">
      <!-- Added completeness indicator -->
      <div class="mb-6 bg-slate-800 rounded-lg p-4 border border-slate-700">
        <div class="flex items-center justify-between mb-2">
          <span class="text-sm font-medium text-slate-300">Form Completeness</span>
          <span class="text-sm text-slate-400" id="completeness-text">Please fill the form</span>
        </div>
        <div class="w-full bg-slate-700 rounded-full h-2.5 overflow-hidden">
          <div id="completeness-bar" class="h-2.5 rounded-full bg-blue-500 transition-all duration-300" style="width: 0%"></div>
        </div>
        <input type="hidden" id="data-completeness-level" name="data-completeness-level" value="Low" />
      </div>

      <form id="companyForm" novalidate class="space-y-8">
        <div class="grid lg:grid-cols-5 gap-8">

          <!-- Left Column -->
          <div class="lg:col-span-2">
            <div class="flex items-center gap-3 mb-6">
              <div class="bg-blue-600 p-2 rounded-lg">
                <svg class="w-5 h-5 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16m14 0h2m-2 0h-5m-9 0H3m2 0h5M9 7h1m-1 4h1m4-4h1m-1 4h1m-5 10v-5a1 1 0 011-1h2a1 1 0 011 1v5m-4 0h4" /></svg>
              </div>
              <h2 class="text-xl font-bold text-white">Company Profile</h2>
            </div>
            <div class="space-y-6">
              <div>
                <label for="company-name" class="flex items-center text-sm font-medium text-slate-300 mb-1.5">
                  Company Name
                  <span class="tooltip-trigger ml-1.5"
                    data-tooltip-text="Enter the full legal name of the company being analyzed.">
                    <svg class="w-4 h-4 text-slate-500 hover:text-blue-400 cursor-help" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" /></svg>
                  </span>
                </label>
                <input type="text" name="company-name" id="company-name"
                  class="w-full px-4 py-2.5 rounded-lg border form-input-modern text-sm"
                  placeholder="e.g., Acme Corporation" required />
              </div>

              <div>
                <label for="industry" class="flex items-center text-sm font-medium text-slate-300 mb-1.5">Industry
                  <span class="tooltip-trigger ml-1.5"
                    data-tooltip-text="Select the primary industry sector in which the company operates.">
                    <svg class="w-4 h-4 text-slate-500 hover:text-blue-400 cursor-help" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" /></svg>
                  </span>
                </label>
                <select id="industry" name="industry"
                  class="w-full px-4 py-2.5 rounded-lg border form-input-modern text-sm appearance-none" required>
                  <option value="" disabled selected>Select an industry</option>
                  <option value="Technology">Technology</option>
                  <option value="Finance">Finance</option>
                  <option value="Healthcare">Healthcare</option>
                  <option value="Retail">Retail</option>
                  <option value="Manufacturing">Manufacturing</option>
                </select>
              </div>

              <div>
                <label for="company-description"
                  class="flex items-center text-sm font-medium text-slate-300 mb-1.5">Company Description
                  <span class="tooltip-trigger ml-1.5"
                    data-tooltip-text="Describe the company's core business, products/services, target market, and competitive landscape.">
                    <svg class="w-4 h-4 text-slate-500 hover:text-blue-400 cursor-help" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" /></svg>
                  </span>
                </label>
                <textarea id="company-description" name="company-description" rows="8"
                  class="w-full px-4 py-2.5 rounded-lg border form-input-modern text-sm resize-none"
                  placeholder="Provide a brief overview of the company, its mission, and its core products or services."></textarea>
              </div>
            </div>
          </div>

          <!-- Right Column -->
          <div class="lg:col-span-3 space-y-8">
            
            <!-- Income Statement -->
            <div class="bg-slate-800 border border-slate-700 rounded-xl p-4">
              <h3 class="font-semibold text-white mb-3 text-center text-sm flex items-center justify-center gap-2">
                <span class="inline-block w-2 h-2 bg-blue-500 rounded-full"></span>
                Income Statement
              </h3>
              <div class="space-y-3">
                <div>
                  <label for="income-period" class="flex items-center text-sm font-medium text-slate-300">Reporting Period
                    <span class="tooltip-trigger ml-1.5"
                      data-tooltip-text="Select the time frame for the income data (e.g., Yearly, Quarterly).">
                      <svg class="w-4 h-4 text-slate-500 hover:text-blue-400 cursor-help" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" /></svg>
                    </span>
                  </label>
                  <select id="income-period" name="income-period"
                    class="mt-1 w-full p-2.5 border rounded-md form-input-modern text-sm">
                    <option value="yearly" selected>Yearly</option>
                    <option value="quarterly">Quarterly</option>
                    <option value="monthly">Monthly</option>
                  </select>
                </div>
                <div>
                  <label for="previous-revenue" class="flex items-center text-sm font-medium text-slate-300">
                    Prior Period Revenue (₱)
                    <span class="tooltip-trigger ml-1.5"
                      data-tooltip-text="Enter the total revenue from the prior fiscal period.">
                      <svg class="w-4 h-4 text-slate-500 hover:text-blue-400 cursor-help" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" /></svg>
                    </span>
                  </label>
                  <input type="number" name="previous-revenue" id="previous-revenue"
                    class="mt-1 w-full p-2.5 border rounded-md form-input-modern text-sm" placeholder="800,000" />
                </div>
                <div>
                  <label for="current-revenue" class="flex items-center text-sm font-medium text-slate-300">
                    Current Period Revenue (₱)
                    <span class="tooltip-trigger ml-1.5"
                      data-tooltip-text="Enter the total revenue from the most recent fiscal period.">
                      <svg class="w-4 h-4 text-slate-500 hover:text-blue-400 cursor-help" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" /></svg>
                    </span>
                  </label>
                  <input type="number" name="current-revenue" id="current-revenue"
                    class="mt-1 w-full p-2.5 border rounded-md form-input-modern text-sm" placeholder="1,000,000" />
                </div>
                <div>
                  <label for="net-income" class="flex items-center text-sm font-medium text-slate-300">
                    Current Period Net Income (₱)
                    <span class="tooltip-trigger ml-1.5"
                      data-tooltip-text="Profit after all expenses and taxes have been deducted.">
                      <svg class="w-4 h-4 text-slate-500 hover:text-blue-400 cursor-help" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" /></svg>
                    </span>
                  </label>
                  <input type="number" name="net-income" id="net-income"
                    class="mt-1 w-full p-2.5 border rounded-md form-input-modern text-sm" placeholder="150,000" />
                </div>
              </div>
            </div>

            <!-- Balance Sheet -->
            <div class="bg-slate-800 border border-slate-700 rounded-xl p-4">
              <h3 class="font-semibold text-white mb-3 text-center text-sm flex items-center justify-center gap-2">
                <span class="inline-block w-2 h-2 bg-emerald-500 rounded-full"></span>
                Balance Sheet
              </h3>
              <div class="space-y-3">
                <div>
                  <label for="total-assets" class="flex items-center text-sm font-medium text-slate-300">
                    Total Assets (₱)
                    <span class="tooltip-trigger ml-1.5"
                      data-tooltip-text="The total value of all assets owned by the company.">
                      <svg class="w-4 h-4 text-slate-500 hover:text-blue-400 cursor-help" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" /></svg>
                    </span>
                  </label>
                  <input type="number" name="total-assets" id="total-assets"
                    class="mt-1 w-full p-2.5 border rounded-md form-input-modern text-sm" placeholder="2,500,000" />
                </div>
                <div>
                  <label for="total-liabilities" class="flex items-center text-sm font-medium text-slate-300">
                    Total Liabilities (₱)
                    <span class="tooltip-trigger ml-1.5"
                      data-tooltip-text="The total amount of debt and obligations owed by the company.">
                      <svg class="w-4 h-4 text-slate-500 hover:text-blue-400 cursor-help" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" /></svg>
                    </span>
                  </label>
                  <input type="number" name="total-liabilities" id="total-liabilities"
                    class="mt-1 w-full p-2.5 border rounded-md form-input-modern text-sm" placeholder="800,000" />
                </div>
                <div>
                  <label for="shareholder-equity" class="text-sm font-medium text-slate-300">Shareholder Equity (₱)</label>
                  <input type="text" name="shareholder-equity" id="shareholder-equity"
                    class="mt-1 w-full p-2.5 bg-slate-700 border border-slate-600 rounded-md text-slate-300 font-medium text-sm"
                    placeholder="Auto-calculated" disabled />
                </div>
              </div>
            </div>

            <!-- Cash Flow -->
            <div class="bg-slate-800 border border-slate-700 rounded-xl p-4">
              <h3 class="font-semibold text-white mb-3 text-center text-sm flex items-center justify-center gap-2">
                <span class="inline-block w-2 h-2 bg-blue-500 rounded-full"></span>
                Cash Flow
              </h3>
              <div class="space-y-3">
                <div>
                  <label for="cash-flow" class="flex items-center text-sm font-medium text-slate-300">
                    Operations Cash Flow (₱)
                    <span class="tooltip-trigger ml-1.5"
                      data-tooltip-text="Cash generated from normal business operations.">
                      <svg class="w-4 h-4 text-slate-500 hover:text-blue-400 cursor-help" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" /></svg>
                    </span>
                  </label>
                  <input type="number" name="cash-flow" id="cash-flow"
                    class="mt-1 w-full p-2.5 border rounded-md form-input-modern text-sm" placeholder="200,000" />
                </div>
                <div>
                  <label for="investment-flow" class="flex items-center text-sm font-medium text-slate-300">
                    Investment Cash Flow (₱)
                    <span class="tooltip-trigger ml-1.5"
                      data-tooltip-text="Cash used for or generated from investments. Can be negative.">
                      <svg class="w-4 h-4 text-slate-500 hover:text-blue-400 cursor-help" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" /></svg>
                    </span>
                  </label>
                  <input type="number" name="investment-flow" id="investment-flow"
                    class="mt-1 w-full p-2.5 border rounded-md form-input-modern text-sm" placeholder="-50,000" />
                </div>
                <div>
                  <label for="financing-flow" class="flex items-center text-sm font-medium text-slate-300">
                    Financing Cash Flow (₱)
                    <span class="tooltip-trigger ml-1.5"
                      data-tooltip-text="Cash flow between the company and its owners/creditors.">
                      <svg class="w-4 h-4 text-slate-500 hover:text-blue-400 cursor-help" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" /></svg>
                    </span>
                  </label>
                  <input type="number" name="financing-flow" id="financing-flow"
                    class="mt-1 w-full p-2.5 border rounded-md form-input-modern text-sm" placeholder="100,000" />
                </div>
              </div>
            </div>

            <!-- Business Metrics -->
            <div class="bg-slate-800 border border-slate-700 rounded-xl p-4">
              <h3 class="font-semibold text-white mb-3 text-center text-sm flex items-center justify-center gap-2">
                <span class="inline-block w-2 h-2 bg-emerald-500 rounded-full"></span>
                Business Metrics
              </h3>
              <div class="space-y-3">
                <div>
                  <label for="funding-ask" class="flex items-center text-sm font-medium text-slate-300">
                    Funding Request (₱)
                    <span class="tooltip-trigger ml-1.5"
                      data-tooltip-text="Amount of funding being requested from investors.">
                      <svg class="w-4 h-4 text-slate-500 hover:text-blue-400 cursor-help" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" /></svg>
                    </span>
                  </label>
                  <input type="number" name="funding-ask" id="funding-ask"
                    class="mt-1 w-full p-2.5 border rounded-md form-input-modern text-sm" placeholder="5,000,000" />
                </div>
                <div>
                  <label for="team-strength" class="flex items-center text-sm font-medium text-slate-300">
                    Team Strength
                    <span class="tooltip-trigger ml-1.5"
                      data-tooltip-text="Describe the team's expertise and experience.">
                      <svg class="w-4 h-4 text-slate-500 hover:text-blue-400 cursor-help" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" /></svg>
                    </span>
                  </label>
                  <textarea id="team-strength" name="team-strength" rows="2"
                    class="mt-1 w-full p-2.5 border rounded-md form-input-modern text-sm resize-none"
                    placeholder="Strong technical team with 10+ years experience..."></textarea>
                </div>
                <div>
                  <label for="market-position" class="flex items-center text-sm font-medium text-slate-300">
                    Market Position
                    <span class="tooltip-trigger ml-1.5"
                      data-tooltip-text="Describe the company's market position and competitive advantage.">
                      <svg class="w-4 h-4 text-slate-500 hover:text-blue-400 cursor-help" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" /></svg>
                    </span>
                  </label>
                  <textarea id="market-position" name="market-position" rows="2"
                    class="mt-1 w-full p-2.5 border rounded-md form-input-modern text-sm resize-none"
                    placeholder="Top 3 provider in local fintech sector..."></textarea>
                </div>
              </div>
            </div>
          </div>
        </div>

        <div class="flex justify-end gap-3 pt-6 border-t border-slate-700">
          <button type="submit" class="px-6 py-2.5 bg-blue-600 hover:bg-blue-700 text-white rounded-lg font-medium transition-colors duration-200">
            Save Profile
          </button>
        </div>
      </form>
    </div>
  </main>

    <script>
        const domCache = {};
        
        function getCachedElement(id) {
          if (!domCache[id]) {
            domCache[id] = document.getElementById(id);
          }
          return domCache[id];
        }

        document.addEventListener('DOMContentLoaded', function() {
            lucide.createIcons();

            const form = document.getElementById('companyForm');
            const totalAssetsInput = getCachedElement('total-assets');
            const totalLiabilitiesInput = getCachedElement('total-liabilities');
            const shareholderEquityInput = getCachedElement('shareholder-equity');
            const completenessBar = getCachedElement('completeness-bar');
            const completenessText = getCachedElement('completeness-text');
            const completenessHiddenInput = getCachedElement('data-completeness-level');
            let tooltipElement;

            // --- Load User Information ---
            async function loadUserInfo() {
                const token = localStorage.getItem('authToken');
                const userEmailElement = getCachedElement('user-email');

                if (!token) {
                    userEmailElement.textContent = 'No user logged in';
                    userEmailElement.className = 'font-semibold text-red-600';
                    return;
                }

                // Get stored user data from login
                const storedUserData = localStorage.getItem('userData');
                if (storedUserData) {
                    try {
                        const user = JSON.parse(storedUserData);
                        userEmailElement.textContent = user.email || 'Unknown user';
                        userEmailElement.className = 'font-semibold text-green-600';
                        return;
                    } catch (error) {
                        console.error('Error parsing user data:', error);
                    }
                }

                // If no stored user data, show token exists but no user info
                userEmailElement.textContent = 'Token found, no user info';
                userEmailElement.className = 'font-semibold text-yellow-600';
            }

            // Load user info on page load
            loadUserInfo();

            // --- Auto-calculation for Shareholder Equity ---
            function calculateEquity() {
                const assets = parseFloat(totalAssetsInput.value) || 0;
                const liabilities = parseFloat(totalLiabilitiesInput.value) || 0;
                const equity = assets - liabilities;
                shareholderEquityInput.value = equity > 0 ? equity.toLocaleString('en-PH', { style: 'currency', currency: 'PHP' }).replace('₱', '₱ ') : '₱ 0.00';
            }
            totalAssetsInput.addEventListener('input', calculateEquity, { passive: true });
            totalLiabilitiesInput.addEventListener('input', calculateEquity, { passive: true });

            // --- Dynamic Tooltip Logic ---
            function createTooltip() {
                if (!tooltipElement) {
                    tooltipElement = document.createElement('div');
                    tooltipElement.className = 'dynamic-tooltip tooltip-top';
                    document.body.appendChild(tooltipElement);
                }
            }
            
            document.querySelectorAll('.tooltip-trigger').forEach(trigger => {
                trigger.addEventListener('mouseenter', (e) => {
                    createTooltip();
                    const text = trigger.getAttribute('data-tooltip-text');
                    tooltipElement.textContent = text;
                    const rect = trigger.getBoundingClientRect();
                    
                    tooltipElement.classList.add('visible');
                    const tooltipRect = tooltipElement.getBoundingClientRect();

                    let top = rect.top - tooltipRect.height - 8;
                    let left = rect.left + (rect.width / 2) - (tooltipRect.width / 2);

                    // Boundary checks
                    if (left < 0) left = 5;
                    if (top < 0) {
                        top = rect.bottom + 8;
                    }

                    tooltipElement.style.top = `${top}px`;
                    tooltipElement.style.left = `${left}px`;
                }, { passive: true });
                trigger.addEventListener('mouseleave', () => {
                    if (tooltipElement) {
                        tooltipElement.classList.remove('visible');
                    }
                }, { passive: true });
            });

            // --- Data Completeness Calculation ---
            const formInputs = Array.from(form.querySelectorAll('input[type="text"], input[type="number"], select, textarea')).filter(el => !el.disabled);
            const totalFields = formInputs.length;

            function updateCompleteness() {
                let filledFields = 0;
                formInputs.forEach(input => {
                    if ((input.type === 'select-one' && input.value !== "") || (input.type !== 'select-one' && input.value && input.value.trim() !== '')) {
                         filledFields++;
                    }
                });

                const percentage = totalFields > 0 ? (filledFields / totalFields) * 100 : 0;
                completenessBar.style.width = percentage + '%';
                
                let level = 'Low';
                let barColor = 'bg-blue-500';

                if (percentage > 75) {
                    level = 'High';
                    barColor = 'bg-emerald-500';
                    completenessText.textContent = `High Confidence (${Math.round(percentage)}%)`;
                } else if (percentage > 40) {
                    level = 'Medium';
                    barColor = 'bg-yellow-500';
                    completenessText.textContent = `Medium Confidence (${Math.round(percentage)}%)`;
                } else {
                    level = 'Low';
                    barColor = 'bg-blue-500';
                    if(filledFields > 0) {
                        completenessText.textContent = `Low Confidence (${Math.round(percentage)}%)`;
                    } else {
                        completenessText.textContent = `Please fill the form`;
                    }
                }
                
                completenessHiddenInput.value = level;
                completenessBar.className = `h-2.5 rounded-full transition-all duration-300 ${barColor}`;
            }

            form.addEventListener('input', updateCompleteness, { passive: true });

            // --- Company Data Object Constructor ---
            function createCompanyDataObject() {
                const companyData = {
                    // Basic Information (match serializer field names)
                    company_name: getCachedElement('company-name').value.trim(),
                    industry: getCachedElement('industry').value,
                    company_description: getCachedElement('company-description').value.trim(),
                    
                    // Financial Data (match serializer field names exactly)
                    revenue: getCachedElement('current-revenue').value || null,
                    net_income: getCachedElement('net-income').value || null,
                    total_assets: getCachedElement('total-assets').value || null,
                    total_liabilities: getCachedElement('total-liabilities').value || null,
                    shareholder_equity: getCachedElement('shareholder-equity').value || null,
                    cash_flow: getCachedElement('cash-flow').value || null,
                    funding_ask: getCachedElement('funding-ask').value || null,
                    
                    // Business Metrics (match serializer field names)
                    team_strength: getCachedElement('team-strength').value.trim() || null,
                    market_position: getCachedElement('market-position').value.trim() || null,
                    brand_reputation: getCachedElement('brand-reputation')?.value?.trim() || null,
                    confidence_percentage: getCachedElement('confidence-percentage')?.value || null,
                    
                    // Data Source Confidence (match serializer field name)
                    data_source_confidence: getCachedElement('data-source-confidence')?.value || 'Medium'
                };
                
                return companyData;
            }

            // --- Function to Check Object Field Storage ---
            function validateObjectFields(companyData) {
                console.log('=== COMPANY DATA OBJECT VALIDATION ===');
                
                const validationReport = {
                    totalFields: 0,
                    filledFields: 0,
                    emptyFields: 0,
                    fieldDetails: {},
                    isValid: false
                };

                // Define field categories for better organization
                const fieldCategories = {
                    basic: ['company_name', 'industry', 'company_description'],
                    financial: ['revenue', 'net_income', 'total_assets', 'total_liabilities', 'shareholder_equity', 'cash_flow', 'funding_ask'],
                    business: ['team_strength', 'market_position', 'brand_reputation', 'confidence_percentage'],
                    confidence: ['data_source_confidence']
                };

                // Validate each field
                Object.keys(companyData).forEach(field => {
                    validationReport.totalFields++;
                    const value = companyData[field];
                    const isEmpty = value === null || value === undefined || value === '';
                    
                    if (!isEmpty) {
                        validationReport.filledFields++;
                    } else {
                        validationReport.emptyFields++;
                    }

                    validationReport.fieldDetails[field] = {
                        value: value,
                        isEmpty: isEmpty,
                        type: typeof value,
                        length: value ? value.toString().length : 0
                    };
                });

                // Check if minimum required fields are filled
                const requiredFields = ['company_name', 'industry'];
                const requiredFieldsFilled = requiredFields.every(field => 
                    companyData[field] && companyData[field].trim() !== ''
                );

                validationReport.isValid = requiredFieldsFilled;

                // Console output for debugging
                console.log('📊 Validation Summary:');
                console.log(`   Total Fields: ${validationReport.totalFields}`);
                console.log(`   Filled Fields: ${validationReport.filledFields}`);
                console.log(`   Empty Fields: ${validationReport.emptyFields}`);
                console.log(`   Form Valid: ${validationReport.isValid ? '✅ Yes' : '❌ No'}`);
                
                console.log('\n📋 Field Details:');
                Object.entries(fieldCategories).forEach(([category, fields]) => {
                    console.log(`\n${category.toUpperCase()} FIELDS:`);
                    fields.forEach(field => {
                        const detail = validationReport.fieldDetails[field];
                        if (detail) {
                            const status = detail.isEmpty ? '❌ Empty' : '✅ Filled';
                            console.log(`   ${field}: ${status} | Value: "${detail.value}" | Type: ${detail.type}`);
                        }
                    });
                });

                console.log('\n🔍 Raw Object Data:');
                console.log(JSON.stringify(companyData, null, 2));
                
                return validationReport;
            }



            // --- API Call Function ---
            async function submitStartupData(companyData) {
                try {
                    // Get auth token
                    const token = localStorage.getItem('authToken');
                    
                    // Show loading state
                    const submitButton = form.querySelector('button[type="submit"]');
                    const originalText = submitButton.innerHTML;
                    submitButton.disabled = true;
                    submitButton.innerHTML = '<i data-lucide="loader-2" class="w-4 h-4 animate-spin"></i> Saving...';
                    
                    // Make API call
                    const response = await fetch('https://fundora-be-singapore.onrender.com/api/startup/add/', {
                        method: 'POST',
                        headers: {
                            'Authorization': `Bearer ${token}`,
                            'Content-Type': 'application/json',
                            'X-CSRFToken': document.querySelector('[name=csrfmiddlewaretoken]')?.value || 
                                          document.querySelector('meta[name="csrf-token"]')?.getAttribute('content') || '',
                        },
                        body: JSON.stringify(companyData)
                    });
                    
                    const result = await response.json();
                    
                    if (result.success) {
                        // Success handling
                        showSuccessMessage(result.message, result.startup_id);
                        // Optionally redirect to another page
                        // window.location.href = `/startup/${result.startup_id}/`;
                    } else {
                        // Error handling
                        showErrorMessage(result.error || 'An error occurred while saving the startup data.');
                    }
                    
                } catch (error) {
                    console.error('API Error:', error);
                    showErrorMessage('Network error. Please check your connection and try again.');
                } finally {
                    // Reset button state
                    const submitButton = form.querySelector('button[type="submit"]');
                    submitButton.disabled = false;
                    submitButton.innerHTML = originalText;
                    lucide.createIcons(); // Recreate icons after innerHTML change
                }
            }

            function showSuccessMessage(message, startupId) {
                // Create success notification
                const notification = document.createElement('div');
                notification.className = 'fixed top-4 right-4 bg-emerald-500 text-white p-4 rounded-lg shadow-lg z-50 max-w-sm';
                notification.innerHTML = `
                    <div class="flex items-center gap-2">
                        <div>
                            <div class="font-semibold">Success</div>
                            <div class="text-sm">${message}</div>
                            ${startupId ? `<div class="text-sm mt-1">Startup ID: ${startupId}</div>` : ''}
                        </div>
                    </div>
                `;
                document.body.appendChild(notification);
                
                // Auto remove after 5 seconds
                setTimeout(() => {
                    notification.remove();
                }, 5000);
            }

            function showErrorMessage(message) {
                // Create error notification
                const notification = document.createElement('div');
                notification.className = 'fixed top-4 right-4 bg-red-500 text-white p-4 rounded-lg shadow-lg z-50 max-w-sm';
                notification.innerHTML = `
                    <div class="flex items-center gap-2">
                        <div>
                            <div class="font-semibold">Error</div>
                            <div class="text-sm">${message}</div>
                        </div>
                    </div>
                `;
                document.body.appendChild(notification);
                
                // Auto remove after 7 seconds
                setTimeout(() => {
                    notification.remove();
                }, 7000);
            }

            // --- Form Submission Handler ---
            form.addEventListener('submit', function(e) {
                e.preventDefault();
                
                if (!form.checkValidity()) {
                    form.reportValidity();
                    return;
                }
                
                // Create company data object
                const companyData = createCompanyDataObject();
                
                // Validate and check object fields
                const validation = validateObjectFields(companyData);
                
                // Check if minimum required fields are filled
                if (!validation.isValid) {
                    showErrorMessage('Please fill in all required fields (Company Name and Industry).');
                    return;
                }
                
                // Submit to API
                submitStartupData(companyData);
            }, { passive: true });

            // --- Initial State Setup ---
            createTooltip();
            updateCompleteness();
        });
    </script>
</body>
