    <style>
        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 50%, #0f172a 100%);
            min-height: 100vh;
        }
        header {
            contain: layout style paint;
            backdrop-filter: blur(10px);
            background: rgba(15, 23, 42, 0.8);
        }
        .startup-card {
            contain: layout style;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .startup-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 20px 25px -5px rgba(59, 130, 246, 0.1), 0 10px 10px -5px rgba(59, 130, 246, 0.04);
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .fade-in {
            animation: fadeIn 0.5s ease-out;
        }
        @keyframes slideDown {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .slide-down {
            animation: slideDown 0.3s ease-out;
        }
        .modal-backdrop {
            backdrop-filter: blur(8px);
            background: rgba(0, 0, 0, 0.6);
        }
        .modal-content {
            animation: fadeIn 0.3s ease-out;
        }
        .choice-card {
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }
        .choice-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(135deg, transparent 0%, rgba(59, 130, 246, 0.1) 100%);
            opacity: 0;
            transition: opacity 0.3s ease;
        }
        .choice-card:hover::before {
            opacity: 1;
        }
        .choice-card:hover {
            transform: translateY(-8px);
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.3);
        }
    </style>
</head>

    <script>
        async function loadUserInfo() {
            const token = sessionStorage.getItem('authToken');
            const userEmailElement = document.getElementById('user-email');

            // Check if element exists before trying to update it
            if (!userEmailElement) {
                return;
            }

          // First try to get stored user data from login
          const storedUserData = localStorage.getItem('userData');
          if (storedUserData) {
              try {
                  const user = JSON.parse(storedUserData);
                  if (user.email) {
                      userEmailElement.textContent = user.email;
                      userEmailElement.className = 'font-semibold text-green-600';
                      return;
                  }
              } catch (error) {
                  console.error('Error parsing stored user data:', error);
              }
          }

          // If no stored user data, try to fetch from API
          try {
              
              // Try the profile endpoint first
              let response = await fetch('https://fundorabe-production-5ccb.up.railway.app/api/auth/profile/', {
                  method: 'GET',
                  headers: {
                      'Authorization': `Bearer ${token}`,
                      'Content-Type': 'application/json',
                      'Accept': 'application/json'
                  }
              });

              // If profile endpoint fails, try alternative endpoints
              if (!response.ok) {
                  response = await fetch('https://fundorabe-production-5ccb.up.railway.app/api/auth/user/', {
                      method: 'GET',
                      headers: {
                          'Authorization': `Bearer ${token}`,
                          'Content-Type': 'application/json',
                          'Accept': 'application/json'
                      }
                  });
              }

              // If user endpoint also fails, try me endpoint
              if (!response.ok) {
                  response = await fetch('https://fundorabe-production-5ccb.up.railway.app/api/auth/me/', {
                      method: 'GET',
                      headers: {
                          'Authorization': `Bearer ${token}`,
                          'Content-Type': 'application/json',
                          'Accept': 'application/json'
                      }
                  });
              }

              if (response.ok) {
                const userData = await response.json();
                
                if (!userEmailElement) {
                    return;
                }
                
                const displayEmail = userData.email || 
                                userData.user?.email || 
                                userData.username || 
                                userData.user?.username ||
                                'Unknown user';
                userEmailElement.textContent = displayEmail;
                userEmailElement.className = 'font-semibold text-green-600';
                  
                  // Store user data for future use
                  localStorage.setItem('userData', JSON.stringify(userData));
                  
              } else if (response.status === 401) {
                // Token is invalid
                if (userEmailElement) {
                    userEmailElement.textContent = 'Please log in again';
                    userEmailElement.className = 'font-semibold text-red-600';
                }
                  console.warn('Invalid token, user needs to log in again');
              } else {
                  // API error but token exists
                  userEmailElement.textContent = 'Logged in user';
                  userEmailElement.className = 'font-semibold text-blue-600';
                  console.warn(`API returned ${response.status}, but token exists`);
              }
          } catch (error) {
              console.error('Error fetching user profile:', error);
              // Show fallback text if API fails
              userEmailElement.textContent = 'Logged in user';
              userEmailElement.className = 'font-semibold text-blue-600';
          }
      }

      const createDeckBtn = document.getElementById('createDeckBtn');
        if (createDeckBtn) {
            createDeckBtn.addEventListener('click', function() {
                // Navigate to Company Information Form
                window.location.href = '../Module_2/Startup.html';
            }, { passive: true });
        }

    async function goToDeckBuilder() {
      const token = sessionStorage.getItem('authToken');
      if (!token) {
        alert('Please log in to create a pitch deck.');
        window.location.href = '../login.html';
        return;
      }

      try {
        const res = await fetch('https://fundorabe-production-5ccb.up.railway.app/api/deck/create/', {
          method: 'POST',
          headers: {
            'Authorization': `Bearer ${token}`,
            'Content-Type': 'application/json'
          }
        });

        const data = await res.json();

        if (res.ok && data.deck_id) {
          localStorage.setItem('deck_id', data.deck_id);
          window.location.href = '/base.html';
        } else {
          alert(data.error || 'Failed to create new deck.');
        }
      } catch (err) {
        console.error('Deck creation failed:', err);
        alert('Something went wrong while creating the deck.');
      }
    }

    function goToCompanyForm() {
      const token = sessionStorage.getItem('authToken');
      if (!token) {
        alert('Please log in to add your business.');
        window.location.href = '../login.html';
        return;
      }
      // Use the correct path for the Company Information Form
      window.location.href = '../Module_2/Startup.html';
    }

    // Add loading flag to prevent duplicate calls
    let isLoadingStartups = false;

    // Manual refresh function with visual feedback
    async function refreshStartups() {
        const refreshBtn = event?.currentTarget;
        if (refreshBtn) {
            refreshBtn.disabled = true;
            const originalHTML = refreshBtn.innerHTML;
            refreshBtn.innerHTML = `
                <svg class="animate-spin w-4 h-4" fill="none" viewBox="0 0 24 24">
                    <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                    <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                </svg>
                <span>Refreshing...</span>
            `;
        }

        await loadStartups();

        if (refreshBtn) {
            setTimeout(() => {
                refreshBtn.innerHTML = `
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path>
                    </svg>
                    <span>Refresh</span>
                `;
                refreshBtn.disabled = false;
            }, 500);
        }
    }

    async function loadStartups() {
        // Prevent multiple simultaneous calls
        if (isLoadingStartups) {
            return;
        }
        
        isLoadingStartups = true;
        
        const token = sessionStorage.getItem('authToken');
        const grid = document.getElementById('startupsGrid');
        const messageContainer = document.getElementById('messageContainer');

        if (!grid || !messageContainer) {
            console.error('Required DOM elements not found');
            isLoadingStartups = false;
            return;
        }

        messageContainer.innerHTML = '';

        if (!token) {
            showMessage('Please log in to view your startups.', 'error');
            setTimeout(() => {
                window.location.href = '../login.html';
            }, 2000);
            return;
        }

        // Clear grid first with a loading indicator
        grid.innerHTML = '<div class="col-span-full text-center py-12"><div class="animate-spin rounded-full h-8 w-8 border-b-2 border-blue-600 mx-auto"></div><p class="mt-4 text-slate-400">Loading startups...</p></div>';

        try {
            
            const response = await fetch(`https://fundorabe-production-5ccb.up.railway.app/api/startups/?_=${Date.now()}`, {
                method: 'GET',
                headers: {
                    'Authorization': `Bearer ${token}`,
                    'Content-Type': 'application/json',
                    'Accept': 'application/json'
                },
                cache: 'no-cache'
            });

            
            if (!response.ok) {
                if (response.status === 401) {
                    showMessage('Authentication failed. Please log in again.', 'error');
                    // Optionally clear token and redirect
                    sessionStorage.removeItem('authToken');
                    return;
                } else if (response.status === 403) {
                    showMessage('Access denied.', 'error');
                    return;
                } else if (response.status === 404) {
                    showMessage('API endpoint not found. Please check the server.', 'error');
                    return;
                }
                throw new Error(`HTTP ${response.status}`);
            }

            const data = await response.json();

            // Robust data extraction with multiple fallback strategies
            let startups = [];
            
            if (data && typeof data === 'object') {
                if (data.success && Array.isArray(data.startups)) {
                    // DRF response format: {success: true, count: X, startups: [...]}
                    startups = data.startups;
                } else if (Array.isArray(data.startups)) {
                    // Alternative format: {startups: [...]}
                    startups = data.startups;
                } else if (Array.isArray(data)) {
                    // Direct array format: [...]
                    startups = data;
                } else if (data.results && Array.isArray(data.results)) {
                    // Paginated format: {results: [...]}
                    startups = data.results;
                }
            }


            // Clear loading indicator after processing
            grid.innerHTML = '';

            // Update header button visibility based on startup count
            updateHeaderButtonVisibility(startups.length);

            // Handle empty state
            if (startups.length === 0) {
                grid.innerHTML = `
                    <div class="col-span-full text-center py-12">
                        <svg xmlns="http://www.w3.org/2000/svg" class="mx-auto h-16 w-16 text-slate-600 mb-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16m14 0h2m-2 0h-5m-9 0H3m2 0h5M9 7h1m-1 4h1m4-4h1m-1 4h1m-5 10v-5a1 1 0 011-1h2a1 1 0 011 1v5m-4 0h4" />
                        </svg>
                        <h3 class="text-lg font-medium text-slate-300 mb-2">No startups added yet</h3>
                        <p class="text-slate-500 mb-6">Get started by adding your first startup.</p>
                        <button onclick="toggleModal()" class="bg-blue-600 text-white px-6 py-2 rounded-lg hover:bg-blue-700 transition-colors">
                            Add Your First Startup
                        </button>
                    </div>
                `;
                return;
            }

            // Validate startup array integrity
            if (!Array.isArray(startups)) {
                console.error('Invalid startups format');
                throw new Error('Invalid data format');
            }

            // Render each startup with comprehensive error handling
            let successfulRenders = 0;
            let skippedPitchDecks = 0;
            let failedRenders = 0;
            
            startups.forEach((startup, index) => {
                try {
                    if (!startup || typeof startup !== 'object') {
                        throw new Error('Invalid startup object');
                    }
                    
                    
                    // Check if startup is from pitch deck - skip if it is
                    const hasDeckInfo = startup && (
                        (startup.deck_info && startup.deck_info.deck_id) ||
                        startup.source_deck_id ||
                        startup.is_deck_builder ||
                        startup.deck_id
                    );
                    
                    if (hasDeckInfo) {
                        skippedPitchDecks++;
                        return;
                    }
                    
                    renderStartupCard(startup, grid);
                    successfulRenders++;
                    
                } catch (error) {
                    console.error('Error rendering startup:', error);
                    failedRenders++;
                    // Optionally show a placeholder for failed renders
                }
            });

            // Show success message with statistics
            const regularStartupsCount = startups.length - skippedPitchDecks;
            
            if (successfulRenders > 0) {
                let message = `Successfully loaded ${successfulRenders} startup${successfulRenders === 1 ? '' : 's'}`;
                showMessage(message, 'success');
            } else if (regularStartupsCount === 0 && skippedPitchDecks > 0) {
                 showMessage('No regular startups found, only pitch decks detected.', 'info');
            }

        } catch (error) {
            console.error('Error loading startups:', error);
            // Hide header button when there's an error
            updateHeaderButtonVisibility(0);
            
            grid.innerHTML = `
                <div class="col-span-full text-center py-12">
                    <div class="text-red-400 mb-4">
                        <svg xmlns="http://www.w3.org/2000/svg" class="mx-auto h-16 w-16 mb-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
                        </svg>
                        <h3 class="text-lg font-medium mb-2">Failed to load startups</h3>
                        <p class="text-slate-400 mb-4">Please try again</p>
                        <button onclick="loadStartups()" class="bg-blue-600 text-white px-4 py-2 rounded-lg hover:bg-blue-700 transition-colors">
                            Try Again
                        </button>
                    </div>
                </div>
            `;
            showMessage(`Failed to load startups: ${error.message}`, 'error');
        } finally {
            // Always reset the loading flag
            isLoadingStartups = false;
        }
    }

    // Function to control header button visibility
    function updateHeaderButtonVisibility(startupCount) {
        const headerButton = document.querySelector('header button[onclick="toggleModal()"]');
        if (headerButton) {
            // If there are existing startups, show the button. Otherwise, hide it.
            headerButton.style.display = startupCount > 0 ? 'block' : 'none';
        }
    }

    function renderStartupCard(startup, container) {
        // Null check for startup object
        if (!startup || typeof startup !== 'object') {
            console.error('Invalid startup object:', startup);
            return;
        }

        const companyName = (startup.company_name && startup.company_name.trim()) || 'Unnamed Company';
        const industry = (startup.industry && startup.industry.trim()) || 'Unknown Industry';
        const initial = companyName.charAt(0).toUpperCase();
        
        // Generate badge color based on first letter
        const badgeColor = {
            'T': 'bg-blue-600', // Updated colors
            'S': 'bg-emerald-600', 
            'F': 'bg-blue-500',
            'A': 'bg-emerald-500',
            'B': 'bg-blue-600',
            'C': 'bg-emerald-600'
        }[initial] || 'bg-slate-600';

        // Calculate financial metrics safely with null checks
        const revenue = parseFloat(startup.revenue || startup.current_revenue || 0) || 0;
        const netIncome = parseFloat(startup.net_income || 0) || 0;
        const fundingAsk = parseFloat(startup.funding_ask || 0) || 0;
        
        const profitMargin = (revenue && netIncome) 
            ? Math.round((netIncome / revenue) * 100)
            : null;

        // Format currency values with null checks
        const formatCurrency = (value) => {
            if (!value || value === 0 || isNaN(value)) return null;
            try {
                return new Intl.NumberFormat('en-PH', { // Assuming PH locale based on previous values
                    style: 'currency',
                    currency: 'PHP',
                    minimumFractionDigits: 0,
                    maximumFractionDigits: 0
                }).format(value);
            } catch (error) {
                console.error('Currency formatting error:', error);
                return `₱${value.toLocaleString()}`; // Fallback
            }
        };

        // Safe ID extraction with fallback - prioritize user-relative ID
        const userStartupId = startup.user_startup_id || 'N/A';
        const startupId = startup.id || startup.pk || 'unknown';

        // Check if startup is from pitch deck or regular form
        const hasDeckInfo = startup && (
            (startup.deck_info && startup.deck_info.deck_id) ||
            startup.source_deck_id ||
            startup.is_deck_builder ||
            startup.deck_id
        );

        const sourceType = hasDeckInfo ? 'pitch-deck' : 'company-form';
        const sourceLabel = hasDeckInfo ? 'Pitch Deck' : 'Company Form';
        const sourceBadgeColor = hasDeckInfo ? 'bg-blue-100 text-blue-800' : 'bg-emerald-100 text-emerald-800'; // Updated colors

        const card = document.createElement('div');
        // Updated card styling to match dark theme
        card.className = "startup-card bg-slate-800 rounded-lg shadow-md p-6 relative group hover:shadow-lg transition-shadow border border-slate-700";
        card.innerHTML = `
            <div class="flex items-center justify-between mb-6">
                <div class="flex items-center gap-3">
                    <div class="w-12 h-12 rounded-lg flex items-center justify-center text-white font-bold text-lg ${badgeColor}">
                        ${initial}
                    </div>
                    <div>
                        <h3 class="text-lg font-semibold text-white">${companyName}</h3>

                    ID: ${userStartupId}
                </div>
            </div>

            <div class="space-y-3 mb-6">
                ${(startup.data_source_confidence && startup.data_source_confidence !== 'Low') ? `
                    ${fundingAsk ? `
                        <div class="flex justify-between items-center">
                            <span class="text-sm text-slate-400">Funding Ask</span>
                            <span class="text-sm font-semibold text-white">${formatCurrency(fundingAsk) || 'N/A'}</span>
                        </div>

                    ${netIncome ? `
                        <div class="flex justify-between items-center">
                            <span class="text-sm text-slate-400">Net Income</span>
                            <span class="text-sm font-semibold ${netIncome >= 0 ? 'text-emerald-400' : 'text-red-400'}">

                            </span>

                    ` : ''}
                    ${revenue ? `
                        <div class="flex justify-between items-center">
                            <span class="text-sm text-slate-400">Revenue</span>
                            <span class="text-sm font-semibold text-white">${formatCurrency(revenue) || 'N/A'}</span>
                        </div>

                        <div class="flex justify-between items-center">
                            <span class="text-sm text-slate-400">Profit Margin</span>
                            <span class="text-sm font-semibold ${netIncome >= 0 ? 'text-emerald-400' : 'text-red-400'}">
                                ${profitMargin}%
                            </span>

                ` : `
                    <div class="text-sm text-slate-500 italic">
                        Limited data available
                    </div>
                `}
                
                <!-- Confidence Level -->
                <div class="flex justify-between items-center">
                    <span class="text-sm text-slate-400">Confidence</span>
                    <span class="text-xs px-2 py-1 rounded-full ${
                        (startup.data_source_confidence === 'High') ? 'bg-emerald-900 text-emerald-200' : // Updated colors
                        (startup.data_source_confidence === 'Medium') ? 'bg-yellow-900 text-yellow-200' :
                        'bg-red-900 text-red-200'
                    }">
                        ${startup.data_source_confidence || 'Unknown'} ${startup.confidence_percentage ? `(${startup.confidence_percentage}%)` : ''}
                    </span>
                </div>
            </div>

            ${(startup.analytics && typeof startup.analytics === 'object') ? `
                <div class="border-t border-slate-700 pt-4 mb-4">
                    <div class="flex items-center justify-between mb-3">
                        <h4 class="text-sm font-semibold text-slate-300">Analytics</h4>
                        <span class="text-xs text-slate-500">Live Data</span>
                    </div>
                    <div class="grid grid-cols-2 gap-3 text-sm">
                        <div class="bg-blue-900/30 p-3 rounded-lg border border-blue-800 ${(startup.analytics.total_views || 0) > 0 ? 'ring-1 ring-blue-500/50' : ''}">
                            <div class="text-blue-300 font-semibold text-lg">${startup.analytics.total_views || 0}</div>
                            <div class="text-blue-400 text-xs">Total Views</div>
                            ${(startup.analytics.recent_views || 0) > 0 ? `<div class="text-blue-300 text-xs mt-1">+${startup.analytics.recent_views} recent</div>` : ''}
                        </div>
                        <div class="bg-emerald-900/30 p-3 rounded-lg border border-emerald-800 ${(startup.analytics.unique_viewers || 0) > 0 ? 'ring-1 ring-emerald-500/50' : ''}">
                            <div class="text-emerald-300 font-semibold text-lg">${startup.analytics.unique_viewers || 0}</div>
                            <div class="text-emerald-400 text-xs">Unique Viewers</div>
                        </div>
                        <div class="bg-purple-900/30 p-3 rounded-lg border border-purple-800 ${(startup.analytics.total_comparisons || 0) > 0 ? 'ring-1 ring-purple-500/50' : ''}">
                            <div class="text-purple-300 font-semibold text-lg">${startup.analytics.total_comparisons || 0}</div>
                            <div class="text-purple-400 text-xs">Total Comparisons</div>
                            ${(startup.analytics.recent_comparisons || 0) > 0 ? `<div class="text-purple-300 text-xs mt-1">+${startup.analytics.recent_comparisons} recent</div>` : ''}
                        </div>
                        <div class="bg-pink-900/30 p-3 rounded-lg border border-pink-800 ${(startup.analytics.unique_comparers || 0) > 0 ? 'ring-1 ring-pink-500/50' : ''}">
                            <div class="text-pink-300 font-semibold text-lg">${startup.analytics.unique_comparers || 0}</div>
                            <div class="text-pink-400 text-xs">Unique Comparers</div>
                        </div>
                    </div>
                </div>
            ` : `
                <div class="border-t border-slate-700 pt-4 mb-4">
                    <div class="flex items-center justify-between mb-3">
                        <h4 class="text-sm font-semibold text-slate-300">Analytics</h4>
                        <span class="text-xs text-slate-500">No Data Yet</span>
                    </div>
                    <div class="grid grid-cols-2 gap-3 text-sm">
                        <div class="bg-blue-900/30 p-3 rounded-lg border border-blue-800">
                            <div class="text-blue-300 font-semibold text-lg">0</div>
                            <div class="text-blue-400 text-xs">Total Views</div>
                        </div>
                        <div class="bg-emerald-900/30 p-3 rounded-lg border border-emerald-800">
                            <div class="text-emerald-300 font-semibold text-lg">0</div>
                            <div class="text-emerald-400 text-xs">Unique Viewers</div>
                        </div>
                        <div class="bg-purple-900/30 p-3 rounded-lg border border-purple-800">
                            <div class="text-purple-300 font-semibold text-lg">0</div>
                            <div class="text-purple-400 text-xs">Total Comparisons</div>
                        </div>
                        <div class="bg-pink-900/30 p-3 rounded-lg border border-pink-800">
                            <div class="text-pink-300 font-semibold text-lg">0</div>
                            <div class="text-pink-400 text-xs">Unique Comparers</div>
                        </div>
                    </div>
                </div>
            `}

            <div class="flex gap-2">
                <button onclick="editStartup(${startupId})"
                        class="flex-1 bg-gradient-to-r from-emerald-600 to-emerald-500 text-white font-semibold py-3 px-4 rounded-lg hover:from-emerald-700 hover:to-emerald-600 transition-all duration-300 flex items-center justify-center gap-2 hover:shadow-lg hover:shadow-emerald-500/30 hover:-translate-y-0.5">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z" />
                    </svg>
                    Edit ${hasDeckInfo ? 'Deck' : 'Info'}
                </button>
                <button onclick="startupReport(${startupId})"
                        class="flex-1 bg-gradient-to-r from-blue-600 to-blue-500 text-white font-semibold py-3 px-4 rounded-lg hover:from-blue-700 hover:to-blue-600 transition-all duration-300 flex items-center justify-center gap-2 hover:shadow-lg hover:shadow-blue-500/30 hover:-translate-y-0.5">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z" />
                    </svg>
                    Report
                </button>
            </div>
        `;
        
        // Safely append to container
        try {
            if (container && typeof container.appendChild === 'function') {
                container.appendChild(card);
            } else {
                console.error('Invalid container for startup card');
            }
        } catch (error) {
            console.error('Error appending startup card:', error);
        }
    }

    function showMessage(message, type = 'info') {
        const messageContainer = document.getElementById('messageContainer');
        if (!messageContainer) {
            console.error('Message container not found');
            return;
        }
        
        // Updated alert classes for dark theme
        const alertClass = type === 'error' ? 'bg-red-900 border-red-700 text-red-200' :
                          type === 'success' ? 'bg-emerald-900 border-emerald-700 text-emerald-200' :
                          type === 'warning' ? 'bg-yellow-900 border-yellow-700 text-yellow-200' :
                          'bg-blue-900 border-blue-700 text-blue-200';
        
        // Simplified message display
        messageContainer.innerHTML = `
            <div class="border-l-4 p-4 ${alertClass}" role="alert">
                <p class="font-medium">${message}</p>
            </div>
        `;
        
        // Auto-hide success and info messages after 5 seconds
        if (type === 'success' || type === 'info') {
            setTimeout(() => {
                // Check if the message is still present before clearing
                if (messageContainer.innerHTML.includes(message)) {
                    messageContainer.innerHTML = '';
                }
            }, 5000);
        }
    }
        
        // Use DOMContentLoaded instead of window.onload to prevent duplicate calls and for better practice
        document.addEventListener('DOMContentLoaded', function() {
            // Check if returning from a comparison
            const comparisonMade = localStorage.getItem('comparisonMade');
            if (comparisonMade) {
                localStorage.removeItem('comparisonMade');
            }
            
            // Load user information first
            loadUserInfo();
            
            // Then load startups
            loadStartups();
        }, { passive: true }); // Use passive listener

        // Add page visibility listener to reload data when returning to the page
        document.addEventListener('visibilitychange', function() {
            // When the page becomes visible again (user returns from another page)
            if (!document.hidden && !isLoadingStartups) {
                // Check if we're returning from viewing a startup or making a comparison
                const wasViewingStartup = localStorage.getItem('startupBeingViewed');
                const startupWasViewed = localStorage.getItem('startupViewed');
                const comparisonWasMade = localStorage.getItem('comparisonMade');
                
                if (wasViewingStartup || startupWasViewed) {
                    localStorage.removeItem('startupBeingViewed');
                    localStorage.removeItem('startupViewed');
                    loadStartups();
                } else if (comparisonWasMade) {
                    localStorage.removeItem('comparisonMade');
                    loadStartups();
                } else {
                    loadStartups();
                }
            }
        }, { passive: true }); // Use passive listener

        // Also reload when the page gains focus (additional fallback)
        window.addEventListener('focus', function() {
            if (!isLoadingStartups) {
                loadStartups();
            }
        }, { passive: true }); // Use passive listener

        // Listen for when a startup report is viewed or comparison is made (to refresh data when returning)
        window.addEventListener('storage', function(e) {
            if ((e.key === 'startupViewed' || e.key === 'comparisonMade') && !isLoadingStartups) {
                if (e.key === 'startupViewed') {
                    localStorage.removeItem('startupViewed');
                }
                if (e.key === 'comparisonMade') {
                    localStorage.removeItem('comparisonMade');
                }
                setTimeout(() => loadStartups(), 500); // Small delay to ensure backend is updated
            }
        }, { passive: true }); // Use passive listener

    function loadDeckEditor(deckId) {
      if (!deckId || isNaN(deckId)) {
        console.error('Invalid deck ID');
        return;
      }

      localStorage.setItem('deck_id', deckId); // persist for other sections
      window.location.href = '/base.html'; // redirect to deck builder
    }

    async function editStartup(startupId) {
      // Validate startupId
      if (!startupId || startupId === 'unknown') {
        alert('Invalid startup ID. Cannot edit startup.');
        return;
      }

      const token = sessionStorage.getItem('authToken');
      if (!token) {
        alert('Please log in to edit startup information.');
        return;
      }

      window.location.href = `Edit_Startup.html?id=${startupId}`;

    }

    async function startupReport(startupId) {
      // Validate startupId
      if (!startupId || startupId === 'unknown') {
        alert('Invalid startup ID. Cannot load report.');
        return;
      }

      const token = sessionStorage.getItem('authToken');
      if (!token) {
        alert('Please log in to view startup reports.');
        return;
        }

      localStorage.setItem('startupId', startupId);

      try {
        // First, record the view with proper DRF format
        try {
          const viewResponse = await fetch(`https://fundorabe-production-5ccb.up.railway.app/api/startups/${startupId}/view/`, {
            method: 'POST',
            headers: {
              'Authorization': `Bearer ${token}`,
              'Content-Type': 'application/json',
              'Accept': 'application/json'
            }
          });

          if (viewResponse.ok) {
            const viewResult = await viewResponse.json();
          } else {
            const errorData = await viewResponse.json().catch(() => ({}));
            console.warn('Failed to record view:', viewResponse.status, errorData);
          }
        } catch (viewError) {
          console.error('Error recording view:', viewError);
          // Don't block navigation if view recording fails
        }

        // Then fetch the startup data
        const response = await fetch(`https://fundorabe-production-5ccb.up.railway.app/api/startup/${startupId}/`, {
          headers: {
            'Authorization': `Bearer ${token}`,
            'Content-Type': 'application/json',
            'Accept': 'application/json'
          }
        });

        if (!response.ok) {
          if (response.status === 401) {
            alert('Authentication failed. Please log in again.');
            return;
          } else if (response.status === 404) {
            alert('Startup not found or you do not have access to it.');
            return;
          }
          throw new Error(`HTTP error! status: ${response.status}`);
        }

        const data = await response.json();
        // Safely access the startup data - DRF compatible
        const startup = data.startup || data;
        
        // Check if startup has deck info for routing decision
        if (startup && startup.deck_info) {
          window.location.href = `/components/report-modal.html?id=${startupId}`;
        } else {
          // Mark that we're about to view a startup (for refresh tracking)
          localStorage.setItem('startupBeingViewed', startupId);
          window.location.href = `View_Startup_Report.html?id=${startupId}`;
        }
      } catch (error) {
        console.error('Failed to fetch startup data:', error);
        alert('Unable to load report. Please try again.');
      }
    }

    // Removed window.onload as DOMContentLoaded is used
    // window.onload = loadStartups;
    
    function logout() {
      sessionStorage.removeItem('authToken');
      localStorage.removeItem('userData');
      window.location.href = '/login.html'; // or wherever your login page lives
  }

    </script>
