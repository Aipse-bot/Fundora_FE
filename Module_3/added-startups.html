<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My Added Startups</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    body {
      font-family: 'Inter', sans-serif;
      background-color: #f8fafc; /* slate-50 */
    }
  </style>
</head>
<body>
  <!-- Header will be injected via JS or static include -->
  <div class="max-w-7xl mx-auto p-4 sm:p-6 lg:p-8">
    <header class="mb-8">
      <h1 class="text-3xl font-bold text-slate-800">My Added Startups</h1>
    </header>

    <!-- Message container for dynamic alerts -->
    <div id="messageContainer" class="mb-6"></div>

    <!-- Startup grid -->
    <div id="startupsGrid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8"></div>

    <!-- Empty state -->
    <div id="emptyState" class="col-span-full text-center py-12 hidden">
      <svg xmlns="http://www.w3.org/2000/svg" class="mx-auto h-16 w-16 text-slate-400 mb-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1">
        <path stroke-linecap="round" stroke-linejoin="round" d="M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16m14 0h2m-2 0h-5m-9 0H3m2 0h5M9 7h1m-1 4h1m4-4h1m-1 4h1m-5 10v-5a1 1 0 011-1h2a1 1 0 011 1v5m-4 0h4" />
      </svg>
      <h3 class="text-lg font-medium text-slate-800 mb-2">No startups added yet</h3>
      <p class="text-slate-600 mb-6">Get started by adding your first startup.</p>
    </div>

    <!-- Add new startup button -->
    <button id="createDeckBtn" class="border-2 border-dashed border-slate-300 rounded-xl flex items-center justify-center p-6 hover:bg-slate-100 hover:border-slate-400 transition-colors cursor-pointer w-full">
      <div class="text-center">
        <svg xmlns="http://www.w3.org/2000/svg" class="mx-auto h-12 w-12 text-slate-400" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5">
          <path stroke-linecap="round" stroke-linejoin="round" d="M12 4v16m8-8H4" />
        </svg>
        <h3 class="mt-2 text-sm font-medium text-slate-800">Add New Startup</h3>
        <p class="mt-1 text-sm text-slate-500">Choose between deck builder or company form.</p>
      </div>
    </button>
  </div>

  <!-- Delete confirmation modal -->
  <div id="delete-modal" class="hidden fixed inset-0 bg-gray-600 bg-opacity-50 overflow-y-auto h-full w-full z-50">
    <div class="relative top-20 mx-auto p-5 border w-96 shadow-lg rounded-md bg-white">
      <div class="mt-3 text-center">
        <div class="mx-auto flex items-center justify-center h-12 w-12 rounded-full bg-red-100">
          <svg class="h-6 w-6 text-red-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z" />
          </svg>
        </div>
        <h3 class="text-lg leading-6 font-medium text-gray-900 mt-2">Delete Startup</h3>
        <div class="mt-2 px-7 py-3">
          <p class="text-sm text-gray-500">Are you sure you want to delete this startup? This action cannot be undone.</p>
        </div>
        <div class="items-center px-4 py-3">
          <button id="modal-delete-confirm" class="px-4 py-2 bg-red-500 text-white text-base font-medium rounded-md w-auto shadow-sm hover:bg-red-700 focus:outline-none focus:ring-2 focus:ring-red-300">
            Delete
          </button>
          <button id="modal-delete-cancel" class="px-4 py-2 bg-gray-200 text-gray-800 text-base font-medium rounded-md w-auto ml-2 shadow-sm hover:bg-gray-300 focus:outline-none focus:ring-2 focus:ring-gray-300">
            Cancel
          </button>
        </div>
      </div>
    </div>
  </div>

    <script>
      // document.getElementById('createDeckBtn').addEventListener('click', async () => {
      //   const token = localStorage.getItem('authToken');

      //   try {
      //     const res = await fetch('http://127.0.0.1:8000/api/deck/create/', {
      //       method: 'POST',
      //       headers: {
      //         'Authorization': `Bearer ${token}`,
      //       }
      //     });

      //     const data = await res.json();

      //     if (res.ok && data.deck_id) {
      //       localStorage.setItem('deckId', data.deck_id);
      //       window.location.href = '/base.html'; // redirect to deck builder
      //     } else {
      //       alert(data.error || 'Failed to create new deck.');
      //     }
      //   } catch (err) {
      //     console.error('Deck creation failed:', err);
      //     alert('Something went wrong while creating the deck.');
      //   }
      // });

    async function loadStartups() {
            const token = localStorage.getItem('authToken');
            const grid = document.getElementById('startupsGrid');

            try {
            const response = await fetch('http://127.0.0.1:8000/api/startups/', {
              
                headers: {
                'Authorization': `Bearer ${token}`,
                'Content-Type': 'application/json'
                }
            });
            console.log(token)
            const data = await response.json();
              if (!response.ok) {
                throw new Error(data.error || data.detail || 'Failed to fetch startups');
              }

            //const startups = data.startups || [];
            const startups = Array.isArray(data) ? data : data.startups || [];
            console.log('Raw API response:', data);

            if (startups.length === 0) {
                grid.innerHTML = `
                <div class="col-span-full text-center py-12">
                    <h3 class="text-lg font-medium text-slate-800 mb-2">No startups added yet</h3>
                    <p class="text-slate-600 mb-6">Get started by adding your first startup.</p>
                </div>
                `;
                return;
            }

            startups.forEach(startup => {
                const initial = startup.company_name.charAt(0).toUpperCase();
                const badgeColor = {
                T: 'bg-orange-500',
                S: 'bg-red-500',
                F: 'bg-green-500'
                }[initial] || 'bg-blue-500';

                const profitMargin = startup.revenue && startup.net_income
                ? Math.round((startup.net_income / startup.revenue) * 100)
                : null;

                const card = document.createElement('div');
                card.className = "startup-card bg-white rounded-xl shadow-md p-6 relative group hover:shadow-lg transition-shadow";
                card.innerHTML = `
                <div class="flex items-center justify-between mb-6">
                    <div class="flex items-center gap-3">
                    <div class="w-12 h-12 rounded-lg flex items-center justify-center text-white font-bold text-lg ${badgeColor}">
                        ${initial}
                    </div>
                    <div>
                        <h3 class="text-lg font-semibold text-slate-800">${startup.company_name}</h3>
                        <p class="text-sm text-slate-500">${startup.industry}</p>
                    </div>
                    </div>
                </div>

                <div class="space-y-3 mb-6">
                    ${startup.data_source_confidence !== 'Low' ? `
                    ${startup.funding_ask ? `
                        <div class="flex justify-between items-center">
                        <span class="text-sm text-slate-600">The Ask</span>
                        <span class="text-sm font-semibold text-slate-800">₱${Math.round(startup.funding_ask)}</span>
                        </div>` : ''
                    }
                    ${startup.net_income && !startup.funding_ask ? `
                        <div class="flex justify-between items-center">
                        <span class="text-sm text-slate-600">Net Income</span>
                        <span class="text-sm font-semibold text-slate-800">₱${Math.round(startup.net_income)}</span>
                        </div>` : ''
                    }
                    ${profitMargin !== null ? `
                        <div class="flex justify-between items-center">
                        <span class="text-sm text-slate-600">Profit Margin</span>
                        <span class="text-sm font-semibold ${startup.net_income >= 0 ? 'text-green-600' : 'text-red-600'}">
                            ${profitMargin}%
                        </span>
                        </div>` : ''
                    }
                    ` : `
                    ${startup.team_strength ? `
                        <div class="flex justify-between items-center">
                        <span class="text-sm text-slate-600">Team Strength</span>
                        <span class="text-sm font-semibold text-slate-800">
                            ${startup.team_strength.length > 50 ? 'Experienced' : 'Basic'}
                        </span>
                        </div>` : ''
                    }
                    ${startup.market_position ? `
                        <div class="flex justify-between items-center">
                        <span class="text-sm text-slate-600">Market Position</span>
                        <span class="text-sm font-semibold text-slate-800">
                            ${startup.market_position.length > 50 ? 'Strong Leader' : 'Developing'}
                        </span>
                        </div>` : ''
                    }
                    `}
                </div>

                ${startup.analytics ? `
                    <div class="border-t border-slate-200 pt-4 mb-4">
                    <h4 class="text-sm font-semibold text-slate-700 mb-3">📊 Analytics</h4>
                    <div class="grid grid-cols-2 gap-3 text-sm">
                        <div class="bg-blue-50 p-3 rounded-lg">
                        <div class="text-blue-800 font-semibold">${startup.analytics.total_views}</div>
                        <div class="text-blue-600 text-xs">Total Views</div>
                        </div>
                        <div class="bg-green-50 p-3 rounded-lg">
                        <div class="text-green-800 font-semibold">${startup.analytics.unique_viewers}</div>
                        <div class="text-green-600 text-xs">Unique Viewers</div>
                        </div>
                        <div class="bg-purple-50 p-3 rounded-lg">
                        <div class="text-purple-800 font-semibold">${startup.analytics.total_comparisons}</div>
                        <div class="text-purple-600 text-xs">Total Comparisons</div>
                        </div>
                        <div class="bg-orange-50 p-3 rounded-lg">
                        <div class="text-orange-800 font-semibold">${startup.analytics.unique_comparers}</div>
                        <div class="text-orange-600 text-xs">Unique Comparers</div>
                        </div>
                    </div>
                    <div class="mt-3 text-xs text-slate-500">
                        Last 30 days: ${startup.analytics.recent_views} views, ${startup.analytics.recent_comparisons} comparisons
                    </div>
                    </div>` : ''
                }

                <button onclick="window.location.href='/startups/${startup.id}/report/'"
                        class="w-full bg-blue-600 text-white font-semibold py-3 px-4 rounded-lg hover:bg-blue-700 transition-colors">
                    View Report
                </button>
                `;
                grid.appendChild(card);
            });
            } catch (err) {
            console.error('Error loading startups:', err);
            grid.innerHTML = `<div class="text-red-600">Failed to load startups. Please try again later.</div>`;
            }
        }

        window.onload = loadStartups;
    </script>
</body>
</html>
