<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Deck Report - Fundora</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50: '#eff6ff',
                            100: '#dbeafe',
                            200: '#bfdbfe',
                            300: '#93c5fd',
                            400: '#60a5fa',
                            500: '#3b82f6',
                            600: '#2563eb',
                            700: '#1d4ed8',
                            800: '#1e40af',
                            900: '#1e3a8a'
                        },
                        accent: {
                            50: '#ecfdf5',
                            100: '#d1fae5',
                            200: '#a7f3d0',
                            300: '#6ee7b7',
                            400: '#34d399',
                            500: '#10b981',
                            600: '#059669',
                            700: '#047857',
                            800: '#065f46',
                            900: '#064e3b'
                        }
                    },
                    fontFamily: {
                        'sans': ['Inter', 'system-ui', 'sans-serif']
                    }
                }
            }
        }
    </script>
    <style>
        body { 
            font-family: 'Inter', sans-serif;
        }
        .card-hover {
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }
        .card-hover:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 16px rgba(59, 130, 246, 0.15);
        }
    </style>
</head>
<body class="bg-slate-950 text-gray-100">

    <!-- Navbar -->
    <nav class="fixed top-0 left-0 right-0 z-50 bg-slate-900/80 backdrop-blur-xl border-b border-slate-800">
        <div class="max-w-7xl mx-auto px-6 py-4">
            <div class="flex items-center justify-between">
                <div class="flex items-center space-x-3">
                    <div class="relative w-10 h-10">
                        <svg viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg">
                            <circle cx="20" cy="20" r="18" fill="url(#logo-gradient)" stroke="#3b82f6" stroke-width="2"/>
                            <path d="M20 10 L20 30 M12 20 L28 20" stroke="white" stroke-width="2.5" stroke-linecap="round"/>
                            <circle cx="20" cy="12" r="2" fill="white"/>
                            <circle cx="20" cy="28" r="2" fill="white"/>
                            <circle cx="12" cy="20" r="2" fill="white"/>
                            <circle cx="28" cy="20" r="2" fill="white"/>
                            <defs>
                                <linearGradient id="logo-gradient" x1="0" y1="0" x2="40" y2="40" gradientUnits="userSpaceOnUse">
                                    <stop offset="0%" stop-color="#3b82f6"/>
                                    <stop offset="100%" stop-color="#10b981"/>
                                </linearGradient>
                            </defs>
                        </svg>
                    </div>
                    <span class="text-2xl font-bold text-white">Fundora</span>
                </div>
                <div id="header-user" class="flex items-center space-x-4"></div>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <div class="pt-24 pb-12 px-6">
        <div class="max-w-7xl mx-auto space-y-8">
            
            <!-- Header Card -->
            <div class="bg-gradient-to-br from-blue-500/10 to-blue-600/5 border border-blue-500/20 rounded-2xl p-8 backdrop-blur-sm">
                <div class="flex flex-col md:flex-row items-start md:items-center justify-between gap-6">
                    <div class="flex items-start gap-4">
                        <div id="deck-initial" class="w-16 h-16 bg-brand-600 text-white font-bold flex items-center justify-center text-2xl rounded-xl shrink-0">
                            L
                        </div>
                        <div>
                            <h1 id="deck-name" class="text-3xl font-bold text-white mb-2">Loading...</h1>
                            <p id="deck-tagline" class="text-lg text-gray-400">—</p>
                        </div>
                    </div>
                    <a href="" class="bg-slate-800 hover:bg-slate-700 border border-slate-700 text-white px-6 py-3 rounded-lg font-medium transition-colors flex items-center gap-2">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"/>
                        </svg>
                        Back to Startups
                    </a>
                </div>
            </div>

            <!-- Problem & Solution -->
            <div class="grid md:grid-cols-2 gap-6">
                <div class="bg-slate-800/50 border border-slate-700 rounded-2xl p-8 backdrop-blur-sm card-hover">
                    <div class="flex items-center gap-3 mb-4">
                        <div class="w-10 h-10 bg-red-500/10 border border-red-500/20 rounded-xl flex items-center justify-center">
                            <svg class="w-5 h-5 text-red-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"/>
                            </svg>
                        </div>
                        <h2 class="text-xl font-bold text-white">The Problem</h2>
                    </div>
                    <p id="problem-description" class="text-gray-400 leading-relaxed">—</p>
                </div>
                
                <div class="bg-slate-800/50 border border-slate-700 rounded-2xl p-8 backdrop-blur-sm card-hover">
                    <div class="flex items-center gap-3 mb-4">
                        <div class="w-10 h-10 bg-emerald-500/10 border border-emerald-500/20 rounded-xl flex items-center justify-center">
                            <svg class="w-5 h-5 text-emerald-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"/>
                            </svg>
                        </div>
                        <h2 class="text-xl font-bold text-white">The Solution</h2>
                    </div>
                    <p id="solution-description" class="text-gray-400 leading-relaxed">—</p>
                </div>
            </div>

            <!-- Market Analysis & Financial Projections -->
            <div class="grid md:grid-cols-2 gap-6">
                
                <!-- Market Analysis -->
                <div class="bg-slate-800/50 border border-slate-700 rounded-2xl p-8 backdrop-blur-sm card-hover">
                    <div class="flex items-center gap-3 mb-6">
                        <div class="w-10 h-10 bg-blue-500/10 border border-blue-500/20 rounded-xl flex items-center justify-center">
                            <svg class="w-5 h-5 text-blue-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z"/>
                            </svg>
                        </div>
                        <h2 class="text-xl font-bold text-white">Market Analysis</h2>
                    </div>
                    
                    <div class="space-y-4">
                        <div class="flex justify-between items-start">
                            <span class="text-gray-400 font-medium">Primary Market:</span>
                            <span id="primary-market" class="text-white font-semibold text-right">—</span>
                        </div>
                        <div class="h-px bg-slate-700"></div>
                        
                        <div class="flex justify-between items-start">
                            <span class="text-gray-400 font-medium">Target Audience:</span>
                            <span id="target-audience" class="text-white font-semibold text-right">—</span>
                        </div>
                        <div class="h-px bg-slate-700"></div>
                        
                        <div class="flex justify-between items-start">
                            <span class="text-gray-400 font-medium">Market Growth:</span>
                            <span id="market-growth" class="text-emerald-400 font-semibold text-right">—</span>
                        </div>
                        <div class="h-px bg-slate-700"></div>
                        
                        <div class="pt-2">
                            <span class="text-gray-400 font-medium block mb-2">Competitive Advantage:</span>
                            <p id="competitive-advantage" class="text-white leading-relaxed">—</p>
                        </div>
                    </div>
                </div>

                <!-- Financial Projections -->
                <div class="bg-slate-800/50 border border-slate-700 rounded-2xl p-8 backdrop-blur-sm card-hover">
                    <div class="flex items-center gap-3 mb-6">
                        <div class="w-10 h-10 bg-emerald-500/10 border border-emerald-500/20 rounded-xl flex items-center justify-center">
                            <svg class="w-5 h-5 text-emerald-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 7h8m0 0v8m0-8l-8 8-4-4-6 6"/>
                            </svg>
                        </div>
                        <h2 class="text-xl font-bold text-white">Financial Projections</h2>
                    </div>
                    
                    <div id="financial-table-container" class="overflow-x-auto mb-6"></div>
                    <div class="bg-slate-900/50 rounded-xl p-4 border border-slate-700">
                        <canvas id="revenueProfitChart"></canvas>
                    </div>
                </div>
            </div>

            <!-- The Ask & Team -->
            <div class="grid md:grid-cols-2 gap-6">
                
                <!-- The Ask -->
                <div class="bg-slate-800/50 border border-slate-700 rounded-2xl p-8 backdrop-blur-sm card-hover">
                    <div class="flex items-center gap-3 mb-6">
                        <div class="w-10 h-10 bg-yellow-500/10 border border-yellow-500/20 rounded-xl flex items-center justify-center">
                            <svg class="w-5 h-5 text-yellow-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8c-1.657 0-3 .895-3 2s1.343 2 3 2 3 .895 3 2-1.343 2-3 2m0-8c1.11 0 2.08.402 2.599 1M12 8V7m0 1v8m0 0v1m0-1c-1.11 0-2.08-.402-2.599-1M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/>
                            </svg>
                        </div>
                        <h2 class="text-xl font-bold text-white">The Ask</h2>
                    </div>
                    <div id="ask-section" class="text-gray-400">
                        <p>Loading funding information...</p>
                    </div>
                </div>

                <!-- The Team -->
                <div class="bg-slate-800/50 border border-slate-700 rounded-2xl p-8 backdrop-blur-sm card-hover">
                    <div class="flex items-center gap-3 mb-6">
                        <div class="w-10 h-10 bg-purple-500/10 border border-purple-500/20 rounded-xl flex items-center justify-center">
                            <svg class="w-5 h-5 text-purple-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0zm6 3a2 2 0 11-4 0 2 2 0 014 0zM7 10a2 2 0 11-4 0 2 2 0 014 0z"/>
                            </svg>
                        </div>
                        <h2 class="text-xl font-bold text-white">The Team</h2>
                    </div>
                    <div id="team-section" class="text-gray-400">
                        <p>Loading team information...</p>
                    </div>
                </div>
            </div>

        </div>
    </div>

    <script>
        function renderHeaderUser(user) {
            const container = document.getElementById('header-user');
            container.innerHTML = '';

            if (!user || !user.name) return;

            container.innerHTML = `
                <span class="text-gray-400 text-sm">
                    Welcome, <span class="font-medium text-white">${user.name}</span>
                </span>
                <a href="/logout.html" class="bg-slate-800 hover:bg-slate-700 border border-slate-700 text-white px-4 py-2 rounded-lg text-sm font-medium transition-colors">
                    Logout
                </a>
            `;
        }
    </script>

</body>
</html>
