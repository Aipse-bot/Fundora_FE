<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Deck Builder</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
  <style>
    body { contain: layout style paint; }
    #deckSections { contain: layout style; }
    #mainContent { contain: layout style paint; }
    #card-panel { contain: layout style paint; }
    
    @keyframes fadeInUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes slideInLeft { from { opacity: 0; transform: translateX(-20px); } to { opacity: 1; transform: translateX(0); } }
    @keyframes slideInRight { from { opacity: 0; transform: translateX(20px); } to { opacity: 1; transform: translateX(0); } }
    @keyframes scaleIn { from { opacity: 0; transform: scale(0.95); } to { opacity: 1; transform: scale(1); } }
    
    aside { animation: slideInLeft 0.5s ease-out; }
    #mainContent { animation: fadeInUp 0.5s ease-out; animation-delay: 0.1s; opacity: 0; animation-fill-mode: forwards; }
    #card-panel { animation: slideInRight 0.5s ease-out; animation-delay: 0.2s; opacity: 0; animation-fill-mode: forwards; }
    
    #deckSections button {
      transition: all 0.3s ease;
    }
    #deckSections button:hover {
      transform: translateX(4px);
    }
    
    button, a, input, textarea, select {
      transition: all 0.3s ease;
    }
    
    button:hover:not(:disabled), a:hover {
      transform: translateY(-1px);
    }
    button:active:not(:disabled), a:active {
      transform: translateY(0);
    }
    
    input:focus, textarea:focus, select:focus {
      transform: translateY(-1px);
      box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.1);
    }
    
    .team-form, .financial-row {
      animation: fadeInUp 0.3s ease-out;
    }
    
    canvas {
      transition: opacity 0.3s ease;
    }
  </style>
</head>

<body class="h-full flex bg-slate-900 text-gray-100 overflow-y-hidden font-inter">

  <!-- Sidebar -->
  <aside class="w-96 h-full p-6 bg-slate-800 flex flex-col justify-between shadow-lg border-r border-slate-700">
    <div>
      <h1 class="text-4xl font-extrabold mb-6 text-white">Deck Builder</h1>

      <!-- Back Button -->
      <div class="mb-6">
        <a href="/deck-builder.html"
          class="flex items-center space-x-2 py-2.5 px-4 rounded-lg bg-slate-700 hover:bg-slate-600 text-gray-200 hover:text-white font-medium transition-all duration-200 ease-in-out">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path>
          </svg>
          <span>Back to My Decks</span>
        </a>
      </div>

      <!-- Navigation Links -->
      <nav id="deckSections" class="space-y-2"></nav>
    </div>
  </aside>

  <!-- Main Content -->
  <main class="flex-1 h-full overflow-y-auto p-10 bg-slate-900" id="mainContent">
    <p class="text-gray-400 text-center text-lg">Start with your cover page from the left sidebar.</p>
  </main>

  <!-- Card Panel -->
  <section id="card-panel"
    class="w-[550px] h-full flex-shrink-0 bg-slate-800 border-l border-slate-700 overflow-y-hidden p-5 flex items-center justify-center">
    <p class="text-gray-500 text-center text-base">Section preview will appear here.</p>
  </section>

  <!-- Team Member Template -->
  <template id="teamMemberTemplate">
    <div class="space-y-3 border-b border-slate-700 pb-6 relative team-form">
      <input type="text" name="name" placeholder="Name"
        class="w-full p-3 bg-slate-700 border border-slate-600 rounded-lg text-gray-100 placeholder-gray-400 focus:ring-2 focus:ring-blue-500 focus:outline-none" />
      <input type="text" name="title" placeholder="Title"
        class="w-full p-3 bg-slate-700 border border-slate-600 rounded-lg text-gray-100 placeholder-gray-400 focus:ring-2 focus:ring-blue-500 focus:outline-none" />
      <button type="button"
        class="absolute top-1 right-2 text-slate-400 hover:text-slate-200 transition remove-member text-lg font-medium">×</button>
    </div>
  </template>

  <!-- Financial Template -->
  <template id="financialTemplate">
    <div class="grid grid-cols-4 gap-2 items-center team-form relative">
      <input type="number" name="year" placeholder="Year"
        class="p-2 bg-slate-700 border border-slate-600 rounded text-gray-100 placeholder-gray-400 focus:ring-2 focus:ring-blue-500 focus:outline-none" />
      <input type="number" name="revenue" placeholder="Revenue"
        class="p-2 bg-slate-700 border border-slate-600 rounded text-gray-100 placeholder-gray-400 focus:ring-2 focus:ring-blue-500 focus:outline-none" />
      <input type="number" name="profit" placeholder="Profit"
        class="p-2 bg-slate-700 border border-slate-600 rounded text-gray-100 placeholder-gray-400 focus:ring-2 focus:ring-blue-500 focus:outline-none" />
      <button type="button"
        class="text-slate-400 hover:text-slate-200 transition remove-financial text-lg font-medium">×</button>
    </div>
  </template>

  <script>
  const domCache = {
    deckSections: null,
    mainContent: null,
    cardPanel: null
  };

  function getCachedElement(id) {
    if (!domCache[id]) {
      domCache[id] = document.getElementById(id);
    }
    return domCache[id];
  }

  async function loadDeckSections() {
    const token = sessionStorage.getItem('authToken');
    const nav = document.getElementById('deckSections');
    const deckId = localStorage.getItem('deck_id');

    try {
      const res = await fetch('https://fundora-be-singapore.onrender.com/api/deck/section-list/', {
        headers: {
          'Authorization': `Bearer ${token}`,
          'Content-Type': 'application/json'
        }
      });

      const sections = await res.json();
      const fragment = document.createDocumentFragment();

      sections.forEach(section => {
        const button = document.createElement('button');
        button.className = "block w-full text-left py-2 px-4 rounded hover:bg-blue-500 hover:text-white text-lg font-semibold transition-all duration-200 ease-in-out";
        button.textContent = section.display_name;
        button.dataset.section = section.key;
        button.addEventListener('click', () => loadSection(section.key, deckId, section), { passive: true });
        fragment.appendChild(button);
      });

      nav.appendChild(fragment);
    } catch (err) {
      console.error('Failed to load deck sections:', err);
    }
  }

  async function loadSection(sectionName, deckId) {
    try {
      const res = await fetch(`components/${sectionName}.html`);
      const html = await res.text();

      const parser = new DOMParser();
      const doc = parser.parseFromString(html, 'text/html');

      const mainContent = doc.querySelector('#mainContent');
      const cardPanel = doc.querySelector('#card-panel');

      const main = document.getElementById('mainContent');
      main.innerHTML = mainContent
        ? mainContent.innerHTML
        : '<p class="text-red-600">Main content missing.</p>';

      const panel = document.getElementById('card-panel');
      if (cardPanel) {
        panel.innerHTML = cardPanel.innerHTML;
        panel.style.display = '';
      } else {
        panel.innerHTML = '';
        panel.style.display = 'none';
      }

      bindSectionEvents(sectionName, deckId);

    } catch (err) {
      console.error(`Failed to load section "${sectionName}":`, err);
      document.getElementById('mainContent').innerHTML = `<p class="text-red-600">Section failed to load.</p>`;
    }
  }

  function bindSectionEvents(sectionName, deckId) {
    const bindings = {
      'cover-page': () => bindCoverFormEvents(deckId),
      'the-problem': () => bindProblemFormEvents(deckId),
      'the-team': () => bindTeamFormEvents(deckId),
      'the-solution': () => bindSolutionFormEvents(deckId),
      'market-analysis': () => bindMarketFormEvents(deckId),
      'financials': () => {},
      'the-ask': () => bindAskFormEvents(deckId),
    };

    if (bindings[sectionName]) {
      bindings[sectionName]();
    } else {
      console.warn(`No binding defined for section: ${sectionName}`);
    }
  }

  window.loadSection = loadSection;

  async function bindCoverFormEvents(deckId) {
    const form = document.getElementById('coverForm');
    const companyInput = document.getElementById('company_name');
    const taglineInput = document.getElementById('tagline');
    const previewCompany = document.getElementById('preview-company-name');
    const previewTagline = document.getElementById('preview-tagline');
    const previewInitial = document.getElementById('preview-initial');
    const token = sessionStorage.getItem('authToken');

    if (!form) return;

    // Load existing data if available
    try {
      const res = await fetch(`https://fundora-be-singapore.onrender.com/api/deck/cover/?deck_id=${deckId}`, {
        headers: { Authorization: `Bearer ${token}` }
      });
      if (res.ok) {
        const data = await res.json();
        companyInput.value = data.company_name || '';
        taglineInput.value = data.tagline || '';
        previewCompany.textContent = data.company_name || 'Your company name...';
        previewTagline.textContent = data.tagline || 'Your tagline...';
      }
    } catch (err) {
      console.warn('No existing cover data found or failed to load:', err);
    }

    console.log('Binding cover form events for deck ID:', deckId);

    // Live preview updates
    companyInput.addEventListener('input', () => {
      previewCompany.textContent = companyInput.value.trim() || 'Your company name...';
    }, { passive: true });

    taglineInput.addEventListener('input', () => {
      previewTagline.textContent = taglineInput.value.trim() || 'Your tagline...';
    }, { passive: true });

    // Bind form submission
    form.addEventListener('submit', async function (e) {
      e.preventDefault();

      const formData = new FormData(form);
      formData.append('deck_id', deckId);

      try {
        const response = await fetch(`https://fundora-be-singapore.onrender.com/api/deck/cover/`, {
          method: 'POST',
          headers: { 'Authorization': `Bearer ${token}` },
          body: formData
        });

        const data = await response.json();

        if (response.ok) {
          localStorage.setItem('deck_id', data.deck_id);
          loadSection('the-problem', data.deck_id); // ✅ use fresh ID
        } else {
          document.getElementById('errorCompanyName').textContent = data.errors?.company_name || '';
          document.getElementById('errorCompanyName').classList.toggle('hidden', !data.errors?.company_name);

          document.getElementById('errorTagline').textContent = data.errors?.tagline || '';
          document.getElementById('errorTagline').classList.toggle('hidden', !data.errors?.tagline);
        }
      } catch (err) {
        console.error('Submission failed:', err);
        alert('Something went wrong. Please try again.');
      }
    });
  }

  async function bindProblemFormEvents(deckId) {
    const form = document.getElementById('problemForm');
    const descriptionInput = document.getElementById('problemDescription');
    const errorElem = document.getElementById('descriptionError');
    const previewElem = document.getElementById('problemPreview');
    const token = sessionStorage.getItem('authToken');

    if (!form || !descriptionInput) return;

    // Load existing problem data
    try {
      const res = await fetch(`https://fundora-be-singapore.onrender.com/api/deck/problem/?deck_id=${deckId}`, {
        headers: { Authorization: `Bearer ${token}` }
      });
      if (res.ok) {
        const data = await res.json();
        const description = data.description || '';
        descriptionInput.value = description;
        previewElem.innerHTML = description
          ? description.replace(/\n/g, '<br>')
          : '<span class="text-gray-400">Describe the problem you\'re solving...</span>';
      }
    } catch (err) {
      console.warn('No existing problem data found or failed to load:', err);
    }

    // Live preview update
    descriptionInput.addEventListener('input', () => {
      const value = descriptionInput.value.trim();
      previewElem.innerHTML = value
        ? value.replace(/\n/g, '<br>')
        : '<span class="text-gray-400">Describe the problem you\'re solving...</span>';
    }, { passive: true });

    // Form submission
    form.addEventListener('submit', async (e) => {
      e.preventDefault();

      const description = descriptionInput.value.trim();

      try {
        const res = await fetch(`https://fundora-be-singapore.onrender.com/api/deck/problem/`, {
          method: 'POST',
          headers: {
            'Authorization': `Bearer ${token}`,
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({ deck_id: deckId, description })
        });

        const data = await res.json();

        if (res.ok) {
          errorElem.classList.add('hidden');
          localStorage.setItem('deck_id', data.deck_id);
          loadSection('the-solution', deckId);
        } else {
          errorElem.textContent = data.errors?.description || 'Something went wrong.';
          errorElem.classList.remove('hidden');
        }
      } catch (err) {
        console.error('Problem form submission failed:', err);
        errorElem.textContent = 'Submission failed. Please try again.';
        errorElem.classList.remove('hidden');
      }
    });
  }

      console.warn('No existing solution data found or failed to load:', err);

    // Live preview update
    descriptionInput.addEventListener('input', () => {

      previewElem.innerHTML = value
        ? value.replace(/\n/g, '<br>')

    // Form submission
    form.addEventListener('submit', async (e) => {

  async function bindMarketFormEvents(deckId) {
    const form = document.getElementById('marketForm');
    if (!form) return;

    const primaryMarket = document.getElementById('primaryMarket');
    const targetAudience = document.getElementById('targetAudience');
    const marketGrowthRate = document.getElementById('marketGrowthRate');
    const competitiveAdvantage = document.getElementById('competitiveAdvantage');

    const errorPrimaryMarket = document.getElementById('primaryMarketError');
    const errorTargetAudience = document.getElementById('targetAudienceError');
    const errorMarketGrowthRate = document.getElementById('marketGrowthRateError');
    const errorCompetitiveAdvantage = document.getElementById('competitiveAdvantageError');

    const previewPrimary = document.getElementById('previewPrimaryMarket');
    const previewTarget = document.getElementById('previewTargetAudience');
    const previewGrowth = document.getElementById('previewMarketGrowthRate');
    const previewAdvantage = document.getElementById('previewCompetitiveAdvantage');

    const token = sessionStorage.getItem('authToken');

    // Load existing market analysis data
    try {
      const res = await fetch(`https://fundora-be-singapore.onrender.com/api/deck/market-analysis/?deck_id=${deckId}`, {
        headers: { Authorization: `Bearer ${token}` }
      });
      if (res.ok) {
        const data = await res.json();
        primaryMarket.value = data.primary_market || '';
        targetAudience.value = data.target_audience || '';
        marketGrowthRate.value = data.market_growth_rate || '';
        competitiveAdvantage.value = data.competitive_advantage || '';

        previewPrimary.innerHTML = data.primary_market
          ? String(data.primary_market).replace(/\n/g, '<br>')
          : '<span class="text-gray-400">Primary market</span>';

        previewTarget.innerHTML = data.target_audience
          ? String(data.target_audience).replace(/\n/g, '<br>')
          : '<span class="text-gray-400">Target audience</span>';

        previewGrowth.innerHTML = data.market_growth_rate
          ? String(data.market_growth_rate).replace(/\n/g, '<br>')
          : '<span class="text-gray-400">Growth rate</span>';

        previewAdvantage.innerHTML = data.competitive_advantage
          ? String(data.competitive_advantage).replace(/\n/g, '<br>')
          : '<span class="text-gray-400">Growth rate</span>';
      }
    } catch (err) {
      console.warn('No existing market analysis found or failed to load:', err);
    }

    // Live preview updates
    primaryMarket.addEventListener('input', () => {
      const value = primaryMarket.value.trim();
      previewPrimary.innerHTML = value
        ? value.replace(/\n/g, '<br>')
        : '<span class="text-gray-400">Primary market</span>';
    }, { passive: true });

    targetAudience.addEventListener('input', () => {
      const value = targetAudience.value.trim();
      previewTarget.innerHTML = value
        ? value.replace(/\n/g, '<br>')
        : '<span class="text-gray-400">Target audience</span>';
    }, { passive: true });

    marketGrowthRate.addEventListener('input', () => {
      const value = marketGrowthRate.value.trim();
      previewGrowth.innerHTML = value
        ? value.replace(/\n/g, '<br>')
        : '<span class="text-gray-400">Growth rate</span>';
    }, { passive: true });

    competitiveAdvantage.addEventListener('input', () => {
      const value = competitiveAdvantage.value.trim();
      previewAdvantage.innerHTML = value
        ? value.replace(/\n/g, '<br>')
        : '<span class="text-gray-400">Growth rate</span>';
    }, { passive: true });

    // Form submission
    form.addEventListener('submit', async (e) => {
      e.preventDefault();

      const payload = {
        deck_id: deckId,
        primary_market: primaryMarket.value.trim(),
        target_audience: targetAudience.value.trim(),
        market_growth_rate: marketGrowthRate.value.trim(),
        competitive_advantage: competitiveAdvantage.value.trim()
      };

      try {
        const res = await fetch(`https://fundora-be-singapore.onrender.com/api/deck/market-analysis/`, {
          method: 'POST',
          headers: {
            'Authorization': `Bearer ${token}`,
            'Content-Type': 'application/json'
          },
          body: JSON.stringify(payload)
        });

        const data = await res.json();

        if (res.ok) {
          [errorPrimaryMarket, errorTargetAudience, errorMarketGrowthRate, errorCompetitiveAdvantage].forEach(el => el.classList.add('hidden'));
          localStorage.setItem('deck_id', data.deck_id);
          loadSection('the-team', deckId);
        } else {
          errorPrimaryMarket.textContent = data.errors?.primary_market || '';
          errorPrimaryMarket.classList.toggle('hidden', !data.errors?.primary_market);

          errorTargetAudience.textContent = data.errors?.target_audience || '';
          errorTargetAudience.classList.toggle('hidden', !data.errors?.target_audience);

          errorMarketGrowthRate.textContent = data.errors?.market_growth_rate || '';
          errorMarketGrowthRate.classList.toggle('hidden', !data.errors?.market_growth_rate);

          errorCompetitiveAdvantage.textContent = data.errors?.competitive_advantage || '';
          errorCompetitiveAdvantage.classList.toggle('hidden', !data.errors?.competitive_advantage);
        }
      } catch (err) {
        console.error('Market analysis submission failed:', err);
        alert('Something went wrong. Please try again.');
      }
    });
  }

  async function bindTeamFormEvents(deckId) {
    const form = document.getElementById('teamForm');
    const teamMembers = document.getElementById('teamMembers');
    const addMemberBtn = document.getElementById('addMemberBtn');
    const template = document.getElementById('teamMemberTemplate');
    const previewContainer = document.getElementById('teamPreview');
    const token = sessionStorage.getItem('authToken');

    if (!form || !teamMembers || !addMemberBtn || !template) return;

    try {
      const res = await fetch(`https://fundora-be-singapore.onrender.com/api/deck/team/?deck_id=${deckId}`, {
        headers: { Authorization: `Bearer ${token}` }
      });
      if (res.ok) {
        const data = await res.json();
        const members = data.members || [];
        const fragment = document.createDocumentFragment();

        members.forEach(member => {
          const clone = template.content.cloneNode(true);
          const formBlock = clone.querySelector('.team-form');

          formBlock.querySelector('input[name="name"]').value = member.name || '';
          formBlock.querySelector('input[name="title"]').value = member.title || '';

          formBlock.querySelector('.remove-member').addEventListener('click', (e) => {
            e.target.closest('.team-form').remove();
            renderTeamPreview();
          }, { passive: true });

          formBlock.querySelectorAll('input').forEach(input => {
            input.addEventListener('input', renderTeamPreview, { passive: true });
          });

          fragment.appendChild(clone);
        });

        teamMembers.appendChild(fragment);
        renderTeamPreview();
      }
    } catch (err) {
      console.warn('No existing team data found or failed to load:', err);
    }

    addMemberBtn.addEventListener('click', () => {
      const clone = template.content.cloneNode(true);
      const formBlock = clone.querySelector('.team-form');

      formBlock.querySelector('.remove-member').addEventListener('click', (e) => {
        e.target.closest('.team-form').remove();
        renderTeamPreview();
      }, { passive: true });

      formBlock.querySelectorAll('input').forEach(input => {
        input.addEventListener('input', renderTeamPreview, { passive: true });
      });

      teamMembers.appendChild(clone);
      renderTeamPreview();
    }, { passive: true });

    form.addEventListener('submit', async (e) => {
      e.preventDefault();

      const members = [...teamMembers.querySelectorAll('.team-form')]
        .map(form => ({
          name: form.querySelector('input[name="name"]').value.trim(),
          title: form.querySelector('input[name="title"]').value.trim()
        }))
        .filter(member => member.name && member.title);

      if (members.length === 0) {
        alert('Please add at least one team member.');
        return;
      }

      try {
        const res = await fetch(`https://fundora-be-singapore.onrender.com/api/deck/team/`, {
          method: 'POST',
          headers: {
            'Authorization': `Bearer ${token}`,
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({ deck_id: deckId, members })
        });

        const data = await res.json();
        if (!res.ok) throw new Error(data.detail || 'Failed to save team');
        localStorage.setItem('deck_id', data.deck_id);
        loadSection('financials', deckId);
      } catch (err) {
        console.error('Team submit error:', err);
        alert('Something went wrong while saving your team.');
      }
    });

    function renderTeamPreview() {
      const members = [...teamMembers.querySelectorAll('.team-form')]
        .map(form => ({
          name: form.querySelector('input[name="name"]').value.trim(),
          title: form.querySelector('input[name="title"]').value.trim()
        }))
        .filter(member => member.name || member.title);

      previewContainer.innerHTML = '';

      if (members.length === 0) {
        previewContainer.innerHTML = '<p class="text-center text-gray-500 text-base">No team members added yet.</p>';
        return;
      }

      const fragment = document.createDocumentFragment();
      members.forEach(member => {
        const card = document.createElement('div');
        card.className = 'bg-gray-50 p-4 rounded-lg shadow-sm border';

        card.innerHTML = `
          <div class="text-lg font-semibold text-gray-800">${member.name || '<span class="text-gray-400">Unnamed</span>'}</div>
          <div class="text-sm text-gray-600">${member.title || '<span class="text-gray-400">No title</span>'}</div>
        `;

        fragment.appendChild(card);
      });
      previewContainer.appendChild(fragment);
    }
  }

  function bindFinancialFormEvents(deckId) {
    const form = document.getElementById('financialForm');
    const financialRows = document.getElementById('financialRows');
    const addYearBtn = document.getElementById('addYearBtn');
    const previewTable = document.getElementById('financialPreviewTable');
    const chartCanvas = document.getElementById('revenueProfitChart');
    const token = sessionStorage.getItem('authToken');

    if (!form || !financialRows || !addYearBtn || !previewTable || !chartCanvas) return;

    const template = document.getElementById('financialTemplate');

    addYearBtn.addEventListener('click', () => {
      const clone = template.content.cloneNode(true);
      clone.querySelectorAll('input').forEach(input => {
        input.addEventListener('input', updatePreviewAndChart, { passive: true });
        if (input.name.includes('year')) {
          input.addEventListener('input', validateYear, { passive: true });
          input.addEventListener('blur', validateYear, { passive: true });
        }
      });
      clone.querySelector('.remove-financial').addEventListener('click', (e) => {
        e.target.closest('.team-form').remove();
        updatePreviewAndChart();
      }, { passive: true });
      financialRows.appendChild(clone);
    }, { passive: true });

    form.addEventListener('submit', async (e) => {
      e.preventDefault();

      const financials = [...financialRows.querySelectorAll('.team-form')].map(row => ({
        year: parseInt(row.querySelector('input[name="year"]').value),
        revenue: parseFloat(row.querySelector('input[name="revenue"]').value),
        profit: parseFloat(row.querySelector('input[name="profit"]').value)
      })).filter(f => f.year && !isNaN(f.revenue) && !isNaN(f.profit));

      if (financials.length === 0) {
        alert('Please add at least one financial entry.');
        return;
      }

      try {
        const res = await fetch(`https://fundora-be-singapore.onrender.com/api/deck/financial/`, {
          method: 'POST',
          headers: {
            'Authorization': `Bearer ${token}`,
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({ deck_id: deckId, financials })
        });

        const data = await res.json();
        if (!res.ok) throw new Error(data.detail || 'Failed to save financials');
        localStorage.setItem('deck_id', data.deck_id); // persist deck ID for next sections
        loadSection('the-ask', deckId); // redirect to next section
        // loadFinancialPreview(deckId); // Refresh preview
      } catch (err) {
                console.error('Financials submits:', financials);
        console.error('Financials submit error:', err);
        alert('Something went wrong while saving your financials.');
      }
    });
    function validateYear(event) {
      const currentInput = event.target;
      const currentValue = currentInput.value;
      const currentForm = currentInput.closest('.team-form');

      if (!currentValue) return;

      const allYearInputs = document.querySelectorAll('input[name="year"]');
      const otherYears = [...allYearInputs].filter(input =>
        input !== currentInput &&
        !input.closest('.team-form')?.style.display.includes('none') &&
        !input.closest('.team-form')?.querySelector('input[type="checkbox"]:checked')
      ).map(input => input.value);

      if (otherYears.includes(currentValue)) {
        currentInput.style.borderColor = '#ef4444';
        currentInput.style.backgroundColor = '#fef2f2';

        let errorMsg = currentForm.querySelector('.year-error');
        if (!errorMsg) {
          errorMsg = document.createElement('div');
          errorMsg.className = 'year-error text-red-600 text-sm mt-1 col-span-4';
          errorMsg.textContent = `Year ${currentValue} is already used. Please choose a different year.`;
          currentForm.appendChild(errorMsg);
        }
      } else {
        currentInput.style.borderColor = '';
        currentInput.style.backgroundColor = '';
        const errorMsg = currentForm.querySelector('.year-error');
        if (errorMsg) errorMsg.remove();
      }
    }

    let revenueProfitChart;
    const chartCtx = chartCanvas.getContext('2d');
    revenueProfitChart = new Chart(chartCtx, {
      type: 'bar',
      data: {
        labels: ['No data'],
        datasets: [
          { label: 'Revenue', data: [0], backgroundColor: '#3b82f6' },
          { label: 'Profit', data: [0], backgroundColor: '#10b981' }
        ]
      },
      options: {
        responsive: true,
        plugins: {
          legend: { position: 'top' },
          title: { display: true }
        },
        scales: {
          y: {
            beginAtZero: true,
            ticks: {
              callback: value => '₱' + value.toLocaleString()
            }
          }
        }
      }
    });

    function updateChart(financialData) {
      if (!revenueProfitChart) return;

      if (financialData.length === 0) {
        revenueProfitChart.data.labels = ['No data'];
        revenueProfitChart.data.datasets[0].data = [0];
        revenueProfitChart.data.datasets[1].data = [0];
      } else {
        revenueProfitChart.data.labels = financialData.map(d => d.year);
        revenueProfitChart.data.datasets[0].data = financialData.map(d => parseFloat(d.revenue) || 0);
        revenueProfitChart.data.datasets[1].data = financialData.map(d => parseFloat(d.profit) || 0);
      }

      revenueProfitChart.update();
    }

  function updatePreviewAndChart() {
    const rows = [...financialRows.querySelectorAll('.team-form')];
    const financialData = rows.map(row => {
      const year = row.querySelector('input[name="year"]')?.value || '';
      const revenue = row.querySelector('input[name="revenue"]')?.value || '';
      const profit = row.querySelector('input[name="profit"]')?.value || '';
      return { year, revenue, profit, yearNumeric: parseInt(year) || 0 };
    }).filter(d => d.year || d.revenue || d.profit);

    financialData.sort((a, b) => a.yearNumeric - b.yearNumeric);

    previewTable.innerHTML = '';

    if (financialData.length === 0) {
      const emptyRow = document.createElement('tr');
      emptyRow.innerHTML = `
        <td colspan="3" class="text-center py-4 text-gray-500 italic">No financial data entered yet...</td>
      `;
      previewTable.appendChild(emptyRow);
      updateChart([]);
      return;
    }

    const fragment = document.createDocumentFragment();
    financialData.forEach(data => {
      const row = document.createElement('tr');
      row.innerHTML = `
        <td class="px-4 py-2 bg-gray-50 border text-gray-700 font-medium">${data.year}</td>
        <td class="px-4 py-2 bg-gray-50 border text-gray-700 font-medium">₱${parseFloat(data.revenue || 0).toLocaleString()}</td>
        <td class="px-4 py-2 bg-gray-50 border text-gray-700 font-medium">₱${parseFloat(data.profit || 0).toLocaleString()}</td>
      `;
      fragment.appendChild(row);
    });
    previewTable.appendChild(fragment);

    updateChart(financialData);
  }

    async function loadFinancials(deckId) {
      try {
        const res = await fetch(`https://fundora-be-singapore.onrender.com/api/deck/financial-list/?deck_id=${deckId}`, {
          headers: { 'Authorization': `Bearer ${token}` }
        });
        const financials = await res.json();
        const fragment = document.createDocumentFragment();
        financials.forEach(data => {
          const clone = template.content.cloneNode(true);
          clone.querySelector('input[name="year"]').value = data.year;
          clone.querySelector('input[name="revenue"]').value = data.revenue;
          clone.querySelector('input[name="profit"]').value = data.profit;

          clone.querySelector('.remove-financial').addEventListener('click', (e) => {
            e.target.closest('.team-form').remove();
            updatePreviewAndChart();
          }, { passive: true });

          clone.querySelectorAll('input').forEach(input => {
            input.addEventListener('input', updatePreviewAndChart, { passive: true });
            if (input.name.includes('year')) {
              input.addEventListener('input', validateYear, { passive: true });
              input.addEventListener('blur', validateYear, { passive: true });
            }
          });
          fragment.appendChild(clone);
        });
        financialRows.appendChild(fragment);
        updatePreviewAndChart();
      } catch (err) {
        console.error('Failed to load financials:', err);
      }
    }

    loadFinancials(deckId);
  }

  function bindAskFormEvents(deckId) {
    const token = sessionStorage.getItem('authToken');
    const form = document.getElementById('askForm');
    const amountInput = document.getElementById('amount');
    const usageInput = document.getElementById('usage_description');
    const previewAmount = document.getElementById('preview-amount');
    const previewUsage = document.getElementById('preview-usage');

    if (!form || !amountInput || !usageInput || !previewAmount || !previewUsage) return;

    async function loadAskData() {
      try {
        const res = await fetch(`https://fundora-be-singapore.onrender.com/api/deck/ask/?deck_id=${deckId}`, {
          headers: { 'Authorization': `Bearer ${token}` }
        });
        const data = await res.json();

        amountInput.value = data.amount || '';
        usageInput.value = data.usage_description || '';

        previewAmount.textContent = data.amount
          ? '₱' + parseFloat(data.amount).toLocaleString()
          : 'Enter funding amount...';

        previewUsage.textContent = data.usage_description?.trim()
          ? data.usage_description
          : 'Describe how you plan to use the funding...';
      } catch (err) {
        console.error('Failed to load ask data:', err);
      }
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const payload = {
        deck_id: deckId,
        amount: parseFloat(amountInput.value.replace(/,/g, '')),
        usage_description: usageInput.value.trim()
      };

      if (isNaN(payload.amount) || !payload.usage_description) {
        alert('Please fill out both fields correctly.');
        return;
      }

      try {
        const res = await fetch(`https://fundora-be-singapore.onrender.com/api/deck/ask/`, {
          method: 'POST',
          headers: {
            'Authorization': `Bearer ${token}`,
            'Content-Type': 'application/json'
          },
          body: JSON.stringify(payload)
        });

        const data = await res.json();
        if (!res.ok) throw new Error(data.detail || 'Failed to save ask');
        localStorage.setItem('deck_id', data.deck_id);
        loadAskData(); // Refresh preview
        window.location.href = 'deck-builder.html';
      } catch (err) {
        console.error('Ask submit error:', err);
        alert('Something went wrong while saving your funding request.');
      }
    });

    amountInput.addEventListener('input', () => {
      const value = amountInput.value.trim();
      const numValue = parseFloat(value.replace(/,/g, ''));
      previewAmount.textContent = !isNaN(numValue)
        ? '₱' + numValue.toLocaleString()
        : value || 'Enter funding amount...';
    }, { passive: true });

    usageInput.addEventListener('input', () => {
      const value = usageInput.value.trim();
      previewUsage.textContent = value || 'Describe how you plan to use the funding...';
    }, { passive: true });

    loadAskData();
  }

  let financialChart = null;
  
  function renderFinancialChart(financials) {
    const ctx = document.getElementById('financialChart').getContext('2d');
    const years = financials.map(f => f.year);
    const revenues = financials.map(f => parseFloat(f.revenue));
    const profits = financials.map(f => parseFloat(f.profit));

    if (financialChart) {
      financialChart.destroy();
      financialChart = null;
    }

    financialChart = new Chart(ctx, {
      type: 'bar',
      data: {
        labels: years,
        datasets: [
          {
            label: 'Revenue',
            data: revenues,
            backgroundColor: '#3b82f6'
          },
          {
            label: 'Profit',
            data: profits,
            backgroundColor: '#10b981'
          }
        ]
      },
      options: {
        responsive: true,
        animation: { duration: 0 },
        scales: {
          y: {
            beginAtZero: true
          }
        }
      }
    });
  }

  function prettify(text) {
    return text.replace(/_/g, ' ').replace(/\b\w/g, c => c.toUpperCase());
  }


  window.addEventListener('load', loadDeckSections, { passive: true });
  </script>
</body>
