<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Fundora - Startup Platform</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen flex flex-col bg-gray-50 p-32">

<main class="flex-1 flex flex-col items-center">
  <div class="w-full max-w-7xl">
    <div class="text-center mb-4">
      <h1 class="text-5xl font-bold mb-4">Welcome to Fundora</h1>
      <p class="text-xl text-gray-600">Choose your path to get started</p>
    </div>

    <div class="flex flex-wrap justify-center gap-12" id="actionCards">
      <div class="flex-1 flex items-start justify-center">
        <div class="w-full max-w-8xl">
          <div class="flex justify-center gap-20 h-[25rem]">
            <!-- Card 1 -->
            <div class="flex flex-col items-center justify-center border-2 shadow-lg border-gray-200 p-8 text-center w-full max-w-[45rem] rounded-xl bg-white transition duration-300 hover:shadow-2xl hover:scale-102 hover:border-gray-700">
              <div class="text-5xl mb-5">📊</div>
              <p class="font-bold text-gray-600 text-lg sm:text-xl">Invest in a Startup Company</p>
              <p class="text-gray-500 text-sm sm:text-base mt-1">Looking for Business to invest your money?</p>
              <div class="mt-5">
                <!-- Link to static HTML page for investor registration -->
                <a href="/Module_1/investor_register.html" class="inline-block bg-blue-600 text-white px-6 py-2 rounded hover:bg-blue-700 transition duration-300">
                  Click Here
                </a>
              </div>
            </div>

            <!-- Card 2 -->
            <div class="flex flex-col items-center justify-center border-2 shadow-lg border-gray-200 p-8 text-center w-full max-w-[45rem] rounded-xl bg-white transition duration-300 hover:shadow-2xl hover:scale-102 hover:border-gray-700">
              <div class="text-5xl mb-5">📝</div>
              <p class="font-bold text-gray-600 text-lg sm:text-xl">Add your Startup Business</p>
              <p class="text-gray-500 text-sm sm:text-base mt-1">Looking for investors to fund your Business?</p>
              <div class="mt-5">
                <!-- Link to static HTML page for startup registration -->
                <a href="/Module_3/startup_register.html" class="inline-block bg-blue-600 text-white px-6 py-2 rounded hover:bg-blue-700 transition duration-300">
                  Click Here
                </a>  
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Login Prompt (Now positioned at the bottom) -->
  <div class="text-center mt-8" id="loginPrompt">
    <p class="text-gray-600 mb-4">Already have a startup account?</p>
    <a href="/login.html" class="inline-block bg-green-600 text-white px-6 py-3 rounded-lg hover:bg-green-700 font-semibold">Login to Access</a>
  </div>
</main>
</body>
</html>
